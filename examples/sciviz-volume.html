<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Volume rendering · Margo Engine</title>
  <link rel="stylesheet" href="./multi-view.css">
  <style>.controls{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;margin:0 0 16px}.controls label{display:flex;gap:8px;align-items:center;color:#d8e4f5}select{font:inherit;background:#263449;color:#edf2fa;border:1px solid #62718b;border-radius:6px;padding:4px 8px}output{min-width:5ch;font-variant-numeric:tabular-nums}</style>
</head>
<body>
  <h1>Volume rendering, slices and GPU isosurfaces</h1>
  <p><code>@margoengine/sciviz</code> · A 160³ field generated on the GPU, ray-marched with a transfer function and gradient lighting. Pick a mode, cut it open with a clip plane, add a slice, or extract an isosurface with marching cubes on the GPU.</p>
  <div class="controls">
    <label>Mode <select id="mode"><option value="composite">Composite</option><option value="mip">Maximum intensity</option></select></label>
    <label>Colour map <select id="map"><option>ember</option><option>aurora</option><option>glacier</option><option>cubehelix</option></select></label>
    <label>Cut <input id="cut" type="range" min="0" max="100" value="100"><output id="cutOut">off</output></label>
    <label>Slice <input id="slice" type="range" min="0" max="100" value="0"><output id="sliceOut">off</output></label>
    <label>Isosurface <input id="iso" type="range" min="0" max="100" value="0"><output id="isoOut">off</output></label>
  </div>
  <div class="views">
    <canvas id="viewport" aria-label="A glowing cloud of nested shells rendered as a volume, with optional slice and isosurface"></canvas>
  </div>
  <p id="status" data-webgpu-status role="status">Starting WebGPU…</p>
  <script type="module">
    import { needsWebGPU } from './needs-webgpu.js';
    needsWebGPU('#viewport').then((ok) => ok && import('./sciviz-volume.ts'));
  </script>
</body>
</html>
