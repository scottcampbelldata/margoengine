<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Below the Swell | Margo Engine</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #071820; color: #e5f3f3; font: 14px system-ui, sans-serif; }
    #viewport { position: fixed; inset: 0; }
    #controls {
      position: fixed; inset: auto 0 0; padding: 48px clamp(16px, 4vw, 60px) 24px;
      display: flex; gap: 18px; align-items: center;
      background: linear-gradient(transparent, #07151bd9); color: #e5f3f3;
    }
    h1 { font-size: clamp(15px, 2vw, 22px); font-weight: 550; margin: 0; }
    button {
      border: 1px solid #aabcc4; background: #112830; border-radius: 4px;
      color: inherit; min-width: 5rem; min-height: 36px; font: inherit; cursor: pointer;
    }
    input { min-width: 50px; max-width: 520px; flex: 1; accent-color: #b8dadd; }
    output { white-space: nowrap; font-variant-numeric: tabular-nums; }
    #status { position: fixed; top: 18px; left: 24px; margin: 0; }
    [hidden] { display: none !important; }
    @media (max-width: 550px) {
      #controls { flex-wrap: wrap; gap: 10px; }
      h1 { width: 100%; }
    }
  </style>
</head>
<body>
  <div id="viewport"></div>
  <p id="status" role="status">Loading the ocean and seabed…</p>
  <section id="controls" aria-label="Playback" hidden>
    <h1>Below the Swell</h1>
    <button id="play" type="button">Pause</button>
    <input id="seek" type="range" aria-label="Film position" min="0" max="60" step="0.01" value="0">
    <output id="clock" for="seek">0:00 / 1:00</output>
  </section>
  <script type="module" src="./main.js"></script>
</body>
</html>
