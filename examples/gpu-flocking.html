<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GPU Flocking · Margo Engine</title>
  <style>
    :root { color-scheme: dark; }
    [hidden] { display: none !important; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 14px/1.45 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #0b1220;
      color: #e8effa;
      overflow: hidden;
    }
    #viewport {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: block;
    }
    .panel {
      position: fixed;
      top: 12px;
      left: 12px;
      width: 300px;
      max-height: calc(100vh - 24px);
      overflow-y: auto;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid rgba(130, 170, 220, 0.25);
      background: rgba(11, 18, 32, 0.84);
      backdrop-filter: blur(8px);
      display: grid;
      gap: 10px;
    }
    h1 { margin: 0; font-size: 16px; letter-spacing: 0.01em; }
    .sub { margin: 0; font-size: 12px; color: #9eb4d4; }
    .row { display: flex; gap: 6px; flex-wrap: wrap; }
    button, select {
      font: inherit;
      font-size: 12px;
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid #455978;
      background: #172338;
      color: #e8effa;
      cursor: pointer;
    }
    button[aria-pressed="true"] {
      background: #cfe2ff;
      color: #0b1220;
      border-color: #cfe2ff;
      font-weight: 600;
    }
    label.slider {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 2px 8px;
      font-size: 12px;
      color: #c5d4eb;
    }
    label.slider input[type="range"] {
      grid-column: 1 / -1;
      width: 100%;
      margin: 0;
    }
    label.check {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #c5d4eb;
      cursor: pointer;
    }
    #status {
      margin: 0;
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      color: #8cc8ff;
    }
  </style>
</head>
<body>
  <canvas id="viewport" aria-label="GPU flocking simulation"></canvas>
  <aside class="panel" aria-label="Flocking controls">
    <h1>GPU Flocking</h1>
    <p class="sub">Separation, alignment and cohesion on the GPU, one instanced draw, no readback. Move the pointer to scatter or gather the flock.</p>

    <div class="row" role="group" aria-label="Preset">
      <button type="button" id="preset-bird" aria-pressed="true">Birds</button>
      <button type="button" id="preset-fish" aria-pressed="false">Fish</button>
      <select id="boid-count" aria-label="Boid count">
        <option value="2048">2,048 boids</option>
        <option value="4096">4,096 boids</option>
        <option value="16384" selected>16,384 boids</option>
        <option value="65536">65,536 boids</option>
      </select>
    </div>

    <div class="row" role="group" aria-label="Pointer mode">
      <button type="button" id="mode-predator" aria-pressed="true">Mouse: Predator</button>
      <button type="button" id="mode-attractor" aria-pressed="false">Mouse: Attractor</button>
      <button type="button" id="mode-off" aria-pressed="false">Off</button>
    </div>

    <label class="slider"><span>Separation</span><output id="out-sep">1.8</output><input id="sl-sep" type="range" min="0" max="5" step="0.1" value="1.8"></label>
    <label class="slider"><span>Alignment</span><output id="out-ali">1.1</output><input id="sl-ali" type="range" min="0" max="4" step="0.1" value="1.1"></label>
    <label class="slider"><span>Cohesion</span><output id="out-coh">1.0</output><input id="sl-coh" type="range" min="0" max="4" step="0.1" value="1.0"></label>
    <label class="slider"><span>Neighbor Radius</span><output id="out-rad">2.6</output><input id="sl-rad" type="range" min="0.8" max="6" step="0.1" value="2.6"></label>
    <label class="slider"><span>Vision Cone (deg)</span><output id="out-vis">270</output><input id="sl-vis" type="range" min="60" max="360" step="5" value="270"></label>
    <label class="slider"><span>Max Speed</span><output id="out-spd">10.0</output><input id="sl-spd" type="range" min="4" max="22" step="0.5" value="10"></label>

    <div class="row">
      <button type="button" id="btn-debug" aria-pressed="false">Debug View</button>
      <button type="button" id="btn-pause" aria-pressed="false">Pause</button>
      <button type="button" id="btn-reset">Reset</button>
    </div>
    <div id="debug-opts" class="row" hidden>
      <label class="check"><input id="dbg-vel" type="checkbox" checked>Velocities</label>
      <label class="check"><input id="dbg-grid" type="checkbox" checked>Grid</label>
      <label class="check"><input id="dbg-perc" type="checkbox" checked>Cone</label>
      <label class="check"><input id="dbg-vecs" type="checkbox" checked>Vectors</label>
    </div>

    <p id="status" data-webgpu-status role="status">Starting WebGPU…</p>
  </aside>
  <script type="module">
    import { needsWebGPU } from './needs-webgpu.js';
    needsWebGPU('#viewport').then((ok) => ok && import('./gpu-flocking.ts'));
  </script>
</body>
</html>
