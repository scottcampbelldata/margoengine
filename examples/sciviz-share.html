<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shared scientific figure | Margo Engine</title>
<style>html,body{margin:0;height:100%;font:16px system-ui;background:#10151d;color:#fff}canvas{width:100%;height:100%;display:block}#status{position:absolute;top:1rem;left:1rem;max-width:40rem}</style>
<canvas aria-label="Shared scientific figure"></canvas><p id="status" role="status">Opening shared figure...</p>
<script type="module">
  import { openShare } from '/packages/sciviz/dist/share.js';
  import { installCompat } from '/packages/webgl2-compat/dist/device.js';
  try {
    await installCompat();
    const figure = await openShare(location.href, document.querySelector('canvas'), { signal: AbortSignal.timeout(90000) });
    document.querySelector('#status').hidden = true;
    window.addEventListener('pagehide', () => figure.dispose(), { once: true });
    window.dispatchEvent(new CustomEvent('margo-ready', { detail: figure }));
  } catch (error) { document.querySelector('#status').textContent = error.message; }
</script>
</html>
