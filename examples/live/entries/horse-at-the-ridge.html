<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Horse at the Ridge | Margo Engine</title>
  <link rel="stylesheet" href="../../showcase-films/player.css">
</head>
<body>
  <div id="viewport"></div>
  <p id="status" role="status">Preparing the film.</p>
  <section id="controls" aria-label="Film playback" hidden>
    <button id="play" type="button">Pause</button>
    <input id="seek" type="range" aria-label="Film time" min="0" max="90" value="0" step="0.01">
    <output id="clock" for="seek">0:00 / 1:30</output>
  </section>
  <script type="module">
    import { openFilm } from '../../showcase-films/film.js';
    import { buildHorseAtTheRidge } from '../../showcase-films/horse-at-the-ridge.js';
    await openFilm({ title: 'Horse at the Ridge', build: buildHorseAtTheRidge, far: 1250, look: { environment: 0.63, direction: [0.56, 0.42, -0.71, 2.4], radiance: [1, 0.88, 0.72, 0.35], exposure: 0.14, bloom: 0.06, shadows: { distance: 39, resolution: 2048 } } });
  </script>
</body>
</html>
