<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Opening Night | Margo Engine</title>
  <link rel="stylesheet" href="../../showcase-films/player.css">
</head>
<body>
  <div id="viewport"></div>
  <p id="status" role="status">Preparing the film.</p>
  <section id="controls" aria-label="Film playback" hidden>
    <button id="play" type="button">Pause</button>
    <input id="seek" type="range" aria-label="Film time" min="0" max="90" value="0" step="0.01">
    <output id="clock" for="seek">0:00 / 1:30</output>
  </section>
  <script type="module">
    import { openFilm } from '../../showcase-films/film.js';
    import { buildOpeningNight } from '../../showcase-films/opening-night.js';
    await openFilm({ title: 'Opening Night', build: buildOpeningNight, night: true, far: 250, look: { environment: 0.62, direction: [-0.39, 0.62, 0.68, 0.95], radiance: [0.77, 0.83, 1, 0.4], exposure: 0.3, bloom: 0.14, shadows: { distance: 60, resolution: 2048 } } });
  </script>
</body>
</html>
