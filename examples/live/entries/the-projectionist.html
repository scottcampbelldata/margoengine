<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Projectionist | Margo Engine</title>
  <link rel="stylesheet" href="../../showcase-films/player.css">
</head>
<body>
  <div id="viewport"></div>
  <p id="status" role="status">Preparing the film.</p>
  <section id="controls" aria-label="Film playback" hidden>
    <button id="play" type="button">Pause</button>
    <input id="seek" type="range" aria-label="Film time" min="0" max="90" value="0" step="0.01">
    <output id="clock" for="seek">0:00 / 1:30</output>
  </section>
  <script type="module">
    import { openFilm } from '../../showcase-films/film.js';
    import { buildProjectionist } from '../../showcase-films/the-projectionist.js';
    await openFilm({ title: 'The Projectionist', build: buildProjectionist, night: true, far: 65, camera: { near: 0.025 }, look: { environment: 0.35, direction: [0.34, 0.72, 0.61, 0.4], radiance: [0.88, 0.83, 0.74, 0.25], exposure: 0.19, bloom: 0.14, shadows: { distance: 18, resolution: 2048 } } });
  </script>
</body>
</html>
