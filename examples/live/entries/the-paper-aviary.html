<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Paper Aviary | Margo Engine</title>
  <link rel="stylesheet" href="../../showcase-films/player.css">
</head>
<body>
  <div id="viewport"></div>
  <p id="status" role="status">Preparing the film.</p>
  <section id="controls" aria-label="Film playback" hidden>
    <button id="play" type="button">Pause</button>
    <input id="seek" type="range" aria-label="Film time" min="0" max="90" value="0" step="0.01">
    <output id="clock" for="seek">0:00 / 1:30</output>
  </section>
  <script type="module">
    import { openFilm } from '../../showcase-films/film.js';
    import { buildAviary } from '../../showcase-films/the-paper-aviary.js';
    await openFilm({ title: 'The Paper Aviary', build: buildAviary, far: 40, look: { direction: [-0.53, 0.75, 0.38, 2.15], radiance: [1, 0.89, 0.77, 0.41], ambient: [1, 0.94, 0.88], environment: 0.65, exposure: 0.18, shadows: { distance: 23, resolution: 2048 } } });
  </script>
</body>
</html>
