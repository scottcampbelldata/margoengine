<!doctype html><html><head><meta charset="utf-8"/><title>Margo vs three.js</title>
<style>html,body{margin:0;background:#000}canvas{display:block;width:1280px;height:720px}</style></head>
<body><canvas width="1280" height="720"></canvas>
<script type="module">
// ?engine=margo|three-webgl|three-webgpu&scene=boxes|cad|helmet&n=..&mode=mesh|instanced&move=0..1 (see run.mjs).
// Loads the minified production bundle run.mjs built for that engine.
const engine = new URLSearchParams(location.search).get('engine');
if (!['margo', 'three-webgl', 'three-webgpu'].includes(engine)) throw new Error('engine?');
await import(`/test-results/vs-threejs/dist/${engine}/${engine}.js`);
</script></body></html>
