<!doctype html><html><head><meta charset="utf-8"/><title>Margo vs three.js and Babylon.js</title><link rel="icon" href="data:,"/>
<style>html,body{margin:0;background:#000}canvas{display:block;width:1280px;height:720px}</style></head>
<body><canvas width="1280" height="720"></canvas>
<script type="module">
// ?engine=margo|three-webgl|three-webgpu|babylon-webgl|babylon-webgpu&scene=boxes|cad|helmet|cadfile&n=..
// &mode=mesh|instanced|culled|tuned&move=0..1 (see run.mjs). Loads the minified production bundle run.mjs built for
// that engine: the cadfile scene from the engine's cadfile build, every other scene from its main build.
const q = new URLSearchParams(location.search),
  engine = q.get('engine');
if (!['margo', 'three-webgl', 'three-webgpu', 'babylon-webgl', 'babylon-webgpu'].includes(engine)) throw new Error('engine?');
const bundle = q.get('scene') === 'cadfile' ? `${engine}-cadfile` : engine;
await import(`/test-results/vs-threejs/dist/${bundle}/${engine}.js`);
</script></body></html>
