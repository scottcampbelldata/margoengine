<!doctype html><html><head><meta charset="utf-8"/><title>DOF gate</title><style>body{margin:0;background:#000}canvas{width:1280px;height:720px;display:block}</style></head><body><canvas></canvas>
<script type="module">
// Real scene for the DOF benchmark (dof.mjs): the post-stack gate's DamagedHelmet + boxes with environment IBL, in a
// PostStack [DOF, Tonemap]. setup({variant,dof,msaa,size}) builds a fresh engine with the DOF class loaded from
// `variant` (a module URL), so old and new builds run in the same page; measure(frames) times every GPU pass.
import {Engine,PbrMaterial,box} from '/packages/core/dist/index.js';
import {loadGLTF} from '/packages/gltf-pro/dist/index.js';
import {PostStack} from '/packages/post/dist/stack.js';
import {Tonemap} from '/packages/tonemap/dist/index.js';
import {Environment,EnvironmentLighting} from '/packages/environment/dist/index.js';

const canvas=document.querySelector('canvas'),helmetUrl='/examples/assets/damaged-helmet.glb';
function sky(width=256,height=128){
  const data=new Float32Array(width*height*4),sun=[0.5,0.6,-0.62];
  for(let y=0;y<height;y++)for(let x=0;x<width;x++){
    const phi=2*Math.PI*((x+0.5)/width-0.5),theta=Math.PI*(y+0.5)/height,d=[Math.sin(theta)*Math.sin(phi),Math.cos(theta),-Math.sin(theta)*Math.cos(phi)];
    const up=Math.max(d[1],0),dot=Math.max(0,d[0]*sun[0]+d[1]*sun[1]+d[2]*sun[2]),s=40*dot**256;
    data.set([0.35+0.25*up+s,0.4+0.35*up+s,0.5+0.6*up+s*0.9,1],(y*width+x)*4);
  }
  return {width,height,data};
}
let state;
async function teardown(){
  if(!state)return;const {engine,model,set,resolve,read}=state;state=undefined;
  await engine.gpu.queue.onSubmittedWorkDone();model.destroy();set?.destroy();resolve?.destroy();read?.destroy();engine.dispose();
}
let owner='scene';
const within=(name,fn)=>function(...args){const prev=owner;owner=name;try{return fn.apply(this,args);}finally{owner=prev;}};
function tag(plugin,name){
  const join=plugin.joinStack;if(join)plugin.joinStack=function(host){const stage=join.call(this,host);stage.render=within(name,stage.render);return stage;};
  return plugin;
}
const begin={render:GPUCommandEncoder.prototype.beginRenderPass,compute:GPUCommandEncoder.prototype.beginComputePass};
GPUCommandEncoder.prototype.beginRenderPass=function(d){return begin.render.call(this,stamp(d));};
GPUCommandEncoder.prototype.beginComputePass=function(d={}){return begin.compute.call(this,stamp(d));};
function stamp(d){
  if(!state?.timing||d.timestampWrites||state.passes>=state.capacity)return d;
  state.owners[state.passes]=owner==='dof'?'dof:'+state.dofPass++:owner;const at=state.passes++*2;return {...d,timestampWrites:{querySet:state.set,beginningOfPassWriteIndex:at,endOfPassWriteIndex:at+1}};
}
const camera={position:[0.4,0.55,3.4],target:[0,0.05,0]};
window.bench={
  async setup({variant='/packages/dof/dist/index.js',dof={},msaa=4,size=[1280,720]}={}){
    await teardown();
    if(msaa===1)globalThis.margoLow=1;else delete globalThis.margoLow;
    canvas.style.width=size[0]+'px';canvas.style.height=size[1]+'px';
    const {DOF}=await import(variant);
    const engine=await Engine.create(canvas,{backend:'webgpu',features:['timestamp-query'],camera:{...camera,position:[...camera.position],near:0.05,far:100}}),device=engine.gpu,errors=[];
    device.addEventListener('uncapturederror',e=>errors.push(e.error.message));
    const floor=new PbrMaterial({color:'#9a9488',roughness:0.85}),paint=new PbrMaterial({color:'#2f6fb0',roughness:0.35,metalness:0.1}),steel=new PbrMaterial({color:'#c8c8c8',roughness:0.2,metalness:1});
    engine.createMesh().setGeometry(box(30,0.1,30)).setPosition([0,-1.05,0]).setMaterial(floor);
    for(let i=0;i<8;i++)engine.createMesh().setGeometry(box(0.8,1.6,0.8)).setPosition([-5+i*1.5,-0.2,-6-i%3*3]).setRotation([0,i*0.6,0]).setMaterial(i%2?paint:steel);
    engine.createMesh().setGeometry(box(0.3,0.3,0.3)).setPosition([-0.75,-0.25,1.9]).setRotation([0.5,0.7,0]).setMaterial(paint);
    engine.createMesh().setGeometry(box(0.5,0.5,0.5)).setPosition([1.05,-0.75,0.1]).setMaterial(steel);
    const model=await loadGLTF(engine,helmetUrl);model.setPosition?.([0,0.05,0]);
    const environment=await Environment.create(engine,sky());engine.use(environment);const lighting=new EnvironmentLighting(environment);engine.use(lighting);lighting.applyTo(model);
    engine.use(new PostStack([tag(new DOF(dof),'dof'),new Tonemap({curve:'neutral'})]));
    const capacity=2048,set=device.createQuerySet({type:'timestamp',count:capacity*2});
    const resolve=device.createBuffer({size:capacity*16,usage:GPUBufferUsage.QUERY_RESOLVE|GPUBufferUsage.COPY_SRC});
    const read=device.createBuffer({size:capacity*16,usage:GPUBufferUsage.COPY_DST|GPUBufferUsage.MAP_READ});
    state={engine,model,set,resolve,read,timing:false,passes:0,owners:[],capacity,errors};
    for(let i=0;i<4;i++)engine.render();await device.queue.onSubmittedWorkDone();
    return {canvas:[canvas.width,canvas.height],errors:errors.splice(0)};
  },
  // Moves the camera sideways by `dx` (scene units) and renders one presented frame.
  async render(dx=0){
    const c=state.engine.camera;c.position=[camera.position[0]+dx,camera.position[1],camera.position[2]];c.target=[camera.target[0]+dx,camera.target[1],camera.target[2]];
    state.engine.render();await state.engine.gpu.queue.onSubmittedWorkDone();await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));return {errors:state.errors.splice(0)};
  },
  async measure(frames=90,warm=30){
    const {engine,set,resolve,read}=state,device=engine.gpu,byOwner={};let zeroFrames=0;
    for(let i=0;i<warm;i++)engine.render();
    let done=0;
    while(done<frames){
      const batch=[];state.passes=0;state.timing=true;
      do{const start=state.passes;state.dofPass=0;engine.render();batch.push([start,state.passes]);done++;}
      while(done<frames&&state.passes+(batch.at(-1)[1]-batch.at(-1)[0])<=state.capacity);
      state.timing=false;
      const n=state.passes,e=device.createCommandEncoder();e.resolveQuerySet(set,0,n*2,resolve,0);e.copyBufferToBuffer(resolve,0,read,0,n*16);device.queue.submit([e.finish()]);
      await read.mapAsync(GPUMapMode.READ);const q=new BigUint64Array(read.getMappedRange().slice(0,n*16));read.unmap();
      for(const [a,b] of batch){
        let sum=0;const own={};for(let i=a;i<b;i++){const t=Number(q[2*i+1]-q[2*i]),o=state.owners[i];own[o]=(own[o]??0)+t/1e6;if(o.startsWith('dof:'))own.dof=(own.dof??0)+t/1e6;sum+=t;}
        if(sum===0){zeroFrames++;continue;}
        for(const k in own)(byOwner[k]??=[]).push(own[k]);
      }
    }
    const median=a=>{const s=[...a].sort((x,y)=>x-y);return s[s.length>>1];};
    return {zeroFrames,ownerMs:Object.fromEntries(Object.entries(byOwner).map(([k,v])=>[k,+median(v).toFixed(4)])),errors:state.errors.splice(0)};
  },
  teardown,
};
window.ready=true;
</script></body></html>
