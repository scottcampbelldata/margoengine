<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102026">
  <title>Interactive Water Ripples · Margo Engine</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#102026;color:#edf5f4;font:14px/1.5 system-ui,sans-serif}
    #viewport{height:100svh;min-height:440px}canvas{outline-offset:-4px;touch-action:none}
    aside{position:absolute;top:24px;left:24px;width:min(348px,calc(100% - 48px));max-height:calc(100svh - 48px);display:flex;flex-direction:column;overflow:hidden;padding:22px;background:#11232aed;border:1px solid #4f7881;border-radius:12px;backdrop-filter:blur(12px)}
    aside>:not(details){flex-shrink:0}details{min-height:0;overflow:auto;scrollbar-gutter:stable;padding-right:10px}
    h1{font-size:26px;line-height:1.1;margin:6px 0 10px}.eyebrow{color:#7ae8d5;font-size:10px;letter-spacing:2px;text-transform:uppercase}p{color:#bbd4d2;margin:0 0 14px}
    summary{font-weight:600;cursor:pointer;padding:6px 0;color:#d8f4ef}fieldset{border:0;border-top:1px solid #355860;padding:8px 0 0;margin:12px 0}
    legend{color:#7ae8d5;font-size:11px;letter-spacing:1px;text-transform:uppercase;padding-right:10px}
    label{display:block;margin-top:10px}input[type=range]{display:block;width:100%;margin:6px 0;accent-color:#6de0cb}input[type=checkbox]{accent-color:#6de0cb}
    output{float:right;font-variant-numeric:tabular-nums}select{width:100%;padding:7px;margin-top:6px;background:#1b353e;color:#edf5f4;border:1px solid #4f7881;border-radius:4px;font:inherit}
    .buttons{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}button{flex:1 1 45%;min-height:40px;padding:8px;border:1px solid #6de0cb;border-radius:6px;background:#6de0cb;color:#102026;font:inherit;font-weight:600;cursor:pointer}
    button.secondary{background:transparent;color:#d8f4ef}button[aria-pressed="true"]{background:#f4c542;border-color:#f4c542;color:#102026}
    :focus-visible{outline:3px solid #aef7e9;outline-offset:4px}#error{color:#ffd2a8;margin:10px 0 0}#error:empty{display:none}
    small{display:block;margin-top:10px;color:#bbd4d2;font-size:11px;font-variant-numeric:tabular-nums}
    @media(max-width:600px){aside{top:12px;left:12px;padding:14px 16px;width:calc(100% - 24px);max-height:55svh}h1{font-size:22px}}
  </style>
</head>
<body>
  <main id="viewport" aria-label="Interactive ripple pond with obstacle reflections, moving boat wakes, rain, and debug heatmap"></main>
  <aside aria-label="Ripples controls">
    <span class="eyebrow">Margo Engine · Interactive Water</span>
    <h1>Water Ripples</h1>
    <p>Click or drag across the pond to cast ripples with <code>disturbRay</code>. Watch wakes from tracked bodies reflect off pillars and walls.</p>
    <details id="settings" open>
      <summary>Pond &amp; debug controls</summary>
      <fieldset>
        <legend>Interaction</legend>
        <label><input id="paint-mode" type="checkbox" checked> Left-click / drag paints ripples (right-drag orbits)</label>
        <label for="brush-radius">Drop radius <output id="radius-value" for="brush-radius">1.1 m</output></label>
        <input id="brush-radius" type="range" min="0.4" max="3.0" step="0.1" value="1.1">
        <label for="brush-strength">Drop strength <output id="strength-value" for="brush-strength">0.18 m</output></label>
        <input id="brush-strength" type="range" min="0.04" max="0.45" step="0.02" value="0.18">
      </fieldset>
      <fieldset>
        <legend>Scene elements</legend>
        <label><input id="boat-active" type="checkbox" checked> Moving boat &amp; bobbing sphere (<code>trackBody</code>)</label>
        <label><input id="obstacles-active" type="checkbox" checked> Reflecting pillars &amp; pier wall (<code>setObstacles</code>)</label>
        <label><input id="rain-active" type="checkbox"> Rain splashes</label>
      </fieldset>
      <fieldset>
        <legend>Debug view</legend>
        <label for="debug-mode">Heatmap mode</label>
        <select id="debug-mode">
          <option value="off" selected>Off (shaded pond)</option>
          <option value="height">Height heatmap</option>
          <option value="velocity">Velocity heatmap</option>
          <option value="obstacles">Obstacle reflection mask</option>
        </select>
        <label><input id="debug-bounds" type="checkbox" checked> Show scroll grid &amp; sponge border</label>
      </fieldset>
    </details>
    <div class="buttons">
      <button id="drop-splash" type="button">Center splash</button>
      <button id="reset-view" type="button" class="secondary">Reset view</button>
    </div>
    <small id="status" data-webgpu-status role="status">Starting WebGPU…</small>
    <p id="error" role="alert"></p>
  </aside>
  <script type="module">
    import { needsWebGPU } from './needs-webgpu.js';
    needsWebGPU('#viewport').then((ok) => ok && import('./water-ripples.ts'));
  </script>
</body>
</html>
