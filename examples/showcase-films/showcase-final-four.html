<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Margo Engine Showcase</title>
  <link rel="stylesheet" href="./player.css">
</head>
<body>
  <div id="viewport"></div>
  <p id="status" role="status">Preparing the film…</p>
  <section id="controls" aria-label="Film playback" hidden>
    <button id="play" type="button">Pause</button>
    <input id="seek" type="range" aria-label="Film time" min="0" max="90" value="0" step="0.01">
    <output id="clock" for="seek">0:00 / 1:30</output>
  </section>
  <script type="module">
    import { openFilm } from './film.js';
    const films = {
      'the-village-that-builds-itself': async () => ({
        title: 'The Village That Builds Itself',
        build: (await import('./the-village-that-builds-itself.js')).buildVillage,
        far: 110, look: { direction: [-0.64, 0.54, 0.48, 2.5], radiance: [1,.87,.73,.38], environment:.82, exposure:.24, shadows:{distance:50} },
      }),
      'lantern-courier': async () => ({
        title: 'Lantern Courier',
        build: (await import('./lantern-courier.js')).buildCourier,
        night: true, far: 30, look: { bloom: 0 },
      }),
      'the-voxel-night-shop': async () => ({
        title: 'The Voxel Night Shop',
        build: (await import('./the-voxel-night-shop.js')).buildNightShop,
        night: true, far: 35, look: { exposure: .25, bloom:.1 },
      }),
      'the-paper-aviary': async () => ({
        title: 'The Paper Aviary',
        build: (await import('./the-paper-aviary.js')).buildAviary,
        far: 40, look: { direction: [-.53,.75,.38,2.15], radiance: [1,.89,.77,.41], ambient:[1,.94,.88], environment:.65, exposure:.18, shadows:{distance:23,resolution:2048} },
      }),
    };
    const id = new URLSearchParams(location.search).get('film');
    if (!Object.hasOwn(films, id)) throw new Error('Choose a showcase film.');
    const film = await films[id]();
    document.title = `${film.title} | Margo Engine`;
    await openFilm(film);
  </script>
</body>
</html>
