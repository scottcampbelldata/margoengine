<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Last Tram | Margo Engine</title>
  <link rel="stylesheet" href="./player.css">
</head>
<body>
  <div id="viewport"></div>
  <p id="status" role="status">Preparing the film…</p>
  <section id="controls" aria-label="Film playback" hidden>
    <button id="play" type="button">Pause</button>
    <input id="seek" type="range" aria-label="Film time" min="0" max="90" value="0" step="0.01">
    <output id="clock" for="seek">0:00 / 1:30</output>
  </section>
  <script type="module">
    import { openFilm } from './film.js';
    import { buildDepot } from './last-tram.js';
    await openFilm({ title: 'Last Tram', build: buildDepot, night: true, far: 180, look: {
      environment: 0.45,
      // What wet tops and glass reflect: the overcast lit orange from below by the city, a dark yard under it.
      sky: { zenith: [0.11, 0.065, 0.04], horizon: [0.2, 0.115, 0.065], ground: [0.018, 0.016, 0.016] },
      // Night grade: a third of a stop up, the dark yard lifted locally so it reads, black kept black and cool,
      // the sodium highlights warm, and a gentle S so wet speculars pop.
      exposure: 0.8,
      bloom: 0.3,
      local: { strength: 0.38, maxStops: 1.6, radius: 0.045 },
      grade: {
        shadows: [-0.012, 0.002, 0.024],
        highlights: [0.018, 0.006, -0.012],
        curves: { master: [[0, 0], [0.08, 0.06], [0.35, 0.37], [0.75, 0.8], [1, 1]] },
        saturation: 1.06,
      },
    } });
  </script>
</body>
</html>
