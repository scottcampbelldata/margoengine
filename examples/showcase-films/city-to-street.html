<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>City to Street | Margo Engine</title>
  <link rel="stylesheet" href="./player.css">
</head>
<body>
  <div id="viewport"></div>
  <p id="status" role="status">Preparing the film…</p>
  <section id="controls" aria-label="Film playback" hidden>
    <button id="play" type="button">Pause</button>
    <input id="seek" type="range" aria-label="Film time" min="0" max="90" value="0" step="0.01">
    <output id="clock" for="seek">0:00 / 1:30</output>
  </section>
  <script type="module">
    import { openFilm } from './film.js';
    import { buildCity } from './city-to-street.js';
    await openFilm({ build: buildCity, ...{
      title: "City to Street",
      "night": false,
      "far": 4500,
      "camera": { "near": 0.4 },
      "look": {
        "environment": 0.68,
        "curve": "agx",
        "exposure": 0.27,
        "contrast": 1,
        "bloom": 0,
        "direction": [
          0.65,
          0.58,
          -0.49,
          2.45
        ],
        "radiance": [
          0.99,
          0.93,
          0.83,
          0.41
        ],
        "shadows": {
          "distance": 190,
          "resolution": 2048
        }
      }
    } });
  </script>
</body>
</html>
