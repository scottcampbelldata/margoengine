<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Margo Engine Showcase</title>
  <link rel="stylesheet" href="./player.css">
</head>
<body>
  <div id="viewport"></div>
  <p id="status" role="status">Preparing the film…</p>
  <section id="controls" aria-label="Film playback" hidden>
    <button id="play" type="button">Pause</button>
    <input id="seek" type="range" aria-label="Film time" min="0" max="90" value="0" step="0.01">
    <output id="clock" for="seek">0:00 / 1:30</output>
  </section>
  <script type="module">
    import { openFilm } from './film.js';
    const load = (name) => import(/* @vite-ignore */ `./${name}.js`);
    const films = {
      'inside-a-meteorite': async () => ({
        build: (await load('inside-a-meteorite')).buildMeteorite,
        title: 'Inside a Meteorite', night: true, far: 17, camera: { near: 0.012 },
        look: { environment: 0.62, direction: [0.44, 0.73, 0.5, 1.71], radiance: [0.9, 0.96, 1, 0.36], exposure: 0.18, bloom: 0.1, shadows: { distance: 2 } },
      }),
      'horse-at-the-ridge': async () => ({
        build: (await load('horse-at-the-ridge')).buildHorseAtTheRidge,
        title: 'Horse at the Ridge', far: 1250,
        look: { environment: 0.63, direction: [0.56, 0.42, -0.71, 2.4], radiance: [1, 0.88, 0.72, 0.35], exposure: 0.14, bloom: 0.06, shadows: { distance: 39, resolution: 2048 } },
      }),
      'the-projectionist': async () => ({
        build: (await load('the-projectionist')).buildProjectionist,
        title: 'The Projectionist', night: true, far: 65, camera: { near: 0.025 },
        look: { environment: 0.35, direction: [0.34, 0.72, 0.61, 0.40], radiance: [0.88, 0.83, 0.74, 0.25], exposure: 0.19, bloom: 0.14, shadows: { distance: 18, resolution: 2048 } },
      }),
      'opening-night': async () => ({
        build: (await load('opening-night')).buildOpeningNight,
        title: 'Opening Night', night: true, far: 250,
        look: { environment: 0.62, direction: [-0.39, 0.62, 0.68, 0.95], radiance: [0.77, 0.83, 1, 0.40], exposure: 0.30, bloom: 0.14, shadows: { distance: 60, resolution: 2048 } },
      }),
    };
    const id = new URLSearchParams(location.search).get('film');
    if (!Object.hasOwn(films, id)) throw new Error('Choose a showcase film.');
    const film = await films[id]();
    document.title = `${film.title} | Margo Engine`;
    await openFilm(film);
  </script>
</body>
</html>
