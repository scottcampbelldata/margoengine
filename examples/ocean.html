<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d1b2a">
  <title>FFT Ocean · Margo Engine</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#0d1b2a;color:#edf2f7;font:14px/1.5 system-ui,sans-serif}
    #viewport{height:100svh;min-height:440px}canvas{outline-offset:-4px;touch-action:none}
    aside{position:absolute;top:24px;left:24px;width:min(348px,calc(100% - 48px));max-height:calc(100svh - 48px);display:flex;flex-direction:column;overflow:hidden;padding:22px;background:#0f1d2eed;border:1px solid #496682;border-radius:12px;backdrop-filter:blur(12px)}
    aside>:not(details){flex-shrink:0}details{min-height:0;overflow:auto;scrollbar-gutter:stable;padding-right:10px}
    h1{font-size:26px;line-height:1.1;margin:6px 0 10px}.eyebrow{color:#7fd4ff;font-size:10px;letter-spacing:2px;text-transform:uppercase}p{color:#b8cbde;margin:0 0 14px}
    summary{font-weight:600;cursor:pointer;padding:6px 0;color:#d6ecff}fieldset{border:0;border-top:1px solid #354f68;padding:8px 0 0;margin:12px 0}
    legend{color:#7fd4ff;font-size:11px;letter-spacing:1px;text-transform:uppercase;padding-right:10px}
    label{display:block;margin-top:10px}input[type=range]{display:block;width:100%;margin:6px 0;accent-color:#6bc8ff}input[type=checkbox]{accent-color:#6bc8ff}
    output{float:right;font-variant-numeric:tabular-nums}select{width:100%;padding:7px;margin-top:6px;background:#1a2e44;color:#edf2f7;border:1px solid #496682;border-radius:4px;font:inherit}
    .buttons{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}button{flex:1 1 45%;min-height:40px;padding:8px;border:1px solid #6bc8ff;border-radius:6px;background:#6bc8ff;color:#0d1b2a;font:inherit;font-weight:600;cursor:pointer}
    button.secondary{background:transparent;color:#d6ecff}button[aria-pressed="true"]{background:#f4c542;border-color:#f4c542;color:#111a24}
    :focus-visible{outline:3px solid #aee4ff;outline-offset:4px}#error{color:#ffd2a8;margin:10px 0 0}#error:empty{display:none}
    small{display:block;margin-top:10px;color:#b8cbde;font-size:11px;font-variant-numeric:tabular-nums}
    @media(max-width:600px){aside{top:12px;left:12px;padding:14px 16px;width:calc(100% - 24px);max-height:55svh}h1{font-size:22px}}
  </style>
</head>
<body>
  <main id="viewport" aria-label="Interactive spectral FFT ocean with live wind retuning and floating buoy"></main>
  <aside aria-label="Ocean controls">
    <span class="eyebrow">Margo Engine · Spectral Water</span>
    <h1>FFT Ocean</h1>
    <p>Live GPU JONSWAP ocean with <code>setWind</code>, synchronous CPU <code>sample()</code> buoy physics, underwater dive, and debug overlays.</p>
    <details id="settings" open>
      <summary>Sea state &amp; debug</summary>
      <fieldset>
        <legend>Look &amp; wind</legend>
        <label for="look">Water look</label>
        <select id="look">
          <option value="breeze" selected>Breeze</option>
          <option value="glassy">Glassy</option>
          <option value="calm">Calm</option>
          <option value="tropical">Tropical</option>
          <option value="arctic">Arctic</option>
          <option value="gale">Gale</option>
          <option value="storm">Storm</option>
          <option value="hurricane">Hurricane</option>
          <option value="nightSea">Night sea</option>
        </select>
        <label for="wind">Wind speed <output id="wind-value" for="wind">10.0 m/s</output></label>
        <input id="wind" type="range" min="0.5" max="35" step="0.5" value="10">
        <label for="direction">Wind direction <output id="direction-value" for="direction">73°</output></label>
        <input id="direction" type="range" min="0" max="360" step="1" value="73">
        <label for="chop">Choppiness <output id="chop-value" for="chop">1.00</output></label>
        <input id="chop" type="range" min="0" max="2.5" step="0.05" value="1">
        <label for="whitecaps">Whitecaps <output id="whitecaps-value" for="whitecaps">0.70</output></label>
        <input id="whitecaps" type="range" min="0" max="1" step="0.02" value="0.7">
      </fieldset>
      <fieldset>
        <legend>Debug view</legend>
        <label for="debug-mode">Shading mode</label>
        <select id="debug-mode">
          <option value="off" selected>Off (shaded ocean)</option>
          <option value="normals">Wave normals</option>
          <option value="foam">Jacobian foam mask</option>
          <option value="jacobian">Jacobian determinant</option>
          <option value="wireframe">Mesh wireframe</option>
        </select>
        <label><input id="debug-wire" type="checkbox"> Overlay wireframe</label>
        <label><input id="debug-rings" type="checkbox"> Show cascade LOD rings</label>
        <label><input id="debug-points" type="checkbox" checked> Highlight buoy sample points</label>
      </fieldset>
    </details>
    <div class="buttons">
      <button id="dive" type="button" aria-pressed="false">Dive underwater</button>
      <button id="pause" type="button" class="secondary" aria-pressed="false">Pause</button>
      <button id="reset-view" type="button" class="secondary">Reset view</button>
    </div>
    <small id="buoy-readout">Buoy: waiting…</small>
    <small id="status" data-webgpu-status role="status">Starting WebGPU…</small>
    <p id="error" role="alert"></p>
  </aside>
  <script type="module">
    import { needsWebGPU } from './needs-webgpu.js';
    needsWebGPU('#viewport').then((ok) => ok && import('./ocean.ts'));
  </script>
</body>
</html>
