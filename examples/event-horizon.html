<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#040508">
  <meta name="description" content="Gargantua-class relativistic Kerr black hole radiative transfer simulation in WebGPU with Margo Engine.">
  <title>EVENT HORIZON · Relativistic Kerr Radiative Transfer - Margo Engine</title>
  <style>
    :root {
      --bg: #040508;
      --panel: rgba(8, 10, 16, 0.76);
      --border: rgba(255, 255, 255, 0.11);
      --border-hi: rgba(245, 176, 86, 0.58);
      --amber: #f5b056;
      --amber-hi: #ffdba4;
      --cyan: #67e8f9;
      --text: #f3f5f8;
      --muted: #8a94a6;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    #viewport {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
    }

    canvas {
      touch-action: none;
      display: block;
      cursor: grab;
    }
    canvas:active { cursor: grabbing; }

    .hud {
      position: fixed;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px 30px;
    }

    /* Top Bar */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      pointer-events: auto;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-ring {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1.5px solid var(--amber);
      box-shadow: 0 0 18px rgba(245, 176, 86, 0.45), inset 0 0 10px rgba(245, 176, 86, 0.35);
      display: grid;
      place-items: center;
    }

    .brand-core {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #020305;
      box-shadow: 0 0 6px var(--amber-hi);
    }

    .brand-title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--text);
    }

    .brand-sub {
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--amber);
      margin-top: 2px;
    }

    .camera-pills {
      display: flex;
      gap: 6px;
      background: var(--panel);
      border: 1px solid var(--border);
      backdrop-filter: blur(16px);
      padding: 4px;
      border-radius: 999px;
    }

    .cam-btn {
      appearance: none;
      border: 1px solid transparent;
      background: transparent;
      color: var(--muted);
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      padding: 7px 13px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.18s ease;
    }

    .cam-btn:hover { color: var(--text); }
    .cam-btn.active {
      background: rgba(245, 176, 86, 0.16);
      color: var(--amber-hi);
      border-color: var(--border-hi);
      box-shadow: 0 0 16px rgba(245, 176, 86, 0.18);
    }

    .telemetry-pill {
      font: 11.5px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      color: var(--amber-hi);
      background: var(--panel);
      border: 1px solid var(--border);
      backdrop-filter: blur(16px);
      padding: 8px 14px;
      border-radius: 999px;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.03em;
    }

    /* Bottom Control Deck */
    .bottom-deck {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
      pointer-events: auto;
    }

    .control-panel {
      background: var(--panel);
      border: 1px solid var(--border);
      backdrop-filter: blur(20px);
      border-radius: 16px;
      padding: 16px 20px;
      width: min(760px, 100%);
      display: grid;
      gap: 14px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55);
    }

    .sliders-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr auto;
      gap: 16px;
      align-items: end;
    }

    @media (max-width: 780px) {
      .sliders-grid { grid-template-columns: 1fr; }
      .camera-pills { display: none; }
    }

    label {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .label-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    output {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 11.5px;
      color: var(--amber-hi);
      font-variant-numeric: tabular-nums;
    }

    input[type="range"] {
      width: 100%;
      height: 5px;
      margin: 0;
      accent-color: var(--amber);
      cursor: pointer;
    }

    .mode-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.07);
      gap: 12px;
      flex-wrap: wrap;
    }

    .spectrum-group {
      display: flex;
      gap: 6px;
    }

    .spec-btn {
      appearance: none;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 6px 11px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.16s ease;
    }

    .spec-btn:hover { color: var(--text); }
    .spec-btn.active {
      background: rgba(245, 176, 86, 0.15);
      border-color: var(--border-hi);
      color: var(--amber-hi);
    }

    .btn-flare {
      appearance: none;
      height: 36px;
      padding: 0 18px;
      background: linear-gradient(135deg, #f6b862 0%, #c97821 100%);
      color: #07090e;
      border: none;
      border-radius: 999px;
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 0.11em;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(245, 176, 86, 0.28);
      transition: transform 0.16s ease, box-shadow 0.16s ease;
      white-space: nowrap;
    }

    .btn-flare:hover {
      transform: translateY(-1px);
      box-shadow: 0 12px 28px rgba(245, 176, 86, 0.42);
    }

    .hint-text {
      font-size: 11px;
      color: var(--muted);
    }

    #status {
      position: fixed;
      top: 46%;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 11px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--amber-hi);
      pointer-events: none;
      z-index: 5;
    }

    #error {
      position: fixed;
      top: 72px;
      left: 30px;
      color: #ff8a8a;
      font-size: 12px;
      z-index: 5;
    }
    #error:empty { display: none; }
  </style>
</head>
<body>
  <main id="viewport" aria-label="Relativistic Kerr black hole radiative transfer simulation; drag to orbit, scroll to zoom"></main>

  <div class="hud">
    <header class="top-bar">
      <div class="brand">
        <div class="brand-ring"><div class="brand-core"></div></div>
        <div>
          <div class="brand-title">GARGANTUA · Kerr Geodesic Solver</div>
          <div class="brand-sub">General Relativistic Ray-Marched Radiative Transfer · Margo Engine</div>
        </div>
      </div>

      <nav class="camera-pills" aria-label="Camera Presets">
        <button type="button" class="cam-btn active" data-cam="0">01 · Gargantua (8.5°)</button>
        <button type="button" class="cam-btn" data-cam="1">02 · Photon Ring Skim</button>
        <button type="button" class="cam-btn" data-cam="2">03 · Polar Jet Funnel</button>
        <button type="button" class="cam-btn" data-cam="3">04 · Edge-On Split (1.2°)</button>
      </nav>

      <p id="telemetry" class="telemetry-pill" aria-live="polite">r_ISCO 2.32 r_g · r_ph 1.55 r_g · D_max 2.68×</p>
    </header>

    <div class="bottom-deck">
      <form id="form" class="control-panel">
        <div class="sliders-grid">
          <label for="spin">
            <span class="label-row"><span>Kerr Spin (a/M)</span><output id="spin-out" for="spin">0.90</output></span>
            <input id="spin" type="range" min="0" max="0.99" step="0.01" value="0.90">
          </label>
          <label for="accretion">
            <span class="label-row"><span>Mass Accretion (ṁ)</span><output id="accretion-out" for="accretion">1.15</output></span>
            <input id="accretion" type="range" min="0.4" max="2.2" step="0.02" value="1.15">
          </label>
          <label for="jet">
            <span class="label-row"><span>Relativistic Jet (B²)</span><output id="jet-out" for="jet">0.65</output></span>
            <input id="jet" type="range" min="0.0" max="1.5" step="0.05" value="0.65">
          </label>
          <button id="flare" class="btn-flare" type="button">Inject Hot-Spot Flare</button>
        </div>

        <div class="mode-bar">
          <div class="spectrum-group">
            <button type="button" class="spec-btn active" data-spec="0">Optical Blackbody</button>
            <button type="button" class="spec-btn" data-spec="1">EHT 230 GHz VLBI</button>
            <button type="button" class="spec-btn" data-spec="2">X-Ray Corona (Fe Kα)</button>
          </div>
          <span class="hint-text">Drag to orbit spacetime · Scroll to zoom · 200-step RK2 null geodesic integrator</span>
        </div>
      </form>
    </div>
  </div>

  <p id="status" data-webgpu-status role="status">Integrating null geodesics in Kerr spacetime…</p>
  <p id="error" role="alert"></p>

  <script type="module">
    import { needsWebGPU } from './needs-webgpu.js';
    needsWebGPU('#viewport').then((ok) => ok && import('./event-horizon.ts'));
  </script>
</body>
</html>
