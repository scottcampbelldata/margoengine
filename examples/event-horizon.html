<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#05060a">
  <meta name="description" content="A spinning relativistic black hole with gravitational lensing, Doppler-beamed accretion disk, and 4,500 orbiting plasma knots. Rendered live in WebGPU with Margo Engine.">
  <title>Event Horizon · Margo Engine</title>
  <!-- Margo engine made for Margie -->
  <style>
    *{box-sizing:border-box}html,body{height:100%}body{margin:0;background:#05060a;color:#ece8df;font:15px/1.4 Georgia,'Times New Roman',serif;overflow:hidden}
    #viewport{position:fixed;inset:0}canvas{touch-action:none;display:block}
    header{position:fixed;top:20px;left:24px;right:24px;display:flex;justify-content:space-between;align-items:baseline;pointer-events:none;gap:16px;flex-wrap:wrap}
    h1{margin:0;font-size:16px;font-weight:400;color:#d8d2c5;pointer-events:auto}
    h1 a{color:inherit}
    #telemetry{margin:0;font:13px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#b8b2a6;background:#090b12cc;padding:6px 12px;border:1px solid #3c3a36;border-radius:4px;font-variant-numeric:tabular-nums}
    form{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(680px,calc(100% - 32px));padding:12px 16px;background:#090b12de;border:1px solid #4a463f;border-radius:4px;display:grid;gap:10px}
    .controls{display:grid;grid-template-columns:1fr 1fr auto;gap:14px;align-items:end}
    @media (max-width:600px){.controls{grid-template-columns:1fr}}
    label{display:flex; flex-direction:column; gap:4px; font-size:14px; color:#d8d2c5}
    .label-row{display:flex;justify-content:space-between}
    output{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;color:#ffd89b;font-variant-numeric:tabular-nums}
    input[type="range"]{width:100%;height:32px;margin:0;accent-color:#f0a84b;cursor:pointer}
    button{min-width:128px;min-height:40px;padding:0 14px;background:#181410;color:#f5e7cf;border:1px solid #b5894c;border-radius:4px;font:inherit;cursor:pointer}
    button:hover{background:#261e15}
    :focus-visible{outline:3px solid #ffd98a;outline-offset:2px}
    #status{position:fixed;top:44%;left:0;right:0;margin:0;padding:0 24px;text-align:center;pointer-events:none}
    #error{position:fixed;top:56px;left:24px;right:24px;margin:0;color:#ffd9b5}#error:empty{display:none}
  </style>
</head>
<body>
  <main id="viewport" aria-label="A spinning relativistic black hole with a glowing accretion disk and orbiting plasma knots; drag to orbit, scroll to zoom"></main>
  <header>
    <h1>Event Horizon, <a href="../">Margo Engine</a></h1>
    <p id="telemetry" aria-live="polite">r_ISCO 3.16 r_g · r_ph 2.04 r_g · D_max 2.41×</p>
  </header>
  <form id="form">
    <div class="controls">
      <label for="spin">
        <span class="label-row"><span>Kerr Spin (a/M)</span><output id="spin-out" for="spin">0.75</output></span>
        <input id="spin" type="range" min="0" max="0.98" step="0.01" value="0.75">
      </label>
      <label for="accretion">
        <span class="label-row"><span>Accretion Rate</span><output id="accretion-out" for="accretion">1.20</output></span>
        <input id="accretion" type="range" min="0.3" max="2.5" step="0.02" value="1.20">
      </label>
      <button id="flare" type="button">Disrupt Star</button>
    </div>
  </form>
  <p id="status" data-webgpu-status role="status">Bending spacetime. The first load can take a few seconds.</p>
  <p id="error" role="alert"></p>
  <script type="module">
    import { needsWebGPU } from './needs-webgpu.js';
    needsWebGPU('#viewport').then((ok) => ok && import('./event-horizon.ts'));
  </script>
</body>
</html>
