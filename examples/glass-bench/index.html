<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>The Glass Bench | Margo Engine</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #101417; color: #e9e5dd; font: 14px system-ui, sans-serif; }
    #viewport { position: fixed; inset: 0; }
    #status { position: fixed; top: 16px; left: 24px; }
    #controls {
      position: fixed; inset: auto 0 0; display: flex; align-items: center; gap: 16px;
      padding: 2rem 5vw 1rem; background: linear-gradient(transparent,#1119);
    }
    [hidden] { display: none !important; }
    button { padding: 0.5rem 1rem; border: 1px solid #67645e; background: #201d1a; color: inherit; font: inherit; }
    input { width: min(60vw,620px); accent-color: #e3c298; }
    output { font-variant-numeric: tabular-nums; white-space: nowrap; }
  </style>
</head>
<body>
  <div id="viewport"></div>
  <p id="status" role="status">Preparing the optics bench…</p>
  <section id="controls" aria-label="Film playback" hidden>
    <button id="play" type="button">Pause</button>
    <input id="seek" type="range" aria-label="Film time" min="0" max="60" value="0" step="0.01">
    <output id="clock" for="seek">0:00 / 1:00</output>
  </section>
  <script type="module" src="./main.js"></script>
</body>
</html>
