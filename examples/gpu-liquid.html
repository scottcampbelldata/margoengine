<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GPU Liquid · Margo Engine</title>
  <style>
    :root { color-scheme: dark; }
    [hidden] { display: none !important; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 14px/1.45 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #0b1220;
      color: #e8effa;
      overflow: hidden;
    }
    #viewport {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: block;
    }
    .panel {
      position: fixed;
      top: 12px;
      left: 12px;
      width: 300px;
      max-height: calc(100vh - 24px);
      overflow-y: auto;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid rgba(130, 170, 220, 0.25);
      background: rgba(11, 18, 32, 0.84);
      backdrop-filter: blur(8px);
      display: grid;
      gap: 10px;
    }
    h1 { margin: 0; font-size: 16px; letter-spacing: 0.01em; }
    .sub { margin: 0; font-size: 12px; color: #9eb4d4; }
    .row { display: flex; gap: 6px; flex-wrap: wrap; }
    button, select {
      font: inherit;
      font-size: 12px;
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid #455978;
      background: #172338;
      color: #e8effa;
      cursor: pointer;
    }
    button[aria-pressed="true"] {
      background: #cfe2ff;
      color: #0b1220;
      border-color: #cfe2ff;
      font-weight: 600;
    }
    label.slider {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 2px 8px;
      font-size: 12px;
      color: #c5d4eb;
    }
    label.slider input[type="range"] {
      grid-column: 1 / -1;
      width: 100%;
      margin: 0;
    }
    label.check {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #c5d4eb;
      cursor: pointer;
    }
    #status {
      margin: 0;
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      color: #8cc8ff;
    }
  </style>
</head>
<body>
  <canvas id="viewport" aria-label="GPU liquid simulation"></canvas>
  <aside class="panel" aria-label="Liquid controls">
    <h1>GPU Liquid</h1>
    <p class="sub">A tank of MLS-MPM liquid stepped on the GPU and drawn as a refracting surface. Drag across the tank to stir it; drop a box in and watch it float.</p>

    <div class="row" role="group" aria-label="Particles">
      <select id="count" aria-label="Particle count">
        <option value="2048">2,048 particles</option>
        <option value="16384">16,384 particles</option>
        <option value="65536" selected>65,536 particles</option>
        <option value="131072">131,072 particles</option>
        <option value="262144">262,144 particles</option>
      </select>
      <select id="profile" aria-label="Solver">
        <option value="fast" selected>Fast</option>
        <option value="accurate">Accurate</option>
      </select>
      <button type="button" id="btn-drop">Drop Box</button>
      <button type="button" id="btn-reset">Reset</button>
    </div>

    <label class="slider"><span>Stir Radius (m)</span><output id="out-radius">0.12</output><input id="sl-radius" type="range" min="0.04" max="0.3" step="0.01" value="0.12"></label>
    <label class="slider"><span>Viscosity (m²/s)</span><output id="out-visc">0.0005</output><input id="sl-visc" type="range" min="0" max="0.004" step="0.0001" value="0.0005"></label>
    <label class="slider"><span>Box Density (kg/m³)</span><output id="out-rho">500</output><input id="sl-rho" type="range" min="100" max="3000" step="50" value="500"></label>

    <div class="row">
      <button type="button" id="btn-debug" aria-pressed="false">Debug View</button>
      <button type="button" id="btn-pause" aria-pressed="false">Pause</button>
    </div>
    <div id="debug-opts" class="row" hidden>
      <label class="check"><input id="dbg-density" type="checkbox">Colour by density</label>
      <label class="check"><input id="dbg-grid" type="checkbox" checked>Grid</label>
      <label class="check"><input id="dbg-box" type="checkbox" checked>Container</label>
      <label class="check"><input id="dbg-col" type="checkbox" checked>Colliders</label>
    </div>

    <p id="status" data-webgpu-status role="status">Starting WebGPU…</p>
  </aside>
  <script type="module">
    import { needsWebGPU } from './needs-webgpu.js';
    needsWebGPU('#viewport').then((ok) => ok && import('./gpu-liquid.ts'));
  </script>
</body>
</html>
