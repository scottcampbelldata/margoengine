<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Hurricane - Margo Engine Test</title>
<style>
  body { margin: 0; background: #0d1117; color: #c9d1d9; font: 16px system-ui, sans-serif; }
  canvas { display: block; width: 100%; height: 70vh; }
  #controls { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px; }
  button { font: inherit; padding: 6px 10px; }
  #status { padding: 0 8px 8px; }
</style>
<canvas id="view"></canvas>
<div id="controls">
  <button id="btnEye">Sea level in the eye</button>
  <button id="btnWall">Sea level in the eyewall</button>
  <button id="btnBand">Sea level in a band</button>
  <button id="btnAir">From the air, 40 km up</button>
  <button id="btnPlay">Play a minute</button>
  <button id="btnRows">Slider rows: five bands, south</button>
</div>
<div id="status"></div>
<script type="module" src="./hurricane.ts"></script></html>
