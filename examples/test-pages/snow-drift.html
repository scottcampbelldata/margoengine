<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Snow drift - Margo Engine Test</title>
<style>
  body { margin: 0; background: #0d1117; color: #c9d1d9; font: 14px system-ui, sans-serif; }
  canvas { display: block; width: 100%; height: 70vh; }
