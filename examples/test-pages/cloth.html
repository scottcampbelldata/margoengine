<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Cloth - Margo Engine Test</title>
<style>
  body { margin: 0; background: #0d1117; color: #c9d1d9; font: 14px system-ui, sans-serif; }
  canvas { display: block; width: 100%; height: 70vh; outline: none; touch-action: none; }
  #controls { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px; }
  button { font: inherit; padding: 6px 10px; }
  #status, #help { padding: 0 8px 8px; }
  output { font-variant-numeric: tabular-nums; }
</style>
<canvas id="view" tabindex="0" aria-label="A flag on a pole in the wind and a cloth draped over a ball"></canvas>
<div id="controls">
  <button id="btnDrop">Drop the cloth on the ball</button>
  <button id="btnWind">Wind: on</button>
  <button id="btnPush">Push the cloth</button>
  <button id="btnDebug">Debug view: off</button>
  <button id="btnReset">Reset</button>
</div>
<p id="help">Move the pointer over the view to push the draped cloth with an invisible ball. The flag is tied to its pole and streams in a gusty wind. The debug view draws each edge coloured by strain, the pins, the colliders and the wind.</p>
<p><output id="readout">Readings appear when the cloth is ready.</output></p>
<div id="status" role="status">Starting the cloth scene…</div>
<script type="module" src="./cloth.ts"></script></html>
