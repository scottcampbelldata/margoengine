<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Lava - Margo Engine Test</title>
<style>
  body { margin: 0; background: #0d1117; color: #c9d1d9; font: 14px system-ui, sans-serif; }
  canvas { display: block; width: 100%; height: 70vh; }
  #controls { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px; }
  button { font: inherit; padding: 6px 10px; }
  #status { padding: 0 8px 8px; }
</style>
<canvas id="view"></canvas>
<div id="controls">
  <button id="btnPlay">Play (600x)</button>
  <button id="btnStart">30 s: the vent opens</button>
  <button id="btnSplit">30 minutes: the flow parts round the ridge</button>
  <button id="btnLevees">6 hours: levees stand</button>
  <button id="btnTubes">2 days: the apron roofs into tubes</button>
  <button id="btnEnd">6 days: the vent has stopped</button>
  <button id="btnHawaiian">Hawaiian rows</button>
  <button id="btnOneChannel">One channel (branchShare 1)</button>
  <button id="btnHighLevees">High levees (leveeMax 0.9)</button>
  <button id="btnNoTubes">No tubes (tubeSlope 0)</button>
</div>
<div id="status"></div>
<script type="module" src="./lava.ts"></script></html>
