<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Format Interop & Exporters - Margo Engine Test</title>
  <style>
    :root {
      --bg: #07090e;
      --panel-bg: rgba(15, 23, 42, 0.92);
      --border: #1e293b;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --danger: #ef4444;
      --success: #22c55e;
      --warning: #f59e0b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      user-select: none;
    }
    #viewport {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      transition: width 0.25s ease;
    }
    #viewport.mobile-view {
      width: 390px !important;
      height: 844px !important;
      margin: 0 auto;
      border-left: 2px solid var(--border);
      border-right: 2px solid var(--border);
    }
    #canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    #hud {
      position: absolute;
      top: 16px;
      left: 16px;
      width: 380px;
      max-height: calc(100vh - 32px);
      overflow-y: auto;
      background: var(--panel-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 50;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .hud-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--accent);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .badge {
      font-size: 0.72rem;
      padding: 2px 8px;
      border-radius: 12px;
      background: #1e293b;
      color: #38bdf8;
      border: 1px solid #334155;
    }
    .badge.gpu { background: #064e3b; color: #34d399; border-color: #059669; }
    .badge.compat { background: #78350f; color: #fbbf24; border-color: #d97706; }
    .section-title {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin-top: 4px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 3px;
    }
    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
    }
    button {
      background: #1e293b;
      color: var(--text);
      border: 1px solid #334155;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.15s ease;
      font-weight: 500;
    }
    button:hover { background: var(--accent-hover); color: white; border-color: var(--accent); }
    button:active { transform: scale(0.98); }
    button.primary { background: #0284c7; border-color: #38bdf8; }
    button.warning { background: #b45309; border-color: #f59e0b; }
    button.danger { background: #991b1b; border-color: #ef4444; }
    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }
    .btn-grid-3 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 6px;
    }
    .stats-card {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 10px;
      font-family: monospace;
      font-size: 0.75rem;
      line-height: 1.4;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    #error-toast {
      position: absolute;
      bottom: 16px;
      left: 16px;
      right: 16px;
      max-width: 600px;
      margin: 0 auto;
      background: rgba(153, 27, 27, 0.95);
      border: 1px solid #f87171;
      color: #fef2f2;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-family: monospace;
      z-index: 100;
      display: none;
      backdrop-filter: blur(8px);
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>
  <div id="viewport">
    <canvas id="canvas"></canvas>
  </div>

  <div id="hud">
    <div class="hud-title">
      <span>Format Interop & Exporters</span>
      <span id="backend-badge" class="badge">Detecting...</span>
    </div>

    <!-- Active Asset & Loaders Section -->
    <div class="section-title">Format Loaders & Ingestion</div>
    <div class="btn-grid-3">
      <button id="btn-load-ply" class="primary">Load PLY</button>
      <button id="btn-load-usdz">Load USDZ</button>
      <button id="btn-load-fbx">Load FBX</button>
    </div>
    <div class="stats-card">
      <div>Loaded Format: <span id="stat-format" style="color:var(--accent);">Procedural Scene</span></div>
      <div>Geometry Stats: <span id="stat-geo" style="color:var(--muted);">Verts: 0 | Triangles: 0</span></div>
    </div>

    <!-- Scene Exporters Section -->
    <div class="section-title">Scene Exporters (glTF, USDZ, OBJ, PLY, STL)</div>
    <div class="btn-grid">
      <button id="btn-export-glb">Export GLB</button>
      <button id="btn-export-gltf">Export glTF JSON</button>
      <button id="btn-export-obj">Export OBJ + MTL</button>
      <button id="btn-export-ply">Export PLY</button>
      <button id="btn-export-stl">Export STL Binary</button>
      <button id="btn-verify-roundtrip" class="primary">Roundtrip Verification</button>
    </div>
    <div class="stats-card">
      <div>Export Status: <span id="stat-export-result" style="color:#34d399;">Ready for export</span></div>
      <div>Payload Size: <span id="stat-export-bytes" style="color:var(--muted);">-- bytes</span></div>
    </div>

    <!-- Animation & Camera Section -->
    <div class="section-title">Viewport Motion & Rotation</div>
    <div class="btn-grid">
      <button id="btn-toggle-rotate">Pause Rotation</button>
      <button id="btn-reset-cam">Reset View</button>
    </div>

    <!-- Stress & Testing Automation -->
    <div class="section-title">Stress & Lifecycle Tests</div>
    <div class="btn-grid">
      <button id="btn-stress-exports" class="warning">Stress 25 Exports</button>
      <button id="btn-stress-switch" class="warning">Rapid Format Switch</button>
    </div>
    <div class="btn-grid">
      <button id="btn-res-mobile">Mobile (390x844)</button>
      <button id="btn-res-reset">Reset Layout</button>
    </div>
    <button id="btn-recreate" class="danger">Dispose & Recreate Scene</button>
  </div>

  <div id="error-toast"></div>

  <script type="module" src="./format-interop-exporters.ts"></script>
</body>
</html>
