<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Damaged helmet · Margo Engine</title>
  <link rel="stylesheet" href="./extension-demo.css">
  <link rel="preload" as="fetch" href="./assets/damaged-helmet-mobile.glb" crossorigin>
</head>
<body data-demo="helmet">
  <main id="viewport" aria-label="Textured PBR helmet"></main>
  <aside aria-label="Scene controls">
    <h1>Damaged helmet</h1>
    <p>Metal, worn paint, and the light inside the visor. Drag to orbit; scroll to zoom.</p>
    <label class="check"><input id="ssao" type="checkbox" checked disabled> Ambient occlusion</label>
    <p id="status" role="status">Loading model…</p><p id="error" role="alert"></p>
    <small>Focus the scene: arrow keys orbit, + / − zoom.</small>
    <small>Damaged Helmet by theblueturtle_ and ctxwing. <a href="https://github.com/KhronosGroup/glTF-Sample-Assets/tree/main/Models/DamagedHelmet">Asset credits and licenses</a>.</small>
  </aside>
  <script type="module" src="./extension-demo.ts"></script>
</body>
</html>
