<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Four-view CAD layout · Margo Engine</title>
  <link rel="stylesheet" href="./multi-view.css">
</head>
<body>
  <h1>Four views, one model</h1>
  <p>Core views · Top, front and right orthographic views (<code>@margoengine/cameras</code>) and a perspective view
    share one scene. Each view has its own camera and controls, and a click picks through the view under it.</p>
  <div id="views" class="views">
    <canvas id="viewport" aria-label="A shaft assembly shown from the top, front, right and in perspective"></canvas>
  </div>
  <p id="status" data-webgpu-status role="status">Starting WebGPU…</p>
  <script type="module">
    import { needsWebGPU } from './needs-webgpu.js';
    needsWebGPU('#viewport').then((ok) => ok && import('./cad-views.ts'));
  </script>
</body>
</html>
