<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Batched mesh · Margo Engine</title>
  <link rel="stylesheet" href="./multi-view.css">
</head>
<body>
  <h1>Many shapes, one draw</h1>
  <p><code>@margoengine/materials/batched</code> · 2,500 items of six different shapes, each with its own matrix, colour
    and visibility, draw as one mesh: one draw call in the main pass and one per shadow cascade.</p>
  <div id="views" class="views">
    <canvas id="viewport" aria-label="A field of boxes, spheres, cones, rings, cylinders and capsules in many colours"></canvas>
  </div>
  <p id="status" data-webgpu-status role="status">Starting WebGPU…</p>
  <script type="module">
    import { needsWebGPU } from './needs-webgpu.js';
    needsWebGPU('#viewport').then((ok) => ok && import('./batched-mesh.ts'));
  </script>
</body>
</html>
