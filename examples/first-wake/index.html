<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>First Wake | Margo Engine</title>
  <style>
    body { margin: 0; background: #152329; color: #f6eedf; font: 14px system-ui,sans-serif; }
    #viewport { position: fixed; inset: 0; }
    #status { position: fixed; top: 1rem; left: 1.5rem; }
    #transport { position: fixed; inset: auto 0 0; display: flex; align-items: center; gap: 16px; padding: 2rem 5vw 1rem; background: linear-gradient(transparent,#101a21e6); }
    [hidden] { display: none !important; }
    button { padding: .5rem 1rem; border: 1px solid #867a62; background: #183039; color: inherit; font: inherit; }
    input { width: min(60vw,620px); accent-color: #ecc687; }
    output { font-variant-numeric: tabular-nums; white-space: nowrap; }
  </style>
</head>
<body>
  <div id="viewport"></div>
  <p id="status" role="status">Preparing the harbor…</p>
  <section id="transport" aria-label="Film playback" hidden>
    <button id="play" type="button">Pause</button>
    <input id="seek" type="range" aria-label="Film time" min="0" max="97" value="0" step="0.01">
    <output id="clock" for="seek">0:00 / 1:37</output>
  </section>
  <script type="module" src="./main.js"></script>
</body>
</html>
