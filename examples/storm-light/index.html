<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#06080b">
  <meta name="description" content="A lighthouse on a rocky headland in a building storm: its beam sweeps through rain and fog over a heaving sea. Rendered live in WebGPU with Margo Engine.">
  <title>Storm Light · Margo Engine</title>
  <!-- Margo engine made for Margie -->
  <style>
    *{box-sizing:border-box}html,body{height:100%}body{margin:0;background:#06080b;color:#e8edf2;font:16px/1.4 Georgia,'Times New Roman',serif;overflow:hidden}
    #viewport{position:fixed;inset:0}canvas{touch-action:none;display:block}
    h1{position:fixed;top:20px;left:24px;margin:0;font-size:16px;font-weight:400;color:#c9d3dc}
    h1 a{color:inherit}
    #hint{position:fixed;top:44px;left:24px;margin:0;font-size:14px;color:#9aa8b4}
    form{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(620px,calc(100% - 32px));padding:12px 16px;background:#080b0fd9;border:1px solid #4d5864;border-radius:4px}
    label{display:flex;justify-content:space-between;font-size:16px}
    output{font-variant-numeric:tabular-nums}
    input{width:100%;height:44px;margin:0;accent-color:#f2c46d}
    :focus-visible{outline:3px solid #ffd98a;outline-offset:2px}
    #status{position:fixed;top:44%;left:0;right:0;margin:0;padding:0 24px;text-align:center}#error{position:fixed;top:72px;left:24px;right:24px;margin:0;color:#ffd9b5}#error:empty{display:none}
  </style>
</head>
<body>
  <main id="viewport" aria-label="A lighthouse on a headland at night in a storm; drag to orbit, click to strike lightning"></main>
  <h1>Storm Light, <a href="../../">Margo Engine</a></h1>
  <p id="hint">Drag to look around. Click the sky for lightning.</p>
  <form id="form">
    <label for="storm">Storm <output id="force" for="storm">Gale</output></label>
    <input id="storm" type="range" min="0" max="1" step="0.001" value="0.78">
  </form>
  <p id="status" role="status" data-webgpu-status>Lighting the lamp. The first load can take up to half a minute.</p>
  <p id="error" role="alert"></p>
  <script type="module">
    import { needsWebGPU } from '../needs-webgpu.js';
    needsWebGPU('#viewport').then((ok) => ok && import('./main.ts'));
  </script>
</body>
</html>
