<!doctype html><html><head><meta charset="utf-8"><style>canvas{width:1px;height:1px}</style></head><body><script type="module">
import {Engine} from '/packages/core/dist/index.js';
import {parseGLTF} from '/packages/gltf-pro/dist/index.js';
import {extendedMaterials} from '/packages/gltf-pro/dist/extended.js';
import {instancing} from '/packages/gltf-pro/dist/instancing.js';
import {instancedGLTF} from '/tests/support/instanced-gltf.js';
import {waitForPipelines} from '/scripts/support/gpu-ready.js';
import {Animation} from '/packages/animation/dist/index.js';
import {pointerChannels} from '/packages/animation/dist/pointer.js';
window.volumeSlabs=async()=>{
 const rows=[];
 const slabs=[...[0.25,0.5,1,1.5,2].map(scale=>({scale,thickness:1})),{scale:1/200,thickness:200},{scale:1/1200,thickness:1200},
  {scale:1,thickness:1,edit:true,color:[0.5,1,0.25]},
  {scale:1,thickness:1,pointer:'attenuationColor',color:[0.5,1,0.25]},
  {scale:1,thickness:2,startThickness:1,pointer:'thicknessFactor'},
  {scale:1,thickness:1,distance:2,pointer:'attenuationDistance'},
  {scale:1/1200,thickness:1200,startThickness:1,pointer:'thicknessFactor'},
  {scale:1,thickness:1,pointer:'transmissionFactor'},
  {scale:1/1200,thickness:1200,pointer:'transmissionFactor'},
 ];
 for(const instanced of [false,true])for(const slab of slabs)for(const mirror of [1,-1]){
  const {scale,thickness,distance=1,color=[0.25,0.5,1]}=slab;
  const canvas=document.body.appendChild(document.createElement('canvas'));
  const engine=await Engine.create(canvas,{backend:'webgpu',powerPreference:'low-power',camera:{position:[0,0,1],target:[0,0,0],fov:35}});
  try{
   engine.scene.background='#ffffff';engine.lighting.direction.set([0,0,1,0]);engine.lighting.radiance.set([0,0,0,0]);
   const input=instancedGLTF([{s:[mirror,1,scale]}],{instanced,material:{extensions:{
    KHR_materials_transmission:{transmissionFactor:slab.pointer==='transmissionFactor'?0:1},KHR_materials_specular:{specularFactor:0},KHR_materials_ior:{ior:1},
    KHR_materials_volume:{thicknessFactor:slab.startThickness??thickness,attenuationColor:[0.25,0.5,1],attenuationDistance:1},
   }}});
   if(slab.pointer){
    const extension=slab.pointer==='transmissionFactor'?'KHR_materials_transmission':'KHR_materials_volume';
    const volume=input.doc.materials[0].extensions[extension];
    const add=(values,type,width)=>{
     const data=Float32Array.from(values),buffer=input.buffers.length,bufferView=input.doc.bufferViews.length,index=input.doc.accessors.length;
     input.buffers.push(data);input.doc.buffers.push({byteLength:data.byteLength});input.doc.bufferViews.push({buffer,byteLength:data.byteLength});
     input.doc.accessors.push({bufferView,componentType:5126,count:data.length/width,type});return index;
    };
    const target=slab.pointer==='transmissionFactor'?1:slab.pointer==='attenuationColor'?color:slab.pointer==='thicknessFactor'?thickness:distance;
    const initial=volume[slab.pointer],vector=Array.isArray(initial);
    const times=add([0,1],'SCALAR',1),output=add(vector?[...initial,...target]:[initial,target],vector?'VEC3':'SCALAR',vector?3:1);
    input.doc.animations=[{samplers:[{input:times,output}],channels:[{sampler:0,target:{path:'pointer',extensions:{KHR_animation_pointer:{pointer:'/materials/0/extensions/'+extension+'/'+slab.pointer}}}}]}];
   }
   const model=parseGLTF(engine,input.doc,input.buffers,[],{instancing,materials:extendedMaterials});
   await waitForPipelines(async()=>{engine.render({culling:false});await engine.gpu.queue.onSubmittedWorkDone();});
   const opaque=slab.pointer==='transmissionFactor'?canvas.toDataURL('image/png'):undefined;
   if(slab.edit)model.primitives[0].material.attenuation=color.slice();
   const animation=slab.pointer?new Animation(model,{pointers:pointerChannels,loop:false}):undefined;
   if(animation)animation.seek(1);
   if(slab.edit||slab.pointer)await waitForPipelines(async()=>{engine.render({culling:false});await engine.gpu.queue.onSubmittedWorkDone();});
   if(opaque){
    animation.seek(0);
    await waitForPipelines(async()=>{engine.render({culling:false});await engine.gpu.queue.onSubmittedWorkDone();});
    if(canvas.toDataURL('image/png')!==opaque)throw new Error('Zero transmission did not restore the original opaque frame');
    animation.seek(1);
    await waitForPipelines(async()=>{engine.render({culling:false});await engine.gpu.queue.onSubmittedWorkDone();});
   }
   rows.push({instanced,scale,thickness,distance,color,edit:slab.edit,pointer:slab.pointer,mirror,material:model.primitives[0].material.tint,draws:engine.stats.drawCalls,width:canvas.width,height:canvas.height,png:canvas.toDataURL('image/png')});
  }finally{engine.dispose();canvas.remove();}
 }
 return rows;
};
</script></body></html>
