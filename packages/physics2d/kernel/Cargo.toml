[package]
name = "margoengine-physics2d-kernel"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
margoengine-physics-kernel-common = { path = "../../physics/kernel-common" }

[features]
# The Wasm interface (src/api.rs) and the page imports it calls. The checks of wasm-check/ run without it.
default = ["api"]
api = []

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
overflow-checks = false
strip = "symbols"

[profile.test]
opt-level = 2
