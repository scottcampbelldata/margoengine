<!doctype html><html><head><meta charset="utf-8"/><title>LOD: imposter outlines</title><style>body{margin:0;background:#000}canvas{width:256px;height:256px;display:block}</style></head><body><canvas width="256" height="256"></canvas>
<script type="module">
// An object far enough to show its imposter, outlined in magenta when its anchor or a level is selected, and behind a wall
// only with x-ray.
import {Engine,PbrMaterial,box} from '/packages/core/dist/index.js';
import {Imposter,LODSystem} from '/packages/lod/dist/index.js';
import {Selection} from '/packages/selection/dist/index.js';
const canvas=document.querySelector('canvas'),errors=[],W=256;
const engine=await Engine.create(canvas,{backend:'webgpu',camera:{position:[0,0,12],target:[0,0,0],fov:40,far:400}}),device=engine.gpu;
engine.stop();
device.addEventListener('uncapturederror',e=>errors.push(e.error.message));
const copy=new OffscreenCanvas(W,W),g=copy.getContext('2d',{willReadFrequently:true});
const magenta=()=>{
  engine.render();g.clearRect(0,0,W,W);g.drawImage(canvas,0,0);
  const d=g.getImageData(0,0,W,W).data;let n=0;
  for(let i=0;i<d.length;i+=4)if(d[i]>150&&d[i+1]<90&&d[i+2]>150)n++;
  return n;
};
const system=LODSystem.attach(engine);
const grey=new PbrMaterial({color:[0.5,0.5,0.5],roughness:0.9});
const atlas=Imposter.bake(engine,box(2,2,2),{material:grey,frames:8,frameSize:64});
const selection=Selection.attach(engine,{width:3,color:[1,0,1]});
window.check={
  errors,
  async run(){
    const out={};
    const anchor=engine.createMesh(),near=engine.createMesh().setGeometry(box(2,2,2)).setMaterial(grey).setParent(anchor);
    const lod=system.add(anchor,[{object:near},{object:atlas,distance:5}],{radius:2});
    engine.render();engine.render();
    out.level=lod.level;
    out.none=magenta();
    selection.set([anchor]);
    out.anchor=magenta();
    selection.set([near]);
    out.levelSelected=magenta();
    // A second object stays out of it.
    const other=engine.createMesh().setPosition([3,0,0]);
    const otherLod=system.add(other,[{object:atlas}]);
    engine.render();
    selection.set([other]);
    out.other=magenta();
    otherLod.remove();
    // A real mesh level gives about the same outline as its imposter.
    selection.set([anchor]);
    engine.camera.position=[0,0,4];
    engine.render();engine.render();
    out.nearLevel=lod.level;
    out.nearOutline=magenta();
    engine.camera.position=[0,0,12];
    engine.render();engine.render();
    // Behind a wall: only the x-ray shows it.
    const wall=engine.createMesh().setGeometry(box(6,6,0.2)).setPosition([0,0,4]).setMaterial(grey);
    engine.render();
    out.hidden=magenta();
    selection.options.xray={dash:0};
    out.xray=magenta();
    selection.options.xray=undefined;
    wall.dispose();
    // Hidden, it draws no outline.
    anchor.visible=false;
    out.anchorHidden=magenta();
    anchor.visible=true;
    lod.remove();
    selection.set([]);
    await device.queue.onSubmittedWorkDone();
    return out;
  },
};
window.ready=true;
</script></body></html>
