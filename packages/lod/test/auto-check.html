<!doctype html><html><head><meta charset="utf-8"/><title>LOD: auto and hierarchical</title><style>body{margin:0;background:#000}canvas{width:640px;height:360px;display:block}</style></head><body><canvas width="640" height="360"></canvas>
<script type="module">
// 400 small boxes on a grid, then one far mesh per cell, and one sphere with simplified levels.
import {Engine,Geometry,box} from '/packages/core/dist/index.js';
import {LODSystem} from '/packages/lod/dist/index.js';
import {hierarchicalLOD,autoLOD} from '/packages/lod/dist/auto.js';
import {createMesh,PbrMaterial,Texture} from '/packages/materials/dist/index.js';
import {loadGLTF} from '/packages/gltf-pro/dist/index.js';
const sphere=(n)=>{const p=[],i=[];for(let y=0;y<=n;y++)for(let x=0;x<=n;x++){const a=x/n*Math.PI*2,b=y/n*Math.PI;p.push(Math.cos(a)*Math.sin(b),Math.cos(b),Math.sin(a)*Math.sin(b));}for(let y=0;y<n;y++)for(let x=0;x<n;x++){const c=y*(n+1)+x,d=c+n+1;i.push(c,d,c+1,c+1,d,d+1);}return new Geometry(p,p,i);};
const canvas=document.querySelector('canvas'),camera={position:[0,20,20],target:[0,0,0],fov:60},errors=[];
const engine=await Engine.create(canvas,{backend:'webgpu',camera}),device=engine.gpu;
engine.stop();
device.addEventListener('uncapturederror',e=>errors.push(e.error.message));
const system=LODSystem.attach(engine),geometry=box(0.4,0.4,0.4),meshes=[];
for(let x=0;x<20;x++)for(let z=0;z<20;z++)meshes.push(engine.createMesh().setGeometry(geometry).setPosition([x-9.5,0,z-9.5]));
const frame=async()=>{engine.render();await device.queue.onSubmittedWorkDone();return engine.stats.visible;};
await frame();
const near=await frame();
// A red and green checker on a sphere: every level has to draw both colours, the far mesh too.
const paintedSphere=()=>{
  const n=32,positions=[],normals=[],uvs=[],colors=[],indices=[];
  for(let y=0;y<=n;y++)for(let x=0;x<=n;x++){const a=x/n*Math.PI*2,b=y/n*Math.PI,p=[Math.cos(a)*Math.sin(b),Math.cos(b),Math.sin(a)*Math.sin(b)];positions.push(...p);normals.push(...p);uvs.push(x/n,y/n);colors.push(1,1,1,1);}
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){const c=y*(n+1)+x,d=c+n+1;indices.push(c,c+1,d,c+1,d+1,d);}
  return {positions,normals,uvs,colors,indices};
};
const textured=async()=>{
  const data=new Uint8Array(8*8*4);
  for(let i=0;i<64;i++)data.set(((i&7)^(i>>3))&1?[235,20,20,255]:[20,235,20,255],i*4);
  const texture=new Texture({data,width:8,height:8},{minFilter:'nearest',magFilter:'nearest',mipmaps:false}),material=new PbrMaterial({map:texture,roughness:1,metalness:0});
  const model=createMesh(engine,paintedSphere(),material);
  const colours=async()=>{
    const c=new OffscreenCanvas(canvas.width,canvas.height),g=c.getContext('2d');
    engine.render();g.drawImage(canvas,0,0); // same task: the canvas still holds the frame
    const d=g.getImageData(0,0,c.width,c.height).data;
    let red=0,green=0;
    for(let i=0;i<d.length;i+=4){if(d[i]>d[i+1]*2&&d[i]>40)red++;if(d[i+1]>d[i]*2&&d[i+1]>40)green++;}
    return {red,green};
  };
  const lod=await autoLOD(system,model,{ratios:[0.5,0.25],screens:[0.6,0.2]}),out={levels:[]};
  for(const distance of [2.2,6,40]){
    engine.camera.position=[0,0,distance];engine.camera.target=[0,0,0];await frame();await frame();
    out.levels.push({level:lod.level,...await colours()});
  }
  lod.remove();
  for(const level of lod.levels.slice(1))level.object.root.visible=false;
  lod.levels[0].object.visible=false;
  const many=[];
  for(let i=0;i<4;i++)many.push(createMesh(engine,paintedSphere(),material));
  many.forEach((m,i)=>m.root.setPosition([i*2.5+1,0,0]));
  await frame();
  const built=await hierarchicalLOD(system,many,{cell:100,distance:30});
  engine.camera.target=[4.75,0,0];engine.camera.position=[4.75,0,12];await frame();await frame();
  out.farNear={...await colours(),visible:many[0].root.visible};
  engine.camera.position=[4.75,0,40];await frame();await frame();
  out.farAway={...await colours(),visible:many[0].root.visible,meshes:built.meshes.length};
  built.remove();
  model.dispose();
  for(const m of many)m.dispose();
  await frame();
  return {textured:out};
};
// A real file: many primitives, textures, shells that are not manifold. Levels draw lit, textured pixels, not black.
const loaded=async()=>{
  const model=await loadGLTF(engine,'/examples/assets/flight-helmet-mobile.glb');
  const b=model.bounds,size=Math.hypot(b[3]-b[0],b[4]-b[1],b[5]-b[2]),centre=[0,1,2].map(i=>(b[i]+b[i+3])/2);
  const triangles=m=>m.primitives.reduce((n,p)=>n+p.indices.length/3,0),before=triangles(model);
  const started=performance.now(),lod=await autoLOD(system,model,{ratios:[0.5,0.1],screens:[0.5,0.1]}),build=performance.now()-started;
  const image=()=>{
    const c=new OffscreenCanvas(canvas.width,canvas.height),g=c.getContext('2d');
    engine.render();g.drawImage(canvas,0,0);
    return g.getImageData(0,0,c.width,c.height).data;
  };
  // What `root` adds to the picture: the pixels that change when it hides, their mean colour and how much they vary.
  const lit=(root=model.root)=>{
    const d=image();root.visible=false;const empty=image();root.visible=true;
    let n=0,colour=[0,0,0],square=0;
    for(let i=0;i<d.length;i+=4)if(Math.abs(d[i]-empty[i])+Math.abs(d[i+1]-empty[i+1])+Math.abs(d[i+2]-empty[i+2])>12){
      n++;colour[0]+=d[i];colour[1]+=d[i+1];colour[2]+=d[i+2];square+=d[i]*d[i];
    }
    const mean=colour.map(v=>v/(n||1));
    return {pixels:n,colour:mean.map(Math.round),spread:Math.round(Math.sqrt(Math.max(0,square/(n||1)-mean[0]*mean[0])))};
  };
  const out={before,build:Math.round(build),triangles:lod.levels.slice(1).map(l=>triangles(l.object)),views:[]};
  for(const far of [1.2,3,12]){
    engine.camera.target=centre;engine.camera.position=[centre[0],centre[1],centre[2]+size*far];await frame();await frame();
    out.views.push({level:lod.level,...lit()});
  }
  const second=await loadGLTF(engine,'/examples/assets/flight-helmet-mobile.glb');
  lod.levels[0].object.visible=false;lod.levels[1].object.root.visible=false;lod.levels[2].object.root.visible=false;lod.remove();
  second.root.setPosition([0,0,0]);await frame();
  const built=await hierarchicalLOD(system,[second],{cell:1000,distance:size*2});
  engine.camera.position=[centre[0],centre[1],centre[2]+size*1.2];await frame();await frame();
  out.near={shown:second.root.visible};
  engine.camera.position=[centre[0],centre[1],centre[2]+size*3];await frame();await frame();
  out.far={shown:second.root.visible,meshes:built.meshes.length,...lit(built.meshes[0])};
  built.remove();second.dispose();model.dispose();await frame();
  return {loaded:out};
};
window.check={
  errors,
  async run(){
    const built=await hierarchicalLOD(system,meshes,{cell:5,distance:60});
    engine.camera.position=[0,20,20];
    const close=(await frame(),await frame());
    engine.camera.position=[0,200,200];
    await frame();
    const far=await frame();
    const result={near,close,far,cells:built.lods.length,farMeshes:built.meshes.length};
    engine.camera.position=[0,20,20];
    await frame();
    built.remove();
    await frame();
    result.restored=await frame();
    const ball=engine.createMesh().setGeometry(sphere(24)).setPosition([0,1,0]),lod=await autoLOD(system,ball,{ratios:[0.5,0.25]});
    result.triangles=lod.levels.map(l=>l.object.indices.length/3);
    await frame();
    engine.camera.position=[0,1,3];await frame();await frame();result.ballNear=lod.level;
    engine.camera.position=[0,400,400];await frame();await frame();result.ballFar=lod.level;
    ball.visible=false;
    Object.assign(result,await textured());
    Object.assign(result,await loaded());
    return result;
  },
};
window.ready=true;
</script></body></html>
