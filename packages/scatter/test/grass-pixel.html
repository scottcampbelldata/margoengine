<!doctype html><html><head><meta charset="utf-8"/><title>Scatter grass pixel floor check</title><style>body{margin:0}canvas{display:block}</style></head><body>
<script type="module">
// Real-GPU proof for the GrassScatter pixel floor (grass-pixel.browser.mjs drives it): a field of thin tapering blades
// to 230 m seen from eye height over sand, without multisampling (exactSize), at a given drawing-buffer size.
import {waitForPipelines} from '/scripts/support/gpu-ready.js';
import {Engine,PbrMaterial} from '/packages/core/dist/index.js';
import {GrassScatter} from '/packages/scatter/dist/grass.js';
const errors=[];
let engine,canvas;
window.check={
 // width x height pixels; lit: the PBR material, else the diffuse shader. One frame, after every pipeline is ready.
 async make(width,height,lit){
  engine?.dispose();canvas?.remove();
  canvas=document.createElement('canvas');canvas.width=width;canvas.height=height;
  canvas.style.width=width+'px';canvas.style.height=height+'px';document.body.append(canvas);
  engine=await Engine.create(canvas,{backend:'webgpu',exactSize:true,camera:{fov:30,position:[0,1.7,0],target:[0,0.9,40],near:0.1,far:400}});
  engine.scene.background='#d9c9a3';const device=engine.gpu;device.addEventListener('uncapturederror',e=>errors.push(e.error.message));
  // Dune grass: narrow leaves 1.6 cm at the root tapering to a point, as the dune coast scene plants them.
  GrassScatter.attach(engine,{count:160000,area:[480,480],follow:true,bounds:[-240,-240,240,240],lod:[30,90,230],lodFade:0,seed:11,
   scale:[0.7,1.25],grass:{height:0.6,heightVariance:0.5,width:0.016,blades:12,radius:0.25,lean:0.65,round:0.4},
   ...(lit?{material:new PbrMaterial({color:[0.16,0.2,0.06],roughness:0.9})}:{color:[0.16,0.2,0.06]})});
  device.pushErrorScope('validation');
  await waitForPipelines(async()=>{engine.render({delta:0});await device.queue.onSubmittedWorkDone();});
  const e=await device.popErrorScope();if(e)errors.push(e.message);
  return {errors:errors.splice(0)};
 },
};
window.ready=true;
</script></body></html>
