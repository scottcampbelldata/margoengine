<!doctype html>
<html>
<head><meta charset="utf-8" /><title>WGSL semantics probe</title></head>
<body>
<script type="module">
// One fragment shader computes 32 cases of WGSL semantics from runtime inputs (a uniform buffer and a texture, so
// nothing folds at compile time) into an rgba32uint row; native WebGPU and the WebGL2 layer must agree bit for bit.
// Cases lean on what GLSL leaves undefined or lacks: integer division and remainder by zero and of the most negative
// value, shift amounts past 31, saturating float to integer conversion, the bit built-ins, packing, the float
// remainder, uniform layouts GLSL's std140 would lay out differently (mat2x2, a vec3 followed by an f32, arrays of
// structs, matCx2), dynamic indexes, loops with continuing blocks, switch, pointers, nested arrays and bitcasts.
// Inputs stay off exact rounding ties of the pack built-ins: there the WGSL specification's floor(0.5 + v) (which the
// layer follows) and Chrome's native rounding of -63.5 to -64 for pack4x8snorm(-0.5) differ.
import { createCompatGPU } from '/packages/webgl2-compat/dist/device.js';

const code = /* wgsl */ `
struct S { x: f32, y: vec2u }
struct U {
  a: vec3f, b: f32,
  m: mat2x2f,
  n: mat3x2f,
  ints: array<vec4i, 4>,
  uints: vec4u,
  s: array<S, 2>,
  floats: vec4f,
  idx: vec4u,
}
@group(0) @binding(0) var<uniform> u: U;
@group(0) @binding(1) var tex: texture_2d<f32>;

@vertex fn vs(@builtin(vertex_index) i: u32) -> @builtin(position) vec4f {
  return vec4f(f32(i & 1u) * 4.0 - 1.0, f32(i >> 1u) * 4.0 - 1.0, 0.0, 1.0);
}

fn bump(p: ptr<function, i32>, by: i32) { *p = *p + by; }

fn bits(v: vec4f) -> vec4u { return bitcast<vec4u>(v); }

fn probe(c: u32) -> vec4u {
  let i0 = u.ints[0]; // 7, -7, 0, i32 min
  let i1 = u.ints[1]; // -2, 2, -1, 31
  let i2 = u.ints[2]; // 5, 33, -8, 0
  let i3 = u.ints[3]; // 2147483647, 1, 4, 32
  let w = u.uints;    // 7, 0, 0xFFFFFFFF, 10
  let f = u.floats;   // -7.5, 2.0, 1e10, 3.9
  switch c {
    case 0u: { return bitcast<vec4u>(vec4i(i0.x / i1.x, i0.y / i1.y, i2.x / i0.z, i0.w / i1.z)); }
    case 1u: { return bitcast<vec4u>(vec4i(i0.x % i1.x, i0.y % i1.y, i2.x % i0.z, i0.w % i1.z)); }
    case 2u: { return vec4u(w.x / w.y, w.x % w.y, w.z / 3u, w.w % 3u); }
    case 3u: { return vec4u(1u << u32(i2.y), w.z >> u32(i1.w), bitcast<u32>(i2.z >> 1u), bitcast<u32>(1i << u32(i3.w))); }
    case 4u: { return vec4u(bitcast<u32>(i32(f.z)), bitcast<u32>(i32(-f.z)), u32(f.x), u32(f.w)); }
    case 5u: { return vec4u(countOneBits(w.z), reverseBits(w.x), countLeadingZeros(w.x), countTrailingZeros(u32(i2.z))); }
    case 6u: { return bitcast<vec4u>(vec4i(firstLeadingBit(i1.z), firstLeadingBit(i2.x), firstTrailingBit(i0.z), firstTrailingBit(i2.z))); }
    case 7u: { return vec4u(firstLeadingBit(w.y), firstLeadingBit(0xF0u + w.y), extractBits(w.z, 4u, 8u), bitcast<u32>(extractBits(i2.z, 1u, 3u))); }
    case 8u: { return vec4u(insertBits(w.x, w.z, 4u, 4u), insertBits(w.x, w.z, 30u + w.y, 8u), bitcast<u32>(insertBits(i2.z, i0.x, 0u, 32u)), extractBits(w.z, 0u, 32u)); }
    case 9u: { return vec4u(pack4x8unorm(vec4f(0.5, -1.0, 2.0, f.w / 7.8)), pack4x8snorm(vec4f(-0.4, 1.0, f.x, 0.25)), pack2x16unorm(vec2f(0.5, f.y)), pack2x16float(vec2f(f.y, f.x))); }
    case 10u: { return vec4u(bits(unpack4x8snorm(0x80FF7F01u + w.y)).xy, bits(unpack4x8unorm(0xFF80u + w.y)).zw); }
    case 11u: { return bits(vec4f(f.x % f.y, (-f.x) % (-f.y), f.w % f.y, (f.x * 0.5) % 1.5)); }
    case 12u: { return bits(vec4f(u.a.z, u.b, u.m[1][0], u.n[2][1])); }
    case 13u: { return vec4u(u.s[1].y.x, u.s[0].y.y, bitcast<u32>(u.s[1].x), bitcast<u32>(u.a.x)); }
    case 14u: { let k = u.idx.x; return bitcast<vec4u>(vec4i(u.ints[k].y, u.ints[k + 1u].w, u.ints[u.idx.y].x, i32(u.s[u.idx.z].y.y))); }
    case 15u: {
      let b = vec4f(f.x, f.y, -f.y, 0.0) > vec4f(0.0);
      return vec4u(select(vec4u(1u), vec4u(2u), b).xy, u32(any(b)) + 10u * u32(all(b)), select(5u, 6u, b.y && !b.z));
    }
    case 16u: { let fr = frexp(f.w * 16.0); let mo = modf(f.x); return bitcast<vec4u>(vec4f(fr.fract, f32(fr.exp), mo.fract, ldexp(f.y, i3.z))); }
    case 17u: { return bitcast<vec4u>(vec4i(dot(i0.xyz, i1.xyz), clamp(i2.y, -3, 9), abs(i0.w), sign(i0.y))); }
    case 18u: {
      var acc = 0i;
      var i = 0i;
      loop {
        if (i == 3) { i = i + 1; continue; }
        acc = acc + i;
        continuing { i = i + 1; break if i >= min(i3.z * 2, 20); }
      }
      for (var j = 0u; j < min(w.x, 9u); j++) { if (j % 2u == 0u) { continue; } acc += i32(j) * 100; }
      var k = 0i;
      while (k < 5) { k++; if (k == 4) { break; } }
      return bitcast<vec4u>(vec4i(acc, i, k, 0));
    }
    case 19u: {
      var r = vec4u(0u);
      for (var j = 0u; j < 4u; j++) {
        switch (u.idx.w + j) {
          case 1u, 2u: { r[j] = 10u; }
          case 3u: { r[j] = 30u; break; }
          default: { r[j] = 99u; }
        }
      }
      return r;
    }
    case 20u: {
      var grid: array<array<i32, 3>, 2>;
      grid[u.idx.x][u.idx.y] = 7;
      grid[1][2] = grid[u.idx.x][u.idx.y] * 3;
      var s = 5i;
      bump(&s, i2.x);
      let p = &grid[1];
      (*p)[0] = s;
      return bitcast<vec4u>(vec4i(grid[1][2], grid[1][0], s, grid[0][0]));
    }
    case 21u: { return bitcast<vec4u>(vec4i(i3.x + i3.y, -i0.w, i0.w - i3.y, i3.x * 2)) ^ vec4u(0u, 0u, 0u, w.y - 1u); }
    case 22u: { return bits(vec4f(quantizeToF16(f.w), round(f.y + 0.5), round(-f.y * 0.25), trunc(f.x))); }
    case 23u: { let t = textureLoad(tex, vec2u(u.idx.x + 1u, u.idx.y), 0); return vec4u(t * 255.0 + 0.5); }
    case 24u: { return vec4u(textureDimensions(tex), textureNumLevels(tex), u32(i2.y) % 7u); }
    case 25u: { let m = mat3x3f(vec3f(f.y, 0.0, 1.0), vec3f(0.0, f.y, 0.0), vec3f(1.0, 0.0, f.y)); return bits(vec4f(determinant(m), (transpose(m) * vec3f(1.0, 2.0, 3.0)).xy, (u.m * vec2f(1.0, 1.0)).y)); }
    case 26u: { return vec4u(bitcast<u32>(i0.y), u32(bitcast<i32>(w.z)), bitcast<u32>(bitcast<f32>(w.x + 0x40000000u)), dot4U8Packed(0x01020304u + w.y, 0x04030201u)); }
    case 27u: { return vec4u(pack4xU8(vec4u(1u, 255u, 256u, w.x)), pack4xI8(vec4i(-1, 127, -128, i1.x)), pack4xU8Clamp(vec4u(300u, 2u, 3u, 4u)), bitcast<u32>(dot4I8Packed(0xFF7F8001u + w.y, 0x01020304u))); }
    case 28u: { return bitcast<vec4u>(vec4i(unpack4xI8(0x80FF7F01u + w.y))); }
    case 29u: { return vec4u(unpack4xU8(0x80FF7F01u + w.y)); }
    case 30u: { var v = vec3i(i0.xyz); v[u.idx.x] = 42; v.y = v[u.idx.y] + 1; return bitcast<vec4u>(vec4i(v, i32(u.idx.x))); }
    default: { return vec4u(c, c * 2u, 0xDEADBEEFu, c ^ 0x55u); }
  }
}

@fragment fn fs(@builtin(position) p: vec4f) -> @location(0) vec4u {
  return probe(u32(p.x));
}`;

function uniformData() {
  // U's WGSL layout: a@0 (vec3f), b@12, m@16 (mat2x2f: columns 8 apart), n@32 (mat3x2f: 3 columns 8 apart, 24 bytes),
  // ints@64 (4 x vec4i), uints@128, s@144 (2 x S, stride 16: x@0, y@8), floats@176, idx@192; size 208.
  const buf = new ArrayBuffer(208),
    f = new Float32Array(buf),
    i = new Int32Array(buf),
    u = new Uint32Array(buf);
  f.set([1.5, -2.25, 3.75], 0);
  f[3] = 0.125;
  f.set([1, 2, 3, 4], 4);
  f.set([5, 6, 7, 8, 9, 10], 8);
  i.set([7, -7, 0, -2147483648, -2, 2, -1, 31, 5, 33, -8, 0, 2147483647, 1, 4, 32], 16);
  u.set([7, 0, 0xffffffff, 10], 32);
  f[36] = 0.75;
  u.set([11, 12], 38);
  f[40] = -3.5;
  u.set([13, 14], 42);
  f.set([-7.5, 2.0, 1e10, 3.9], 44);
  u.set([1, 2, 1, 0], 48);
  return buf;
}

async function run(gpu) {
  const adapter = await gpu.requestAdapter();
  const device = await adapter.requestDevice();
  const errors = [];
  device.addEventListener('uncapturederror', (e) => errors.push(e.error.message));
  device.pushErrorScope('validation');
  const module = device.createShaderModule({ code });
  const pipeline = device.createRenderPipeline({
    layout: 'auto',
    vertex: { module, entryPoint: 'vs' },
    fragment: { module, entryPoint: 'fs', targets: [{ format: 'rgba32uint' }] },
  });
  const uniform = device.createBuffer({ size: 208, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
  device.queue.writeBuffer(uniform, 0, uniformData());
  const tex = device.createTexture({ size: [4, 3], format: 'rgba8unorm', usage: GPUTextureUsage.TEXTURE_BINDING | GPUTextureUsage.COPY_DST });
  const texels = new Uint8Array(4 * 3 * 4).map((_, k) => (k * 37 + 11) & 255);
  // bytesPerRow 20 (not a whole number of texels' worth of 16-byte alignment) exercises the row repacking.
  const padded = new Uint8Array(20 * 3);
  for (let r = 0; r < 3; r++) padded.set(texels.subarray(r * 16, r * 16 + 16), r * 20);
  device.queue.writeTexture({ texture: tex }, padded, { bytesPerRow: 20, rowsPerImage: 3 }, [4, 3]);
  const group = device.createBindGroup({
    layout: pipeline.getBindGroupLayout(0),
    entries: [
      { binding: 0, resource: { buffer: uniform } },
      { binding: 1, resource: tex.createView() },
    ],
  });
  const target = device.createTexture({ size: [32, 1], format: 'rgba32uint', usage: GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.COPY_SRC });
  const read = device.createBuffer({ size: 512, usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ });
  const encoder = device.createCommandEncoder();
  const pass = encoder.beginRenderPass({ colorAttachments: [{ view: target.createView(), loadOp: 'clear', storeOp: 'store', clearValue: [0, 0, 0, 0] }] });
  pass.setPipeline(pipeline);
  pass.setBindGroup(0, group);
  pass.draw(3);
  pass.end();
  encoder.copyTextureToBuffer({ texture: target }, { buffer: read, bytesPerRow: 512 }, [32, 1]);
  device.queue.submit([encoder.finish()]);
  await read.mapAsync(GPUMapMode.READ);
  const out = [...new Uint32Array(read.getMappedRange())];
  read.unmap();
  const scoped = await device.popErrorScope();
  if (scoped) errors.push(scoped.message);
  const gl = device.gl ? device.gl.getError() : 0;
  device.destroy();
  return { out, errors, glError: gl };
}

window.probe = async () => {
  const native = await run(navigator.gpu);
  const compat = await run(createCompatGPU());
  return { native, compat };
};
window.probeCode = code;
window.probeRun = run;
window.ready = true;
</script>
</body>
</html>
