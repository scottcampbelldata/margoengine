<!doctype html>
<meta charset="utf-8" />
<title>WebGL2 Direct3D 11 shader resource crash repro</title>
<!--
  Raw WebGL2, no Margo code (KB-BOUNCE-COMPATUNITS1 in docs/known-bugs.md). One fragment program reads `samplers`
  sampler2D uniforms and `blocks` std140 uniform blocks, each holding one array of `size` uvec4 read at a dynamic index (`form` 'array'), or the same
  layout as `size` - 1 rows and a last row ('tail'), or the array inside a struct ('struct').
  It is linked, drawn once into a 1 x 1 target and read back; the page reports whether the context survived.
  Driven by d3d11-srv-crash-repro.mjs.
-->
<script>
  "use strict";
  function fragment(samplers, blocks, size, form) {
    const decl = [],
      body = [];
    for (let i = 0; i < samplers; i++) {
      decl.push(`uniform sampler2D s${i};`);
      body.push(`  c += texture(s${i}, vec2(0.5));`);
    }
    for (let i = 0; i < blocks; i++) {
      if (form === "tail") {
        // The same std140 layout as one array, as an array of size - 1 rows and a last row.
        decl.push(
          `layout(std140) uniform B${i} { highp uvec4 a${i}[${size - 1}]; highp uvec4 z${i}; };`,
        );
        body.push(`  c += vec4(k < ${size - 1} ? a${i}[k] : z${i});`);
      } else if (form === "struct") {
        decl.push(
          `struct W${i} { highp uvec4 a[${size}]; };`,
          `layout(std140) uniform B${i} { W${i} w${i}; };`,
        );
        body.push(`  c += vec4(w${i}.a[k]);`);
      } else {
        decl.push(
          `layout(std140) uniform B${i} { highp uvec4 a${i}[${size}]; };`,
        );
        body.push(`  c += vec4(a${i}[k]);`);
      }
    }
    return `#version 300 es
precision highp float;
uniform int k;
${decl.join("\n")}
out vec4 o;
void main() {
  vec4 c = vec4(0.0);
${body.join("\n")}
  o = c;
}`;
  }
  const VERTEX = `#version 300 es
void main() {
  vec2 p = vec2(gl_VertexID == 1 ? 3.0 : -1.0, gl_VertexID == 2 ? 3.0 : -1.0);
  gl_Position = vec4(p, 0.0, 1.0);
}`;

  window.runRepro = async ({ samplers, blocks, size, form = "array" }) => {
    const canvas = Object.assign(document.createElement("canvas"), {
        width: 1,
        height: 1,
      }),
      gl = canvas.getContext("webgl2"),
      info = gl.getExtension("WEBGL_debug_renderer_info");
    const renderer = info
      ? gl.getParameter(info.UNMASKED_RENDERER_WEBGL)
      : gl.getParameter(gl.RENDERER);
    const shader = (type, text) => {
      const s = gl.createShader(type);
      gl.shaderSource(s, text);
      gl.compileShader(s);
      return s;
    };
    const program = gl.createProgram();
    gl.attachShader(program, shader(gl.VERTEX_SHADER, VERTEX));
    gl.attachShader(
      program,
      shader(gl.FRAGMENT_SHADER, fragment(samplers, blocks, size, form)),
    );
    gl.linkProgram(program);
    const linked = gl.getProgramParameter(program, gl.LINK_STATUS);
    if (!linked)
      return {
        renderer,
        linked,
        log: gl.getProgramInfoLog(program),
        lost: gl.isContextLost(),
      };
    gl.useProgram(program);
    gl.uniform1i(gl.getUniformLocation(program, "k"), 0);
    for (let i = 0; i < samplers; i++) {
      const t = gl.createTexture();
      gl.activeTexture(gl.TEXTURE0 + i);
      gl.bindTexture(gl.TEXTURE_2D, t);
      gl.texImage2D(
        gl.TEXTURE_2D,
        0,
        gl.RGBA8,
        1,
        1,
        0,
        gl.RGBA,
        gl.UNSIGNED_BYTE,
        new Uint8Array([1, 2, 3, 4]),
      );
      gl.uniform1i(gl.getUniformLocation(program, `s${i}`), i);
    }
    for (let i = 0; i < blocks; i++) {
      const b = gl.createBuffer();
      gl.bindBuffer(gl.UNIFORM_BUFFER, b);
      gl.bufferData(gl.UNIFORM_BUFFER, size * 16, gl.STATIC_DRAW);
      gl.uniformBlockBinding(
        program,
        gl.getUniformBlockIndex(program, `B${i}`),
        i,
      );
      gl.bindBufferBase(gl.UNIFORM_BUFFER, i, b);
    }
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    const px = new Uint8Array(4);
    gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
    // A crashed GPU process is seen by the page a little later: wait, then ask again.
    await new Promise((r) => setTimeout(r, 1000));
    return {
      renderer,
      linked,
      lost: gl.isContextLost(),
      error: gl.getError(),
      pixel: [...px],
    };
  };
  window.reproReady = true;
</script>
