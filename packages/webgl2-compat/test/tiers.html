<!doctype html>
<meta charset="utf-8">
<title>Compatibility device tiers</title>
<script type="module">
import { createTieredGPU } from '/packages/webgl2-compat/dist/tiers.js';
import { maskTier } from './support/mask-tier.js';

const U = { COPY_SRC: 1, COPY_DST: 2, TEXTURE_BINDING: 4, STORAGE_BINDING: 8, RENDER_ATTACHMENT: 16 };
const allocations = [];
const FULL = '@vertex fn v(@builtin(vertex_index) i: u32) -> @builtin(position) vec4f { return vec4f(f32(i & 1u) * 4.0 - 1.0, f32(i >> 1u) * 4.0 - 1.0, 0.0, 1.0); }';

function makeContext(tier, attributes) {
  const gl = new OffscreenCanvas(4, 4).getContext('webgl2', attributes);
  if (!gl) throw new Error('WebGL2 required for tier checks');
  maskTier(gl, tier);
  for (const [name, index] of [['texStorage2D', 2], ['texStorage3D', 2], ['renderbufferStorageMultisample', 2]]) {
    const original = gl[name].bind(gl);
    gl[name] = (...args) => { allocations.push({ tier, name, internal: args[index] }); return original(...args); };
  }
  return gl;
}

async function read(device, texture, { level = 0, layer = 0, bytes = 16 } = {}) {
  const w = Math.max(1, texture.width >> level), h = Math.max(1, texture.height >> level);
  const buffer = device.createBuffer({ size: h * 256, usage: 1 | 8 });
  const encoder = device.createCommandEncoder();
  encoder.copyTextureToBuffer({ texture, mipLevel: level, origin: [0, 0, layer] }, { buffer, bytesPerRow: 256 }, [w, h]);
  device.queue.submit([encoder.finish()]);
  await buffer.mapAsync(1);
  const rows = new Uint8Array(buffer.getMappedRange()), tight = new Uint8Array(w * h * bytes);
  for (let y = 0; y < h; y++) tight.set(rows.subarray(y * 256, y * 256 + w * bytes), y * w * bytes);
  buffer.unmap(); buffer.destroy();
  return tight;
}

function render(device, target, { code = '@fragment fn f() -> @location(0) vec4f { return vec4f(-2.0, 0.25, 0.5, 4.0); }', entries = [], blend, view, resolve } = {}) {
  const module = device.createShaderModule({ code: `${FULL}\n${code}` });
  const pipeline = device.createRenderPipeline({ layout: 'auto', vertex: { module, entryPoint: 'v' }, fragment: { module, entryPoint: 'f', targets: [{ format: target.format, blend }] }, multisample: { count: target.sampleCount } });
  const encoder = device.createCommandEncoder();
  const pass = encoder.beginRenderPass({ colorAttachments: [{ view: view ?? target.createView(), resolveTarget: resolve?.createView(), loadOp: 'clear', storeOp: 'store', clearValue: [0, 0, 0, 0] }] });
  pass.setPipeline(pipeline);
  if (entries.length) pass.setBindGroup(0, device.createBindGroup({ layout: pipeline.getBindGroupLayout(0), entries }));
  pass.draw(3); pass.end();
  device.queue.submit([encoder.finish()]);
}

async function probe(tier) {
  allocations.length = 0;
  const adapter = await (await createTieredGPU({ createContext: attributes => makeContext(tier, attributes) })).requestAdapter();
  if (!adapter) throw new Error(`Tier ${tier} unavailable`);
  const device = await adapter.requestDevice();
  const errors = [], textures = [];
  device.addEventListener('uncapturederror', e => { errors.push(e.error.message); e.preventDefault(); });
  const texture = (format = 'rgba32float', extra = {}) => {
    const t = device.createTexture({ size: [2, 2], format, usage: 1 | 2 | 4 | 16, ...extra });
    textures.push(t); return t;
  };
  const floats = bytes => [...new Float32Array(bytes.buffer)];
  const results = { tier: adapter.capabilities.tier, renderer: adapter.capabilities.renderer,
    version: adapter.capabilities.version, shadingLanguageVersion: adapter.capabilities.shadingLanguageVersion,
    formats: {}, errors };
  try {
    for (const [format, bytes] of [['r32float', 4], ['rg32float', 8], ['rgba32float', 16], ['r16float', 2], ['rg16float', 4], ['rgba16float', 8], ['rg11b10ufloat', 4]]) {
      const t = texture(format);
      render(device, t);
      results.formats[format] = { physical: t.storageInfo.name, bytes: [...await read(device, t, { bytes })] };
    }
    const upload = texture();
    const values = new Float32Array(16);
    for (let i = 0; i < 4; i++) values.set([-2, 0.25, 0.5, 4], i * 4);
    device.queue.writeTexture({ texture: upload }, values, { bytesPerRow: 32 }, [2, 2]);
    results.upload = floats(await read(device, upload));
    const copy = texture();
    const encoder = device.createCommandEncoder();
    encoder.copyTextureToTexture({ texture: upload }, { texture: copy }, [2, 2]);
    device.queue.submit([encoder.finish()]);
    results.copy = floats(await read(device, copy));

    // Both cross-usage directions must use physical storage, even though the logical formats are identical.
    const crossSource = texture('rgba32float', { usage: 1 | 2 | 4 });
    const crossTarget = texture(), crossBack = texture('rgba32float', { usage: 1 | 2 | 4 });
    device.queue.writeTexture({ texture: crossSource }, values, { bytesPerRow: 32 }, [2, 2]);
    const cross = device.createCommandEncoder();
    cross.copyTextureToTexture({ texture: crossSource }, { texture: crossTarget }, [2, 2]);
    cross.copyTextureToTexture({ texture: crossTarget }, { texture: crossBack }, [2, 2]);
    device.queue.submit([cross.finish()]);
    results.crossUsage = floats(await read(device, crossBack));

    // Sample-only float32 data retains its full range and precision on all tiers. Readback uses integer bits.
    const sample = texture('rgba32float', { usage: 1 | 2 | 4 });
    const precise = new Float32Array([0.12345679104328156, -123456, 987654, 0.00000012345679]);
    device.queue.writeTexture({ texture: sample }, precise, {}, [1, 1]);
    results.sample = floats((await read(device, sample)).slice(0, 16));
    results.samplePhysical = sample.storageInfo.name;

    const cube = texture('rgba32float', { size: [2, 2, 6], usage: 1 | 2 | 4 });
    const cubeValues = new Float32Array(96);
    for (let face = 0; face < 6; face++)
      for (let pixel = 0; pixel < 4; pixel++) cubeValues.set([-2 - face, 2 + face, (pixel + 1) / 16, 0.5], (face * 4 + pixel) * 4);
    device.queue.writeTexture({ texture: cube }, cubeValues, { bytesPerRow: 32, rowsPerImage: 2 }, [2, 2, 6]);
    results.cube = [];
    for (let face = 0; face < 6; face++) results.cube.push(floats(await read(device, cube, { layer: face })));
    const cubeTarget = texture();
    render(device, cubeTarget, {
      code: '@group(0) @binding(0) var t: texture_2d<f32>; @fragment fn f(@builtin(position) p: vec4f) -> @location(0) vec4f { return textureLoad(t, vec2i(p.xy), 0); }',
      entries: [{ binding: 0, resource: cube.createView({ dimension: '2d', baseArrayLayer: 3, arrayLayerCount: 1 }) }],
    });
    results.cubeView = floats(await read(device, cubeTarget));

    // Array-layer and mip uploads keep logical row/image pitches and view-copy storage selection.
    const array = texture('rgba32float', { size: [4, 4, 2], mipLevelCount: 2 });
    device.queue.writeTexture({ texture: array, origin: [0, 0, 1], mipLevel: 1 }, values, { bytesPerRow: 32 }, [2, 2]);
    results.array = floats(await read(device, array, { level: 1, layer: 1 }));
    const shaded = texture();
    render(device, shaded, {
      code: '@group(0) @binding(0) var t: texture_2d<f32>; @fragment fn f() -> @location(0) vec4f { return textureLoad(t, vec2i(0), 0); }',
      entries: [{ binding: 0, resource: array.createView({ dimension: '2d', baseArrayLayer: 1, arrayLayerCount: 1, baseMipLevel: 1, mipLevelCount: 1 }) }],
    });
    results.view = floats(await read(device, shaded));

    // Resolve and blending use physical formats, retaining the public logical pipeline format.
    const msaa = texture('rgba16float', { sampleCount: 4 }), resolved = texture('rgba16float');
    render(device, msaa, { resolve: resolved });
    const msaaResult = texture();
    render(device, msaaResult, { code: '@group(0) @binding(0) var t: texture_2d<f32>; @fragment fn f() -> @location(0) vec4f { return textureLoad(t, vec2i(0), 0); }', entries: [{ binding: 0, resource: resolved.createView() }] });
    results.msaa = floats(await read(device, msaaResult));
    const blended = texture('rgba16float');
    render(device, blended, { code: '@fragment fn f() -> @location(0) vec4f { return vec4f(0.5); }', blend: { color: { srcFactor: 'one', dstFactor: 'one' }, alpha: { srcFactor: 'one', dstFactor: 'one' } } });
    const blendResult = texture();
    render(device, blendResult, { code: '@group(0) @binding(0) var t: texture_2d<f32>; @fragment fn f() -> @location(0) vec4f { return textureLoad(t, vec2i(0), 0); }', entries: [{ binding: 0, resource: blended.createView() }] });
    results.blended = floats(await read(device, blendResult));
    results.blendOracle = rawUNORMBlend();

    // Exercise both texture-store GPU and workgroup-memory CPU compute on the same lower-tier device.
    for (const cpu of [false, true]) {
      const output = texture('rgba32float', { usage: 1 | 4 | 8 });
      const module = device.createShaderModule({ code: `@group(0) @binding(0) var output: texture_storage_2d<rgba32float, write>;
        ${cpu ? 'var<workgroup> x: f32;' : ''}
        @compute @workgroup_size(1) fn main(@builtin(global_invocation_id) id: vec3u) {
          ${cpu ? 'x = 0.25; workgroupBarrier();' : ''}
          textureStore(output, vec2i(id.xy), vec4f(-2.0, ${cpu ? 'x' : '0.25'}, 0.5, 4.0)); }` });
      const pipeline = device.createComputePipeline({ layout: 'auto', compute: { module, entryPoint: 'main' } });
      const encoder = device.createCommandEncoder(), pass = encoder.beginComputePass();
      pass.setPipeline(pipeline);
      pass.setBindGroup(0, device.createBindGroup({ layout: pipeline.getBindGroupLayout(0), entries: [{ binding: 0, resource: output.createView() }] }));
      pass.dispatchWorkgroups(2, 2); pass.end(); device.queue.submit([encoder.finish()]);
      results[cpu ? 'cpu' : 'fragment'] = floats(await read(device, output));
    }
    results.dispatches = { ...device.dispatches };
    results.dither = device.gl.isEnabled(device.gl.DITHER);
    results.gl = device.gl.getError();
    results.allocations = allocations.slice();
    return results;
  } finally {
    for (const t of textures) t.destroy();
    device.destroy();
  }
}

// Independent physical-format oracle. ES 3.0.6 permits either adjacent integer in fixed-point conversion;
// assuming the upper neighbour at the exact 0.5 tie misidentifies a driver choice as a layer defect.
function rawUNORMBlend() {
  const gl = new OffscreenCanvas(2, 2).getContext('webgl2', { antialias: false });
  const program = gl.createProgram(), texture = gl.createTexture(), fbo = gl.createFramebuffer();
  try {
    for (const [kind, source] of [
      [gl.VERTEX_SHADER, '#version 300 es\nvoid main(){gl_Position=vec4(float((gl_VertexID&1)<<2)-1.0,float((gl_VertexID&2)<<1)-1.0,0.0,1.0);}'],
      [gl.FRAGMENT_SHADER, '#version 300 es\nprecision highp float;out vec4 c;void main(){c=vec4(0.5);}'],
    ]) {
      const shader = gl.createShader(kind);
      gl.shaderSource(shader, source); gl.compileShader(shader); gl.attachShader(program, shader); gl.deleteShader(shader);
    }
    gl.linkProgram(program);
    if (!gl.getProgramParameter(program, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(program));
    gl.bindTexture(gl.TEXTURE_2D, texture); gl.texStorage2D(gl.TEXTURE_2D, 1, gl.RGBA8, 2, 2);
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo); gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, texture, 0);
    if (gl.checkFramebufferStatus(gl.FRAMEBUFFER) !== gl.FRAMEBUFFER_COMPLETE) throw new Error('UNORM oracle framebuffer incomplete');
    gl.useProgram(program); gl.viewport(0, 0, 2, 2); gl.disable(gl.DITHER);
    gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE);
    gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT); gl.drawArrays(gl.TRIANGLES, 0, 3);
    const bytes = new Uint8Array(16); gl.readPixels(0, 0, 2, 2, gl.RGBA, gl.UNSIGNED_BYTE, bytes);
    if (gl.getError() !== 0) throw new Error('UNORM oracle GL error');
    return [...bytes];
  } finally {
    gl.deleteFramebuffer(fbo); gl.deleteTexture(texture); gl.deleteProgram(program);
    gl.getExtension('WEBGL_lose_context')?.loseContext();
  }
}
window.check = { probe };
window.ready = true;
</script>
