<!doctype html><html><head><meta charset="utf-8"/><title>Targets without a fragment output</title></head><body>
<script type="module">
// A pipeline whose colour targets past the first have write mask 0 and no fragment output (valid WebGPU), drawn into a
// three-target pass with depth writes, on the WebGL2 layer: the draw lands in target 0 and the depth, the other targets
// keep their clear, and the device reports no error (KB-COMPAT-SILENTTARGET1). Asynchronous, so ANGLE Direct3D's warm draw
// (CompatProgram.warmed) runs too.
import { install } from '/packages/webgl2-compat/dist/index.js';
window.check = {
  async run() {
    const result = await install({ force: true });
    if (!result.installed) throw new Error('install() did not install: ' + result.reason);
    const adapter = await navigator.gpu.requestAdapter(), device = await adapter.requestDevice(), errors = [];
    device.addEventListener('uncapturederror', (e) => errors.push(e.error.message));
    const size = 4, format = 'rgba16float', usage = GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.COPY_SRC,
      colours = [0, 1, 2].map(() => device.createTexture({ size: [size, size], format, usage })),
      depth = device.createTexture({ size: [size, size], format: 'depth32float', usage }),
      module = device.createShaderModule({ code: `@vertex fn vertex(@builtin(vertex_index) i:u32)->@builtin(position) vec4f {
  let p=array(vec2f(-1,-1),vec2f(3,-1),vec2f(-1,3));return vec4f(p[i],0.25,1);}
@fragment fn fragment()->@location(0) vec4f {return vec4f(0.5,0.25,1,1);}` });
    device.pushErrorScope('validation');
    const pipeline = await device.createRenderPipelineAsync({ layout: 'auto',
      vertex: { module, entryPoint: 'vertex' },
      fragment: { module, entryPoint: 'fragment', targets: [{ format }, { format, writeMask: 0 }, { format, writeMask: 0 }] },
      depthStencil: { format: 'depth32float', depthWriteEnabled: true, depthCompare: 'always' } });
    const encoder = device.createCommandEncoder(), pass = encoder.beginRenderPass({
      colorAttachments: colours.map((view) => ({ view: view.createView(), loadOp: 'clear', storeOp: 'store', clearValue: [0, 0, 0, 0.75] })),
      depthStencilAttachment: { view: depth.createView(), depthLoadOp: 'clear', depthClearValue: 1, depthStoreOp: 'store' } });
    pass.setPipeline(pipeline); pass.draw(3); pass.end();
    const reads = colours.map(() => device.createBuffer({ size: 256 * size, usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ }));
    colours.forEach((t, i) => encoder.copyTextureToBuffer({ texture: t }, { buffer: reads[i], bytesPerRow: 256 }, [size, size]));
    const depthRead = device.createBuffer({ size: 256 * size, usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ });
    encoder.copyTextureToBuffer({ texture: depth, aspect: 'depth-only' }, { buffer: depthRead, bytesPerRow: 256 }, [size, size]);
    device.queue.submit([encoder.finish()]);
    const scoped = await device.popErrorScope();
    const half = (h) => { const e = (h >> 10) & 31, m = h & 1023; return (e ? (1 + m / 1024) * 2 ** (e - 15) : m / 1024 * 2 ** -14) * (h & 0x8000 ? -1 : 1); };
    const pixels = [];
    for (const r of reads) { await r.mapAsync(GPUMapMode.READ); pixels.push([...new Uint16Array(r.getMappedRange().slice(0, 8))].map(half)); r.unmap(); }
    await depthRead.mapAsync(GPUMapMode.READ); const d = new Float32Array(depthRead.getMappedRange().slice(0, 4))[0]; depthRead.unmap();
    // fixed-wait: a check that nothing happens: no late GL error arrives in this time
    await new Promise((r) => setTimeout(r, 50));
    return { pixels, depth: d, errors, scoped: scoped?.message ?? null };
  },
};
window.ready = true;
</script></body></html>
