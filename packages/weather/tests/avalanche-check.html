<!doctype html><html><head><meta charset="utf-8"/><title>Avalanche browser check</title><style>body{margin:0}canvas{display:block;width:256px;height:192px}</style></head><body><canvas id="a"></canvas>
<script type="module">
// Real-GPU proof for @margoengine/weather/avalanche: Snow draws the avalanche as its field (the cover before the
// release, the scar and the moving core after it, a later time re-uploads), the same frame twice is the same,
// AvalancheScatter's plant maps hold the avalanche's snow surface and plantsKept to the byte, and the powder cloud drawn
// into a vfx Clouds changes the picture.
import {Engine,Geometry,PbrMaterial} from '/packages/core/dist/index.js';
import {sceneSamples} from '/packages/core/dist/quality.js';
import {Bloom} from '/packages/post/dist/bloom.js';
import {Clouds} from '/packages/vfx/dist/clouds.js';
import {Snow} from '/packages/weather/dist/snow.js';
import {Avalanche,AvalancheScatter} from '/packages/weather/dist/avalanche.js';
if(new URLSearchParams(location.search).get('samples')==='1')globalThis.margoLow=1;
const errors=[];
// A 38 degree gully falling toward +z, flat below 300 m, 4 m samples.
const W=25,D=126,C=4,ground=new Float32Array(W*D);
for(let j=0;j<D;j++)for(let i=0;i<W;i++)ground[j*W+i]=-Math.tan(38*Math.PI/180)*Math.min(j*C,300)+0.7*C*Math.abs(i-12);
function terrain(){
 const pos=[],nor=[],idx=[];
 for(let j=0;j<D;j++)for(let i=0;i<W;i++){const h=(a,b)=>ground[Math.min(D-1,Math.max(0,b))*W+Math.min(W-1,Math.max(0,a))];const gx=(h(i+1,j)-h(i-1,j))/(2*C),gz=(h(i,j+1)-h(i,j-1))/(2*C),l=Math.hypot(gx,1,gz);pos.push(i*C,ground[j*W+i],j*C);nor.push(-gx/l,1/l,-gz/l);}
 for(let j=0;j<D-1;j++)for(let i=0;i<W-1;i++){const k=j*W+i;idx.push(k,k+W,k+1,k+1,k+W,k+W+1);}
 return new Geometry(pos,nor,idx);
}
const canvas=document.querySelector('#a');
const engine=await Engine.create(canvas,{backend:'webgpu',camera:{position:[48,60,520],target:[48,-160,200],near:0.5,far:2000}});engine.stop();
engine.gpu.addEventListener('uncapturederror',e=>errors.push(e.error.message));
const post=Bloom.attach(engine,{strength:0,threshold:100,exposure:0});
engine.createMesh().setGeometry(terrain()).setMaterial(new PbrMaterial({color:'#5a4a3a',roughness:0.9}));
const device=engine.gpu;
async function read(texture){
 const pipeline=device.createComputePipeline({layout:'auto',compute:{module:device.createShaderModule({code:'@group(0) @binding(0) var image:texture_2d<f32>;@group(0) @binding(1) var<storage,read_write> result:array<vec4f>;@compute @workgroup_size(8,8) fn main(@builtin(global_invocation_id) id:vec3u){let s=textureDimensions(image);if(any(id.xy>=s)){return;}result[id.y*s.x+id.x]=textureLoad(image,vec2i(id.xy),0);}'}),entryPoint:'main'}});
 const bytes=texture.width*texture.height*16,output=device.createBuffer({size:bytes,usage:GPUBufferUsage.STORAGE|GPUBufferUsage.COPY_SRC}),staging=device.createBuffer({size:bytes,usage:GPUBufferUsage.COPY_DST|GPUBufferUsage.MAP_READ});
 const encoder=device.createCommandEncoder(),pass=encoder.beginComputePass();pass.setPipeline(pipeline);
 pass.setBindGroup(0,device.createBindGroup({layout:pipeline.getBindGroupLayout(0),entries:[{binding:0,resource:texture.createView()},{binding:1,resource:{buffer:output}}]}));
 pass.dispatchWorkgroups(Math.ceil(texture.width/8),Math.ceil(texture.height/8));pass.end();encoder.copyBufferToBuffer(output,0,staging,0,bytes);device.queue.submit([encoder.finish()]);
 await staging.mapAsync(GPUMapMode.READ);const data=new Float32Array(staging.getMappedRange()).slice();staging.unmap();output.destroy();staging.destroy();return data;
}
async function shot(){engine.render({delta:0});await device.queue.onSubmittedWorkDone();return read(post.sceneTexture);}
const count=(a,b)=>{let n=0;for(let p=0;p<a.length;p+=4)if(Math.abs(a[p]-b[p])+Math.abs(a[p+1]-b[p+1])+Math.abs(a[p+2]-b[p+2])>1e-4)n++;return n;};
window.check={samples:sceneSamples,
 async run(){
  const out={};device.pushErrorScope('validation');
  const slide=new Avalanche({width:W,depth:D,cellSize:C,ground,cover:1,release:{at:[48,60],size:[14,40]},releaseTime:1});
  const bare=await shot();
  const snow=Snow.attach(engine,{field:slide});
  const before=await shot();out.coverChanged=count(bare,before);
  slide.seek(12);out.released=slide.isReleased;
  const flowing=await shot();out.flowChanged=count(before,flowing);out.sameTwice=count(flowing,await shot());
  const v=slide.version;slide.seek(30);out.versionMoved=slide.version!==v;out.later=count(flowing,await shot());
  // The plant maps against the avalanche.
  const scatter=AvalancheScatter.attach(engine,slide);engine.render({delta:0});await device.queue.onSubmittedWorkDone();
  const hm=await read(scatter.heightmap()),dm=await read(scatter.densityMap()),f=slide.fieldData(),kept=slide.plantsKept();
  let hWorst=0,dWorst=0,broken=0;for(let k=0;k<W*D;k++){hWorst=Math.max(hWorst,Math.abs(hm[4*k]-(f[2*k]+f[2*k+1])));dWorst=Math.max(dWorst,Math.abs(dm[4*k]-Math.round(255*kept[k])/255));if(kept[k]<0.5)broken++;}
  out.heightWorst=hWorst;out.densityWorst=dWorst;out.broken=broken;
  // The powder cloud as vfx puffs.
  slide.seek(14);const noCloud=await shot();
  const clouds=Clouds.attach?Clouds.attach(engine):(()=>{const c=new Clouds();engine.use(c);return c;})();
  slide.drawCloud(clouds);out.parcels=slide.powderCloud().length;
  out.cloudChanged=count(noCloud,await shot());
  slide.clearCloud();clouds.dispose();scatter.dispose();snow.dispose();
  const error=await device.popErrorScope();
  out.validation=error?.message??null;out.errors=errors.splice(0);
  return out;
 }
};
window.ready=true;
</script></body></html>
