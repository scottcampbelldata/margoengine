<!doctype html><html><head><meta charset="utf-8"/><title>Snow drift browser check</title><style>body{margin:0}canvas{display:block;width:256px;height:192px}</style></head><body><canvas id="a"></canvas>
<script type="module">
// Real-GPU proof for @margoengine/weather/snow-drift drawn by Snow's field: the field WGSL against its JavaScript twins;
// an empty field changes no pixel; a drifted field lifts the ridge's skyline (seen from below the crest, so the nearest
// row of the grid is the skyline) by the snow depth at each grid point (deep in the lee, none on the scoured crest); the same frame twice is the same; a later time re-uploads the field; the
// cornice mesh draws past the crest.
import {Engine,Geometry,PbrMaterial} from '/packages/core/dist/index.js';
import {sceneSamples} from '/packages/core/dist/quality.js';
import {Bloom} from '/packages/post/dist/bloom.js';
import {Snow,snowWGSL,snowFieldWGSL,snowFieldCover,snowFieldDepth} from '/packages/weather/dist/snow.js';
import {SnowDrift} from '/packages/weather/dist/snow-drift.js';
if(new URLSearchParams(location.search).get('samples')==='1')globalThis.margoLow=1;
const errors=[];
const W=97,D=8,ground=new Float32Array(W*D);
for(let j=0;j<D;j++)for(let i=0;i<W;i++)ground[j*W+i]=i<40?8*Math.max(0,1-(40-i)/30):8*Math.max(0,1-(i-40)/6);
function terrain(){
 const pos=[],nor=[],idx=[];
 for(let j=0;j<D;j++)for(let i=0;i<W;i++){const h=(a,b)=>ground[Math.min(D-1,Math.max(0,b))*W+Math.min(W-1,Math.max(0,a))];const gx=(h(i+1,j)-h(i-1,j))/2,gz=(h(i,j+1)-h(i,j-1))/2,l=Math.hypot(gx,1,gz);pos.push(i,ground[j*W+i],j);nor.push(-gx/l,1/l,-gz/l);}
 for(let j=0;j<D-1;j++)for(let i=0;i<W-1;i++){const k=j*W+i;idx.push(k,k+W,k+1,k+1,k+W,k+W+1);}
 return new Geometry(pos,nor,idx);
}
const canvas=document.querySelector('#a');
const engine=await Engine.create(canvas,{backend:'webgpu',camera:{position:[42,0.2,30],target:[42,3,0],near:0.1,far:400}});engine.stop();
engine.gpu.addEventListener('uncapturederror',e=>errors.push(e.error.message));
const post=Bloom.attach(engine,{strength:0,threshold:100,exposure:0});
engine.createMesh().setGeometry(terrain()).setMaterial(new PbrMaterial({color:'#5a4a3a',roughness:0.9}));
const device=engine.gpu;
const module=(d)=>d.createShaderModule({code:'@group(0) @binding(0) var image:texture_2d<f32>;@group(0) @binding(1) var<storage,read_write> result:array<vec4f>;@compute @workgroup_size(8,8) fn main(@builtin(global_invocation_id) id:vec3u){let s=textureDimensions(image);if(any(id.xy>=s)){return;}result[id.y*s.x+id.x]=textureLoad(image,vec2i(id.xy),0);}'});
async function read(d,texture){
 const pipeline=d.createComputePipeline({layout:'auto',compute:{module:module(d),entryPoint:'main'}});
 const bytes=texture.width*texture.height*16,output=d.createBuffer({size:bytes,usage:GPUBufferUsage.STORAGE|GPUBufferUsage.COPY_SRC}),staging=d.createBuffer({size:bytes,usage:GPUBufferUsage.COPY_DST|GPUBufferUsage.MAP_READ});
 const encoder=d.createCommandEncoder(),pass=encoder.beginComputePass();pass.setPipeline(pipeline);
 pass.setBindGroup(0,d.createBindGroup({layout:pipeline.getBindGroupLayout(0),entries:[{binding:0,resource:texture.createView()},{binding:1,resource:{buffer:output}}]}));
 pass.dispatchWorkgroups(Math.ceil(texture.width/8),Math.ceil(texture.height/8));pass.end();encoder.copyBufferToBuffer(output,0,staging,0,bytes);d.queue.submit([encoder.finish()]);
 await staging.mapAsync(GPUMapMode.READ);const data=new Float32Array(staging.getMappedRange()).slice();staging.unmap();output.destroy();staging.destroy();return data;
}
async function shot(){engine.render({delta:0});await device.queue.onSubmittedWorkDone();return read(device,post.sceneTexture);}
const differs=(a,b,p)=>Math.abs(a[p]-b[p])+Math.abs(a[p+1]-b[p+1])+Math.abs(a[p+2]-b[p+2])>1e-4;
const count=(a,b)=>{let n=0;for(let p=0;p<a.length;p+=4)if(differs(a,b,p))n++;return n;};
// The field maths: the WGSL with the field's map and uniform bound, against snowFieldCover and snowFieldDepth.
async function maths(drift){
 const cases=[];for(let x=-3;x<100;x+=0.77)for(let z=-1;z<9;z+=1.3)for(const dy of [-0.2,0,0.04,0.3,2])cases.push([x,(drift.surfaceAt(x,z)??0)-(drift.depthAt(x,z))+dy,z,0]);
 const input=new Float32Array(cases.flat());
 const code=snowWGSL+snowFieldWGSL.replaceAll('@group(0) @binding(164)','@group(0) @binding(2)').replaceAll('@group(0) @binding(165)','@group(0) @binding(3)')+'@group(0) @binding(0) var<storage,read> inp:array<vec4f>;@group(0) @binding(1) var<storage,read_write> outp:array<vec2f>;@compute @workgroup_size(64) fn main(@builtin(global_invocation_id) id:vec3u){if(id.x>=arrayLength(&inp)){return;}let c=inp[id.x];let u=WeatherSnow(vec4f(0.4,0.2,0.0,4),vec4f(0.9,0.92,0.95,0.85),vec4f(0.3,0,0,0));outp[id.x]=vec2f(weather_snow_field_cover(c.xyz,0.4),weather_snow_depth(c.xz,1.0,weather_snow_field_uniform(c.xyz,u)));}';
 const m=device.createShaderModule({code}),p=device.createComputePipeline({layout:'auto',compute:{module:m,entryPoint:'main'}});
 const a=device.createBuffer({size:input.byteLength,usage:GPUBufferUsage.STORAGE|GPUBufferUsage.COPY_DST}),b=device.createBuffer({size:input.byteLength/2,usage:GPUBufferUsage.STORAGE|GPUBufferUsage.COPY_SRC}),st=device.createBuffer({size:input.byteLength/2,usage:GPUBufferUsage.COPY_DST|GPUBufferUsage.MAP_READ});
 const fu=device.createBuffer({size:32,usage:GPUBufferUsage.UNIFORM|GPUBufferUsage.COPY_DST}),tex=device.createTexture({size:[W,D],format:'rg32float',usage:GPUTextureUsage.TEXTURE_BINDING|GPUTextureUsage.COPY_DST});
 device.queue.writeBuffer(fu,0,new Float32Array([drift.origin[0],drift.origin[1],1/drift.cellSize,1,W,D,0.05,0]));
 device.queue.writeTexture({texture:tex},drift.fieldData(),{bytesPerRow:W*8,rowsPerImage:D},[W,D]);
 device.queue.writeBuffer(a,0,input);
 const e=device.createCommandEncoder(),pass=e.beginComputePass();pass.setPipeline(p);pass.setBindGroup(0,device.createBindGroup({layout:p.getBindGroupLayout(0),entries:[{binding:0,resource:{buffer:a}},{binding:1,resource:{buffer:b}},{binding:2,resource:{buffer:fu}},{binding:3,resource:tex.createView()}]}));pass.dispatchWorkgroups(Math.ceil(cases.length/64));pass.end();e.copyBufferToBuffer(b,0,st,0,input.byteLength/2);device.queue.submit([e.finish()]);
 await st.mapAsync(GPUMapMode.READ);const out=new Float32Array(st.getMappedRange()).slice();st.unmap();a.destroy();b.destroy();fu.destroy();tex.destroy();
 let worst=0,onField=0,off=0;
 cases.forEach(([x,y,z],i)=>{const c=snowFieldCover(drift,x,y,z,0.4),d=snowFieldDepth(drift,x,y,z,0.4,{depth:0.2,variation:0});if(c===0.4)off++;else onField++;worst=Math.max(worst,Math.abs(out[i*2]-c),Math.abs(out[i*2+1]-d));});
 return {cases:cases.length,worst,onField,off};
}
// The skyline: the topmost row of a column that differs from the background (row 0).
function edge(img,Wp,Hp,x){for(let y=0;y<Hp;y++){const p=(y*Wp+x)*4,b=x*4;if(Math.abs(img[p]-img[b])+Math.abs(img[p+1]-img[b+1])+Math.abs(img[p+2]-img[b+2])>0.01)return y;}return -1;}
function project(x,y,z){const m=engine.camera.matrix,c=[0,1,2,3].map(r=>m[r]*x+m[4+r]*y+m[8+r]*z+m[12+r]);return [(c[0]/c[3]+1)/2,(1-c[1]/c[3])/2];}
window.check={samples:sceneSamples,
 async run(){
  const out={};device.pushErrorScope('validation');
  const drift=new SnowDrift({width:W,depth:D,ground,initialDepth:0.3,wind:16,windDirection:90,snowfall:2,temperature:-8,timeScale:3600});
  const bare=await shot();
  const Wp=post.sceneTexture.width,Hp=post.sceneTexture.height;
  // Time 0 with no snow at all: the field is empty, so nothing changes.
  const empty=new SnowDrift({width:W,depth:D,ground});
  const snow0=Snow.attach(engine,{field:empty,cover:1,depth:0.5});
  out.emptyChanged=count(bare,await shot());snow0.dispose();
  out.maths0=await maths(drift);
  drift.seek(3);
  out.maths=await maths(drift);
  const snow=Snow.attach(engine,{field:drift});
  const drifted=await shot();
  out.sameTwice=count(drifted,await shot());
  out.columns=[];
  for(const x of [30,36,40,42,44]){
   const [u]=project(x,ground[x],7),col=Math.round(u*Wp-0.5);
   const before=edge(bare,Wp,Hp,col),after=edge(drifted,Wp,Hp,col),depth=drift.snowDepth()[7*W+x];
   const [,vb]=project(x,ground[x],7),[,va]=project(x,ground[x]+depth,7);
   out.columns.push({x,depth,before,after,expectedBefore:vb*Hp,expectedAfter:va*Hp});
  }
  // A later time: the field's version changes and the shader reads the new map.
  const v=drift.version;drift.seek(6);out.versionMoved=drift.version!==v;
  out.later=count(drifted,await shot());
  // The cornice mesh past the crest.
  const before=await shot(),cg=drift.corniceGeometry();out.cornices=drift.cornices().length;
  const mesh=engine.createMesh().setGeometry(new Geometry(cg.positions,cg.normals,cg.indices)).setMaterial(new PbrMaterial({color:'#f0f2f5',roughness:0.85}));
  out.corniceChanged=count(before,await shot());
  mesh.dispose?.();snow.dispose();
  const error=await device.popErrorScope();
  out.validation=error?.message??null;out.errors=errors.splice(0);
  return out;
 }
};
window.ready=true;
</script></body></html>
