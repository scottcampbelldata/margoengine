<!doctype html><html><head><meta charset="utf-8"/><title>Weather seek check</title><style>body{margin:0}canvas{display:inline-block;width:192px;height:128px}</style></head><body><canvas id="a"></canvas><canvas id="b"></canvas><canvas id="c"></canvas>
<script type="module">
// GAP-FILM-TIME: a world seeked to film time draws what a continuous run draws there, bit for bit. Three worlds alike:
// A runs n + 1 live frames; B is fresh, seeks n / fps (@margoengine/cutscene/seek), then draws one live frame; C draws
// one frame with no seek (the restart a film cut showed before). A WeatherDrive steps a machine whose schedule changes
// the wind and the hail on the way and writes them into Hail; Puddles follow the machine's wetness and rain rings. The
// HDR scene captures of A and B must be equal float for float, and C must differ. Driven by seek-check.mjs.
import {Engine,PbrMaterial,box} from '/packages/core/dist/index.js';
import {Bloom} from '/packages/post/dist/bloom.js';
import {WeatherMachine,WEATHER_PRESETS} from '/packages/weather/dist/index.js';
import {WeatherDrive} from '/packages/weather/dist/drive.js';
import {Hail} from '/packages/weather/dist/hail.js';
import {Puddles} from '/packages/weather/dist/puddles.js';
import {seek} from '/packages/cutscene/dist/seek.js';
import {waitForPipelines} from '/scripts/support/gpu-ready.js';
const FPS=60,errors=[];
// Film code: what a film sets from its own step, live or replayed (ctx.seek), so both runs read the same inputs.
const film=(w,step)=>{w.drive.options.position=[step*0.01,2,0];};
async function world(id){
 const engine=await Engine.create(document.getElementById(id),{backend:'webgpu',camera:{position:[0,3,4],target:[0,0,-6],near:0.1,far:500}}),device=engine.gpu;
 device.addEventListener('uncapturederror',e=>errors.push(e.error.message));
 const machine=new WeatherMachine({...WEATHER_PRESETS.rain,hail:0.7,wind:3},{seed:5}).schedule([{to:{wind:14,hail:1},seconds:3,hold:1},{to:{wind:2,hail:0.5},seconds:2,hold:2}],{loop:true});
 const hail=new Hail({seed:3,particles:4000,radius:12,height:12});
 // Attach order: the drive first, so the hail draws this frame's numbers.
 const drive=WeatherDrive.attach(engine,{weather:machine,hail,position:[0,2,0]});
 engine.use(hail);
 const puddles=Puddles.attach(engine,{weather:machine,start:0.02,coverage:0.5,size:1.5});
 const post=Bloom.attach(engine,{strength:0,threshold:100,exposure:0});
 engine.createMesh().setGeometry(box(60,0.2,60)).setMaterial(new PbrMaterial({color:'#6a6258',roughness:0.8}));
 return {engine,device,post,machine,drive,hail,puddles};
}
async function draw(w,step){film(w,step);w.engine.render({delta:1/FPS});await w.device.queue.onSubmittedWorkDone();}
async function read(w){
 const {device}=w,texture=w.post.sceneTexture,module=device.createShaderModule({code:'@group(0) @binding(0) var image:texture_2d<f32>;@group(0) @binding(1) var<storage,read_write> result:array<vec4f>;@compute @workgroup_size(8,8) fn main(@builtin(global_invocation_id) id:vec3u){let s=textureDimensions(image);if(any(id.xy>=s)){return;}result[id.y*s.x+id.x]=textureLoad(image,vec2i(id.xy),0);}'});
 const pipeline=device.createComputePipeline({layout:'auto',compute:{module,entryPoint:'main'}});
 const bytes=texture.width*texture.height*16,output=device.createBuffer({size:bytes,usage:GPUBufferUsage.STORAGE|GPUBufferUsage.COPY_SRC}),staging=device.createBuffer({size:bytes,usage:GPUBufferUsage.COPY_DST|GPUBufferUsage.MAP_READ});
 const encoder=device.createCommandEncoder(),pass=encoder.beginComputePass();pass.setPipeline(pipeline);
 pass.setBindGroup(0,device.createBindGroup({layout:pipeline.getBindGroupLayout(0),entries:[{binding:0,resource:texture.createView()},{binding:1,resource:{buffer:output}}]}));
 pass.dispatchWorkgroups(Math.ceil(texture.width/8),Math.ceil(texture.height/8));pass.end();encoder.copyBufferToBuffer(output,0,staging,0,bytes);device.queue.submit([encoder.finish()]);
 await staging.mapAsync(GPUMapMode.READ);const data=new Float32Array(staging.getMappedRange()).slice();staging.unmap();output.destroy();staging.destroy();return data;
}
const differ=(a,b)=>{let n=0;for(let i=0;i<a.length;i++)if(!Object.is(a[i],b[i]))n++;return n;};
const lit=(a)=>{let s=0;for(let i=0;i<a.length;i+=4)s+=a[i]+a[i+1]+a[i+2];return s;};
const a=await world('a'),b=await world('b'),c=await world('c');
// Pipelines compile on warm-up frames of delta 0, which move no clock (time stays 0, so a seek is allowed); every world
// gets the same number of them, so all three start from the same state.
const still=async w=>{w.engine.render({delta:0});await w.device.queue.onSubmittedWorkDone();};
const counts=[];
for(const w of [a,b,c]){let n=0;await waitForPipelines(async()=>{n++;await still(w);});counts.push(n);}
const most=Math.max(...counts);
for(const [i,w] of [a,b,c].entries())for(let k=counts[i];k<most;k++)await still(w);
const clocks=w=>[w.machine.time,w.hail.time,w.puddles.time,w.hail.amount,w.machine.wetness,...w.hail.options.wind];
window.check={async run(n=600){
 for(let step=0;step<=n;step++)await draw(a,step);
 const result=await seek(b.engine,n/FPS,{fps:FPS,onStep:step=>film(b,step)});
 await draw(b,n);await draw(c,n);
 const [ia,ib,ic]=await Promise.all([read(a),read(b),read(c)]);
 return {errors,steps:result.steps,clocks:result.clocks,unseekable:result.unseekable,values:ia.length,differ:differ(ia,ib),fresh:differ(ia,ic),lit:lit(ia),
  clocksA:clocks(a),clocksB:clocks(b),stones:a.hail.count,wetness:a.machine.wetness};
}};
window.ready=true;
</script></body></html>
