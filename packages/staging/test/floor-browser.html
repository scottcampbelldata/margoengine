<!doctype html><html><head><meta charset="utf-8"><title>Glossy product floor oracle</title><style>body{margin:0}canvas{display:block;width:256px;height:256px}</style></head><body><canvas></canvas><script type="module">
import {Engine} from '/packages/core/dist/index.js';
import {engineRuntime} from '/packages/core/dist/extension.js';
import {loadGLTF} from '/packages/gltf-pro/dist/index.js';
import {worldTriangles} from '/packages/bvh/dist/index.js';
import {Reflector} from '/packages/environment/dist/reflector.js';
import {floatToHalf,halfToFloat} from '/packages/environment/dist/index.js';
import {readTexture} from '/packages/environment/tests/gpu-read.js';
import {webglRenderer} from '/packages/webgl2-compat/dist/preview.js';
const engine=await Engine.create(document.querySelector('canvas'),{camera:{position:[0,.4,.9],target:[0,.2,0]}});
engine.scene.background='#cccccc';
const errors=[];engine.onError=e=>errors.push(e.message);
const watch=()=>{
 const d=engine.gpu,create=d.createTexture.bind(d);
 d.createTexture=o=>create(o.label==='planar blur'?{...o,usage:o.usage|GPUTextureUsage.COPY_SRC}:o);
 d.addEventListener('uncapturederror',e=>errors.push(e.error.message));
};watch();
const product=await loadGLTF(engine,'/examples/assets/flight-helmet-mobile.glb',{signal:AbortSignal.timeout(30000)});
const triangles=worldTriangles(engine,[product]),bounds=[Infinity,Infinity,Infinity,-Infinity,-Infinity,-Infinity];
for(let k=0;k<triangles.vertices.length;k++){const a=k%3;bounds[a]=Math.min(bounds[a],triangles.vertices[k]);bounds[a+3]=Math.max(bounds[a+3],triangles.vertices[k]);}
const floor=Reflector.attach(engine,{width:2,height:2,color:[.6,.6,.6],roughness:.4,autoUpdate:false,resolution:1});
floor.node.setRotation([-Math.PI/2,0,0]);floor.node.setPosition([0,bounds[1]-.0001,0]);
const frame=async()=>{floor.update();engine.render();await engine.gpu.queue.onSubmittedWorkDone();};
const project=p=>{const m=engine.camera.matrix,c=[0,1,2,3].map(r=>m[r]*p[0]+m[4+r]*p[1]+m[8+r]*p[2]+m[12+r]);return [(1+c[0]/c[3])*128,(1-c[1]/c[3])*128];};
window.check={
 async draw(roughness,visible=true){floor.roughness=roughness;product.root.visible=visible;engine.gpu.pushErrorScope('validation');await frame();const e=await engine.gpu.popErrorScope();if(e)errors.push(e.message);return errors;},
 async mips(){
  await frame();const images=[];
  for(let i=0;i<floor.blur.levels.length;i++){const image=await readTexture(engine.gpu,floor.blur.texture,i);images.push({width:image.width,height:image.height,data:Array.from(image.data)});}
  return images;
 },
 region(){let maxY=-Infinity;for(let k=0;k<triangles.vertices.length;k+=3)maxY=Math.max(maxY,project(triangles.vertices.subarray(k,k+3))[1]);return Math.ceil(maxY)+2;},
 async restore(){const old=engine.gpu;old.destroy();await old.lost;await engineRuntime(engine).rebootDevice();watch();await frame();return engine.gpu!==old;},
 async resize(){engine.canvas.style.width='128px';engine.canvas.style.height='128px';engine.render();await frame();return {width:floor.texture.width,height:floor.texture.height,levels:floor.blur.levels.length,errors};},
 async quantization(){
  const cases=[[1,1+2**-10,1,1+2**-10],[2**-24,0,2**-24,0],[65504,65504,65504,65504],[1+2**-10,1+2**-9,1+2**-10,1+2**-9]];
  const words=new Uint16Array(8*2*4),expected=[];
  for(let b=0;b<4;b++){let sum=0;for(let k=0;k<4;k++){const h=floatToHalf(cases[b][k]);sum+=halfToFloat(h)/4;const offset=((k>>1)*8+b*2+(k&1))*4;words.set([h,h,h,floatToHalf(1)],offset);}expected.push(halfToFloat(floatToHalf(sum)));}
  const device=engine.gpu,source=device.createTexture({size:[8,2],format:'rgba16float',usage:GPUTextureUsage.COPY_SRC|GPUTextureUsage.COPY_DST|GPUTextureUsage.TEXTURE_BINDING});
  device.queue.writeTexture({texture:source},words,{bytesPerRow:64},[8,2]);
  const original=floor.target.color;floor.target.color=source;
  try{const encoder=device.createCommandEncoder();floor.mips({device,encoder});device.queue.submit([encoder.finish()]);const image=await readTexture(device,floor.blur.texture,1);return {actual:Array.from({length:4},(_,i)=>image.data[i*4]),expected};}
  finally{floor.target.color=original;source.destroy();}
 },
 async empty(){product.dispose();await frame();const data=(await readTexture(engine.gpu,floor.texture)).data;return {uniform:data.every((v,i)=>v===data[i%4]),pixel:Array.from(data.subarray(0,4)),errors};},
 async native(){const fallback=await Engine.create(document.createElement('canvas'),{backend:'webgl2',fallback:webglRenderer});try{Reflector.attach(fallback);return null;}catch(e){return {code:e.code,message:e.message};}finally{fallback.dispose();}},
 extremes(){let invalid=0;for(const v of [-1,NaN,Infinity,1e100]){try{floor.roughness=v;}catch(e){if(e instanceof RangeError)invalid++;else throw e;}}floor.roughness=1;return {invalid,maximum:floor.roughness};},
 dispose(){floor.dispose();floor.dispose();const detached=!engine.scene.plugins.has(floor.name);engine.dispose();return {detached,errors};},
 info:{triangles:triangles.indices.length/3,bounds},
};window.ready=true;
</script></body></html>
