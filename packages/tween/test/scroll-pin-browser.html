<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Scroll pin correctness fixture</title>
<style>
  body {margin:0}
  #before {height:600px}
  #pin {height:180px;background:#126b80;color:white}
  #after {height:2000px}
  #scroller {height:200px;overflow:auto;border:4px solid black}
  #inner-before {height:100px}
  #inner-pin {height:100px;background:#8b509c}
  #inner-after {height:1500px}
</style>
<div id="before"></div>
<section id="pin" style="color: white">Pinned section</section>
<div id="after"></div>
<div id="scroller"><div id="inner-before"></div><section id="inner-pin">Inner section</section><div id="inner-after"></div></div>
<script type="module">
  import {Timeline} from '../dist/full-timeline.js';
  import {pinTimeline} from '../dist/scroll-pin.js';
  const pin=document.querySelector('#pin'),inner=document.querySelector('#inner-pin'),source=document.querySelector('#scroller');
  const value={x:0};
  const timeline=new Timeline().to(value,'x',10,{duration:2}).label('start',0).label('middle',1).label('end',2);
  const controller=new AbortController();
  const originalStyle=pin.getAttribute('style');
  let link=pinTimeline(timeline,{pin,distance:1000,snap:'labels',snapDelay:0.03,snapDuration:0.1,signal:controller.signal});
  const innerValue={x:0};
  const innerTimeline=new Timeline().to(innerValue,'x',10,{duration:1});
  const innerLink=pinTimeline(innerTimeline,{pin:inner,source,distance:600,snap:0.5,snapDelay:0.03,snapDuration:0.1});
  window.fixture={pin,source,inner,link,innerLink,controller,value,originalStyle,
    state:()=>({x:value.x,progress:link.progress,snapping:link.snapping,pinTop:pin.getBoundingClientRect().top,inner:innerValue.x,
      innerTop:inner.getBoundingClientRect().top-source.getBoundingClientRect().top-source.clientTop}),
    refresh:()=>link.refresh(),
    stop:()=>controller.abort(),
  };
  window.ready=true;
</script>
</html>
