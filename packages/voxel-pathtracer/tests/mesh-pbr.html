<!doctype html><html><meta charset="utf-8"><title>Mesh PBR correctness</title><canvas width="16" height="16"></canvas><script type="module">
import {Engine} from '/packages/core/dist/index.js';
import {engineRuntime} from '/packages/core/dist/extension.js';
import {ComposedVoxelPathTracer} from '/packages/voxel-pathtracer/dist/compose.js';
import {meshPBR,traceSceneFromGLTF} from '/packages/voxel-pathtracer/dist/mesh-pbr.js';
import {loadGLTF} from '/packages/gltf/dist/pbr.js';
import {Animation} from '/packages/animation/dist/index.js';
window.run=async(compat=false)=>{
 if(compat){const {install}=await import('/packages/webgl2-compat/dist/index.js');await install({force:true});}
 const engine=await Engine.create(document.querySelector('canvas'),{backend:'webgpu',camera:{position:[0,0,4],target:[0,0,0]}});
 const device=engineRuntime(engine).gpu,errors=[],messages=[],reports=[],rows=[];
 device.addEventListener('uncapturederror',e=>errors.push(e.error.message));
 const create=device.createShaderModule.bind(device);device.createShaderModule=d=>{const m=create(d);reports.push(m.getCompilationInfo().then(i=>messages.push(...i.messages.filter(v=>v.type==='error').map(v=>v.message))));return m;};
 engine.camera.project=(out,aspect)=>{out.fill(0);out[0]=1/aspect;out[5]=1;out[10]=.01;out[14]=1;out[15]=1;};engine.render();
 const quad=()=>({id:'quad',material:1,positions:new Float32Array([-2,-2,0,2,-2,0,2,2,0,-2,2,0]),indices:new Uint32Array([0,1,2,0,2,3]),uvs:new Float32Array([0,0,1,0,1,1,0,1])});
 const scene=()=>({revision:1,models:[],instances:[],materials:[{id:1,type:'metal',color:[1,1,1]}],meshes:[quad()],pbrMaterials:[{id:1,metallicFactor:0}],environment:{ground:false,skyIntensity:0,sunIntensity:Math.PI,sunAngularSize:0,sunDirection:[0,0,1]}});
 const tex=(data)=>({width:1,height:1,data:new Uint8Array(data)});
 const render=async(s,samples=4)=>{
  const t=await ComposedVoxelPathTracer.create(engine,{scene:s,features:[meshPBR()],denoise:false,maxBounces:2});
  try{await t.ready;return await t.renderImage({width:8,height:8,samples,jitter:false,seed:17,aovs:true,signal:AbortSignal.timeout(120000)});}finally{t.dispose();}
 };
 const compare=async(name,left,right)=>{
  const a=await render(left),b=await render(right);let maximumError=0;
  for(let i=0;i<a.color.length;i++)maximumError=Math.max(maximumError,Math.abs(a.color[i]-b.color[i]));
  rows.push({name,maximumError,finite:a.color.every(Number.isFinite)&&b.color.every(Number.isFinite)});
 };
 try{
  const linear=x=>x<=.04045?x/12.92:((x+.055)/1.055)**2.4;
  let a=scene(),b=scene();a.pbrMaterials[0].baseColorTexture=tex([128,64,32,255]);b.pbrMaterials[0].baseColorFactor=[linear(128/255),linear(64/255),linear(32/255),1];
  await compare('base texture equals independently decoded linear factors',a,b);
  a=scene();b=scene();Object.assign(a.pbrMaterials[0],{metallicFactor:.8,roughnessFactor:.6,metallicRoughnessTexture:tex([0,128,64,255])});Object.assign(b.pbrMaterials[0],{metallicFactor:.8*64/255,roughnessFactor:.6*128/255});
  await compare('roughness green and metallic blue equal scalar factors',a,b);
  a=scene();b=scene();a.environment.sunIntensity=b.environment.sunIntensity=0;
  Object.assign(a.pbrMaterials[0],{emissiveFactor:[2,1,3],emissiveStrength:4,emissiveTexture:tex([128,255,0,255])});Object.assign(b.pbrMaterials[0],{emissiveFactor:[8*linear(128/255),4,0]});
  await compare('emissive texture equals independent radiance factors',a,b);
  a=scene();b=scene();Object.assign(a.pbrMaterials[0],{alphaMode:'MASK',alphaCutoff:.5,baseColorTexture:tex([255,255,255,127])});b.meshes=[];
  await compare('alpha cutout equals empty geometry',a,b);
  a=scene();b=scene();Object.assign(a.pbrMaterials[0],{alphaMode:'BLEND',baseColorFactor:[1,1,1,0]});b.meshes=[];
  await compare('alpha blend coverage 0 equals empty geometry',a,b);
  a=scene();b=scene();Object.assign(a.pbrMaterials[0],{alphaMode:'BLEND',baseColorTexture:tex([255,255,255,255])});b.pbrMaterials[0].baseColorTexture=tex([255,255,255,255]);
  await compare('alpha blend coverage 1 equals opaque',a,b);
  {a=scene();b=scene();Object.assign(a.pbrMaterials[0],{alphaMode:'BLEND',baseColorFactor:[1,1,1,.25]});
   const blend=await render(a,256),opaque=await render(b,16),mean=im=>{let s=0;for(let i=0;i<im.color.length;i+=4)s+=im.color[i]+im.color[i+1]+im.color[i+2];return s;};
   const ratio=mean(blend)/mean(opaque);rows.push({name:'alpha blend 0.25 coverage passes three quarters of the rays',ratio,ratioError:Math.abs(ratio-.25)/.25,finite:blend.color.every(Number.isFinite)});}
  a=scene();b=scene();a.pbrMaterials[0].normalTexture=tex([255,128,255,255]);const length=Math.hypot(1,1/255,1),n=[1/length,(1/255)/length,1/length];b.meshes[0].normals=new Float32Array([...n,...n,...n,...n]);
  await compare('normal texture equals independent vertex normals',a,b);
  const model=await loadGLTF(engine,'/packages/gltf/test/fixtures/metadata/Box.gltf',{signal:AbortSignal.timeout(120000)});
  engine.render();const gltf=await traceSceneFromGLTF(model,{signal:AbortSignal.timeout(120000)});model.dispose();
  gltf.environment=scene().environment;const im=await render(gltf);
  rows.push({name:'licensed Khronos metadata Box snapshot survives model disposal',finite:im.color.every(Number.isFinite),triangles:gltf.meshes.reduce((n,m)=>n+m.indices.length/3,0),drawn:im.instance.some(id=>id<=-4)});
  {// A skinned glTF (Khronos Fox, CC BY 4.0) posed by Animation: each pose's snapshot carries the deformed vertices,
   // setScene swaps it atomically, and returning to a pose gives that pose's image again.
   const fox=await loadGLTF(engine,'/examples/assets/khronos/Fox/Fox.glb',{signal:AbortSignal.timeout(120000)}),animation=Animation.attach(fox);
   animation.playing=false;const clip=animation.clips[0],poses=[];
   for(const part of [.2,.7]){animation.seek(clip.duration*part);engine.render({culling:false});
    const s=await traceSceneFromGLTF(fox,{signal:AbortSignal.timeout(120000)});
    s.environment={skyColor:[1,1,1],skyIntensity:1,ground:false,sunIntensity:0};poses.push(s);}
   const geometry=await fox.readPickingGeometry();animation.dispose?.();fox.dispose();
   let moved=0;for(let i=0;i<poses[0].meshes[0].positions.length;i++)moved=Math.max(moved,Math.abs(poses[0].meshes[0].positions[i]-poses[1].meshes[0].positions[i]));
   const pose=geometry[0].vertices,posed=poses[1].meshes[0].positions;let snapshotError=0;
   for(let i=0;i<posed.length/3;i++)for(let k=0;k<3;k++)snapshotError=Math.max(snapshotError,Math.abs(posed[i*3+k]-pose[i*20+k]));
   const at=poses[0].meshInstances[0].transform,box=[0,1,2].map(k=>{let lo=Infinity,hi=-Infinity;const p=poses[0].meshes[0].positions;for(let i=k;i<p.length;i+=3){lo=Math.min(lo,p[i]);hi=Math.max(hi,p[i]);}return [lo,hi];});
   const c=box.map(([lo,hi])=>(lo+hi)/2),size=Math.max(...box.map(([lo,hi])=>hi-lo))*Math.hypot(at[0],at[1],at[2]);
   const centre=[0,1,2].map(k=>at[k]*c[0]+at[4+k]*c[1]+at[8+k]*c[2]+at[12+k]);
   const t=await ComposedVoxelPathTracer.create(engine,{scene:poses[0],features:[meshPBR()],denoise:false,maxBounces:1});
   const ortho=engine.camera.project;engine.camera.project=undefined;engine.camera.far=size*10;engine.camera.near=size/1000;
   try{await t.ready;engine.camera.position=[centre[0]+size*.8,centre[1]+size*.3,centre[2]+size*.8];engine.camera.target=centre;
    const shot=()=>t.renderImage({width:8,height:8,samples:4,jitter:false,seed:17,aovs:true,signal:AbortSignal.timeout(120000)});
    const a=await shot();await t.setScene(poses[1],{signal:AbortSignal.timeout(120000)});const b=await shot();
    await t.setScene(poses[0],{signal:AbortSignal.timeout(120000)});const again=await shot();
    let differs=0,repeat=0;for(let i=0;i<a.color.length;i++){differs=Math.max(differs,Math.abs(a.color[i]-b.color[i]));repeat=Math.max(repeat,Math.abs(a.color[i]-again.color[i]));}
    rows.push({name:'skinned glTF poses trace their deformed vertices and swap atomically',moved,snapshotError,differs,repeat,
     drawn:a.instance.some(id=>id<=-4),finite:[a,b,again].every(im=>im.color.every(Number.isFinite))});
   }finally{t.dispose();engine.camera.project=ortho;}}
  await Promise.all(reports);return {rows,errors,messages};
 }finally{engine.dispose();}
};window.ready=true;
</script></html>
