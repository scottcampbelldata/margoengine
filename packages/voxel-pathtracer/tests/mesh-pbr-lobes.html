<!doctype html><html><meta charset="utf-8"><title>Mesh PBR extension lobes</title><canvas width="16" height="16"></canvas><script type="module">
import {Engine} from '/packages/core/dist/index.js';
import {engineRuntime} from '/packages/core/dist/extension.js';
import {ComposedVoxelPathTracer} from '/packages/voxel-pathtracer/dist/compose.js';
import {meshPBR,traceSceneFromGLTF} from '/packages/voxel-pathtracer/dist/mesh-pbr.js';
import {loadGLTF} from '/packages/gltf-pro/dist/index.js';
window.run=async(compat=false)=>{
 if(compat){const {install}=await import('/packages/webgl2-compat/dist/index.js');await install({force:true});}
 const engine=await Engine.create(document.querySelector('canvas'),{backend:'webgpu',camera:{position:[0,0,4],target:[0,0,0]}});
 const device=engineRuntime(engine).gpu,errors=[],messages=[],reports=[],rows=[];
 device.addEventListener('uncapturederror',e=>errors.push(e.error.message));
 const create=device.createShaderModule.bind(device);device.createShaderModule=d=>{const m=create(d);reports.push(m.getCompilationInfo().then(i=>messages.push(...i.messages.filter(v=>v.type==='error').map(v=>v.message))));return m;};
 engine.camera.project=(out,aspect)=>{out.fill(0);out[0]=1/aspect;out[5]=1;out[10]=.01;out[14]=1;out[15]=1;};engine.render();
 const quad=()=>({id:'quad',material:1,positions:new Float32Array([-2,-2,0,2,-2,0,2,2,0,-2,2,0]),indices:new Uint32Array([0,1,2,0,2,3]),uvs:new Float32Array([0,0,1,0,1,1,0,1])});
 const scene=()=>({revision:1,models:[],instances:[],materials:[{id:1,type:'metal',color:[1,1,1]}],meshes:[quad()],pbrMaterials:[{id:1,metallicFactor:0}],environment:{ground:false,skyIntensity:0,sunIntensity:Math.PI,sunAngularSize:0,sunDirection:[0,0,1]}});
 const tex=(data)=>({width:1,height:1,data:new Uint8Array(data)});
 const render=async(s)=>{
  console.log('lobes phase create');const t=await ComposedVoxelPathTracer.create(engine,{scene:s,features:[meshPBR()],denoise:false,maxBounces:2});
  try{console.log('lobes phase ready');await t.ready;console.log('lobes phase image');return await t.renderImage({width:8,height:8,samples:4,jitter:false,seed:17,aovs:true,signal:AbortSignal.timeout(120000)});}finally{t.dispose();}
 };
 const compare=async(name,left,right)=>{
  const a=await render(left),b=await render(right);let maximumError=0;
  for(let i=0;i<a.color.length;i++)maximumError=Math.max(maximumError,Math.abs(a.color[i]-b.color[i]));
  rows.push({name,maximumError,finite:a.color.every(Number.isFinite)&&b.color.every(Number.isFinite)});
 };
 try{
  const linear=x=>x<=.04045?x/12.92:((x+.055)/1.055)**2.4;
  let a=scene(),b=scene();Object.assign(a.pbrMaterials[0],{clearcoatFactor:.8,clearcoatRoughnessFactor:.7,clearcoatTexture:tex([128,255,255,255]),clearcoatRoughnessTexture:tex([255,64,255,255])});Object.assign(b.pbrMaterials[0],{clearcoatFactor:.8*128/255,clearcoatRoughnessFactor:.7*64/255});await compare('clearcoat red intensity and green roughness match flat factors',a,b);
  a=scene();b=scene();Object.assign(a.pbrMaterials[0],{sheenColorFactor:[.8,.6,.4],sheenRoughnessFactor:.7,sheenColorTexture:tex([128,255,64,255]),sheenRoughnessTexture:tex([255,255,255,128])});Object.assign(b.pbrMaterials[0],{sheenColorFactor:[.8*linear(128/255),.6,.4*linear(64/255)],sheenRoughnessFactor:.7*128/255});await compare('sheen sRGB color and alpha roughness match flat factors',a,b);
  a=scene();b=scene();Object.assign(a.pbrMaterials[0],{specularFactor:.7,specularColorFactor:[2,3,4],specularTexture:tex([255,255,255,128]),specularColorTexture:tex([128,255,64,255])});Object.assign(b.pbrMaterials[0],{specularFactor:.7*128/255,specularColorFactor:[2*linear(128/255),3,4*linear(64/255)]});await compare('specular alpha strength and sRGB F0 color match flat factors',a,b);
  a=scene();b=scene();Object.assign(a.pbrMaterials[0],{iridescenceFactor:.9,iridescenceIor:1.4,iridescenceThicknessMaximum:600,iridescenceTexture:tex([128,255,255,255]),iridescenceThicknessTexture:tex([255,64,255,255])});Object.assign(b.pbrMaterials[0],{iridescenceFactor:.9*128/255,iridescenceIor:1.4,iridescenceThicknessMaximum:100+500*64/255});await compare('iridescence red blend and green thickness match flat factors',a,b);
  a=scene();b=scene();a.environment.sunIntensity=b.environment.sunIntensity=0;Object.assign(a.pbrMaterials[0],{emissiveFactor:[2,4,8],clearcoatFactor:1});b.pbrMaterials[0].emissiveFactor=[2*.96,4*.96,8*.96];await compare('clearcoat attenuates emission with the independently known normal-incidence Fresnel',a,b);
  const model=await loadGLTF(engine,'/packages/gltf-pro/tests/fixtures/metadata/Box.gltf',{signal:AbortSignal.timeout(120000)});
  model.asset.doc.materials[0].extensions={KHR_materials_clearcoat:{clearcoatFactor:.7,clearcoatRoughnessFactor:.3},KHR_materials_sheen:{sheenColorFactor:[.3,.1,.05],sheenRoughnessFactor:.5},KHR_materials_specular:{specularFactor:.7,specularColorFactor:[2,1,1]},KHR_materials_iridescence:{iridescenceFactor:.6,iridescenceThicknessMaximum:450}};engine.render();const gltf=await traceSceneFromGLTF(model,{signal:AbortSignal.timeout(120000)});model.dispose();
  gltf.environment=scene().environment;const im=await render(gltf);
  rows.push({name:'licensed Khronos Box snapshot traces all four extension records',finite:im.color.every(Number.isFinite),triangles:gltf.meshes.reduce((n,m)=>n+m.indices.length/3,0),drawn:im.instance.some(id=>id<=-4)});
  await Promise.all(reports);return {rows,errors,messages};
 }finally{engine.dispose();}
};window.ready=true;
</script></html>
