<!doctype html><html><meta charset="utf-8"><title>Engine meshes traced</title><script type="module">
import {Engine,PbrMaterial,box} from '/packages/core/dist/index.js';
import {engineRuntime} from '/packages/core/dist/extension.js';
import {createHeadlessCanvas,installGPU,readPixels} from '/packages/headless/dist/index.js';
import {ComposedVoxelPathTracer} from '/packages/voxel-pathtracer/dist/compose.js';
import {meshPBR} from '/packages/voxel-pathtracer/dist/mesh-pbr.js';
import {traceSceneFromEngine} from '/packages/voxel-pathtracer/dist/from-engine.js';
// The same core meshes drawn by the raster renderer and traced through traceSceneFromEngine: their silhouettes must
// agree (intersection over union), so placements, scales, rotations and shared geometry carry over.
window.run=async(compat=false)=>{
 if(compat){const {install}=await import('/packages/webgl2-compat/dist/index.js');await install({force:true});}
 const W=128,H=96;installGPU({gpu:navigator.gpu});const canvas=createHeadlessCanvas({width:W,height:H});
 const engine=await Engine.create(canvas,{backend:'webgpu',exactSize:true,camera:{position:[2.2,2.6,4.6],target:[0,0.4,0],fov:45}});
 engine.scene.background='#000000';
 const errors=[];const device=engineRuntime(engine).gpu;device.addEventListener('uncapturederror',e=>errors.push(e.error.message));
 const white=new PbrMaterial({color:[0.9,0.9,0.9],roughness:0.6}),metal=new PbrMaterial({color:[0.8,0.6,0.2],metalness:1,roughness:0.3});
 const cube=box(1,1,1),slab=box(3,0.25,2);
 const make=(g,m)=>engine.createMesh().setGeometry(g).setMaterial(m);
 const a=make(cube,white).setPosition([-1.5,0.5,0]).setRotation([0,0.6,0]);
 const b=make(cube,metal).setPosition([1.4,0.9,-0.5]).setScale([0.8,1.8,0.8]).setRotation([0.3,0,0.2]);
 const c=make(cube,white).setPosition([0.2,0.4,1.6]).setRotation([0,-0.4,0]).setScale([0.6,0.6,0.6]);
 const floor=make(slab,white).setPosition([0,-0.2,0]);
 const hidden=make(cube,white).setPosition([0,2,0]);hidden.visible=false;
 engine.render();
 const raster=await readPixels(engine,{signal:AbortSignal.timeout(60000)});
 const scene=traceSceneFromEngine(engine,{base:{revision:1,models:[],instances:[],materials:[],environment:{ground:false,skyIntensity:0,sunIntensity:3,sunDirection:[0.4,0.8,0.3]}}});
 const tracer=await ComposedVoxelPathTracer.create(engine,{scene,features:[meshPBR()],denoise:false,signal:AbortSignal.timeout(120000)});
 try{
  await tracer.ready;
  const image=await tracer.renderImage({width:W,height:H,samples:4,jitter:false,aovs:true,signal:AbortSignal.timeout(120000)});
  let both=0,either=0,rasterOnly=0,traceOnly=0;
  for(let i=0;i<W*H;i++){
   const r=raster.data[i*4]+raster.data[i*4+1]+raster.data[i*4+2]>0,t=image.instance[i]<=-4;
   if(r&&t)both++;if(r||t)either++;if(r&&!t)rasterOnly++;if(t&&!r)traceOnly++;
  }
  return {errors,iou:both/either,covered:both,rasterOnly,traceOnly,meshes:scene.meshes.length,instances:scene.meshInstances.length,materials:scene.pbrMaterials.length};
 }finally{tracer.dispose();engine.dispose();}
};
// A drawn Terrain with a hole against the same heights traced through TerrainQuery.triangles: the silhouettes (outline
// and the hole's rim) must agree, so the terrain's placement, scale, offset and holes carry over.
window.runTerrain=async(compat=false)=>{
 if(compat){const {install}=await import('/packages/webgl2-compat/dist/index.js');await install({force:true});}
 const {Terrain}=await import('/packages/terrain/dist/index.js'),{TerrainQuery}=await import('/packages/terrain/dist/query.js'),{TerrainHoles}=await import('/packages/terrain/dist/holes.js');
 const W=128,H=96;installGPU({gpu:navigator.gpu});const canvas=createHeadlessCanvas({width:W,height:H});
 const engine=await Engine.create(canvas,{backend:'webgpu',exactSize:true,camera:{position:[1,11,13],target:[0,0,0],fov:50,near:0.1,far:200}});
 engine.scene.background='#000000';
 const errors=[];const device=engineRuntime(engine).gpu;device.addEventListener('uncapturederror',e=>errors.push(e.error.message));
 const n=33,heights=new Float32Array(n*n);
 for(let z=0;z<n;z++)for(let x=0;x<n;x++)heights[z*n+x]=Math.sin(x*0.35)*Math.cos(z*0.27)+0.04*x;
 const options={origin:[-8,-6],size:[16,12],heightScale:1.5,heightOffset:0.5,cellSize:0.5};
 const holes=new TerrainHoles(options,n-1).circle(2.5,1,2.2);
 const terrain=Terrain.attach(engine,{...options,layers:Array.from({length:4},()=>({height:[-1e5,1e5],slope:[0,1],scale:1})),textures:(gpu)=>{
  const heightmap=gpu.createTexture({size:[n,n],format:'r32float',usage:6});gpu.queue.writeTexture({texture:heightmap},heights,{bytesPerRow:n*4},[n,n]);
  const layers=gpu.createTexture({size:[1,1,4],format:'rgba8unorm-srgb',usage:6});gpu.queue.writeTexture({texture:layers},new Uint8Array(16).fill(170),{bytesPerRow:4,rowsPerImage:1},[1,1,4]);
  return {heightmap,layers,holes:holes.texture(gpu)};}});
 engine.render({delta:1/60});await device.queue.onSubmittedWorkDone();engine.render({delta:1/60});
 const raster=await readPixels(engine,{signal:AbortSignal.timeout(60000)});
 const query=new TerrainQuery(heights,n,n,{...options,holes});
 const scene=traceSceneFromEngine(engine,{terrain:[{query}],base:{revision:1,models:[],instances:[],materials:[],environment:{ground:false,skyIntensity:0,sunIntensity:3,sunDirection:[0.4,0.8,0.3]}}});
 const tracer=await ComposedVoxelPathTracer.create(engine,{scene,features:[meshPBR()],denoise:false,signal:AbortSignal.timeout(120000)});
 try{
  await tracer.ready;
  const image=await tracer.renderImage({width:W,height:H,samples:4,jitter:false,aovs:true,signal:AbortSignal.timeout(120000)});
  let both=0,either=0,rasterOnly=0,traceOnly=0;
  for(let i=0;i<W*H;i++){
   const r=raster.data[i*4]+raster.data[i*4+1]+raster.data[i*4+2]>0,t=image.instance[i]<=-4;
   if(r&&t)both++;if(r||t)either++;if(r&&!t)rasterOnly++;if(t&&!r)traceOnly++;
  }
  return {errors,iou:both/either,covered:both,rasterOnly,traceOnly,meshes:scene.meshes.length,triangles:scene.meshes[0].indices.length/3};
 }finally{tracer.dispose();terrain.dispose();engine.dispose();}
};
// A GPU Scatter on sloped ground, aligned to it, read back through readScatter and traced: its drawn and traced
// silhouettes must agree, so the instance transforms (position, scale, yaw, ground tilt) match the vertex stage.
window.runScatter=async(compat=false)=>{
 if(compat){const {install}=await import('/packages/webgl2-compat/dist/index.js');await install({force:true});}
 const {Scatter}=await import('/packages/scatter/dist/index.js'),{readScatter}=await import('/packages/scatter/dist/read.js');
 const W=128,H=96;installGPU({gpu:navigator.gpu});const canvas=createHeadlessCanvas({width:W,height:H});
 const engine=await Engine.create(canvas,{backend:'webgpu',exactSize:true,camera:{position:[0,7,9],target:[0,0,0],fov:50,near:0.1,far:200}});
 engine.scene.background='#000000';
 const errors=[];const device=engineRuntime(engine).gpu;device.addEventListener('uncapturederror',e=>errors.push(e.error.message));
 const n=64,heights=new Float32Array(n*n);
 for(let z=0;z<n;z++)for(let x=0;x<n;x++)heights[z*n+x]=0.8*Math.sin(x*0.15)+0.5*Math.cos(z*0.12);
 let heightmap;
 const scatter=Scatter.attach(engine,box(0.3,1.6,0.6),{count:40,area:[10,8],scale:[0.6,1.2],lod:[30,40,50],alignToGround:1,seed:7,color:[0.9,0.8,0.6],
  heightmap:()=>{if(!heightmap){heightmap=device.createTexture({size:[n,n],format:'r32float',usage:6});device.queue.writeTexture({texture:heightmap},heights,{bytesPerRow:n*4},[n,n]);}return heightmap;}});
 engine.render({delta:1/60});await device.queue.onSubmittedWorkDone();engine.render({delta:1/60});
 const raster=await readPixels(engine,{signal:AbortSignal.timeout(60000)});
 const read=await readScatter(engine,scatter,{signal:AbortSignal.timeout(60000)});
 const scene=traceSceneFromEngine(engine,{scatter:[read],base:{revision:1,models:[],instances:[],materials:[],environment:{ground:false,skyIntensity:0,sunIntensity:3,sunDirection:[0.4,0.8,0.3]}}});
 const tracer=await ComposedVoxelPathTracer.create(engine,{scene,features:[meshPBR()],denoise:false,signal:AbortSignal.timeout(120000)});
 try{
  await tracer.ready;
  const image=await tracer.renderImage({width:W,height:H,samples:4,jitter:false,aovs:true,signal:AbortSignal.timeout(120000)});
  let both=0,either=0,rasterOnly=0,traceOnly=0;
  for(let i=0;i<W*H;i++){
   const r=raster.data[i*4]+raster.data[i*4+1]+raster.data[i*4+2]>0,t=image.instance[i]<=-4;
   if(r&&t)both++;if(r||t)either++;if(r&&!t)rasterOnly++;if(t&&!r)traceOnly++;
  }
  // Tilt: the largest sideways lean of an instance's up axis (column 1's x and z over its length).
  let tilt=0;for(const r of read.rings)for(let k=0;k<r.transforms.length;k+=16){const t=r.transforms;tilt=Math.max(tilt,Math.hypot(t[k+4],t[k+6])/Math.hypot(t[k+4],t[k+5],t[k+6]));}
  // The same placement with the first LOD distance through the middle of the field: instances in the fade band are
  // drawn in two rings (distinct ring meshes turn the cross-fade on), and the readback keeps each once.
  const split=Scatter.attach(engine,[0,1,2].map(()=>box(0.3,1.6,0.6)),{count:40,area:[10,8],scale:[0.6,1.2],lod:[11.4,40,50],lodFade:3,alignToGround:1,seed:7,color:[0.9,0.8,0.6],heightmap:()=>heightmap});
  engine.render({delta:1/60});await device.queue.onSubmittedWorkDone();
  const fade=await readScatter(engine,split,{signal:AbortSignal.timeout(60000)});
  const copy=device.createBuffer({size:60,usage:9}),enc=device.createCommandEncoder();enc.copyBufferToBuffer(split.velocityParts().cull.commands,0,copy,0,60);device.queue.submit([enc.finish()]);
  await copy.mapAsync(1);const raw=new Uint32Array(copy.getMappedRange().slice(0));copy.destroy();split.dispose();
  const drawn=raw[1]+raw[6]+raw[11];
  return {errors,tilt,drawn,fadeRings:fade.rings.map(r=>r.transforms.length/16),iou:both/either,covered:both,rasterOnly,traceOnly,rings:read.rings.map(r=>r.transforms.length/16),meshes:scene.meshes.length,color:read.color};
 }finally{tracer.dispose();scatter.dispose();heightmap?.destroy();engine.dispose();}
};
// FG-17-WIND: a windy field read back with pose: true. The traced posed field must match the drawn, bent one; the
// rigid read must not (the bend is real); each read's shutter-open pose must be the frame before's pose bit for bit;
// and the pose kernel must build with the scatter's own patches (grass blades, trampling).
window.runWind=async(compat=false)=>{
 if(compat){const {install}=await import('/packages/webgl2-compat/dist/index.js');await install({force:true});}
 const {Scatter}=await import('/packages/scatter/dist/index.js'),{GrassScatter}=await import('/packages/scatter/dist/grass.js');
 const {TrampledScatter}=await import('/packages/scatter/dist/interact.js'),{readScatter}=await import('/packages/scatter/dist/read.js');
 const W=128,H=96;installGPU({gpu:navigator.gpu});const canvas=createHeadlessCanvas({width:W,height:H});
 const engine=await Engine.create(canvas,{backend:'webgpu',exactSize:true,camera:{position:[0,5,9],target:[0,0.8,0],fov:50,near:0.1,far:200}});
 engine.scene.background='#000000';
 const errors=[];const device=engineRuntime(engine).gpu;device.addEventListener('uncapturederror',e=>errors.push(e.error.message));
 const signal=()=>AbortSignal.timeout(60000);
 const field=Scatter.attach(engine,box(0.25,2,0.25),{count:30,area:[8,6],scale:[0.8,1.2],lod:[30,40,50],seed:4,color:[0.9,0.8,0.6],wind:[1,0.2,1]});
 const frame=async(delta)=>{engine.render({delta});await device.queue.onSubmittedWorkDone();};
 await frame(0.4);
 const start=await readScatter(engine,field,{pose:true,signal:signal()});
 await frame(0.4);await frame(0.4);
 const before=await readScatter(engine,field,{pose:true,signal:signal()});
 await frame(0.3);
 const raster=await readPixels(engine,{signal:signal()});
 const posed=await readScatter(engine,field,{pose:true,signal:signal()}),rigid=await readScatter(engine,field,{signal:signal()});
 // Instances match across frames by their root (the cull's slot order may differ); vertices compare bit for bit.
 const byRoot=(read)=>{const m=new Map(),r=read.rings[0],v=r.geometry.vertices.length/6;for(let k=0;k<r.transforms.length/16;k++)m.set(r.transforms[k*16+12]+','+r.transforms[k*16+14],k*v*3);return {m,v};};
 const shutterOpen=(now,then)=>{const a=byRoot(now),b=byRoot(then);let worst=0,matched=0,moved=0;
  for(const [key,at] of a.m){const bt=b.m.get(key);if(bt===undefined)continue;matched++;
   for(let i=0;i<a.v*3;i++){worst=Math.max(worst,Math.abs(now.rings[0].posed.previousPositions[at+i]-then.rings[0].posed.positions[bt+i]));moved=Math.max(moved,Math.abs(now.rings[0].posed.positions[at+i]-then.rings[0].posed.positions[bt+i]));}}
  return {worst,matched,moved};};
 const open=shutterOpen(posed,before),first=start.rings[0].posed;
 let still=0;for(let i=0;i<first.positions.length;i++)still=Math.max(still,Math.abs(first.positions[i]-first.previousPositions[i]));
 const env={ground:false,skyIntensity:0,sunIntensity:3,sunDirection:[0.4,0.8,0.3]};
 const iou=async(read)=>{
  const scene=traceSceneFromEngine(engine,{scatter:[read],base:{revision:1,models:[],instances:[],materials:[],environment:env}});
  const tracer=await ComposedVoxelPathTracer.create(engine,{scene,features:[meshPBR()],denoise:false,signal:AbortSignal.timeout(120000)});
  try{await tracer.ready;const image=await tracer.renderImage({width:W,height:H,samples:4,jitter:false,aovs:true,signal:AbortSignal.timeout(120000)});
   let both=0,either=0;for(let i=0;i<W*H;i++){const r=raster.data[i*4]+raster.data[i*4+1]+raster.data[i*4+2]>0,t=image.instance[i]<=-4;if(r&&t)both++;if(r||t)either++;}
   return {iou:both/either,covered:both,meshes:scene.meshes.length,instances:scene.meshInstances.length};}finally{tracer.dispose();}
 };
 const tracedPosed=await iou(posed),tracedRigid=await iou(rigid);
 const r0=posed.rings[0],verts=r0.geometry.vertices.length/6,count=r0.transforms.length/16;
 field.dispose();
 // The pose kernel with the scatter's own patches: grass blades (the strip built in the vertex stage) and trampling.
 const grass=GrassScatter.attach(engine,{count:200,area:[6,6],lod:[10,20,30],lodFade:0,seed:5,wind:[1,0.3,0.8]});
 await frame(0.2);await frame(0.2);
 const blades=await readScatter(engine,grass,{pose:true,signal:signal()});grass.dispose();
 const g=blades.rings[0],gv=g.geometry.vertices.length/6,gn=g.transforms.length/16;
 let finite=true,unit=0,top=0;
 for(let i=0;i<g.posed.positions.length;i++)finite&&=Number.isFinite(g.posed.positions[i])&&Number.isFinite(g.posed.previousPositions[i]);
 for(let i=0;i<g.posed.normals.length;i+=3)unit=Math.max(unit,Math.abs(Math.hypot(g.posed.normals[i],g.posed.normals[i+1],g.posed.normals[i+2])-1));
 for(let i=1;i<g.posed.positions.length;i+=3)top=Math.max(top,g.posed.positions[i]);
 const trampled=TrampledScatter.attach(engine,box(0.06,1,0.02),{count:100,area:[6,6],lod:[10,20,30],seed:2,wind:[0.4,1,0.5]});
 await frame(0.2);await frame(0.2);
 const trodden=await readScatter(engine,trampled,{pose:true,signal:signal()});trampled.dispose();
 const t0=trodden.rings[0];
 engine.dispose();
 return {errors,posed:tracedPosed,rigid:tracedRigid,open,still,count,positions:r0.posed.positions.length,verts,indices:r0.posed.indices.length,meshIndices:r0.geometry.indices.length,
  rigidPosed:rigid.rings[0].posed===undefined,grass:{count:gn,positions:g.posed.positions.length,verts:gv,finite,unit,top},
  trampled:{count:t0.transforms.length/16,positions:t0.posed?.positions.length??0,verts:t0.geometry.vertices.length/6}};
};window.ready=true;
</script></html>
