<!doctype html><html><head><meta charset="utf-8"/><title>GPU liquid check</title><style>body{margin:0}canvas{display:block;width:320px;height:240px}</style></head><body>
<script type="module">
import { Engine } from '/packages/core/dist/index.js';
import {
  GPULiquid,
  bakeLiquidMesh,
  createLiquidState,
  liquidStateHash,
  resolveLiquidParams,
  stepLiquidCPU,
  LIQUID_PARTICLE_FLOATS as F,
} from '/packages/water/dist/liquid.js';
import { isCompatDevice } from '/packages/webgl2-compat/dist/device.js';

const W = 320, H = 240;
window.check = async () => {
  const c = document.createElement('canvas');
  c.width = W;
  c.height = H;
  document.body.append(c);
  const engine = await Engine.create(c, {
    backend: 'webgpu',
    camera: { position: [0, 0.6, 2.2], target: [0, 0.35, 0], near: 0.05, far: 50 },
  });
  engine.stop();
  engine.scene.background = '#0a101a';
  const errors = [];
  engine.gpu.addEventListener('uncapturederror', (e) => errors.push(e.error.message));

  const compat = isCompatDevice(engine.gpu);
  // 65,536 particles on WebGPU (docs/physics-parity-bar.md P13: tens of thousands at interactive rates); the CPU twin
  // steps 1,024 on the WebGL2 layer.
  const count = compat ? 1024 : 65536;
  // A cube of half size 0.08 m as a triangle mesh, baked to a distance field.
  const corners = [];
  for (let i = 0; i < 8; i++) corners.push(i & 1 ? 0.08 : -0.08, i & 2 ? 0.08 : -0.08, i & 4 ? 0.08 : -0.08);
  const faces = [[0, 2, 6, 4], [1, 5, 7, 3], [0, 4, 5, 1], [2, 3, 7, 6], [0, 1, 3, 2], [4, 6, 7, 5]];
  const cube = bakeLiquidMesh(corners, faces.flatMap(([a, b, c, d]) => [a, b, c, a, c, d]), { resolution: 32 });
  const q = Math.SQRT1_2;
  const options = {
    count,
    seed: 3,
    // A resting layer 0.4 m deep over the whole floor, with a held sphere, capsule (lying along x) and mesh cube in it
    // from the first step.
    fill: { min: [-0.5, 0, -0.5], max: [0.5, 0.4, 0.5] },
    colliders: [
      { shape: 'sphere', position: [0.25, 0.2, 0], radius: 0.1 },
      { shape: 'capsule', position: [-0.22, 0.2, 0.25], radius: 0.07, halfHeight: 0.1, rotation: [0, 0, q, q] },
      { shape: 'mesh', position: [-0.25, 0.2, -0.25], mesh: cube },
    ],
  };
  const liquid = GPULiquid.attach(engine, options);
  const hash = async () => liquidStateHash((await liquid.snapshot()).particles);

  // Determinism: the same 30 frames from the start give the same hash; a snapshot restored repeats the rest exactly.
  for (let k = 0; k < 30; k++) liquid.step(1 / 60);
  const runA = await hash();
  liquid.reset();
  for (let k = 0; k < 15; k++) liquid.step(1 / 60);
  const mid = await liquid.snapshot();
  for (let k = 0; k < 15; k++) liquid.step(1 / 60);
  const runB = await hash();
  liquid.restore(mid);
  for (let k = 0; k < 15; k++) liquid.step(1 / 60);
  const runC = await hash();

  // One frame of the GPU step against its CPU twin from the same start, particles and collider forces.
  liquid.reset();
  liquid.step(1 / 60);
  const gpu = (await liquid.snapshot()).particles;
  const gpuForces = await liquid.readForces();
  const params = resolveLiquidParams(liquid.options, count);
  const twin = createLiquidState(params);
  const substeps = stepLiquidCPU(twin, params, 1 / 60);
  let worstPos = 0, worstVel = 0;
  for (let i = 0; i < count; i++)
    for (let a = 0; a < 3; a++) {
      worstPos = Math.max(worstPos, Math.abs(gpu[i * F + a] - twin.particles[i * F + a]));
      worstVel = Math.max(worstVel, Math.abs(gpu[i * F + 4 + a] - twin.particles[i * F + 4 + a]));
    }
  const twinForceY = (twin.impulses[1] / 1024) * liquid.particleMass * 60;

  // Two seconds of frames: the liquid stays finite and inside the container.
  // The held sphere's force averaged over the last two of three seconds, against Archimedes' rho g V.
  liquid.reset();
  const lifts = [0, 0, 0];
  for (let k = 0; k < 180; k++) {
    liquid.step(1 / 60);
    const f = await liquid.readForces();
    if (k >= 60) for (let i = 0; i < 3; i++) lifts[i] += f[i].force[1] / 120;
  }
  const lift = lifts[0];
  const archimedes = 1000 * 9.81 * (4 / 3) * Math.PI * 0.1 ** 3;
  const late = (await liquid.snapshot()).particles;
  let outside = 0, nonFinite = 0;
  const { boxMin, boxMax } = params;
  for (let i = 0; i < count; i++)
    for (let a = 0; a < 3; a++) {
      const x = late[i * F + a];
      if (!Number.isFinite(x) || !Number.isFinite(late[i * F + 4 + a])) nonFinite++;
      else if (x < boxMin[a] || x > boxMax[a]) outside++;
    }
  const lateForces = await liquid.readForces();

  // The pointer: liquid near it takes on its velocity.
  const near = (data) => {
    let v = 0, n = 0;
    for (let i = 0; i < count; i++) {
      const dx = data[i * F] - 0.3, dy = data[i * F + 1] - 0.3, dz = data[i * F + 2] - 0.3;
      if (dx * dx + dy * dy + dz * dz < 0.01) { v += data[i * F + 6]; n++; }
    }
    return n ? v / n : 0;
  };
  liquid.setPointer({ position: [0.3, 0.3, 0.3], velocity: [0, 0, 2], radius: 0.15, strength: 60 });
  for (let k = 0; k < 6; k++) liquid.step(1 / 60);
  const pointerVz = near((await liquid.snapshot()).particles);
  liquid.setPointer(null);

  // A box of half size 0.1 m and 500 kg/m³ linked as a body (rotation held), dropped from just above the surface: it
  // floats, and its mean draft over the last two seconds against Archimedes' m / (rho A) = 0.1 m.
  liquid.setColliders([]);
  liquid.reset();
  const mass = 500 * 0.2 ** 3;
  const body = {
    position: [0, 0.52, 0],
    rotation: [0, 0, 0, 1],
    linearVelocity: [0, 0, 0],
    angularVelocity: [0, 0, 0],
    taken: 0,
    applyImpulse(j) {
      for (let a = 0; a < 3; a++) this.linearVelocity[a] += j[a] / mass;
      this.taken += j[1];
    },
    applyTorqueImpulse() {},
  };
  const link = liquid.link(body, { shape: 'box', halfExtents: [0.1, 0.1, 0.1] });
  let centre = 0, low = Infinity, high = -Infinity;
  for (let k = 0; k < 240; k++) {
    liquid.step(1 / 60);
    await liquid.readForces();
    body.linearVelocity[1] -= 9.81 / 60;
    for (let a = 0; a < 3; a++) body.position[a] += body.linearVelocity[a] / 60;
    if (k >= 120) {
      centre += body.position[1] / 120;
      low = Math.min(low, body.position[1]);
      high = Math.max(high, body.position[1]);
    }
  }
  // The free surface away from the box: the highest particle in each 5 cm column of the far corners, plus half a spacing.
  const floatState = (await liquid.snapshot()).particles;
  const tops = new Map();
  for (let i = 0; i < count; i++) {
    const x = floatState[i * F], y = floatState[i * F + 1], z = floatState[i * F + 2];
    if (Math.abs(x) < 0.3 || Math.abs(z) < 0.3) continue;
    const key = Math.floor(x / 0.05) * 100 + Math.floor(z / 0.05);
    tops.set(key, Math.max(tops.get(key) ?? -Infinity, y));
  }
  const level = [...tops.values()].reduce((a, b) => a + b, 0) / tops.size + liquid.spacing / 2;
  const draft = level - (centre - 0.1);
  const linked = liquid.forces.length;
  link.unlink();

  // Surface tension and adhesion: one frame of a cube of liquid against the ceiling, GPU against the twin; then without
  // gravity the cube pulls into a drop with the Laplace pressure 2 sigma / R inside.
  const dropCount = compat ? 4096 : 32768;
  const dropBox = { min: [-0.2, -0.2, -0.2], max: [0.2, 0.2, 0.2] };
  const wet = { count: dropCount, box: dropBox, fill: { min: [-0.1, 0, -0.1], max: [0.1, 0.2, 0.1] }, resolution: compat ? 16 : 32, surfaceTension: 10, adhesion: 15, speedOfSound: 2, surface: false };
  const wetLiquid = GPULiquid.attach(engine, wet);
  wetLiquid.step(1 / 60);
  const wetGpu = (await wetLiquid.snapshot()).particles;
  const wetParams = resolveLiquidParams(wetLiquid.options, dropCount);
  const wetTwin = createLiquidState(wetParams);
  stepLiquidCPU(wetTwin, wetParams, 1 / 60);
  let wetGap = 0;
  for (let i = 0; i < dropCount * F; i++) if (i % F < 3) wetGap = Math.max(wetGap, Math.abs(wetGpu[i] - wetTwin.particles[i]));
  wetLiquid.dispose();
  const dropLiquid = GPULiquid.attach(engine, { ...wet, fill: { min: [-0.1, -0.1, -0.1], max: [0.1, 0.1, 0.1] }, adhesion: 0, gravity: [0, 0, 0], viscosity: 0.006 });
  let dropPressure = 0, dropFrames = 0;
  const dropR = 0.2 * Math.cbrt(3 / (4 * Math.PI));
  for (let k = 0; k < 180; k++) {
    dropLiquid.step(1 / 60);
    if (k < 120) continue;
    const d = (await dropLiquid.snapshot()).particles;
    let sum = 0, n = 0;
    for (let i = 0; i < dropCount; i++) {
      if (Math.hypot(d[i * F], d[i * F + 1], d[i * F + 2]) > dropR / 2) continue;
      const r = Math.min(d[i * F + 3], 3);
      sum += r > 1 ? ((1000 * 4) / 7) * (r ** 7 - 1) : 0;
      n++;
    }
    dropPressure += sum / n;
    dropFrames++;
  }
  dropPressure /= dropFrames;
  const dropCell = dropLiquid.stats.cellSize;
  dropLiquid.dispose();

  const shot = new OffscreenCanvas(W, H);
  const ctx = shot.getContext('2d', { willReadFrequently: true });
  const grab = async (delta = 1 / 60) => {
    engine.render({ delta });
    if (compat) await engine.gpu.queue.onSubmittedWorkDone();
    ctx.drawImage(c, 0, 0);
    return ctx.getImageData(0, 0, W, H).data;
  };
  const nonBg = (px) => {
    let n = 0;
    for (let i = 0; i < px.length; i += 4) if (px[i] > 28 || px[i + 1] > 32 || px[i + 2] > 44) n++;
    return n;
  };
  const diffCount = (a, b) => {
    let n = 0;
    for (let i = 0; i < a.length; i += 4)
      if (Math.abs(a[i] - b[i]) + Math.abs(a[i + 1] - b[i + 1]) + Math.abs(a[i + 2] - b[i + 2]) > 18) n++;
    return n;
  };

  liquid.reset();
  const stepsBefore = liquid.stats.steps;
  const frame1 = await grab(1 / 60);
  for (let k = 0; k < 8; k++) engine.render({ delta: 1 / 60 });
  const frame2 = await grab(1 / 60);
  const frameSteps = liquid.stats.steps - stepsBefore;
  const frameSubsteps = liquid.stats.frameSubsteps;
  liquid.options.paused = true;
  const pausedA = await grab(1 / 60);
  const pausedB = await grab(1 / 60);
  liquid.setDebug({ enabled: true, particles: 'speed', grid: false, container: false, colliders: false });
  const frameSpeed = await grab(0);
  liquid.setDebug({ particles: 'density' });
  const frameDensity = await grab(0);
  liquid.setDebug({ particles: 'off', grid: true, container: true, colliders: true });
  const frameLines = await grab(0);
  const debugDraws = liquid.stats.debugDraws;
  liquid.setDebug({ enabled: false });
  const frameSurface = await grab(0);
  const surfaceBack = liquid.surface.options.enabled !== false;

  const stats = { ...liquid.stats };
  liquid.dispose();
  const frameAfterDispose = await grab(1 / 60);

  // Two liquids, red and a heavier blue, side by side and mixing: one frame against the twin (positions and colours),
  // then the surface draws each side in its own colour.
  const twoCount = compat ? 2048 : 32768;
  const two = {
    count: twoCount,
    seed: 5,
    liquids: [
      { fill: { min: [-0.5, 0, -0.5], max: [0, 0.4, 0.5] }, color: [1, 0.15, 0.1] },
      { fill: { min: [0, 0, -0.5], max: [0.5, 0.4, 0.5] }, color: [0.1, 0.2, 1], density: 2000 },
    ],
    mixing: 5,
  };
  const twoLiquid = GPULiquid.attach(engine, two);
  twoLiquid.step(1 / 60);
  const twoGpu = (await twoLiquid.snapshot()).particles;
  const twoParams = resolveLiquidParams(twoLiquid.options, twoCount);
  const twoTwin = createLiquidState(twoParams);
  stepLiquidCPU(twoTwin, twoParams, 1 / 60);
  let twoGap = 0, colorGap = 0;
  for (let i = 0; i < twoCount * F; i++) {
    const o = i % F, gap = Math.abs(twoGpu[i] - twoTwin.particles[i]);
    if (o < 3) twoGap = Math.max(twoGap, gap);
    else if (o >= 17) colorGap = Math.max(colorGap, gap);
  }
  twoLiquid.options.paused = true;
  // A light background: the colour tints the light through the liquid, as ParticleLiquid's own colour does.
  engine.scene.background = '#d0d0d0';
  const twoFrame = await grab(0);
  let redPixels = 0, bluePixels = 0;
  for (let y = 0; y < H; y++)
    for (let x = 0; x < W; x++) {
      const k = (y * W + x) * 4, r = twoFrame[k], b = twoFrame[k + 2];
      if (r > b + 25 && x < W / 2) redPixels++;
      if (b > r + 25 && x > W / 2) bluePixels++;
    }
  twoLiquid.dispose();

  // An emitter pouring into a tank with a drain on its floor: three frames on the GPU against the twin (the emit pass,
  // the drain marks and the four compaction passes): the same live count, the same particles in the same order.
  const flowOptions = {
    count: compat ? 1024 : 16384,
    capacity: compat ? 2048 : 32768,
    fill: { min: [-0.5, 0, -0.5], max: [0.5, 0.15, 0.5] },
    emitters: [{ position: [0, 0.6, 0], velocity: [0, -2, 0], radius: 0.08 }],
    drains: [{ shape: 'box', position: [0.3, 0.05, 0], halfExtents: [0.1, 0.1, 0.5] }],
    surface: false,
  };
  const flow = GPULiquid.attach(engine, flowOptions);
  for (let k = 0; k < 3; k++) flow.step(1 / 60);
  const flowGpu = await flow.snapshot();
  const flowParams = resolveLiquidParams(flow.options, flowOptions.count);
  const flowTwin = createLiquidState(flowParams);
  for (let k = 0; k < 3; k++) stepLiquidCPU(flowTwin, flowParams, 1 / 60);
  let flowGap = 0;
  for (let i = 0; i < Math.min(flowGpu.live, flowTwin.live) * F; i++)
    if (i % F < 3) flowGap = Math.max(flowGap, Math.abs(flowGpu.particles[i] - flowTwin.particles[i]));
  let flowEmpty = 0;
  for (let i = flowGpu.live; i < flowGpu.count; i++) if (Number.isNaN(flowGpu.particles[i * F])) flowEmpty++;
  const flowLive = [flowGpu.live, flowTwin.live, flowOptions.count, flowGpu.count - flowGpu.live, flowEmpty];
  flow.dispose();
  engine.dispose();

  return {
    compat,
    count,
    errors,
    stats,
    hashes: [runA, runB, runC],
    substeps,
    worstPos,
    worstVel,
    gpuForceY: gpuForces[0]?.force[1],
    twinForceY,
    lateForceY: lateForces[0]?.force[1],
    lift,
    lifts,
    archimedes,
    draft,
    bob: high - low,
    linked,
    spacing: liquid.spacing,
    wetGap,
    dropPressure,
    dropR,
    dropCell,
    outside,
    nonFinite,
    pointerVz,
    frameSteps,
    frameSubsteps,
    litFrame1: nonBg(frame1),
    movedPixels: diffCount(frame1, frame2),
    pausedDiff: diffCount(pausedA, pausedB),
    speedDiff: diffCount(frameSurface, frameSpeed),
    densityDiff: diffCount(frameSpeed, frameDensity),
    linesDiff: diffCount(frameSurface, frameLines),
    debugDraws,
    surfaceBack,
    afterDisposeLit: nonBg(frameAfterDispose),
    twoGap,
    flowGap,
    flowLive,
    colorGap,
    redPixels,
    bluePixels,
  };
};
window.ready = true;
</script></body></html>
