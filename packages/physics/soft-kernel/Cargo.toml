[package]
name = "margoengine-soft-kernel"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
# Cloth contacts, shared with the physics kernel's tests (packages/physics/kernel-common/src/cloth.rs).
margoengine-physics-kernel-common = { path = "../kernel-common" }

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
overflow-checks = false
strip = "symbols"

[profile.test]
opt-level = 2
