[package]
name = "margoengine-wake-fft"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[features]
shared-modes = []

[dependencies]
margoengine-physics-kernel-common = { path = "../kernel-common" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
