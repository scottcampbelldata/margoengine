<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Sliding tissue test</title></head>
<body style="margin:0">
<canvas width="448" height="320" style="display:block;width:448px;height:320px"></canvas>
<script type="module">
  import { Engine, Geometry, PbrMaterial } from '/packages/core/dist/index.js';
  import { Physics } from '../dist/index.js';
  import { createLayeredTissue, TissueSolver } from '../dist/tissue.js';
  import { PhysicsWorld, RigidSolver } from '../dist/world.js';
  import { cells, createLayerFixture, materials } from './coupling/tissue-layers-fixture.js';
  import { createTissueFixture } from './coupling/tissue-fixture.js';

  await Physics.load();
  const canvas = document.querySelector('canvas');
  const engine = await Engine.create(canvas, {
    backend: 'webgpu',
    camera: { position: [1.2, 0.9, 1.65], target: [0.2, 0.14, 0.23], near: 0.1, far: 10 },
  });
  const mesh = engine.createMesh().setMaterial(new PbrMaterial({ color: '#bf7566', roughness: 0.65 }));

  function surface(body) {
    const positions = body.particlePositions();
    const triangles = body.triangles();
    const flat = new Float32Array(3 * triangles.length);
    const normals = new Float32Array(flat.length);
    const indices = new Uint32Array(triangles.length);
    for (let i = 0; i < triangles.length; i++) {
      const source = 3 * triangles[i];
      flat.set(positions.subarray(source, source + 3), 3 * i);
      indices[i] = i;
    }
    for (let i = 0; i < flat.length; i += 9) {
      const u = [0, 1, 2].map((axis) => flat[i + 3 + axis] - flat[i + axis]);
      const v = [0, 1, 2].map((axis) => flat[i + 6 + axis] - flat[i + axis]);
      const n = [u[1] * v[2] - u[2] * v[1], u[2] * v[0] - u[0] * v[2], u[0] * v[1] - u[1] * v[0]];
      const magnitude = Math.hypot(...n);
      const normal = n.map((value) => value / magnitude);
      for (let j = 0; j < 9; j += 3) normals.set(normal, i + j);
    }
    return new Geometry(flat, normals, indices);
  }

  window.renderTissue = async (position) => {
    const { world, tissue, physics } = await createTissueFixture(true, position);
    world.advance(1);
    const reading = await draw(tissue, world, 3);
    physics.dispose();
    return reading;
  };

  window.renderLayers = async (skinModulus) => {
    const { physics, soft, desc } = await createLayerFixture();
    const skin = materials.skin.clone();
    skin.youngsModulus = skinModulus;
    const tissue = createLayeredTissue(soft, desc, { cells, materials: { ...materials, skin } });
    const world = new PhysicsWorld({ rate: { num: 60, den: 1 }, gravity: [0, 0, 0] })
      .add(new RigidSolver(), { physics })
      .add(new TissueSolver(), { soft, bindings: [] });
    tissue.applyParticleImpulse(5, [0, 0, 0.45]);
    world.advance(4);
    const reading = await draw(tissue, world, 5);
    physics.dispose();
    return reading;
  };

  async function draw(tissue, world, apex) {
    mesh.setGeometry(surface(tissue));
    engine.render({ delta: 1 / 60 });
    await engine.gpu.queue.onSubmittedWorkDone();
    return { vertex: tissue.particlePosition(apex), hash: world.hash(), visible: engine.stats.visible };
  }
</script>
</body>
</html>
