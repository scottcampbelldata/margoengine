<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Elastic steel plate buckling</title></head>
<body style="margin:0"><canvas width="480" height="320"></canvas>
<script type="module">
  import { Engine, Geometry, PbrMaterial } from '/packages/core/dist/index.js';
  import { CircularPlateIndentation, CrushSolver, resolvePlateBuckling } from '../dist/crush.js';
  import { Physics } from '../dist/index.js';
  import { PhysicsWorld, RigidSolver } from '../dist/world.js';

  const plate = { length: 0.6, width: 0.3, thickness: 0.003, young: 200e9 };
  const engine = await Engine.create(document.querySelector('canvas'), {
    backend: 'webgpu',
    camera: { position: [0.72, 0.45, 0.48], target: [0.3, 0.14, 0], near: 0.02, far: 5 },
  });
  const panel = engine.createMesh().setMaterial(new PbrMaterial({ color: '#7a91a5', roughness: 0.38 }));
  const columns = 36;
  const rows = 18;
  const points = [];
  const triangles = [];
  for (let y = 0; y <= rows; y++) {
    for (let x = 0; x <= columns; x++) {
      points.push(plate.length * (x / columns), plate.width * (y / rows));
      if (x === columns || y === rows) continue;
      const a = y * (columns + 1) + x;
      const b = a + columns + 1;
      triangles.push(a, a + 1, b + 1, a, b + 1, b);
    }
  }

  async function drawSurface(surface, indices = triangles) {
    panel.setGeometry(new Geometry(surface.positions, surface.normals, indices));
    await engine.render({ delta: 0 });
    await engine.gpu.queue.onSubmittedWorkDone();
  }

  window.drawCrushPlate = async (flat) => {
    const { crest, surface } = resolvePlateBuckling(plate, 0.0014, points);
    if (flat) {
      // Control draw keeps the same in-plane positions and changes only surface shape and normals.
      for (let i = 0; i < surface.positions.length; i += 3) {
        surface.positions[i + 2] = 0;
        surface.normals.set([0, 0, 1], i);
      }
    }
    await drawSurface(surface);
    return { crest, visible: engine.stats.visible, compat: Boolean(globalThis.__margoCompat) };
  };

  await Physics.load();
  const gravity = [0, 0, 0];
  const world = new PhysicsWorld({ rate: { num: 60, den: 1 }, gravity });
  const physics = new Physics(null, { arena: world.arena, gravity });
  const carriage = physics.addBody(null, {
    position: [-0.5, 0, 0],
    colliders: { shape: 'box', halfExtents: [0.2, 0.2, 0.2], mass: 5e6, sensor: true },
  });
  const crush = new CrushSolver();
  const capacity = physics.kernel.capacity;
  world.add(new RigidSolver(), { physics, capacity });
  world.add(crush, { bodyCapacity: capacity, patches: [{
    body: carriage.row, anchor: [0.2, 0, 0], normal: [1, 0, 0], radius: 0.12,
    support: { point: [-0.2, 0, 0] }, response: 'continuous', plate,
    material: { stiffness: 300e6, yieldForce: 80e3, stroke: 0.025 },
  }] });
  world.couple(['rigid', crush.id], 'staggered');
  world.advance(1);
  const initial = world.takeSnapshot();
  window.drawLiveCrushPlate = async (released) => {
    world.restoreSnapshot(initial.bytes);
    carriage.setPosition([-0.3986, 0, 0]);
    world.advance(2);
    if (released) {
      carriage.setPosition([-0.5, 0, 0]);
      carriage.setLinearVelocity([0, 0, 0]);
      world.advance(3);
    }
    const { stroke, buckling } = crush.readPlate(0, points);
    await drawSurface(buckling.surface);
    return { stroke, crest: buckling.crest, hash: world.hash(), visible: engine.stats.visible };
  };

  const circleRadius = 0.1114;
  const circularParams = {
    radius: circleRadius, thickness: 0.001, indenterRadius: 0.025, strength: 497e6, hardening: 0.19,
  };
  const circular = new CircularPlateIndentation(circularParams);
  const radialRest = [0, 0];
  const radialFaces = [];
  const rings = 12;
  const sectors = 32;
  for (let ring = 0; ring < rings; ring++) {
    const radius = circleRadius * ((ring + 1) / rings);
    for (let sector = 0; sector < sectors; sector++) {
      const ang = 2 * Math.PI * sector / sectors;
      radialRest.push(radius * Math.cos(ang), radius * Math.sin(ang));
      const near = 1 + ring * sectors + sector;
      const far = 1 + ring * sectors + ((sector + 1) % sectors);
      if (ring === 0) radialFaces.push(0, near, far);
      else radialFaces.push(near - sectors, near, far, near - sectors, far, far - sectors);
    }
  }

  async function drawCircular(surface) {
    for (let i = 0; i < surface.positions.length; i += 3) {
      surface.positions[i] += 0.3;
      surface.positions[i + 1] += 0.14;
    }
    await drawSurface(surface, radialFaces);
  }

  window.drawIndentedPlate = async (flat) => {
    const stroke = flat ? 0 : 0.8 * circular.fractureStroke;
    const { surface, force } = circular.read(stroke, radialRest);
    await drawCircular(surface);
    return { stroke, force, visible: engine.stats.visible, rim: surface.positions.at(-1) };
  };

  const membraneWorld = new PhysicsWorld({ rate: { num: 60, den: 1 }, gravity });
  const membranePhysics = new Physics(null, { arena: membraneWorld.arena, gravity });
  const membrane = membranePhysics.addBody(null, {
    position: [-0.405, 0, 0],
    colliders: { shape: 'box', halfExtents: [0.2, 0.2, 0.2], mass: 400, sensor: true },
  });
  const roundSupport = membranePhysics.addBody(null, {
    position: [-0.175, 0, 0],
    colliders: { shape: 'sphere', radius: 0.025, mass: 600, sensor: true },
  });
  const indentation = new CrushSolver();
  const membraneCapacity = membranePhysics.kernel.capacity;
  membraneWorld.add(new RigidSolver(), { physics: membranePhysics, capacity: membraneCapacity });
  membraneWorld.add(indentation, { bodyCapacity: membraneCapacity, patches: [], indentationPatches: [{
    body: membrane.row, anchor: [0.2, 0, 0], normal: [1, 0, 0], radius: 0.14,
    support: { body: roundSupport.row, point: [-0.025, 0, 0] }, indentation: circularParams,
  }] });
  membraneWorld.couple(['rigid', indentation.id], 'staggered');
  membraneWorld.advance(1);
  const membraneInitial = membraneWorld.takeSnapshot();
  window.drawNativeIndentation = async () => {
    membraneWorld.restoreSnapshot(membraneInitial.bytes);
    membrane.setLinearVelocity([2.6, 0, 0]);
    membraneWorld.advance(5);
    const { surface, stroke, work, fractured } = indentation.readIndentation(0, radialRest);
    await drawCircular(surface);
    return { stroke, work, fractured, hash: membraneWorld.hash(), rim: surface.positions.at(-1) };
  };
</script>
</body>
</html>
