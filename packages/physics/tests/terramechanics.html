<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Terramechanics native replay</title></head>
<body style="margin:0">
  <canvas id="soil" width="640" height="360"></canvas>
  <script type="module">
    import { Physics } from '/packages/physics/dist/index.js';
    import { AirborneParticles } from '/packages/physics/dist/airborne.js';
    import { TerrainBed } from '/packages/physics/dist/earth.js';
    import { ResistiveSoil, soilPatchField, Terramechanics } from '/packages/physics/dist/terramechanics.js';
    import { PhysicsWorld, regionWords, RigidSolver, worldMemory } from '/packages/physics/dist/world.js';

    const terrain = { columns: 24, rows: 24, width: 2.4, depth: 2.4, centre: [0, 0] };

    async function makeWorld(shared, tier, hardpan) {
      const soil = await Terramechanics.load({ tier });
      const bed = new TerrainBed();
      const air = await AirborneParticles.load({ terrain: true, dustField: soil.dustField });
      const world = new PhysicsWorld({ rate: { num: 60, den: 1 }, memory: worldMemory(shared) })
        .add(bed, { ...terrain, elevations: () => 0 })
        .add(soil, { terrain, hardpan, patches: [{ x: 0, z: 0, length: 0.38, width: 0.22, load: 900, displacement: [0.04, 0], rounded: true }] })
        .add(air, { terrain, capacity: 64, dustReleaseHeight: 0.02, dustLiftVelocity: 0.5 });
      world.couple(['terramechanics', 'bed'], 'staggered');
      return { world, bed, air };
    }

    window.runTerramechanics = async () => {
      const simulate = async (shared, tier, hardpan) => {
        const { world, bed, air } = await makeWorld(shared, tier, hardpan);
        world.advance(5);
        const saved = world.takeSnapshot();
        world.advance(30);
        const end = world.hash();
        world.restoreSnapshot(saved.bytes);
        world.advance(30);
        if (world.hash() !== end) throw new Error('The restored soil and dust state changed. Inspect both registered fields.');
        return { hash: end, min: Math.min(...bed.elevations()), max: Math.max(...bed.elevations()), mass: air.budget.supplied };
      };
      const hardpan = { thickness: 0.16, frictionalModulus: 900_000 };
      return { mean: [await simulate(false, 'mean'), await simulate(true, 'mean')],
        resolved: [await simulate(false, 'resolved'), await simulate(true, 'resolved')],
        hardpan: [await simulate(false, 'resolved', hardpan), await simulate(true, 'resolved', hardpan)] };
    };

    window.runResistiveSoil = async () => {
      await Physics.load({ threads: true });
      const simulate = async (shared) => {
        const soil = await ResistiveSoil.load();
        const world = new PhysicsWorld({ rate: { num: 60, den: 1 }, memory: worldMemory(shared) });
        const physics = new Physics(null, { arena: world.arena, fixedTimestep: 1 / 60, gravity: [0, 0, 0] });
        try {
          const body = physics.addBody(null, {
            linearVelocity: [0, -0.06, 0],
            colliders: { shape: 'sphere', radius: 0.05, mass: 2 },
          });
          const strip = { start: [0.01, -0.10, 0], end: [0.11, -0.10, 0], width: 0.1, samples: 3 };
          world.add(new TerrainBed(), { ...terrain, elevations: () => 0 })
            .add(new RigidSolver(), { physics })
            .add(soil, { terrain, coefficients: [1000, 0, 0, 0, 0, 0, 0, 0, 0], bodies: [{ row: body.row, strips: [strip] }] })
            .couple(['bed', 'rigid', soil.id], 'staggered');
          world.advance(1);
          const snapshot = world.takeSnapshot();
          const { force, torque } = soil.read(body.row);
          const depth = 0.1 - body.position[1];
          world.advance(2);
          const hash = world.hash();
          world.restoreSnapshot(snapshot.bytes);
          world.advance(2);
          return { hash, restored: world.hash(), depth, force, torque, velocity: body.linearVelocity };
        } finally {
          physics.dispose();
        }
      };
      return [await simulate(false), await simulate(true)];
    };

    window.runCyclicSoil = async () => {
      const simulate = async (shared) => {
        const shape = { columns: 8, rows: 8, width: 0.8, depth: 0.8, centre: [0, 0] };
        const input = soilPatchField();
        const soil = await Terramechanics.load({ tier: 'resolved', input });
        const bed = new TerrainBed();
        const world = new PhysicsWorld({ rate: { num: 60, den: 1 }, memory: worldMemory(shared) });
        let state;
        world.add({
          describe: () => ({ id: 'plate', rate: 0, stableRate: () => 0, fields: [{ field: input, access: 'write' }] }),
          init: host => { state = host.allocate('plate-load', 80, 'f64', 1); },
          step: context => {
            const load = [900, 450, 0, 1350, 0][context.tick];
            regionWords(world.memory, state).set([0, 0, 0, 1, 0.3, 0.3, load, 0, 0, 0]);
          },
          exportPorts: tick => [{ field: input.name, region: state, tick, cell: [0, 0, 0] }],
          importPorts: () => {},
          stateRegions: () => [state],
          extraState: () => [],
        });
        world.add(bed, { ...shape, elevations: () => 0 }).add(soil, {
          terrain: shape, inputRows: 1,
          material: { cohesiveModulus: 0, frictionalModulus: 100000, compaction: 1,
            unloading: { stiffness: 400000, hardening: 2000000 } },
        }).couple(['plate', soil.id, 'bed'], 'staggered');
        world.advance(1);
        const loaded = bed.elevations()[40];
        const snapshot = world.takeSnapshot();
        world.advance(3);
        const recovered = bed.elevations()[40];
        world.advance(5);
        const hash = world.hash();
        world.restoreSnapshot(snapshot.bytes);
        world.advance(5);
        return { hash, restored: world.hash(), loaded, recovered, residual: bed.elevations()[40], mass: soil.budget.compacted };
      };
      return [await simulate(false), await simulate(true)];
    };

    window.prepareTerramechanicsRender = async () => {
      const [{ createStage }, { heightfield }] = await Promise.all([
        import('/packages/stage/dist/index.js'),
        import('/packages/terrain/dist/index.js'),
      ]);
      const { world, bed } = await makeWorld(true, 'resolved');
      const errors = [];
      const stage = await createStage(document.querySelector('#soil'), {
        autoStart: false, controls: false, exactSize: [640, 360], background: '#9aaab1',
        camera: { position: [0.53, 0.68, 0.95], target: [0, -0.032, 0], fov: 46, near: 0.1, far: 10 },
        onError: error => errors.push(String(error.message ?? error)),
      });
      stage.engine.lighting.direction.set([-4, 2, -1, 2]);
      stage.engine.lighting.radiance.set([1, 0.93, 0.86, 0.26]);
      const geometry = () => {
        const surface = bed.bed;
        return heightfield((x, z) => surface.sample(x, z).elevation,
          { size: [terrain.width, terrain.depth], resolution: 72 });
      };
      const ground = stage.mesh(geometry(), { color: '#76634e', roughness: 0.91 });
      window.terramechanicsFrame = async tick => {
        world.advance(tick);
        ground.setGeometry(geometry());
        await stage.engine.render({ delta: 0 });
        await stage.engine.render({ delta: 0 });
        return { elevation: bed.bed.sample(0, 0).elevation, drawCalls: stage.engine.scene.stats.drawCalls, errors };
      };
      window.closeTerramechanicsRender = () => stage.dispose();
    };
  </script>
</body>
</html>
