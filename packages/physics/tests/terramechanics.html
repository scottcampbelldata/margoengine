<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Terramechanics native replay</title></head>
<body>
  <script type="module">
    import { AirborneParticles } from '/packages/physics/dist/airborne.js';
    import { TerrainBed } from '/packages/physics/dist/earth.js';
    import { Terramechanics } from '/packages/physics/dist/terramechanics.js';
    import { PhysicsWorld, worldMemory } from '/packages/physics/dist/world.js';

    window.runTerramechanics = async () => {
      const simulate = async shared => {
        const terrain = { columns: 24, rows: 24, width: 2.4, depth: 2.4, centre: [0, 0] };
        const soil = await Terramechanics.load();
        const bed = new TerrainBed();
        const air = await AirborneParticles.load({ terrain: true, dustField: soil.dustField });
        const world = new PhysicsWorld({ rate: { num: 60, den: 1 }, memory: worldMemory(shared) })
          .add(bed, { ...terrain, elevations: () => 0 })
          .add(soil, { terrain, patches: [{ x: 0, z: 0, length: 0.38, width: 0.22, load: 900, displacement: [0.04, 0] }] })
          .add(air, { terrain, capacity: 64, dustReleaseHeight: 0.02, dustLiftVelocity: 0.5 });
        world.couple(['terramechanics', 'bed'], 'staggered');
        world.advance(5);
        const saved = world.takeSnapshot();
        world.advance(30);
        const end = world.hash();
        world.restoreSnapshot(saved.bytes);
        world.advance(30);
        if (world.hash() !== end) throw new Error('The restored soil and dust state changed. Inspect both registered fields.');
        return { hash: end, min: Math.min(...bed.elevations()), max: Math.max(...bed.elevations()), mass: air.budget.supplied };
      };
      return { plain: await simulate(false), shared: await simulate(true) };
    };
  </script>
</body>
</html>
