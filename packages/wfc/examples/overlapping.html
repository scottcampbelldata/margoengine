<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Margo · Overlapping WFC</title>
<style>:root{color-scheme:dark;font:16px system-ui;background:#10141c;color:#edf2fa}body{margin:0;padding:16px;max-width:1100px;margin-inline:auto}h1{font-size:24px;margin:0 0 6px}p{color:#b4c2d6;margin:0 0 12px}.row{display:flex;gap:20px;flex-wrap:wrap;align-items:flex-start}canvas{image-rendering:pixelated;border-radius:8px;background:#080c12;max-width:100%}label{display:inline-grid;gap:6px;margin:14px 20px 0 0}input{accent-color:#75c5ff}</style></head>
<body>
<h1>Overlapping WFC</h1><p>@margoengine/wfc/overlapping · every 3 x 3 window of the output appears in the 12 x 12 sample (with rotations and reflections). Contradictions backtrack.</p>
<div class="row"><canvas id="sample" width="12" height="12" style="width:144px" aria-label="Sample: rooms with walls and doors"></canvas><canvas id="output" width="64" height="40" style="width:768px" aria-label="Generated rooms"></canvas></div>
<label for="seed">Seed <input id="seed" type="number" min="1" max="99999" value="1"></label>
<label for="periodic">Wrap edges <input id="periodic" type="checkbox"></label>
<p id="status" role="status"></p>
<script type="module">
import {OverlappingModel} from '../dist/overlapping.js';
// 0 floor, 1 wall, 2 door.
const rows = ['111111111111', '100001000001', '100002000001', '100001000001', '111211111211', '100001000001', '100001000001', '100002000001', '111111111111', '100000000001', '100000000001', '111111111111'];
const palette = [[38, 44, 58], [196, 186, 160], [214, 120, 60]], sample = {data: rows.join('').split('').map(Number), width: 12, height: 12};
const draw = (canvas, data, width, height) => {
  const image = new ImageData(width, height);
  data.forEach((v, i) => image.data.set([...palette[v], 255], i * 4));
  canvas.getContext('2d').putImageData(image, 0, 0);
};
draw(document.querySelector('#sample'), sample.data, 12, 12);
const model = new OverlappingModel(sample, {N: 3}), status = document.querySelector('#status');
const run = () => {
  const seed = Math.max(1, document.querySelector('#seed').valueAsNumber | 0), periodic = document.querySelector('#periodic').checked, started = performance.now();
  try {
    const image = model.solve(64, 40, {seed, periodic});
    draw(document.querySelector('#output'), image, 64, 40);
    status.textContent = `${model.patterns} patterns · ${(performance.now() - started).toFixed(0)} ms · ${model.stats.backtracks} backtracks, attempt ${model.stats.attempts}`;
  } catch (error) {status.textContent = String(error);}
};
for (const id of ['seed', 'periodic']) document.querySelector('#' + id).addEventListener('change', run);
run();
</script>
</body></html>
