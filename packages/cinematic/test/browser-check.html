<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Cinematic browser check</title>
    <style>
      body { margin: 0; }
      canvas { display: block; width: 800px; height: 400px; }
    </style>
  </head>
  <body>
    <canvas width="800" height="400"></canvas>
    <script type="module">
      import { Engine, PbrMaterial, box } from '/packages/core/dist/index.js';
      import { CameraBrain } from '/packages/cinematic/dist/brain.js';
      import { FramingComposer } from '/packages/cinematic/dist/composer.js';
      import { GroupFraming } from '/packages/cinematic/dist/group.js';
      import { FocusTracker, focusOutput } from '/packages/cinematic/dist/lens.js';
      import { DOF } from '/packages/dof/dist/index.js';

      const engine = await Engine.create(document.querySelector('canvas'), { backend: 'webgpu' }),
        device = engine.gpu,
        errors = [];
      device.addEventListener('uncapturederror', (e) => errors.push(e.error.message));
      const add = (position, size = 0.4) => {
        return engine
          .createMesh()
          .setGeometry(box(size, size, size))
          .setMaterial(new PbrMaterial({ color: '#ff0000' }))
          .setPosition(position);
      };
      const frame = async (delta = 1 / 60) => {
        engine.render({ delta });
        await device.queue.onSubmittedWorkDone();
      };
      const brain = CameraBrain.attach(engine, { blend: { duration: 0.5 } }),
        subject = add([0, 1, 0]),
        composer = new FramingComposer(subject, { screen: [0.25, 0.75], deadZone: [0.1, 0.1], softZone: [0.5, 0.4] }),
        follow = brain.add({ name: 'follow', priority: 1, position: [0, 3, 12], target: [0, 1, 0], fov: 40, stages: [composer] }),
        wide = brain.add({ name: 'wide', priority: 0, position: [20, 10, 20], target: [0, 0, 0], fov: 60 });
      const pick = async (x, y) => (await engine.pick(x, y)) === subject;
      window.check = {
        async framed() {
          // fixed-wait: fixed simulation steps are what is under test, not a wait for the GPU
          for (let i = 0; i < 3; i++) await frame();
          const [x, y] = composer.onScreen;
          return {
            x,
            y,
            center: await pick(x * 800, y * 400),
            left: await pick(x * 800 - 40, y * 400),
            right: await pick(x * 800 + 40, y * 400),
            above: await pick(x * 800, y * 400 - 40),
            below: await pick(x * 800, y * 400 + 40),
            errors,
          };
        },
        async move(position, frames) {
          subject.setPosition(position);
          // fixed-wait: fixed simulation steps are what is under test, not a wait for the GPU
          for (let i = 0; i < frames; i++) await frame();
          const [x, y] = composer.onScreen;
          return { x, y, hit: await pick(x * 800, y * 400), errors };
        },
        async swap() {
          wide.priority = 5;
          await frame();
          const during = [];
          // fixed-wait: fixed simulation steps are what is under test, not a wait for the GPU
          for (let i = 0; i < 40; i++) {
            await frame();
            during.push([...engine.camera.position]);
          }
          follow.priority = 0;
          return { during, live: brain.live.name, position: [...engine.camera.position], errors };
        },
      };
      window.check.group = async () => {
        const left = add([994, 0, 0]),
          right = add([1006, 0, 0]);
        brain.add({
          name: 'group',
          priority: 20,
          position: [1000, 0, 30],
          target: [1000, 0, 0],
          fov: 40,
          stages: [new GroupFraming([left, right], { padding: 0.1 })],
        });
        // fixed-wait: fixed simulation steps are what is under test, not a wait for the GPU
        for (let i = 0; i < 40; i++) await frame();
        const at = async (x, y) => {
          const mesh = await engine.pick(x, y);
          return mesh === left ? 'left' : mesh === right ? 'right' : null;
        };
        // The padding leaves a tenth of the width at each side: 80 pixels of 800.
        return { ends: [await at(80, 200), await at(720, 200)], outside: [await at(40, 200), await at(760, 200)], errors };
      };
      // Two flat cards at 6 and 30 units, the far one 5 times the size, so both fill the same part of the picture.
      const card = (position, size) =>
        engine
          .createMesh()
          .setGeometry(box(size, size, 0.02))
          .setMaterial(new PbrMaterial({ color: '#ffffff', emissive: '#ffffff' }))
          .setPosition(position);
      let lens = null;
      window.check.lens = async (which, frames, delta = 1 / 60) => {
        if (!lens) {
          const cards = { near: card([-2001.2, 0, 0], 1), far: card([-1994, 0, -24], 5) },
            tracker = new FocusTracker(cards.near),
            dof = DOF.attach(engine, { focalLength: 0.05, aperture: 0.2, maxRadius: 16 });
          brain.stages.push(focusOutput({ dof }));
          brain.add({ name: 'lens', priority: 30, position: [-2000, 0, 6], target: [-2000, 0, 0], fov: 40, stages: [tracker] });
          lens = { cards, tracker, dof };
          await frame();
        }
        lens.tracker.target = lens.cards[which];
        // fixed-wait: fixed simulation steps are what is under test, not a wait for the GPU
        for (let i = 0; i < frames; i++) await frame(delta);
        return { focus: lens.dof.options.focalDistance, errors };
      };
      window.check.zoom = async () => {
        const subject = card([-3000, 0, 0], 1);
        brain.add({
          name: 'zoom',
          priority: 40,
          position: [-3000, 0, 6],
          target: [-3000, 0, 0],
          fov: 60,
          stages: [new FocusTracker(subject, { size: 1, screenHeight: 0.5, minFov: 1 })],
        });
        // fixed-wait: fixed simulation steps are what is under test, not a wait for the GPU
        for (let i = 0; i < 40; i++) await frame();
        const hit = async (y) => (await engine.pick(400, y)) === subject;
        // Half the 400 pixel height: 100 above and below the middle.
        return { fov: engine.camera.fov, inside: [await hit(104), await hit(296)], outside: [await hit(96), await hit(304)], errors };
      };
      window.ready = true;
    </script>
  </body>
</html>
