<!doctype html><html><head><meta charset="utf-8"/><title>Voxel far levels browser check</title><style>body{margin:0}canvas{display:block;width:320px;height:240px}</style></head><body><canvas></canvas>
<script type="module">
// Real-GPU proof of VoxelRenderer `scale` and @margoengine/voxel/lod, driven by lod-browser-check.mjs: (1) one small
// world drawn at scale 1 from eye E and at scale 2 from eye 2E (near and far doubled) must give the same image, since
// every block, the camera and its clip range are scaled alike; (2) far levels of noiseTerrainLod, lit by
// VoxelLighting and drawn by one scaled renderer each, cover the view to the horizon with no validation error.
import {Engine} from '/packages/core/dist/index.js';
import {engineRuntime} from '/packages/core/dist/extension.js';
import {BlockTypes,VoxelWorld} from '/packages/voxel/dist/index.js';
import {VoxelLighting} from '/packages/voxel/dist/light.js';
import {noiseTerrainLod,VoxelLod} from '/packages/voxel/dist/lod.js';
import {BlockTextures,VoxelRenderer} from '/packages/voxel/dist/render.js';
import {compareImages} from '/packages/voxel/tests/blend-tolerance.js';
const canvas=document.querySelector('canvas'),errors=[];
const engine=await Engine.create(canvas,{backend:'webgpu',camera:{position:[-10,30,-10],target:[30,8,30],near:0.1,far:400}});
const device=()=>engineRuntime(engine).gpu;device().addEventListener('uncapturederror',(e)=>errors.push(e.error.message));
let seed=5;const random=()=>((seed=(Math.imul(seed,1103515245)+12345)>>>0)>>>8)/16777216;
const tile=(f)=>{const data=new Uint8Array(1024);for(let y=0;y<16;y++)for(let x=0;x<16;x++)data.set(f(x,y),(y*16+x)*4);return {width:16,height:16,data};};
const noisy=(r,g,b)=>tile(()=>{const k=0.8+0.4*random();return [r*k,g*k,b*k,255];});
const textures=new BlockTextures({images:[noisy(128,128,128),noisy(134,96,67),noisy(92,160,60),noisy(210,200,140),noisy(60,100,200)]});
const blocks=new BlockTypes();blocks.define('stone',{textures:0});blocks.define('dirt',{textures:1});blocks.define('grass',{textures:[1,1,2,1,1,1]});
blocks.define('sand',{textures:3});blocks.define('water',{shape:'liquid',liquid:true,solid:false,layer:'translucent',textures:4,opacity:1});
const readCanvas=()=>{const c=new OffscreenCanvas(canvas.width,canvas.height).getContext('2d');c.drawImage(canvas,0,0);return c.getImageData(0,0,canvas.width,canvas.height).data;};
const frame=async()=>{engine.render({delta:0});await device().queue.onSubmittedWorkDone();await new Promise((r)=>setTimeout(r,1));};
async function settle(renderers,update=()=>{}){
 let stable=0;
 for(let i=0;i<6000&&stable<4;i++){update();await frame();
  stable=renderers.every((r)=>!r.world.dirty.size&&!r.stats.pending&&!r.stats.compiling&&(r.stats.draws||!r.stats.chunks))?stable+1:0;}
 if(stable<4)throw new Error('renderers did not settle');
 // Read in the task that drew: once presented, a WebGPU canvas's texture may read back blank.
 engine.render({delta:0});return readCanvas();
}
// (1) The same world at scale 1 and 2.
const world=new VoxelWorld({blocks});
for(let z=0;z<48;z++)for(let x=0;x<48;x++){const h=Math.round(9+3*Math.sin(x*0.3)*Math.cos(z*0.23)+random());
 for(let y=0;y<=h;y++)world.setBlock(x,y,z,y===h?3:y>h-3?2:1);}
for(let y=10;y<18;y++)world.setBlock(20,y,20,1);
VoxelLighting.attach(world,{budget:Infinity}).update();
async function draw(scale,clip=scale){
 for(const k of [...world.dirty])world.dirty.delete(k);
 for(let cx=0;cx<2;cx++)for(let cz=0;cz<2;cz++)world.dirty.add(`${cx},0,${cz}`);
 engine.camera.near=0.1*clip;engine.camera.far=400*clip;
 engine.camera.position=[-10*scale,30*scale,-10*scale];engine.camera.target=[30*scale,8*scale,30*scale];
 const r=VoxelRenderer.attach(engine,{world,textures,workers:2,scale});
 const image=await settle([r]);const stats={...r.stats};r.dispose();return {image,stats};
}
window.check={
 errors:()=>errors,drawOnly:(s)=>draw(s),
 async scaled(){
  const a=await draw(1),b=await draw(2),c=await draw(1);
  const bg=a.image.slice(0,4);
  return {repeat:compareImages(a.image,c.image,bg,canvas.width,0),scaled:compareImages(a.image,b.image,bg,canvas.width,0),stats:[a.stats,b.stats]};
 },
 async far(shot=false){
  const lod=new VoxelLod({world:new VoxelWorld({blocks}),generate:noiseTerrainLod({seed:3,height:24,amplitude:40,scale:600}),levels:4,radius:6,minY:-64,maxY:191,budget:Infinity});
  const eye=[0,90,0];engine.camera.near=0.5;engine.camera.far=20000;engine.camera.position=eye;engine.camera.target=[3000,-200,1200];
  lod.update(eye);
  const lights=lod.levels.map(({world})=>VoxelLighting.attach(world,{budget:Infinity}));
  const renderers=lod.levels.map(({world,scale})=>VoxelRenderer.attach(engine,{world,textures,workers:1,scale}));
  const image=await settle(renderers,()=>{lod.update(eye);for(const l of lights)l.update();});
  let drawn=0,top=canvas.height;const bg=image.slice(0,4);
  for(let p=0;p<image.length;p+=4)if(image[p]!==bg[0]||image[p+1]!==bg[1]||image[p+2]!==bg[2]){drawn++;top=Math.min(top,Math.floor(p/4/canvas.width));}
  const out={drawn,total:image.length/4,top,nodes:lod.stats.nodes,chunks:renderers.map((r)=>r.stats.chunks),quads:renderers.map((r)=>r.stats.quads)};
  if(shot)out.png=canvas.toDataURL("image/png");
  for(const r of renderers)r.dispose();for(const l of lights)l.dispose();lod.dispose();return out;
 },
};
window.ready=true;
</script></body></html>
