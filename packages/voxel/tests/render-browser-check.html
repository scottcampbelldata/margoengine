watch(runtime().gpu);

 noisy(128,128,128), // 0 stone
 noisy(134,96,67), // 1 dirt
 noisy(92,160,60), // 2 grass top

 noisy(60,100,200,170), // 4 water

for(let y=12;y<16;y++)put(10,y,10,LOG);
for(let x=9;x<12;x++)for(let y=16;y<19;y++)for(let z=9;z<12;z++)put(x,y,z,LEAVES);
for(let x=26;x<34;x++)for(let z=18;z<26;z++)put(x,17,z,STONE); // overhang

const flatKeys=['0,0,0'];

// nothing under it, as at the edge of the loaded range.
const leafWorld=new VoxelWorld({blocks}),waterWorld=new VoxelWorld({blocks}),distanceKeys=[];
{const leafEdits=[],waterEdits=[];

 for(let x=0;x<128;x++)for(let y=0;y<32;y++){leafEdits.push(x,y,10,RED,x,y,31,LEAF_LIT);}
 for(let x=0;x<128;x++)for(let z=0;z<64;z++)waterEdits.push(x,8,z,WATER);

// greedy quads meet in T-junctions); lit only by emission, every face has the same colour.
const slab=new VoxelWorld({blocks}),slabKeys=[],slabEdits=[];
for(let cz=0;cz<3;cz++)for(let cx=0;cx<3;cx++){slab.addChunk(cx,0,cz);slabKeys.push(`${cx},0,${cz}`);}
for(let z=0;z<96;z++)for(let x=0;x<96;x++)for(let y=0;y<4;y++)slabEdits.push(x,y,z,random()<0.3?WHITE2:WHITE);

const quadsOf=(w,ks,mode)=>ks.reduce((n,k)=>{let m=meshChunk(meshInput(w,k));if(mode==='naive')m=naiveMesh(m);return n+(m.opaque.length+m.cutout.length+m.translucent.length)/3;},0);

 {name:'overview',position:[-14,30,-14],target:[30,10,30]},
 {name:'floor grazing',position:[-6,13.6,45],target:[90,12.9,46]},
 {name:'floor grazing diagonal',position:[-3,14.2,31],target:[60,12.5,70]},
 {name:'hills grazing',position:[64,13,-2],target:[0,12,62]},
 {name:'pool and glass',position:[30,18,-6],target:[40,11,12]},

let post,renderer;
const device=()=>runtime().gpu;
const module=()=>device().createShaderModule({code:'@group(0) @binding(0) var image:texture_2d<f32>;@group(0) @binding(1) var<storage,read_write> result:array<vec4f>;@compute @workgroup_size(8,8) fn main(@builtin(global_invocation_id) id:vec3u){let s=textureDimensions(image);if(any(id.xy>=s)){return;}result[id.y*s.x+id.x]=textureLoad(image,vec2i(id.xy),0);}'});

// One finished frame of the current view: the canvas is read in the task that rendered it.

for(const v of views)v.blended=seesTranslucent(v);

  const holes=(a,b)=>{const list=[];let interior=0,count=0;
   for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++){let inside=true;for(let dy=-1;dy<=1&&inside;dy++)for(let dx=-1;dx<=1;dx++)inside&&=isSlab(b,x+dx,y+dy);
    if(!inside)continue;interior++;if(!isSlab(a,x,y)){count++;if(list.length<8)list.push([x,y,[...a.slice((y*W+x)*4,(y*W+x)*4+3)]]);}}
   return {interior,count,list};};
  const counts=shots.naive.map((n,i)=>{const g=shots.greedy[i],h=holes(g,n);return {interior:h.interior,cracks:h.count,list:h.list,naiveHoles:holes(n,g).count};});
  return {colour,counts,errors:errors.splice(0)};
 },
 // HDR numbers with the lights off: every block emissive 1, so a pixel is its linear base colour.
 async composites(){
  post=Bloom.attach(engine,{strength:0.2,threshold:1,exposure:0});
  const l=runtime().lighting,saved=[l.direction.slice(),l.radiance.slice()];l.direction[3]=0;l.radiance[3]=0;
  renderer=attach(flat,flatKeys,'greedy');await ready(renderer,flat,flatKeys,'greedy');
  const at=async(position,target)=>{look({position,target});const img=await shot(),w=canvas.width,h=canvas.height,
   px=(fx,fy)=>{const p=(Math.floor(h*fy)*w+Math.floor(w*fx))*4;return [img[p],img[p+1],img[p+2]];};return px;};
  // Blue glass (0.4) at z 2..3 in front of red at z 0..1, seen from +z.
  let px=await at([0.5,0.5,7],[0.5,0.5,0]);const glass=px(0.5,0.5);
  // Cutout: green square in the middle of the face, transparent border showing the red block behind.
  // 0.3 blocks left of the face centre (4.5 blocks away, 60 degree field of view): the border, whose ray goes on through
  // the back face's border to the red block.
  px=await at([2.5,0.5,7.5],[2.5,0.5,0]);const square=px(0.5,0.5),border=px(0.5-(0.3*canvas.height/2/(Math.tan(Math.PI/6)*4.5))/canvas.width,0.5);
  // The red block alone.
  px=await at([0.5,0.5,-5],[0.5,0.5,0]);const red=px(0.5,0.5);
  renderer.dispose();post.dispose();post=undefined;l.direction.set(saved[0]);l.radiance.set(saved[1]);
  return {glass,square,border,red,errors:errors.splice(0)};
 },
 // Leaves far away: how much of the red wall behind them shows. Mean red over the wall, per distance.
 async distantLeaves(){
  post=Bloom.attach(engine,{strength:0,threshold:1,exposure:0});
  const l=runtime().lighting,saved=[l.direction.slice(),l.radiance.slice()];l.direction[3]=0;l.radiance[3]=0;
  renderer=attach(leafWorld,distanceKeys,'greedy');await ready(renderer,leafWorld,distanceKeys,'greedy');
  const red={};
  for(const d of [40,80,160]){
   look({position:[64,16,32+d],target:[64,16,32]});
   const img=await shot(),w=canvas.width,h=canvas.height,half=Math.floor(h*(12/d)/(2*Math.tan(Math.PI/6))),cx=w>>1,cy=h>>1;
   let sum=0,n=0;for(let y=cy-half;y<cy+half;y++)for(let x=cx-half;x<cx+half;x++){sum+=img[(y*w+x)*4];n++;}
   red[d]=sum/n;
  }
  renderer.dispose();post.dispose();post=undefined;l.direction.set(saved[0]);l.radiance.set(saved[1]);
  return {red,errors:errors.splice(0)};
 },
 // Screen-space fog over water with nothing under it in the opaque depth.
 async waterFog(){
  post=Bloom.attach(engine,{strength:0,threshold:1,exposure:0});

 },
 // Frames at 60 Hz from a block edit to its pixels: a gold block placed in view and removed again, five times.
 async edit(){
  renderer=attach(world,keys,'greedy');await ready(renderer,world,keys,'greedy');
  look({position:[20.5,14.5,40],target:[20.5,14.5,50]});await shot();
  const centre=()=>{const img=readCanvas(),p=((canvas.height>>1)*canvas.width+(canvas.width>>1))*4;return [img[p],img[p+1],img[p+2]];};
  engine.render({delta:0});const before=centre(),frames=[];let gold;
  const until=async(changed)=>{for(let i=1;i<=30;i++){await new Promise(requestAnimationFrame);engine.render({delta:1/60});const c=centre();if(changed(c))return [i,c];}return [Infinity,centre()];};
  for(let k=0;k<5;k++){
   world.setBlock(20,14,44,GOLD);const [n,c]=await until((c)=>c.join()!==before.join());frames.push(n);gold=c;
   world.setBlock(20,14,44,0);await until((c)=>c.join()===before.join());
  }
  return {before,gold,frames,errors:errors.splice(0)};
 },
 // engine.rebootDevice(): the renderer meshes everything again on the new device and draws the same image.
 async restore(){
  look(views[0]);const before=await shot(),old=device();await engine.rebootDevice();watch(device());
  await ready(renderer,world,keys,'greedy');const after=await shot();const stats={...renderer.stats};renderer.dispose();
  return {result:compare(after,before,[0,0,0],tolerance(views[0])),newDevice:device()!==old,stats,errors:errors.splice(0)};
 },
 // The most quads one chunk layer can hold: a 3D checkerboard of two cutout cube types (chunk 0,0,0) and one of two
 // glasses (chunk 2,0,0) show every face of every cell, 196,608 quads each. An indirect draw past the index buffer is
 // skipped (no error) and a direct one is a validation error, so each chunk must cover its view.
 async worst(){
  const w=new VoxelWorld({blocks}),ks=['0,0,0','2,0,0'],e=[];
  for(let y=0;y<32;y++)for(let z=0;z<32;z++)for(let x=0;x<32;x++){const odd=(x+y+z)&1;e.push(x,y,z,odd?LEAVES:GREEN,x+64,y,z,odd?GLASS:BLUE);}
  w.setBlocks(e);
  const shots=[[[16,16,-12],[16,16,16]],[[80,16,-12],[80,16,16]]];look({position:shots[0][0],target:shots[0][1]});
  const empty=await shot(),bg=[empty[0],empty[1],empty[2]];
  renderer=attach(w,ks,'greedy');await ready(renderer,w,ks,'greedy');
  const lit=[];for(const [position,target] of shots){look({position,target});const img=await shot();let n=0;
   for(let p=0;p<img.length;p+=4)if(img[p]!==bg[0]||img[p+1]!==bg[1]||img[p+2]!==bg[2])n++;lit.push(n);}
  look({position:[48,40,-40],target:[48,16,16]});await shot();const stats={...renderer.stats};renderer.dispose();
  return {expected:quadsOf(w,ks,'greedy'),stats,lit,pixels:canvas.width*canvas.height,errors:errors.splice(0)};
 },
 // The quad pool at its default (the device's storage binding): worst-case chunks (196,608 quads each, half opaque, half
 // cutout) until one no longer fits. stats.poolFull must be false while all fit and true once one waits; then GPU time
 // of the voxel passes (timestamp queries) over the grid (stats.visible chunks in view) and the steady work counts.
 async scale(){
  const d=device(),limit=Math.min(d.limits.maxStorageBufferBindingSize,d.limits.maxBufferSize),fit=Math.floor(Math.floor(limit/768)/3072);
  const w=new VoxelWorld({blocks}),chunks=[];
  const one=()=>{const c=new VoxelChunk();c.fillLight(0xf0);for(let i=0;i<32768;i++){const x=i&31,y=i>>10,z=(i>>5)&31;c.set(x,y,z,((x+y+z)&1)?LEAVES:GREEN);}return c;};
  const settle=async(n)=>{let stable=0,last=-1;for(let i=0;i<20000&&stable<30;i++){engine.render({delta:0});await d.queue.onSubmittedWorkDone();stable=renderer.stats.quads===last&&!w.dirty.size&&renderer.stats.chunks>=Math.min(n,fit)?stable+1:0;last=renderer.stats.quads;await new Promise((r)=>setTimeout(r,0));}};
  const side=Math.ceil(Math.sqrt(fit+1));look({position:[side*20,side*30,-side*10],target:[side*20,0,side*20]});engine.camera.far=side*200;
  renderer=VoxelRenderer.attach(engine,{world:w,textures});
  for(let i=0;i<fit;i++){w.addChunk((i%side)*2,0,Math.floor(i/side)*2,one());chunks.push(i);}
  await settle(fit);const fitted={...renderer.stats};
  w.addChunk((fit%side)*2,0,Math.floor(fit/side)*2,one());
  for(let i=0;i<200;i++){engine.render({delta:0});await d.queue.onSubmittedWorkDone();await new Promise((r)=>setTimeout(r,0));}
  const over={...renderer.stats};
  // Timestamps where the device has them (native); on the WebGL2 layer, wall time per frame until the GPU is done.
  const gpu=[],cpu=[],wall=[];
  if(d.features.has('timestamp-query')){
   const query=d.createQuerySet({type:'timestamp',count:4}),resolve=d.createBuffer({size:32,usage:GPUBufferUsage.QUERY_RESOLVE|GPUBufferUsage.COPY_SRC}),read=d.createBuffer({size:32,usage:GPUBufferUsage.COPY_DST|GPUBufferUsage.MAP_READ});
   const stamp=(name,order,index)=>runtime().frameGraph.add({name,order,execute:(c)=>c.encoder.beginComputePass({timestampWrites:{querySet:query,beginningOfPassWriteIndex:index}}).end()});
   const off=[stamp('t0',0.999,0),stamp('t1',1.001,1),stamp('t2',4.499,2),stamp('t3',4.501,3),runtime().frameGraph.add({name:'t-resolve',order:9.99,execute:(c)=>{c.encoder.resolveQuerySet(query,0,4,resolve,0);c.encoder.copyBufferToBuffer(resolve,0,read,0,32);}})];
   for(let i=0;i<80;i++){const t=performance.now();engine.render({delta:1/60});cpu.push(performance.now()-t);await read.mapAsync(GPUMapMode.READ);const s=new BigInt64Array(read.getMappedRange().slice(0));read.unmap();if(i>=20)gpu.push(Number(s[1]-s[0]+s[3]-s[2])/1e6);}
   for(const f of off)f();
  }else for(let i=0;i<80;i++){const t=performance.now();engine.render({delta:1/60});cpu.push(performance.now()-t);await d.queue.onSubmittedWorkDone();if(i>=20)wall.push(performance.now()-t);}
  w.removeChunk(0,0,0);for(let i=0;i<20000&&renderer.stats.poolFull;i++){engine.render({delta:0});await d.queue.onSubmittedWorkDone();await new Promise((r)=>setTimeout(r,0));}
  const freed={...renderer.stats};renderer.dispose();engine.camera.far=400;
  const median=(a)=>[...a].sort((x,y)=>x-y)[a.length>>1];
  return {limit,fit,size:[canvas.width,canvas.height],fitted,over,freed,gpuMs:gpu.length?median(gpu):null,wallMs:wall.length?median(wall):null,cpuFrameMs:median(cpu),errors:errors.splice(0)};
 },
 // A synthetic world of render distance 16 (33 x 33 x 2 chunks): stats, GPU time of the voxel passes, bundle cost.
 async timing(){
  const big=new VoxelWorld({blocks}),bigKeys=[];
  for(let cz=-16;cz<=16;cz++)for(let cx=-16;cx<=16;cx++)for(let cy=0;cy<2;cy++){
   const chunk=new VoxelChunk();chunk.fillLight(0xf0);
   for(let z=0;z<32;z++)for(let x=0;x<32;x++){const wx=cx*32+x,wz=cz*32+z,h=Math.round(30+9*Math.sin(wx*0.031)*Math.cos(wz*0.027)+4*Math.sin(wx*0.11+wz*0.07));
    for(let y=0;y<32;y++){const wy=cy*32+y;if(wy<=h)chunk.set(x,y,z,wy===h?GRASS:wy>h-3?DIRT:STONE);}}
   big.addChunk(cx,cy,cz,chunk);bigKeys.push(`${cx},${cy},${cz}`);}
  const d=device(),records=[],make=d.createRenderBundleEncoder.bind(d);
  d.createRenderBundleEncoder=(desc)=>{const t0=performance.now(),e=make(desc),finish=e.finish.bind(e);e.finish=()=>{const b=finish();records.push(performance.now()-t0);return b;};return e;};
  canvas.style.width='1920px';canvas.style.height='1080px';look({position:[0,48,0],target:[200,30,120]});engine.camera.far=800;
  const start=performance.now();renderer=VoxelRenderer.attach(engine,{world:big,textures});let stable=0,last=-1;
  for(let i=0;i<20000&&stable<30;i++){engine.render({delta:0});await d.queue.onSubmittedWorkDone();stable=renderer.stats.quads===last&&!big.dirty.size?stable+1:0;last=renderer.stats.quads;await new Promise((r)=>setTimeout(r,0));}
  const spawn=performance.now()-start,query=d.createQuerySet({type:'timestamp',count:4}),resolve=d.createBuffer({size:32,usage:GPUBufferUsage.QUERY_RESOLVE|GPUBufferUsage.COPY_SRC}),read=d.createBuffer({size:32,usage:GPUBufferUsage.COPY_DST|GPUBufferUsage.MAP_READ});
  const stamp=(name,order,index)=>runtime().frameGraph.add({name,order,execute:(c)=>c.encoder.beginComputePass({timestampWrites:{querySet:query,beginningOfPassWriteIndex:index}}).end()});
  const off=[stamp('t0',0.999,0),stamp('t1',1.001,1),stamp('t2',4.499,2),stamp('t3',4.501,3),runtime().frameGraph.add({name:'t-resolve',order:9.99,execute:(c)=>{c.encoder.resolveQuerySet(query,0,4,resolve,0);c.encoder.copyBufferToBuffer(resolve,0,read,0,32);}})];
  const gpu=[],cpu=[];
  for(let i=0;i<120;i++){const t=performance.now();engine.render({delta:1/60});cpu.push(performance.now()-t);await read.mapAsync(GPUMapMode.READ);const s=new BigInt64Array(read.getMappedRange().slice(0));read.unmap();if(i>=20)gpu.push(Number(s[1]-s[0]+s[3]-s[2])/1e6);}
  for(const f of off)f();
  const stats={...renderer.stats},bundleRecords=records.length,recordMs=records.slice(-5);
  // Re-record cost: a cutout flower in a chunk without cutout quads changes the bundle's draws.
  records.length=0;big.setBlock(3,40,3,FLOWER);for(let i=0;i<10&&!records.length;i++){engine.render({delta:0});await d.queue.onSubmittedWorkDone();await new Promise((r)=>setTimeout(r,5));}
  renderer.dispose();d.createRenderBundleEncoder=make;const size=[canvas.width,canvas.height];canvas.style.width='320px';canvas.style.height='240px';
  const median=(a)=>[...a].sort((x,y)=>x-y)[a.length>>1];
  return {size,chunks:bigKeys.length,stats,spawnMs:Math.round(spawn),gpuMs:median(gpu),gpuMinMs:Math.min(...gpu),cpuFrameMs:median(cpu),bundleRecords,reRecordMs:records[0],recordMs,errors:errors.splice(0)};
 },
};
