<!doctype html><html><head><meta charset="utf-8"/><title>Voxel debris browser check</title><style>body{margin:0}canvas{display:block;width:320px;height:240px}</style></head><body><canvas></canvas>
<script type="module">
// Real-GPU proof of @margoengine/voxel/debris, driven by debris-browser-check.mjs: a red beam on a pillar over a grey
// floor, drawn by VoxelRenderer; cutting the pillar breaks the beam off as a dynamic body (Physics with VoxelPhysics),
// drawn by VoxelDebris as a core mesh that falls with the body and comes to rest on the floor.
import {Engine} from '@margoengine/core';
import {Physics} from '@margoengine/physics';
import {BlockTypes,VoxelWorld} from '@margoengine/voxel';
import {VoxelLighting} from '@margoengine/voxel/light';
import {BlockTextures,VoxelRenderer} from '@margoengine/voxel/render';
import {VoxelPhysics} from '@margoengine/voxel/physics';
import {VoxelDebris} from '@margoengine/voxel/debris';
const canvas=document.querySelector('canvas'),errors=[];
const engine=await Engine.create(canvas,{backend:'webgpu',camera:{position:[13,9,-6],target:[13,3,10],near:0.1,far:200}});
engine.gpu.addEventListener('uncapturederror',(e)=>errors.push(e.error.message));
await Physics.load();
const physics=Physics.attach(engine,{gravity:[0,-9.81,0]});
const grey={width:16,height:16,data:new Uint8Array(1024).fill(200)};
const blocks=new BlockTypes(),STONE=blocks.define('stone',{textures:0}),BRICK=blocks.define('brick',{textures:0,color:'#c8281e'});
const world=new VoxelWorld({blocks});world.addChunk(0,0,0);
const e=[];for(let x=0;x<32;x++)for(let z=0;z<32;z++)e.push(x,0,z,STONE);
for(let y=1;y<5;y++)e.push(8,y,10,BRICK);for(let x=8;x<19;x++)e.push(x,5,10,BRICK);world.setBlocks(e);
const lighting=VoxelLighting.attach(world,{budget:Infinity});lighting.update();
const voxels=VoxelRenderer.attach(engine,{world,textures:new BlockTextures({images:[grey]}),workers:1});
const colliders=new VoxelPhysics(physics,world,{budget:Infinity});
const debris=new VoxelDebris(world,{physics,engine});
const readCanvas=()=>{const c=new OffscreenCanvas(canvas.width,canvas.height).getContext('2d');c.drawImage(canvas,0,0);return c.getImageData(0,0,canvas.width,canvas.height).data;};
const project=(p)=>{const m=engine.camera.matrix,v=[0,1,2,3].map((r)=>m[r]*p[0]+m[4+r]*p[1]+m[8+r]*p[2]+m[12+r]);return [(v[0]/v[3]*0.5+0.5)*canvas.width,(0.5-v[1]/v[3]*0.5)*canvas.height];};
const mean=(image,p,r=2)=>{const [cx,cy]=project(p),s=[0,0,0];let n=0;
 for(let y=Math.round(cy-r);y<=cy+r;y++)for(let x=Math.round(cx-r);x<=cx+r;x++){const o=(y*canvas.width+x)*4;for(let c=0;c<3;c++)s[c]+=image[o+c];n++;}return s.map((v)=>v/n);};
async function settle(){let stable=0;
 for(let i=0;i<2000&&stable<4;i++){lighting.update();engine.render({delta:0});await engine.gpu.queue.onSubmittedWorkDone();await new Promise((r)=>setTimeout(r,1));
  stable=!world.dirty.size&&!voxels.stats.pending&&!voxels.stats.compiling&&voxels.stats.draws?stable+1:0;}
 if(stable<4)throw new Error('did not settle');
 // Read in the task that drew: once presented, a WebGPU canvas's texture may read back blank.
 engine.render({delta:0});return readCanvas();}
window.check={
 errors:()=>errors,
 async run(){
  // A kinematic body by the beam, so VoxelPhysics builds the chunk's colliders before the cut.
  physics.addBody(null,{type:'kinematicPosition',position:[13,4,10],colliders:[]});
  for(let i=0;i<3;i++)engine.render({delta:1/60});
  const before=await settle(),beam=[16.5,5.5,10];
  world.setBlock(8,2,10,0);
  const [piece]=debris.update(),start=[...piece.body.position];
  const stats={cells:piece.cells.length/3,meshes:piece.meshes.length,boxes:piece.boxes.length/6};
  for(let i=0;i<300;i++){debris.update(1/60);lighting.update();engine.render({delta:1/60});if(i%30===0)await engine.gpu.queue.onSubmittedWorkDone();}
  const after=await settle(),end=[...piece.body.position],rest=(({x,y,z})=>[x,y,z])(piece.meshes[0].position);
  // Where the beam's middle now is: its offset from the centre turned by the body's rotation.
  const q=piece.body.rotation,o=[beam[0]-piece.center[0],beam[1]-piece.center[1],beam[2]-piece.center[2]];
  const t=[2*(q[1]*o[2]-q[2]*o[1]),2*(q[2]*o[0]-q[0]*o[2]),2*(q[0]*o[1]-q[1]*o[0])];
  const moved=[0,1,2].map((a)=>end[a]+o[a]+q[3]*t[a]+[q[1]*t[2]-q[2]*t[1],q[2]*t[0]-q[0]*t[2],q[0]*t[1]-q[1]*t[0]][a]);
  const out={stats,start,end,rest,moved,speed:Math.hypot(...piece.body.linearVelocity),
   beamBefore:mean(before,beam),beamAfter:mean(after,beam),fallen:mean(after,moved),floor:mean(before,[13,1,4])};
  debris.dispose();colliders.dispose();voxels.dispose();return out;
 },
};
window.ready=true;
</script></body></html>
