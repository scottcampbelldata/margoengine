<!doctype html><html><head><meta charset="utf-8"/><title>Voxel lightmap restore browser check</title><style>body{margin:0}canvas{display:block;width:320px;height:240px}</style></head><body><canvas></canvas>
<script type="module">
// Real-GPU proof of the borrowed-object rule for a VoxelRenderer lightmap atlas (KB-RESTORE-BORROWED1), driven by
// lightmap-restore-browser-check.mjs. A sunlit white floor with a red baked chart on part of it. A plain atlas is lost
// with its device: after engine.rebootDevice() the frames raise no validation error, the floor draws with live
// lighting, engine.onError hears of it once, and a new lightmap brings the baked chart back. A (device) => texture
// atlas is made again for the new device with no report.
import {Engine} from '/packages/core/dist/index.js';
import {BlockTypes,VoxelWorld} from '/packages/voxel/dist/index.js';
import {VoxelLighting} from '/packages/voxel/dist/light.js';
import {voxelLightmap} from '/packages/voxel/dist/lightmap.js';
import {BlockTextures,VoxelRenderer} from '/packages/voxel/dist/render.js';
const canvas=document.querySelector('canvas'),errors=[],reported=[];
const engine=await Engine.create(canvas,{backend:'webgpu',camera:{position:[16,22,-6],target:[16,1,16],near:0.1,far:200}});
engine.onError=(e)=>reported.push(`${e?.code??''} ${e?.message??e}`);
const watch=(device)=>device.addEventListener('uncapturederror',(e)=>errors.push(e.error.message));
watch(engine.gpu);
const l=[0.3,0.9,-0.3],n=Math.hypot(...l);engine.lighting.direction.set(l.map((v)=>v/n));engine.lighting.radiance.set([1.2,1.2,1.2]);
const textures=new BlockTextures({images:[{width:16,height:16,data:Uint8Array.from({length:1024},(_,i)=>[190,190,190,255][i&3])}]});
const blocks=new BlockTypes();const WHITE=blocks.define('white',{textures:0});
const world=new VoxelWorld({blocks}),e=[];
world.addChunk(0,0,0);
for(let z=0;z<32;z++)for(let x=0;x<32;x++)e.push(x,0,z,WHITE);
world.setBlocks(e);
const lighting=VoxelLighting.attach(world,{budget:Infinity});lighting.update();
const voxels=VoxelRenderer.attach(engine,{world,textures});
// The chart: the floor's top from (4, 4) to (12, 12), counterclockwise seen from above.
const positions=[4,1,4,4,1,12,12,1,12,12,1,4],uv=[0,0,1,0,1,1,0,1];
let made=0;
const atlas=(device)=>{made++;const t=device.createTexture({size:[4,4],format:'rgba8unorm',usage:GPUTextureUsage.TEXTURE_BINDING|GPUTextureUsage.COPY_DST});
 device.queue.writeTexture({texture:t},Uint8Array.from({length:64},(_,i)=>[255,50,50,255][i&3]),{bytesPerRow:16},[4,4]);return t;};
const readCanvas=()=>{const c=new OffscreenCanvas(canvas.width,canvas.height).getContext('2d');c.drawImage(canvas,0,0);return c.getImageData(0,0,canvas.width,canvas.height).data;};
const project=(p)=>{const m=engine.camera.matrix,v=[0,1,2,3].map((r)=>m[r]*p[0]+m[4+r]*p[1]+m[8+r]*p[2]+m[12+r]);return [(v[0]/v[3]*0.5+0.5)*canvas.width,(0.5-v[1]/v[3]*0.5)*canvas.height];};
const at=(image,p,r=1)=>{const [px,py]=project(p).map(Math.round),s=[0,0,0];let k=0;
 for(let y=py-r;y<=py+r;y++)for(let x=px-r;x<=px+r;x++){const o=(y*canvas.width+x)*4;for(let c=0;c<3;c++)s[c]+=image[o+c];k++;}return s.map((v)=>v/k);};
const draw=()=>{try{engine.render({delta:0});}catch(error){errors.push(`render threw: ${error?.message??error}`);}};
async function settle(phase){let stable=0;
 for(let i=0;i<4000&&stable<6;i++){draw();await engine.gpu.queue.onSubmittedWorkDone();await new Promise((r)=>setTimeout(r,1));
  stable=!world.dirty.size&&!voxels.stats.pending&&!voxels.stats.compiling&&voxels.stats.draws?stable+1:0;}
 if(stable<6)throw new Error(`renderer did not settle ${phase}: errors ${JSON.stringify(errors.slice(0,3))}, reported ${JSON.stringify(reported.slice(0,3))}`);
 draw();return {chart:at(readCanvas(),[8,1,8]),open:at(readCanvas(),[24,1,24])};}
async function restore(){const previous=engine.gpu;previous.destroy();await previous.lost;await engine.rebootDevice();watch(engine.gpu);
 for(let i=0;i<3;i++){draw();await engine.gpu.queue.onSubmittedWorkDone();await new Promise((r)=>setTimeout(r,1));}
 return engine.gpu!==previous;}
window.check={
 errors:()=>errors,
 reported:()=>reported,
 async run(){
  const live=await settle('live');
  voxels.lightmap=voxelLightmap({texture:atlas(engine.gpu),positions,uv});
  const baked=await settle('baked');
  const restored=await restore();
  const lost=await settle('lost'),reportedLost=reported.length;
  voxels.lightmap=voxelLightmap({texture:atlas(engine.gpu),positions,uv});
  const replaced=await settle('replaced');
  made=0;voxels.lightmap=voxelLightmap({texture:atlas,positions,uv});
  const fn=await settle('function');
  const restoredAgain=await restore();
  const fnAfter=await settle('function after restore');
  return {restored,restoredAgain,live,baked,lost,replaced,fn,fnAfter,reportedLost,made};
 },
};
window.ready=true;
</script></body></html>
