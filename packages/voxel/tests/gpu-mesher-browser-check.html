<!doctype html><html><head><meta charset="utf-8"/><title>Voxel GPU mesher browser check</title><style>body{margin:0}canvas{display:block;width:320px;height:240px}</style></head><body><canvas></canvas>
<script type="module">
// Real-GPU proof of @margoengine/voxel/gpu-mesher, driven by gpu-mesher-browser-check.mjs: every chunk of a lit terrain
// (stone, dirt, grass with its own top, glass, leaves, water at several levels, tall grass, torches, caves), a glass and
// stone checkerboard, uniform stone and water chunks, an all-air chunk and a chunk with a slab, meshed by
// GpuVoxelMesher and by meshChunk: the same words in every layer and the same visibility, before and after a large
// edit, the translucent quads sorted the same; the slab chunk goes to meshChunk. Then the terrain drawn by a
// VoxelRenderer with its worker mesher and with the GPU mesher gives the same picture.
import {Engine} from '/packages/core/dist/index.js';
import {BlockTypes,VoxelWorld,slabState} from '/packages/voxel/dist/index.js';
import {VoxelLighting} from '/packages/voxel/dist/light.js';
import {meshChunk,meshInput,sortQuads} from '/packages/voxel/dist/mesher.js';
import {GpuVoxelMesher} from '/packages/voxel/dist/gpu-mesher.js';
import {BlockTextures,VoxelRenderer} from '/packages/voxel/dist/render.js';
const canvas=document.querySelector('canvas'),errors=[];
const engine=await Engine.create(canvas,{backend:'webgpu',camera:{position:[-20,60,-20],target:[48,20,48],near:0.1,far:400}});
const device=engine.gpu;device.addEventListener('uncapturederror',(e)=>errors.push(e.error.message));
const tex=(v)=>({width:16,height:16,data:Uint8Array.from({length:1024},(_,i)=>(i&3)===3?255:(v+((i>>2)%7)*9)&255)});
const textures=new BlockTextures({images:[tex(120),tex(60),tex(180),tex(200),tex(90),tex(30)]});
const blocks=new BlockTypes();
const STONE=blocks.define('stone',{textures:0}),DIRT=blocks.define('dirt',{textures:1});
const GRASS=blocks.define('grass',{textures:[1,1,2,1,1,1]});
const GLASS=blocks.define('glass',{textures:3,layer:'translucent'});
const LEAVES=blocks.define('leaves',{textures:4,layer:'cutout'});
const WATER=blocks.define('water',{textures:5,layer:'translucent',shape:'liquid',liquid:true});
const TALL=blocks.define('tallgrass',{textures:2,layer:'cutout',shape:'cross',solid:false});
const TORCH=blocks.define('torch',{textures:3,layer:'cutout',shape:'cross',solid:false,light:14});
const SLAB=blocks.define('slab',{textures:0,shape:'slab'});
let seed=12345;const rand=()=>((seed=(seed*1103515245+12345)>>>0)>>>8)/16777216;
function terrain(world){
 for(let cz=0;cz<3;cz++)for(let cx=0;cx<3;cx++)for(let cy=0;cy<2;cy++)world.addChunk(cx,cy,cz);
 const edits=[];
 for(let z=0;z<96;z++)for(let x=0;x<96;x++){
  const h=22+Math.round(8*Math.sin(x/9)+6*Math.cos(z/7));
  for(let y=0;y<=h;y++){
   const cave=Math.sin(x/5)*Math.cos(y/4)*Math.sin(z/6)>0.55;
   if(cave)continue;
   edits.push(x,y,z,y===h?GRASS:y>h-3?DIRT:STONE);
  }
  if(h<22)for(let y=h+1;y<=22;y++)edits.push(x,y,z,WATER|((y===22?(x+z)%8:0)<<16));
  else{const r=rand();if(r<0.08)edits.push(x,h+1,z,TALL);else if(r<0.1)edits.push(x,h+1,z,TORCH);
   else if(r<0.13)edits.push(x,h+1,z,GLASS,x,h+2,z,GLASS);else if(r<0.15)for(let y=h+1;y<h+5;y++)edits.push(x,y,z,LEAVES);}
 }
 world.setBlocks(edits);
}
const world=new VoxelWorld({blocks});terrain(world);
// Separate chunks: a glass and stone checkerboard, uniform stone, uniform water, all air, and one with a slab.
world.addChunk(5,0,0);world.addChunk(7,0,0);world.addChunk(9,0,0);world.addChunk(11,0,0);world.addChunk(13,0,0);
{const e=[];for(let y=0;y<32;y++)for(let z=0;z<32;z++)for(let x=0;x<32;x++){
 if((x+y+z)&1)e.push(160+x,y,z,GLASS);else if(x%3===0)e.push(160+x,y,z,STONE);
 e.push(224+x,y,z,STONE,288+x,y,z,WATER);}
 e.push(416,5,5,STONE,417,5,5,slabState(SLAB));world.setBlocks(e);}
const lighting=VoxelLighting.attach(world,{budget:Infinity});lighting.update();
const KEYS=['5,0,0','7,0,0','9,0,0','11,0,0','13,0,0'];
for(let cz=0;cz<3;cz++)for(let cx=0;cx<3;cx++)for(let cy=0;cy<2;cy++)KEYS.push(`${cx},${cy},${cz}`);
const keys=()=>KEYS;
const same=(a,b)=>a.length===b.length&&a.every((v,i)=>v===b[i]);
async function compare(mesher,eye){
 const list=keys(),t0=performance.now(),gpu=await Promise.all(list.map((k)=>mesher.mesh(world,k,0,eye))),gpuMs=performance.now()-t0;
 const t1=performance.now(),cpu=list.map((k)=>meshChunk(meshInput(world,k))),cpuMs=performance.now()-t1;
 const bad=[];let quads=0;
 list.forEach((k,i)=>{const g=gpu[i],c=cpu[i];
  if(eye){const [cx,cy,cz]=k.split(',').map(Number);sortQuads(c.translucent,[eye[0]-cx*32,eye[1]-cy*32,eye[2]-cz*32]);}
  for(const l of ['opaque','cutout','translucent']){quads+=c[l].length/3;if(!same(g[l],c[l]))bad.push(`${k} ${l} gpu ${g[l].length/3} cpu ${c[l].length/3}`);}
  if(g.visibility!==c.visibility)bad.push(`${k} visibility ${g.visibility} ${c.visibility}`);});
 return {chunks:list.length,quads,bad,gpuMs,cpuMs};
}
const readCanvas=()=>{const c=new OffscreenCanvas(canvas.width,canvas.height).getContext('2d');c.drawImage(canvas,0,0);return c.getImageData(0,0,canvas.width,canvas.height).data;};
async function picture(options){
 for(const k of keys())world.dirty.add(k);
 const voxels=VoxelRenderer.attach(engine,{world,textures,workers:2,...options});
 let stable=0;
 for(let i=0;i<4000&&stable<4;i++){engine.render({delta:0});await device.queue.onSubmittedWorkDone();await new Promise((r)=>setTimeout(r,1));
  stable=!world.dirty.size&&!voxels.stats.pending&&!voxels.stats.compiling&&voxels.stats.draws?stable+1:0;}
 if(stable<4)throw new Error('renderer did not settle');
 // Read in the task that drew: once presented, a WebGPU canvas's texture may read back blank.
 engine.render({delta:0});const image=readCanvas(),draws=voxels.stats.draws;voxels.dispose();return {image,draws};
}
window.check={
 errors:()=>errors,
 async run(){
  const mesher=new GpuVoxelMesher(device,{batch:8});mesher.warm();
  const first=await compare(mesher);
  const sorted=await compare(mesher,[40.5,30,20.5]);
  // A large edit: a 60 x 24 x 60 hole through several chunks, light updated, then every chunk again.
  const e=[];for(let y=6;y<30;y++)for(let z=10;z<70;z++)for(let x=10;x<70;x++)e.push(x,y,z,0);world.setBlocks(e);lighting.update();
  const edited=await compare(mesher);
  const stats={...mesher.stats};
  const cpuPicture=await picture({}),gpuMesher=new GpuVoxelMesher(device),gpuPicture=await picture({mesher:gpuMesher});
  let differ=0;for(let i=0;i<cpuPicture.image.length;i+=4)if(cpuPicture.image[i]!==gpuPicture.image[i]||cpuPicture.image[i+1]!==gpuPicture.image[i+1]||cpuPicture.image[i+2]!==gpuPicture.image[i+2])differ++;
  let lit=0;for(let i=0;i<gpuPicture.image.length;i+=4)if(gpuPicture.image[i]+gpuPicture.image[i+1]+gpuPicture.image[i+2]>30)lit++;
  const rendererStats={...gpuMesher.stats};
  mesher.dispose();gpuMesher.dispose();
  let disposed='';try{mesher.mesh(world,'0,0,0');}catch(err){disposed=err.code;}
  return {first,sorted,edited,stats,differ,lit,pixels:canvas.width*canvas.height,draws:[cpuPicture.draws,gpuPicture.draws],rendererStats,disposed};
 },
};
window.ready=true;
</script></body></html>
