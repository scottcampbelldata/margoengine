<!doctype html><html><head><meta charset="utf-8"/><title>Voxel restore browser check</title><style>body{margin:0}canvas{display:block;width:320px;height:240px}</style></head><body><canvas></canvas>
<script type="module">
// Real-GPU proof that a VoxelRenderer with a caller's GpuVoxelMesher and a VoxelGI keeps drawing after a device restore,
// driven by restore-browser-check.mjs. A white floor and a sunlit red wall, meshed by a GpuVoxelMesher the page made
// and lit by VoxelGI. The device is destroyed and the engine restores a new one. Frames drawn before the next
// VoxelGI.update() must bind nothing of the lost device (KB-RESTORE-VOXGI1); the renderer meshes every chunk again
// with the caller's mesher on the new device (KB-RESTORE-VOXMESH1); once settled the picture matches the one before.
import {Engine} from '/packages/core/dist/index.js';
import {BlockTypes,VoxelWorld} from '/packages/voxel/dist/index.js';
import {VoxelLighting} from '/packages/voxel/dist/light.js';
import {VoxelGI} from '/packages/voxel/dist/gi.js';
import {GpuVoxelMesher} from '/packages/voxel/dist/gpu-mesher.js';
import {BlockTextures,VoxelRenderer} from '/packages/voxel/dist/render.js';
const canvas=document.querySelector('canvas'),errors=[],reported=[];
const engine=await Engine.create(canvas,{backend:'webgpu',camera:{position:[30,22,6],target:[30,1,30],near:0.1,far:200}});
engine.onError=(e)=>reported.push(`${e?.code??''} ${e?.message??e}`);
const watch=(device)=>device.addEventListener('uncapturederror',(e)=>errors.push(e.error.message));
watch(engine.gpu);
const l=[0.45,0.8,-0.4],n=Math.hypot(...l);engine.lighting.direction.set(l.map((v)=>v/n));engine.lighting.radiance.set([1.2,1.2,1.2]);
const tex=(r,g,b)=>({width:16,height:16,data:Uint8Array.from({length:1024},(_,i)=>[r,g,b,255][i&3])});
const textures=new BlockTextures({images:[tex(190,190,190),tex(230,30,20)]});
const blocks=new BlockTypes();const WHITE=blocks.define('white',{textures:0});const RED=blocks.define('red',{textures:1});
const world=new VoxelWorld({blocks}),e=[];
for(let cz=0;cz<2;cz++)for(let cx=0;cx<2;cx++)world.addChunk(cx,0,cz);
for(let z=0;z<64;z++)for(let x=0;x<64;x++)e.push(x,0,z,WHITE);
for(let y=1;y<12;y++)for(let x=14;x<26;x++)e.push(x,y,30,RED);
world.setBlocks(e);
const lighting=VoxelLighting.attach(world,{budget:Infinity});lighting.update();
const mesher=new GpuVoxelMesher(engine.gpu);
const voxels=VoxelRenderer.attach(engine,{world,textures,mesher});
const gi=VoxelGI.attach(engine,{world,albedo:{red:[0.8,0.05,0.03],white:[0.8,0.8,0.8]},softness:0.08,cells:262144,rays:8,strength:4});
gi.add(voxels);
const readCanvas=()=>{const c=new OffscreenCanvas(canvas.width,canvas.height).getContext('2d');c.drawImage(canvas,0,0);return c.getImageData(0,0,canvas.width,canvas.height).data;};
const project=(p)=>{const m=engine.camera.matrix,v=[0,1,2,3].map((r)=>m[r]*p[0]+m[4+r]*p[1]+m[8+r]*p[2]+m[12+r]);return [(v[0]/v[3]*0.5+0.5)*canvas.width,(0.5-v[1]/v[3]*0.5)*canvas.height];};
const at=(image,p,r=1)=>{const [px,py]=project(p).map(Math.round),s=[0,0,0];let k=0;
 for(let y=py-r;y<=py+r;y++)for(let x=px-r;x<=px+r;x++){const o=(y*canvas.width+x)*4;for(let c=0;c<3;c++)s[c]+=image[o+c];k++;}return s.map((v)=>v/k);};
// One frame; a throw from render (core throws an uncaptured validation error from the next frame) is recorded.
const draw=(update)=>{try{if(update)gi.update();engine.render({delta:0});}catch(error){errors.push(`render threw: ${error?.message??error}`);}};
async function settle(count,phase){let stable=0;
 for(let i=0;i<4000&&(stable<4||count>0);i++){draw(true);await engine.gpu.queue.onSubmittedWorkDone();await new Promise((r)=>setTimeout(r,1));count--;
  stable=!world.dirty.size&&!voxels.stats.pending&&!voxels.stats.compiling&&voxels.stats.draws?stable+1:0;}
 if(stable<4)throw new Error(`renderer did not settle ${phase}: errors ${JSON.stringify(errors.slice(0,3))}, reported ${JSON.stringify(reported.slice(0,3))}, pending ${voxels.stats.pending}, draws ${voxels.stats.draws}`);
 draw(true);return readCanvas();}
const nearWall=[20,1,28.5],open=[50,1,14],wall=[20,6,29.9];
const sample=(image)=>({nearWall:at(image,nearWall),open:at(image,open),wall:at(image,wall)});
window.check={
 errors:()=>errors,
 reported:()=>reported,
 async run(){
  const before=sample(await settle(48,"before")),meshedBefore=mesher.stats.gpu;
  const previous=engine.gpu;previous.destroy();await previous.lost;
  await engine.rebootDevice();
  const restored=engine.gpu!==previous;watch(engine.gpu);
  // Frames drawn before VoxelGI.update() runs again: they must not bind the lost device's volumes.
  for(let i=0;i<3;i++){draw(false);await engine.gpu.queue.onSubmittedWorkDone();await new Promise((r)=>setTimeout(r,1));}
  const early=errors.length;
  const after=sample(await settle(48,"after"));
  return {restored,before,after,early,meshedBefore,meshedAfter:mesher.stats.gpu};
 },
};
window.ready=true;
</script></body></html>
