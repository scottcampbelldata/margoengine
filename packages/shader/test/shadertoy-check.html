<!doctype html><html><head><meta charset="utf-8"><title>Shadertoy programs</title><style>body{margin:0}canvas{width:32px;height:32px;display:block}</style></head><body><canvas id="margo"></canvas>
<script type="module">
// Each source of test/shadertoy-fixtures.js through Shadertoy as a pass, as toy.texture shown by a pass, and as

const raw=RawShaders.attach(engine);
// The quad of the mesh leg covers the canvas; a ShaderMaterial reads uv as given (v up, as GL's).
const quad={positions:[-1.5,-1.5,0,1.5,-1.5,0,1.5,1.5,0,-1.5,1.5,0],uvs:[0,0,1,0,1,1,0,1],indices:[0,1,2,0,2,3]},glUv=[0,0,1,0,1,1,0,1];

function gpuTexture(kind){

let toy,stack,mesh,extra=[];

}
// GL's matrices for a look-at camera and a perspective projection (OpenGL ES 3.0 section 2.13, clip z from -w to w).

const display='#version 300 es\nprecision highp float;uniform sampler2D toyTexture;out vec4 c;\nvoid main(){c=texelFetch(toyTexture,ivec2(gl_FragCoord.xy),0);}\n';
window.check={
  modes:(i)=>toyFixtures[i].pass?['pass']:['pass','texture','mesh'],
  async draw(i,mode){
    clear();
    const f=toyFixtures[i];
    toy=new Shadertoy({image:{source:f.source,...channelsOf(f)},resolution:[W,H]});
    apply(1);
    if(mode==='pass'){
      const stages=[toy.pass()];
      if(f.pass){const g=new ShaderPass({fragmentShader:passGenerator.fragment},{name:'generator'});extra.push(g);stages.unshift(g);}
      stack=PostStack.attach(engine,stages);

      engine.use(toy);

      mesh=raw.add(shaderMesh(quad,toy.material()));

  },
  async change(){apply(2);return settle();},
  oracle:(i,mode,which)=>oracle(toyFixtures[i],mode,which,toyFixtures[i].pass?oracle(null,'generator',1):undefined),
  close(){clear();engine.dispose();return errors.splice(0);},

// Multipass: the toy as a pass, a texture and a mesh material, drawn frame by frame with the clock paused and the

const media=[];

const lists={multi:multiFixtures,cube:cubeFixtures};
