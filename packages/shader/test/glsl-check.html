<!doctype html><html><head><meta charset="utf-8"><title>GLSL functions in node graphs</title><style>body{margin:0}#host{width:32px;height:32px}#host canvas{min-height:0!important;height:32px!important}</style></head><body><div id="host"></div>
<script type="module">
import {createStage} from '/packages/stage/dist/index.js';
import {Texture,createMesh} from '/packages/materials/dist/index.js';
import {planeGeometry} from '/packages/geometry/dist/index.js';
import {PostStack} from '/packages/post/dist/index.js';
import {NodePass,NodeMaterial,uniform,uv,vec2,vec3,oneMinus,positionLocal,wgslFn,texture} from '/packages/shader/dist/index.js';
import {glslFn,toGLSL} from '/packages/shader/dist/glsl.js';
import * as layer from '/packages/webgl2-compat/dist/glsl.js';
import {glslFixtures,fixtureImage} from '/packages/shader/test/glsl-fixtures.js';
const W=32,H=32,stage=await createStage('#host',{backend:'webgpu',autoStart:false,controls:false,camera:{position:[0,0,2.5],target:[0,0,0]}}),engine=stage.engine,device=engine.gpu,errors=[];
device.addEventListener('uncapturederror',e=>errors.push(e.error.message));
engine.onError=e=>errors.push(e.message);
const bytes=fixtureImage(),image=new Texture({data:bytes,width:8,height:8},{colorSpace:'linear',mipmaps:false,minFilter:'nearest',magFilter:'nearest'});
// The oracle: each fixture as written, compiled by the browser's own WebGL2 compiler (Donaldson et al., OOPSLA 2017).
const canvas=document.createElement('canvas');canvas.width=W;canvas.height=H;
const gl=canvas.getContext('webgl2',{preserveDrawingBuffer:true,antialias:false,premultipliedAlpha:false});
const buffer=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buffer);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
const glTexture=gl.createTexture();gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,glTexture);
gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,8,8,0,gl.RGBA,gl.UNSIGNED_BYTE,bytes);
for(const [k,v] of [[gl.TEXTURE_MIN_FILTER,gl.NEAREST],[gl.TEXTURE_MAG_FILTER,gl.NEAREST],[gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE],[gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE]])gl.texParameteri(gl.TEXTURE_2D,k,v);
const compile=(type,source)=>{const s=gl.createShader(type);gl.shaderSource(s,source);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s)+'\n'+source);return s;};
const link=(vs,fs)=>{const p=gl.createProgram();gl.attachShader(p,compile(gl.VERTEX_SHADER,vs));gl.attachShader(p,compile(gl.FRAGMENT_SHADER,fs));gl.linkProgram(p);if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(p));return p;};
const programs=glslFixtures.map(f=>{
  const legacy=/^\s*#\s*version\s+100/m.test(f.source),body=f.source.replace(/^\s*#\s*version[^\n]*\n/,''),entry=[...body.matchAll(/\bvec4\s+(\w+)\s*\(/g)].at(-1)[1],call=`${entry}(v_uv,T${f.texture?',img':''})`;
  return legacy
    ?link('#version 100\nattribute vec2 position;varying vec2 v_uv;void main(){gl_Position=vec4(position,0,1);v_uv=position*0.5+0.5;}',`#version 100\nprecision highp float;\n${body}\nvarying vec2 v_uv;uniform float T;uniform sampler2D img;void main(){gl_FragColor=${call};}`)
    :link('#version 300 es\nin vec2 position;out vec2 v_uv;void main(){gl_Position=vec4(position,0,1);v_uv=position*0.5+0.5;}',`#version 300 es\nprecision highp float;precision highp int;\n${body}\nin vec2 v_uv;out vec4 o;uniform float T;uniform sampler2D img;void main(){o=${call};}`);
});
const settle=async()=>{engine.render();await device.queue.onSubmittedWorkDone();return errors.splice(0);};
const t=uniform(0.25),flipped=vec2(uv().x,oneMinus(uv().y));
const tint=glslFn(glslFixtures[0].source),twin=wgslFn('fn tintTwin(uv: vec2f, t: f32) -> vec4f { let c = vec3f(uv, 0.25); return vec4f(mix(c, c.bgr, vec3f(t)), 1.0); }');
const pick=glslFn('vec4 pick(sampler2D img, vec2 uv) { return texture(img, uv); }');
let stack,mesh,material;
const clear=()=>{stack?.dispose();stack=undefined;mesh?.destroy();mesh=undefined;};
window.check={
  // Fixture i through glslFn in a NodePass (rows from the top).
  async pass(i,value){clear();t.value=value;const f=glslFixtures[i];stack=PostStack.attach(engine,[new NodePass(glslFn(f.source)(flipped,t,...(f.texture?[image]:[])))]);return settle();},
  // The oracle's pixels for fixture i, rows from the top, as RGB.
  oracle(i,value){const p=programs[i];gl.useProgram(p);const at=gl.getAttribLocation(p,'position');gl.bindBuffer(gl.ARRAY_BUFFER,buffer);gl.enableVertexAttribArray(at);gl.vertexAttribPointer(at,2,gl.FLOAT,false,0,0);
    gl.uniform1f(gl.getUniformLocation(p,'T'),value);gl.uniform1i(gl.getUniformLocation(p,'img'),0);gl.viewport(0,0,W,H);gl.drawArrays(gl.TRIANGLES,0,3);
    const out=new Uint8Array(W*H*4);gl.readPixels(0,0,W,H,gl.RGBA,gl.UNSIGNED_BYTE,out);if(gl.getError()!==gl.NO_ERROR)throw new Error('oracle GL error');
    const rgb=[];for(let y=H-1;y>=0;y--)for(let x=0;x<W;x++)rgb.push(...out.slice((y*W+x)*4,(y*W+x)*4+3));return rgb;},
  // A NodeMaterial whose colour and vertex offset come from GLSL, or from the same graph written in WGSL and texture().
  async material(kind,glsl){clear();
    const color=kind==='tint'?(glsl?tint(uv(),0.25):twin(uv(),0.25)).rgb:(glsl?pick(image,uv()):texture(image,uv())).rgb;
    const lift=(glsl?tint(uv(),0.5):twin(uv(),0.5)).x.mul(0.2);
    material=new NodeMaterial({shading:'basic',colorNode:color,positionNode:positionLocal.add(vec3(0,0,lift))});
    mesh=createMesh(engine,planeGeometry(2,2),material);return settle();},
  // Strict keeps WGSL's derivative uniformity rule: an implicit lookup in a per-pixel branch is then a WebGPU error.
  async strict(on){const f=glslFixtures[3];const code=new NodePass(glslFn(f.source,{strict:on})(uv(),t,image)).code();
    const info=await device.createShaderModule({code,...(on?{label:'expect-error:glsl-strict'}:{})}).getCompilationInfo();errors.splice(0);return info.messages.filter(m=>m.type==='error').length;},
  // Every toGLSL program (each fixture's pass and the last material drawn) compiles and links in this browser's WebGL2.
  compile(){const failed=[];const targets=[...glslFixtures.map(f=>new NodePass(glslFn(f.source)(uv(),t,...(f.texture?[image]:[])))),material];
    for(const target of targets){try{const p=toGLSL(target,layer);link(p.vertex.source,p.fragment.source);}catch(e){failed.push(String(e.message).slice(0,400));}}
    return {failed,count:targets.length};},
  close(){clear();image.dispose();stage.dispose();return errors.splice(0);}
};window.ready=true;
</script></body></html>
