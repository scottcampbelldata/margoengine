<!doctype html><html><head><meta charset="utf-8"/><title>Scene pass check</title><style>body{margin:0}#host{width:400px;height:400px}</style></head><body><div id="host"></div>
<script type="module">
import {createStage} from '/packages/stage/dist/index.js';
import {planeGeometry} from '/packages/geometry/dist/index.js';
import {Material,createMesh} from '/packages/materials/dist/index.js';
import {PostStack} from '/packages/post/dist/index.js';
import {NodeMaterial,NodePass,inputColor,materialEmissive,screenUV,select,texture,uniform,uv,vec2,vec3,vec4} from '/packages/shader/dist/index.js';
import {PassMaterial,ScenePass} from '/packages/shader/dist/pass.js';
const stage=await createStage('#host',{backend:'webgpu',autoStart:false,controls:false,camera:{position:[0,0,3],target:[0,0,0]}});
const engine=stage.engine,device=engine.gpu,errors=[];
device.addEventListener('uncapturederror',e=>errors.push(e.error.message));
engine.lighting.direction[3]=0;engine.lighting.radiance[3]=0;
const black={color:[0,0,0],toneMapped:false};
const plane=(w,h,material,at=[0,0,0])=>{const m=createMesh(engine,planeGeometry(w,h),material);m.root.setPosition(at);return m;};
// A plane near the camera, not in the pass, that fills the picture with what `node` reads.
const viewer=node=>plane(4,4,new NodeMaterial({...black,emissiveNode:node}),[0,0,1]);
const cleanup=(...parts)=>({destroy(){for(const part of parts)typeof part==='function'?part():part.destroy();}});
const remove=pass=>()=>engine.removePlugin(pass.name);
// Left half red and right half blue, by uv, as a lit-free emissive wall.
const halves=()=>new NodeMaterial({...black,emissiveNode:select(uv().x.lessThan(0.5),vec3(1,0,0),vec3(0,0,1))});
const sun=(power)=>{engine.lighting.direction.set([0.6,0,0.8,power]);engine.lighting.radiance.set([1,1,1,0]);return ()=>{engine.lighting.direction[3]=0;engine.lighting.radiance[3]=0;};};
const sunWall=(toneMapped)=>plane(4,4,new Material({color:[0.5,0.4,0.3],roughness:1,metalness:0,toneMapped}));
const sunPass=(power,toneMapped)=>{const off=sun(power),pass=ScenePass.attach(engine,{outputs:{color:'rgba16float'}}),wall=sunWall(toneMapped);pass.add(wall);
  const shown=plane(4,4,new NodeMaterial({color:[0,0,0],toneMapped,emissiveNode:texture(pass.texture('color'),screenUV).rgb}),[0,0,1]);
  return cleanup(remove(pass),wall,shown,off);};
const sunDirect=(power,toneMapped)=>{const off=sun(power),wall=sunWall(toneMapped);return cleanup(wall,off);};
const scenarios={
  // A glowing plane with a plain one half across it: the plain one hides the glow it covers.
  glow:()=>{const pass=ScenePass.attach(engine,{outputs:{glow:'rgba16float',mask:'rgba8unorm'}}),
    lit=plane(1,1,new PassMaterial({...black,outputs:{glow:vec4(1,0,0,1),mask:vec4(0,1,0,1)}})),
    cover=plane(0.5,1,new Material({color:[1,1,1]}),[0.25,0,0.2]);pass.add(lit);pass.add(cover);
    const shown=viewer(texture(pass.texture('glow'),screenUV).rgb.add(texture(pass.texture('mask'),screenUV).rgb));
    return cleanup(remove(pass),lit,cover,shown);},
  // What a graph writes follows the graph: an output that reads uv.
  graph:()=>{const pass=ScenePass.attach(engine,{outputs:{data:'rgba16float'}}),m=plane(1,1,new PassMaterial({...black,outputs:{data:vec4(uv(),0,1)}}));pass.add(m);
    return cleanup(remove(pass),m,viewer(texture(pass.texture('data'),screenUV).rgb));},
  // The scene as it is drawn, then read back through the pass on a viewer.
  direct:()=>plane(4,4,halves()),
  litColor:()=>{const pass=ScenePass.attach(engine,{outputs:{color:'rgba16float'}}),wall=plane(4,4,halves());pass.add(wall);
    return cleanup(remove(pass),wall,viewer(texture(pass.texture('color'),screenUV).rgb));},
  // Sunlight, plain and tone mapped: the output holds linear light, so a viewer encodes and tone maps it once.
  sunDirect:()=>sunDirect(Math.PI*2,false),
  sunColor:()=>sunPass(Math.PI*2,false),
  toneDirect:()=>sunDirect(Math.PI*6,true),
  toneColor:()=>sunPass(Math.PI*6,true),
  // The material's final emissive and a live uniform as outputs.
  emissive:()=>{const pass=ScenePass.attach(engine,{outputs:{e:'rgba16float'}}),m=plane(1,1,new PassMaterial({...black,emissiveNode:vec3(0.5,0,0),outputs:{e:vec4(materialEmissive,1)}}));pass.add(m);
    return cleanup(remove(pass),m,viewer(texture(pass.texture('e'),screenUV).rgb));},
  uniformOutput:()=>{const u=uniform(0.1),pass=ScenePass.attach(engine,{outputs:{loop:'rgba16float'}}),m=plane(1,1,new PassMaterial({...black,outputs:{loop:vec4(0,u,0,1)}}));pass.add(m);u.value=0.5;
    return cleanup(remove(pass),m,viewer(texture(pass.texture('loop'),screenUV).rgb));},
  // A mesh moved just before a frame is in its new place in that frame's pass, which runs before the colour pass.
  moved:async()=>{const pass=ScenePass.attach(engine,{outputs:{glow:'rgba16float'}}),lit=plane(1,1,new PassMaterial({...black,outputs:{glow:vec4(1,0,0,1)}}));pass.add(lit);
    const shown=viewer(texture(pass.texture('glow'),screenUV).rgb);
    engine.render();await device.queue.onSubmittedWorkDone();
    lit.root.setPosition([1,0,0]);stepped=true;
    return cleanup(remove(pass),lit,shown,()=>{stepped=false;});},
  // The screen behind a surface: a pane not in the pass shows the wall behind it, shifted a quarter of the picture.
  refraction:()=>{const pass=ScenePass.attach(engine,{outputs:{color:'rgba16float'}}),wall=plane(8,8,halves());pass.add(wall);
    const pane=plane(1,1,new NodeMaterial({...black,emissiveNode:texture(pass.texture('color'),screenUV.add(vec2(0.25,0))).rgb}),[0,0,0.5]);
    return cleanup(remove(pass),wall,pane);},
  // A plain NodePass reads an output: selective glow added to the picture.
  post:()=>{const pass=ScenePass.attach(engine,{outputs:{glow:'rgba16float'}}),lit=plane(1,1,new PassMaterial({...black,outputs:{glow:vec4(0,1,0,1)}}));pass.add(lit);
    const add=new NodePass(inputColor().rgb.add(texture(pass.texture('glow'),uv()).rgb)),stack=PostStack.attach(engine,[add]);
    return cleanup(()=>engine.removePlugin(stack.name),remove(pass),lit);},
  // A PassMaterial in no pass draws as a NodeMaterial.
  alone:()=>plane(1,1,new PassMaterial({color:[0,0,0],toneMapped:false,emissiveNode:vec3(0,0,1),outputs:{glow:vec4(1,0,0,1)}})),
  // The camera steps along x between frames: each pixel of the wall moves by the step on screen.
  velocity:async()=>{
    const pass=ScenePass.attach(engine,{outputs:{motion:'rgba16float'}}),wall=plane(8,8,new PassMaterial({...black,outputs:{motion:vec4(pass.velocity(),0,1)}}));pass.add(wall);
    const shown=viewer(texture(pass.texture('motion'),screenUV).rgb.mul(vec3(-1,1,1)).add(vec3(0.25,0.5,0)));
    engine.render();await device.queue.onSubmittedWorkDone();
    engine.camera.position=[0.1,0,3];engine.camera.target=[0.1,0,0];stepped=true;
    return cleanup(remove(pass),wall,shown,()=>{engine.camera.position=[0,0,3];engine.camera.target=[0,0,0];stepped=false;});
  },
  // A new canvas size makes new targets, and a material that reads them follows.
  resized:async()=>{
    const pass=ScenePass.attach(engine,{outputs:{glow:'rgba16float'}}),lit=plane(1,1,new PassMaterial({...black,outputs:{glow:vec4(1,0,0,1)}}));pass.add(lit);
    const shown=viewer(texture(pass.texture('glow'),screenUV).rgb);
    engine.render();await device.queue.onSubmittedWorkDone();
    document.getElementById('host').style.width='300px';document.getElementById('host').style.height='300px';
    await new Promise(done=>requestAnimationFrame(()=>requestAnimationFrame(done)));
    return cleanup(remove(pass),lit,shown,()=>{document.getElementById('host').style.width='400px';document.getElementById('host').style.height='400px';});
  },
};
let stepped=false;
window.check={
  // One frame only after the scenario for velocity, which measures one camera step.
  async run(name){device.pushErrorScope('validation');window.current=await scenarios[name]();engine.render();await device.queue.onSubmittedWorkDone();if(!stepped){engine.render();await device.queue.onSubmittedWorkDone();}const e=await device.popErrorScope();return {errors:[...(e?[e.message]:[]),...errors.splice(0)]};},
  clear(){window.current?.destroy();window.current=null;engine.render();},
  // The UV step of the wall point at the picture's centre when the camera moves 0.1 along x at distance 3: matrix[0] is the projection's x scale, as this camera looks straight down z.
  camera(){return {step:0.1/3*engine.camera.matrix[0]*0.5};},
};
window.ready=true;
</script></body></html>
