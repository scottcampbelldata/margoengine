<!doctype html><html><head><meta charset="utf-8"/><title>Sky Hillaire check</title><style>body{margin:0}canvas{display:block;width:128px;height:96px}</style></head><body><canvas width="128" height="96"></canvas>
<script type="module">
// The Hillaire sky on a real GPU, read from Bloom's HDR scene capture: its colours at noon, sunset and twilight (with
// and without ozone), from orbit, across the top of the air (table against direct march), its sun disc and that it
// leaves geometry alone. Driven by features-check.mjs.
import {Engine,PbrMaterial,box} from '/packages/core/dist/index.js';
import {sceneSamples} from '/packages/core/dist/quality.js';
import {Bloom} from '/packages/post/dist/bloom.js';
import {HillaireSky} from '/packages/sky/dist/hillaire.js';
if(new URLSearchParams(location.search).get('samples')==='1')globalThis.margoLow=1;
const engine=await Engine.create(document.querySelector('canvas'),{backend:'webgpu',camera:{position:[0,2,0],target:[0,2,-1],fov:20,near:0.5,far:100000}}),device=engine.gpu,errors=[];
engine.stop();
device.addEventListener('uncapturederror',e=>errors.push(e.error.message));
const post=Bloom.attach(engine,{strength:0,threshold:1,exposure:0}),rad=Math.PI/180;
const pillar=engine.createMesh().setGeometry(box(4,40,4)).setMaterial(new PbrMaterial({color:'#808080',roughness:1,metalness:0})).setPosition([0,-1e7,0]);
const module=device.createShaderModule({code:'@group(0) @binding(0) var image:texture_2d<f32>;@group(0) @binding(1) var<storage,read_write> result:array<vec4f>;@compute @workgroup_size(8,8) fn main(@builtin(global_invocation_id) id:vec3u){let s=textureDimensions(image);if(id.x<s.x&&id.y<s.y){result[id.y*s.x+id.x]=textureLoad(image,id.xy,0);}}'});
const pipeline=device.createComputePipeline({layout:'auto',compute:{module,entryPoint:'main'}});
// The whole HDR capture after one frame; a pixel is read as image(x, y).
async function frame(){
 const t0=performance.now();engine.render({delta:0});
 const w=post.sceneTexture.width,h=post.sceneTexture.height,size=w*h*16;
 const output=device.createBuffer({size,usage:GPUBufferUsage.STORAGE|GPUBufferUsage.COPY_SRC}),staging=device.createBuffer({size,usage:GPUBufferUsage.COPY_DST|GPUBufferUsage.MAP_READ});
 const encoder=device.createCommandEncoder(),pass=encoder.beginComputePass();pass.setPipeline(pipeline);
 pass.setBindGroup(0,device.createBindGroup({layout:pipeline.getBindGroupLayout(0),entries:[{binding:0,resource:post.sceneTexture.createView()},{binding:1,resource:{buffer:output}}]}));
 pass.dispatchWorkgroups(Math.ceil(w/8),Math.ceil(h/8));pass.end();encoder.copyBufferToBuffer(output,0,staging,0,size);device.queue.submit([encoder.finish()]);
 await staging.mapAsync(GPUMapMode.READ);const v=new Float32Array(staging.getMappedRange().slice(0));staging.unmap();output.destroy();staging.destroy();
 const ms=performance.now()-t0;
 return {ms,at:(x,y)=>Array.from(v.subarray((y*w+x)*4,(y*w+x)*4+3)),w,h};
}
// Every texel of a float texture, as one Float32Array of RGBA.
async function texels(texture){
 const w=texture.width,h=texture.height,size=w*h*16;
 const output=device.createBuffer({size,usage:GPUBufferUsage.STORAGE|GPUBufferUsage.COPY_SRC}),staging=device.createBuffer({size,usage:GPUBufferUsage.COPY_DST|GPUBufferUsage.MAP_READ});
 const encoder=device.createCommandEncoder(),pass=encoder.beginComputePass();pass.setPipeline(pipeline);
 pass.setBindGroup(0,device.createBindGroup({layout:pipeline.getBindGroupLayout(0),entries:[{binding:0,resource:texture.createView()},{binding:1,resource:{buffer:output}}]}));
 pass.dispatchWorkgroups(Math.ceil(w/8),Math.ceil(h/8));pass.end();encoder.copyBufferToBuffer(output,0,staging,0,size);device.queue.submit([encoder.finish()]);
 await staging.mapAsync(GPUMapMode.READ);const v=new Float32Array(staging.getMappedRange().slice(0));staging.unmap();output.destroy();staging.destroy();return v;
}
// Aim the camera at azimuth (degrees from -z toward +x) and elevation, `height` metres up; the centre pixel is that ray.
function aim(azimuth,elevation,height=2){
 const a=azimuth*rad,e=elevation*rad;engine.camera.position=[0,height,0];
 engine.camera.target=[Math.sin(a)*Math.cos(e)*1000,height+Math.sin(e)*1000,-Math.cos(a)*Math.cos(e)*1000];
}
const sunAt=(azimuth,elevation)=>{const a=azimuth*rad,e=elevation*rad;return [Math.sin(a)*Math.cos(e),Math.sin(e),-Math.cos(a)*Math.cos(e)];};
async function centre(sky,options,az,el,height){
 Object.assign(sky.options,options);aim(az,el,height);await frame();const f=await frame();return {v:f.at(f.w>>1,f.h>>1),ms:f.ms,f};
}
window.check={samples:sceneSamples,
 async run(){
  device.pushErrorScope('validation');
  const sky=HillaireSky.attach(engine,{timeScale:0,sunDisc:false}),out={};
  // Noon: the sky 40 degrees up, 90 degrees from the sun.
  out.noon=(await centre(sky,{sunDirection:sunAt(0,60)},90,40)).v;
  // Sunset: the sun 2 degrees up, looking 4 degrees up toward it; and the sky opposite the sun.
  out.sunset=(await centre(sky,{sunDirection:sunAt(0,2)},0,4)).v;
  out.antisolar=(await centre(sky,{sunDirection:sunAt(0,2)},180,4)).v;
  // Twilight, the sun 4 degrees down: the sky 80 degrees up, with Earth's ozone and with none.
  out.twilight=(await centre(sky,{sunDirection:sunAt(0,-4)},180,80)).v;
  sky.options.atmosphere={ozone:[0,0,0]};
  out.twilightNoOzone=(await centre(sky,{},180,80)).v;
  // KB3454: a nearly closed conservative atmosphere (mean free path 1 km under a 100 km scale height, nothing absorbed,
  // a white ground), where 1 - f_ms rounds to zero as 1 minus a sum. The multiple scattering table and the sky stay finite.
  sky.options.atmosphere={rayleigh:[1,1,1],mie:1,mieAbsorption:0,rayleighHeight:100000,mieHeight:100000,groundAlbedo:[1,1,1],ozone:[0,0,0]};
  const closed=await centre(sky,{sunDirection:sunAt(0,60)},90,40),table=await texels(sky.table.multiple);
  let nonfinite=0,largest=0;for(let i=0;i<table.length;i++){if(i%4===3)continue;if(!Number.isFinite(table[i]))nonfinite++;else largest=Math.max(largest,table[i]);}
  const rows=[];for(let y=0;y<32;y++){let m=0;for(let x=0;x<32;x++)m=Math.max(m,table[(y*32+x)*4]);rows.push(m);}
  out.closed={sky:closed.v,nonfinite,largest,rows};
  sky.options.atmosphere=undefined;
  // Orbit, 1,000 km up, the sun overhead: the ground below, the limb (the planet's edge is 30.2 degrees down), and space.
  const orbit=(el)=>centre(sky,{sunDirection:sunAt(0,90),altitude:1e6},0,el);
  out.ground=(await orbit(-89)).v;out.limb=(await orbit(-29)).v;
  const space=await orbit(60);out.space=space.v;out.orbitMs=space.ms;
  // Across the top of the air (100 km): just under it the table, just over it the direct march, same ray.
  out.under=(await centre(sky,{sunDirection:sunAt(0,30),altitude:99000},180,-30)).v;
  out.over=(await centre(sky,{altitude:101000},180,-30)).v;
  // The sun's disc against the sky beside it.
  sky.options.sunDisc=true;
  const disc=await centre(sky,{sunDirection:sunAt(0,30),altitude:0},0,30);
  out.disc={centre:disc.v,beside:disc.f.at((disc.f.w>>1)+20,disc.f.h>>1),ms:disc.ms};
  sky.options.sunDisc=false;
  // A pillar 400 m away: its pixels stay as they were without the sky.
  pillar.setPosition([0,2,-400]);aim(0,0);sky.options.sunDirection=sunAt(90,40);
  await frame();const lit=await frame();sky.dispose();await frame();const bare=await frame();
  const px=[[64,48],[64,40],[64,56]];
  out.pillar={withSky:px.map(([x,y])=>lit.at(x,y)),bare:px.map(([x,y])=>bare.at(x,y)),skyPixel:[lit.at(64,8),bare.at(64,8)]};
  const error=await device.popErrorScope();
  return {...out,error:error?.message??null,errors:errors.splice(0)};
 }};
window.ready=true;
</script></body></html>
