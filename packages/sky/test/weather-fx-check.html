<!doctype html><html><head><meta charset="utf-8"/><title>Sky weather effects check</title><style>body{margin:0}canvas{display:block;width:256px;height:192px}</style></head><body><canvas width="256" height="192"></canvas>
<script type="module">
// Rain cover, splashes and lens drops on a real GPU, read back from Bloom's HDR scene capture and from the cover map.
// Driven by features-check.mjs.
import {Engine,PbrMaterial,box} from '/packages/core/dist/index.js';
import {sceneSamples} from '/packages/core/dist/quality.js';
import {Bloom} from '/packages/post/dist/bloom.js';
import {Sky} from '/packages/sky/dist/index.js';
import {Weather} from '/packages/sky/dist/weather.js';
import {WeatherFX} from '/packages/sky/dist/weather-fx.js';
import {waitForPipelines} from '/scripts/support/gpu-ready.js';
if(new URLSearchParams(location.search).get('samples')==='1')globalThis.margoLow=1;
const engine=await Engine.create(document.querySelector('canvas'),{backend:'webgpu',camera:{position:[0,1.5,0],target:[0,1.5,-10],near:0.1,far:2000}}),device=engine.gpu,errors=[];
engine.stop();
device.addEventListener('uncapturederror',e=>errors.push(e.error.message));
const post=Bloom.attach(engine,{strength:0,threshold:1,exposure:0});
const sky=new Sky({hours:11,timeScale:0});engine.use(sky);
const grey=new PbrMaterial({color:'#4a4a4a',roughness:0.9});
const ground=engine.createMesh().setGeometry(box(400,0.2,400)).setMaterial(grey);
// A roof 4 m up (top at 4.25) over x from -30 to 0.3, so the camera at x = 0 stands under its edge; parked far away
// until a case needs it, and a roof over everything.
const roof=engine.createMesh().setGeometry(box(30.3,0.5,80)).setMaterial(grey).setPosition([0,-500,0]);
const whole=engine.createMesh().setGeometry(box(80,0.5,80)).setMaterial(grey).setPosition([0,-500,0]);
const weather=new Weather({intensity:1,fadeSeconds:0});engine.use(weather);
const module=device.createShaderModule({code:'@group(0) @binding(0) var image:texture_2d<f32>;@group(0) @binding(1) var<storage,read_write> result:array<vec4f>;@compute @workgroup_size(8,8) fn main(@builtin(global_invocation_id) id:vec3u){let s=textureDimensions(image);if(any(id.xy>=s)){return;}result[id.y*s.x+id.x]=textureLoad(image,vec2i(id.xy),0);}'});
const pipeline=device.createComputePipeline({layout:'auto',compute:{module,entryPoint:'main'}});
const depthModule=device.createShaderModule({code:'@group(0) @binding(0) var image:texture_depth_2d;@group(0) @binding(1) var<storage,read_write> result:array<f32>;@compute @workgroup_size(8,8) fn main(@builtin(global_invocation_id) id:vec3u){let s=textureDimensions(image);if(any(id.xy>=s)){return;}result[id.y*s.x+id.x]=textureLoad(image,vec2i(id.xy),0);}'});
const depthPipeline=device.createComputePipeline({layout:'auto',compute:{module:depthModule,entryPoint:'main'}});
async function read(texture,depth=false){
 const bytes=texture.width*texture.height*(depth?4:16),output=device.createBuffer({size:bytes,usage:GPUBufferUsage.STORAGE|GPUBufferUsage.COPY_SRC}),staging=device.createBuffer({size:bytes,usage:GPUBufferUsage.COPY_DST|GPUBufferUsage.MAP_READ});
 const p=depth?depthPipeline:pipeline,encoder=device.createCommandEncoder(),pass=encoder.beginComputePass();pass.setPipeline(p);
 pass.setBindGroup(0,device.createBindGroup({layout:p.getBindGroupLayout(0),entries:[{binding:0,resource:texture.createView()},{binding:1,resource:{buffer:output}}]}));
 pass.dispatchWorkgroups(Math.ceil(texture.width/8),Math.ceil(texture.height/8));pass.end();encoder.copyBufferToBuffer(output,0,staging,0,bytes);device.queue.submit([encoder.finish()]);
 await staging.mapAsync(GPUMapMode.READ);const data=new Float32Array(staging.getMappedRange()).slice();staging.unmap();output.destroy();staging.destroy();return data;
}
const frame=async(delta=0)=>{engine.render({delta});await device.queue.onSubmittedWorkDone();return read(post.sceneTexture);};
const W=256,margin=4;
// Pixels that differ, in the left and right halves (a margin either side of the middle column left out).
const halves=(a,b)=>{let left=0,right=0;for(let p=0;p<a.length;p+=4){const x=(p/4)%W;let d=0;for(let c=0;c<3;c++)d=Math.max(d,Math.abs(a[p+c]-b[p+c]));if(d===0)continue;if(x<W/2-margin)left++;else if(x>=W/2+margin)right++;}return {left,right};};
const changed=(a,b)=>{let n=0;for(let p=0;p<a.length;p++)if(p%4!==3&&a[p]!==b[p])n++;return n;};
const place=(mesh,at)=>mesh.setPosition(at??[0,-500,0]);
window.check={samples:sceneSamples,
 async run(){
  device.pushErrorScope('validation');const out={};
  // Half the view under the roof: the rain stops under it, with the effects and only with them.
  place(roof,[-14.85,4,0]);
  weather.options.intensity=0;await waitForPipelines(frame);const bare=await frame();weather.options.intensity=1;
  await waitForPipelines(frame);const rain=await frame();
  let fx=WeatherFX.attach(engine,{weather,occluders:[roof,ground]});await waitForPipelines(frame);
  const covered=await frame();
  out.half={without:halves(rain,bare),with:halves(covered,bare)};
  // The cover map: the roof's top (4.25 m) over the texels left of x = 0.3, the ground's (0.1 m) to the right; depth
  // 0 is 1,000 m over the camera and 1 is 1,021 m below that (the box's 20 m and a metre).
  const map=await read(fx.coverTexture,true),n=fx.coverTexture.width,texel=50/n,top=1001.5,range=1021;let worst=0,checked=0;
  for(let j=0;j<n;j+=7)for(let i=0;i<n;i+=3){const x=-25+(i+0.5)*texel,z=-25+(j+0.5)*texel;if(Math.abs(x-0.3)<texel||Math.abs(z)>39)continue;const h=top-map[j*n+i]*range;worst=Math.max(worst,Math.abs(h-(x<0.3?4.25:0.1)));checked++;}
  out.map={worst,checked};fx.dispose();
  // Splashes on open ground: they change ground pixels; none land under the roof's half.
  place(roof);fx=WeatherFX.attach(engine,{weather,occluders:[ground],lensDrops:0});await waitForPipelines(frame);
  const splashed=await frame();fx.options.splashes=0;const dry=await frame();
  out.splashes=halves(splashed,dry);
  place(roof,[-14.85,4,0]);fx.options.occluders=[roof,ground];fx.options.splashes=3000;const under=await frame();fx.options.splashes=0;const underDry=await frame();
  out.splashesHalf=halves(under,underDry);fx.dispose();place(roof);
  // Lens drops: ten seconds in the open rain wet the lens; ten under a roof over everything leave it dry.
  for(const [name,cover] of [['open',null],['roofed',[0,4,0]]]){
   place(whole,cover);fx=WeatherFX.attach(engine,{weather,occluders:[ground,whole],splashes:0});await waitForPipelines(frame);
   // fixed-wait: steps the lens ten seconds of weather time, one second a frame; it waits for nothing
   for(let i=0;i<10;i++)await frame(1);
   const wet=await frame();fx.options.lensDrops=0;const clear=await frame();out[name]=changed(wet,clear);
   (window.shots??={})[name]={wet,clear};fx.dispose();
  }
  place(whole);
  (window.shots??={}).half={rain,covered,bare};window.shots.splash={splashed,dry};
  const error=await device.popErrorScope();
  return {...out,error:error?.message??null,errors:errors.splice(0)};
 }};
window.shot=(name,key)=>{const f=window.shots[name][key],o=new Array(f.length);for(let p=0;p<f.length;p++)o[p]=(p%4===3)?255:Math.round(255*Math.min(1,Math.pow(f[p]/(1+f[p]),1/2.2)));return o;};
window.ready=true;
</script></body></html>
