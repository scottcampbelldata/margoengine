<!doctype html><html><head><meta charset="utf-8"><title>Sky layers under an oblique near plane</title><style>canvas{width:96px;height:96px}</style></head><body><canvas width="96" height="96"></canvas><script type="module">
// A planar reflection captures with an oblique near plane (Lengyel, JGT 2005), which tilts the far plane: the point a
// layer unprojects at depth 0 can then lie behind the eye. The near plane only clips geometry, so every sky layer must
// draw the same picture with it as without it.
import {Engine} from '/packages/core/dist/index.js';
import {Sky} from '/packages/sky/dist/base.js';
import {preetham} from '/packages/sky/dist/preetham.js';
import {HillaireSky} from '/packages/sky/dist/hillaire.js';
import {Moon} from '/packages/sky/dist/moon.js';
import {Aurora} from '/packages/sky/dist/aurora.js';
import {Bloom} from '/packages/post/dist/bloom.js';
import {waitForPipelines} from '/scripts/support/gpu-ready.js';
// Core's WebGPU perspective (reversed depth) and the planar capture's oblique near plane, as in
// packages/environment/src/capture.ts: row 2 becomes row 3 minus the view-space plane scaled to the farthest corner.
function perspective(out,fov,aspect,near,far){const f=1/Math.tan(fov*Math.PI/360),d=near-far;out.fill(0);out[0]=f/aspect;out[5]=f;out[10]=-near/d;out[11]=-1;out[14]=-far*near/d;}
function obliqueNearPlane(p,plane){
 const m=[[p[0],p[4],p[8],p[12]],[p[1],p[5],p[9],p[13]],[p[2],p[6],p[10],p[14]],[p[3],p[7],p[11],p[15]]];
 // Perspective inverse by cofactors of this sparse matrix: x' = x/a, y' = y/b, z and w from the 2x2 block.
 const a=m[0][0],b=m[1][1],c=m[2][2],e=m[2][3],g=m[3][2],det=-e*g;
 const inv=new Float64Array(16);inv[0]=1/a;inv[5]=1/b;inv[11]=1/e;inv[14]=1/g;inv[15]=-c/(e*g);
 const clip=[0,1,2,3].map(k=>plane[0]*inv[k*4]+plane[1]*inv[k*4+1]+plane[2]*inv[k*4+2]+plane[3]*inv[k*4+3]);
 const reach=Math.abs(clip[0])+Math.abs(clip[1])+Math.max(0,clip[2])+clip[3];if(!(reach>0)||det===0)throw new Error('plane misses the frustum');
 for(let k=0;k<4;k++)p[k*4+2]=p[k*4+3]-plane[k]/reach;
}
const S=96,canvas=document.querySelector('canvas');
const albedo={width:8,height:4,data:new Uint8Array(8*4*4).fill(200)};
const layers={
 sky:(engine)=>Sky.attach(engine,{timeScale:0},{preetham}),
 hillaire:(engine)=>HillaireSky.attach(engine,{timeScale:0,sunDisc:false}),
 moon:(engine)=>Moon.attach(engine,{albedo,direction:[0.15,0.3,-1],sunDirection:[0,0,1],angularRadius:8,earthshine:0}),
 aurora:(engine)=>Aurora.attach(engine,{intensity:400,distance:60,speed:0}),
};
async function frames(name){
 const engine=await Engine.create(canvas,{backend:'webgpu',exactSize:true,camera:{position:[0,0,0],target:[0,0.35,-1],fov:60,near:0.1,far:1000}}),device=engine.gpu,errors=[];
 engine.stop();engine.scene.background='#000000';device.addEventListener('uncapturederror',e=>errors.push(e.error.message));
 layers[name](engine);
 const post=Bloom.attach(engine,{strength:0,threshold:1,exposure:0});
 const module=device.createShaderModule({code:'@group(0) @binding(0) var image:texture_2d<f32>;@group(0) @binding(1) var<storage,read_write> result:array<vec4f>;@compute @workgroup_size(8,8) fn main(@builtin(global_invocation_id) id:vec3u){let s=textureDimensions(image);if(any(id.xy>=s)){return;}result[id.y*s.x+id.x]=textureLoad(image,vec2i(id.xy),0);}'});
 const pipeline=device.createComputePipeline({layout:'auto',compute:{module,entryPoint:'main'}});
 async function frame(){
  engine.render({delta:0});await device.queue.onSubmittedWorkDone();
  const bytes=S*S*16,output=device.createBuffer({size:bytes,usage:GPUBufferUsage.STORAGE|GPUBufferUsage.COPY_SRC}),staging=device.createBuffer({size:bytes,usage:GPUBufferUsage.COPY_DST|GPUBufferUsage.MAP_READ});
  const encoder=device.createCommandEncoder(),pass=encoder.beginComputePass();pass.setPipeline(pipeline);pass.setBindGroup(0,device.createBindGroup({layout:pipeline.getBindGroupLayout(0),entries:[{binding:0,resource:post.sceneTexture.createView()},{binding:1,resource:{buffer:output}}]}));pass.dispatchWorkgroups(S/8,S/8);pass.end();encoder.copyBufferToBuffer(output,0,staging,0,bytes);device.queue.submit([encoder.finish()]);await staging.mapAsync(GPUMapMode.READ);const data=new Float32Array(staging.getMappedRange()).slice();staging.unmap();output.destroy();staging.destroy();return data;
 }
 device.pushErrorScope('validation');await waitForPipelines(frame);
 const plain=await frame();
 // A mirror's view plane below and ahead of the eye, the eye on its clipped side: keep 0.6 y - 0.8 z - 1 >= 0.
 engine.camera.project=(out,aspect)=>{perspective(out,60,aspect,0.1,1000);obliqueNearPlane(out,[0,0.6,-0.8,-1]);};
 const oblique=await frame();
 let peak=0,diff=0;for(let i=0;i<plain.length;i++){if(i%4===3)continue;peak=Math.max(peak,plain[i]);diff=Math.max(diff,Math.abs(plain[i]-oblique[i]));}
 const error=(await device.popErrorScope())?.message??null;engine.dispose();
 return {name,peak,diff,errors,error};
}
window.check={async run(){const out=[];for(const name of Object.keys(layers))out.push(await frames(name));return out;}};window.ready=true;
</script></body></html>
