<!doctype html><html><head><meta charset="utf-8"/><title>Sky look check</title><style>body{margin:0}canvas{display:block;width:128px;height:96px}</style></head><body><canvas width="128" height="96"></canvas>
<script type="module">
// The sky's look and atmosphere options on a real GPU, read from Bloom's HDR scene capture as mean linear RGB over
// three bands of the view: high (60 to 80 degrees up), mid (about 30 degrees) and horizon (0 to 8 degrees), with the
// camera looking north 40 degrees up and the sun 15 degrees up in the east. Driven by features-check.mjs ("look").
import {Engine} from '/packages/core/dist/index.js';
import {sceneSamples} from '/packages/core/dist/quality.js';
import {Bloom} from '/packages/post/dist/bloom.js';
import {Sky,fogOpticalDepth} from '/packages/sky/dist/index.js';
if(new URLSearchParams(location.search).get('samples')==='1')globalThis.margoLow=1;
const engine=await Engine.create(document.querySelector('canvas'),{backend:'webgpu',camera:{position:[0,2,0],target:[0,2,-1],fov:80,near:0.5,far:100000}}),device=engine.gpu,errors=[];
engine.stop();
engine.onError=(e)=>{globalThis.__engErr=(globalThis.__engErr??'')+String(e?.message??e)+'|';};
device.addEventListener('uncapturederror',e=>errors.push(e.error.message));
const post=Bloom.attach(engine,{strength:0,threshold:1,exposure:0}),rad=Math.PI/180;
const module=device.createShaderModule({code:'@group(0) @binding(0) var image:texture_2d<f32>;@group(0) @binding(1) var<storage,read_write> result:array<vec4f>;@compute @workgroup_size(8,8) fn main(@builtin(global_invocation_id) id:vec3u){let s=textureDimensions(image);if(id.x<s.x&&id.y<s.y){result[id.y*s.x+id.x]=textureLoad(image,id.xy,0);}}'});
const pipeline=device.createComputePipeline({layout:'auto',compute:{module,entryPoint:'main'}});
async function image(){
 engine.render({delta:0});
 const w=post.sceneTexture.width,h=post.sceneTexture.height,size=w*h*16;
 const output=device.createBuffer({size,usage:GPUBufferUsage.STORAGE|GPUBufferUsage.COPY_SRC}),staging=device.createBuffer({size,usage:GPUBufferUsage.COPY_DST|GPUBufferUsage.MAP_READ});
 const encoder=device.createCommandEncoder(),pass=encoder.beginComputePass();pass.setPipeline(pipeline);
 pass.setBindGroup(0,device.createBindGroup({layout:pipeline.getBindGroupLayout(0),entries:[{binding:0,resource:post.sceneTexture.createView()},{binding:1,resource:{buffer:output}}]}));
 pass.dispatchWorkgroups(Math.ceil(w/8),Math.ceil(h/8));pass.end();encoder.copyBufferToBuffer(output,0,staging,0,size);device.queue.submit([encoder.finish()]);
 await staging.mapAsync(GPUMapMode.READ);const v=new Float32Array(staging.getMappedRange().slice(0));staging.unmap();output.destroy();staging.destroy();
 return {w,h,v};
}
const aim=(elevation,azimuth=0)=>{const e=elevation*rad,a=azimuth*rad;engine.camera.target=[Math.sin(a)*Math.cos(e)*1000,2+Math.sin(e)*1000,-Math.cos(a)*Math.cos(e)*1000];};
// Mean RGB of rows a..b (fractions of the height) and the whole image; the second frame, as the sky settles in one.
async function bands(){
 await image();const {w,h,v}=await image(),band=(a,b)=>{const s=[0,0,0];let n=0;for(let y=Math.floor(a*h);y<Math.ceil(b*h);y++)for(let x=0;x<w;x++,n++)for(let c=0;c<3;c++)s[c]+=v[(y*w+x)*4+c];return s.map(x=>x/n);};
 return {high:band(0,0.12),mid:band(0.42,0.5),horizon:band(0.9,1),all:band(0,1),pixels:v};
}
const maxDiff=(a,b)=>{let m=0;for(let i=0;i<a.length;i++)if(i%4!==3)m=Math.max(m,Math.abs(a[i]-b[i])/Math.max(1e-4,Math.abs(b[i])));return m;};
const strip=(r)=>{const {pixels,...rest}=r;return rest;};
window.check={samples:sceneSamples,
 async run(){
  device.pushErrorScope('validation');
  const sun=[Math.cos(15*rad),Math.sin(15*rad),0],out={};
  const sky=Sky.attach(engine,{timeScale:0,sunDirection:sun});
  aim(40);
  const shot=async(name,set)=>{set(sky.options);out[name]=await bands();return out[name];};
  for(const model of ['preetham','bruneton']){
   const m=(o)=>{for(const k of ['look','atmosphere','clouds'])delete o[k];o.model=model;};
   const plain=await shot(model,m);
   // The options set with nothing moved: the physical sky again, within float rounding of the rewritten program.
   const neutral=await shot(model+'Neutral',o=>{m(o);o.look={};o.atmosphere={};});
   out[model+'NeutralDiff']=maxDiff(neutral.pixels,plain.pixels);
   await shot(model+'Zenith',o=>{m(o);o.look={zenithColor:[0.2,1,0.2],zenithStrength:1};});
   await shot(model+'Horizon',o=>{m(o);o.look={horizonColor:[1,0.15,0.1],horizonStrength:1};});
   await shot(model+'Gradient',o=>{m(o);o.look={gradientStrength:1,gradientIntensity:2,gradient:[{elevation:0,color:[1,0.5,0]},{elevation:90,color:[0.5,0,1]}]};});
   await shot(model+'Glow',o=>{m(o);o.look={glowStrength:2,glowWidth:10,glowSunward:0};});
   await shot(model+'SunIntensity',o=>{m(o);o.atmosphere={sunIntensity:2};});
   await shot(model+'SunColor',o=>{m(o);o.atmosphere={sunColor:[1,0.5,0.25]};});
   // Removed again: the exact program and data of the plain sky, so the exact frame.
   const back=await shot(model+'Back',m);
   out[model+'BackDiff']=maxDiff(back.pixels,plain.pixels);
  }
  const b=(o)=>{for(const k of ['look','atmosphere','clouds'])delete o[k];o.model='bruneton';};
  await shot('rayleighGreen',o=>{b(o);o.atmosphere={rayleighColor:[0.3,1,0.2]};});
  await shot('rayleighNone',o=>{b(o);o.atmosphere={rayleigh:0.1};});
  await shot('rayleighThick',o=>{b(o);o.atmosphere={rayleigh:3};});
  await shot('mieHaze',o=>{b(o);o.atmosphere={mie:15};});
  await shot('mieRed',o=>{b(o);o.atmosphere={mie:15,mieColor:[1,0.3,0.1]};});
  await shot('ozone',o=>{b(o);o.atmosphere={ozone:5};});
  aim(15,90);
  await shot('mieForward',o=>{b(o);o.atmosphere={mie:10,mieAnisotropy:0.2};});
  await shot('mieForwardTight',o=>{b(o);o.atmosphere={mie:10,mieAnisotropy:0.9};});
  // The glow's shape, with the sun at the centre of the view: mean luminance of the 4 x 4 pixels round the sun (within
  // about 2 degrees) and of the mid band's pixels 40 or more columns to either side (beyond about 30 degrees).
  for(const name of ['mieForward','mieForwardTight']){
   const v=out[name].pixels,w=128,lum=(i)=>0.2126*v[i]+0.7152*v[i+1]+0.0722*v[i+2],mean=(cells)=>cells.reduce((s,i)=>s+lum(i),0)/cells.length,near=[],far=[];
   for(let y=46;y<50;y++)for(let x=62;x<66;x++)near.push((y*w+x)*4);
   for(let y=40;y<48;y++)for(let x=0;x<w;x++)if(Math.abs(x+0.5-64)>=40)far.push((y*w+x)*4);
   out[name+'Shape']={near:mean(near),far:mean(far)};
  }
  // Toward the sun: the disc's size and colour.
  const discPixels=(r,limit)=>{let n=0;for(let i=0;i<r.pixels.length;i+=4)if(r.pixels[i]+r.pixels[i+1]+r.pixels[i+2]>limit)n++;return n;};
  const sunPlain=await shot('sunPlain',b),limit=0.5*Math.max(...Array.from({length:sunPlain.pixels.length/4},(_,i)=>sunPlain.pixels[4*i]+sunPlain.pixels[4*i+1]+sunPlain.pixels[4*i+2]));
  const sunBig=await shot('sunBig',o=>{b(o);o.look={sunDiscSize:4};});
  const sunRed=await shot('sunRed',o=>{b(o);o.look={sunDiscColor:[1,0.1,0.1]};});
  out.disc={plain:discPixels(sunPlain,limit),big:discPixels(sunBig,limit)};
  const peak=(r)=>{let best=0,at=0;for(let i=0;i<r.pixels.length;i+=4){const s=r.pixels[i]+r.pixels[i+1]+r.pixels[i+2];if(s>best){best=s;at=i;}}return Array.from(r.pixels.subarray(at,at+3));};
  out.sunPeak={plain:peak(sunPlain),red:peak(sunRed)};
  // The cloud sheet: colour and density, looking up into it.
  aim(60);
  await shot('cloudPlain',o=>{b(o);o.clouds={coverage:0.6};});
  await shot('cloudRed',o=>{b(o);o.clouds={coverage:0.6};o.look={cloudColor:[1,0.3,0.3]};});
  await shot('cloudThin',o=>{b(o);o.clouds={coverage:0.6};o.look={cloudDensity:0.2};});
  await shot('cloudClear',o=>{b(o);});
  // Below the horizon: the ground tint.
  aim(-30);
  await shot('groundPlain',b);
  await shot('groundTint',o=>{b(o);o.look={groundColor:[0.1,0.2,1],groundStrength:1};});
  // By day the low layer's transmittance leaves the frame as it was: the day sky takes the layer through sunColor.
  aim(40);
  const dayNeutral=await shot('dayNeutral',o=>{b(o);o.atmosphere={};});
  const dayLayer=await shot('dayLayer',o=>{b(o);o.atmosphere={layerTransmittance:[0.01,0.01,0.01]};});
  out.dayLayerDiff=maxDiff(dayLayer.pixels,dayNeutral.pixels);
  // KB-SKY-FIREDAY1: the fires' light on the layer is drawn by day too (it was drawn by the night's share alone, so a fire
  // spot left the day frame exact while the haze under it took the spot's light): the frame takes the spot's colour.
  {const e=[...engine.camera.position],dayFire=await shot('dayFire',o=>{b(o);o.atmosphere={fireSpots:[{color:[0.2,0.1,0.04],x:e[0],z:e[2],height:e[1]+1000,reach:1000}]};});
   const rise=[0,0,0];for(let i=0;i<dayFire.pixels.length;i+=4)for(let k=0;k<3;k++)rise[k]+=(dayFire.pixels[i+k]-dayNeutral.pixels[i+k])/(dayFire.pixels.length/4);
   out.dayFireRise=rise;}
  // KB-SKY-HAZEGLOW1: a far ground the fog hides fully takes the sky's radiance toward it plus the fog's fire glow on the
  // haze, so the sky over it must take that glow too, or every hazed ridge over a burning valley stands lighter than the
  // sky. A level view, the same pixels shot over the sky (depth 0, the fog draws nothing) and over a plane 50 km ahead
  // (the fog's opacity 1): rows 36 to 46, rays 0.4 to 9 degrees up, under a thick layer, a fire 1.5 km ahead.
  {aim(0);const e=[...engine.camera.position],plane=(z)=>{const t=device.createTexture({size:[128,96],format:'depth32float',usage:GPUTextureUsage.RENDER_ATTACHMENT|GPUTextureUsage.TEXTURE_BINDING}),c=device.createCommandEncoder();
    c.beginRenderPass({colorAttachments:[],depthStencilAttachment:{view:t.createView(),depthClearValue:z?0.5*(100000-z)/(z*(100000-0.5)):0,depthLoadOp:'clear',depthStoreOp:'store'}}).end();device.queue.submit([c.finish()]);return t;};
   const open=plane(0),far=plane(50000),layer={layerTransmittance:[0.02,0.03,0.05],fireSpots:[{color:[0.2,0.1,0.04],x:e[0],z:e[2]-1500,height:e[1]+800,reach:1000}]},
    fog=(depth)=>({depth:()=>depth,density:0.001,start:0,falloff:'exp2',fireSpots:[{color:[0.6,0.3,0.1],x:e[0],z:e[2]-1500,reach:1000}]});
   const rows=async(name,set)=>{const r=await shot(name,set),px=[];out[name+'Rows']=Array.from({length:12},(_,k)=>{const y=k*8;return Array.from(r.pixels.subarray((y*128+64)*4,(y*128+64)*4+3)).map(v=>+v.toFixed(3));});for(let y=36;y<47;y++)for(let x=0;x<128;x+=8)px.push(...r.pixels.subarray((y*128+x)*4,(y*128+x)*4+3));return px;};
   const skyPx=await rows('hazeGlowSky',o=>{b(o);o.atmosphere=layer;o.fog=fog(open);}),groundPx=await rows('hazeGlowGround',o=>{b(o);o.atmosphere=layer;o.fog=fog(far);}),
    plainPx=await rows('hazeGlowPlain',o=>{b(o);delete o.fog;o.atmosphere={layerTransmittance:layer.layerTransmittance};});
   let worst=0,glow=0;for(let i=0;i<skyPx.length;i++){worst=Math.max(worst,Math.abs(groundPx[i]-skyPx[i])/Math.max(1e-4,groundPx[i]));glow=Math.max(glow,groundPx[i]-plainPx[i]);}
   out.hazeGlow={worst,glow,rows:[out.hazeGlowSkyRows,out.hazeGlowGroundRows,out.hazeGlowPlainRows]};delete sky.options.fog;open.destroy();far.destroy();aim(40);}
  sky.dispose();
  // At night (sun 30 degrees down) the night sky and the clouds above are seen through the layer (KB-SKY-NIGHTPALL1).
  const night=Sky.attach(engine,{timeScale:0,sunDirection:[Math.cos(30*rad),-Math.sin(30*rad),0]});
  const nshot=async(name,set)=>{set(night.options);out[name]=await bands();return out[name];};
  const n=(o)=>{for(const k of ['look','atmosphere','clouds'])delete o[k];};
  await nshot('nightPlain',o=>{n(o);o.atmosphere={};});
  await nshot('nightHalf',o=>{n(o);o.atmosphere={layerTransmittance:[0.5,0.5,0.5]};});
  await nshot('nightPall',o=>{n(o);o.atmosphere={layerTransmittance:[1e-6,1e-6,1e-6]};});
  await nshot('nightGlow',o=>{n(o);o.atmosphere={layerTransmittance:[1e-6,1e-6,1e-6],scatteredLight:[0.02,0.01,0.004]};});
  // KB-SKY-PALLFALLOFF1: fire spots straight under the eye light the layer brightest overhead, less toward the horizon;
  // the sight holds a low ray near them; two spots add.
  const eye=[...engine.camera.position],spot={color:[0.02,0.01,0.004],x:eye[0],z:eye[2],height:eye[1]+1000,reach:1000},pall={layerTransmittance:[1e-6,1e-6,1e-6]};
  await nshot('nightFire',o=>{n(o);o.atmosphere={...pall,fireSpots:[spot]};});
  await nshot('nightFireSight',o=>{n(o);o.atmosphere={...pall,fireSpots:[spot],fireSight:500};});
  await nshot('nightFireTwo',o=>{n(o);o.atmosphere={...pall,fireSpots:[spot,spot]};});
  // The haze over a fire, on a depth of the test's own, a plane 2 km ahead of a level view: the fog's colour at the
  // view's centre is its spot's colour times the mean of the falloff along that path, and far less with the spot 20 km
  // to the side.
  aim(0);
  const level=device.createTexture({size:[128,96],format:'depth32float',usage:GPUTextureUsage.RENDER_ATTACHMENT|GPUTextureUsage.TEXTURE_BINDING}),wipe=device.createCommandEncoder();
  wipe.beginRenderPass({colorAttachments:[],depthStencilAttachment:{view:level.createView(),depthClearValue:0.5*(100000-2000)/(2000*(100000-0.5)),depthLoadOp:'clear',depthStoreOp:'store'}}).end();
  device.queue.submit([wipe.finish()]);
  // Each haze is shot with and without its spot; the difference is what the fire adds.
  const haze=async(name,aside,density)=>{for(const lit of [true,false]){n(night.options);night.options.fog={depth:()=>level,density,start:0,falloff:'exp2',color:[0,0,0],...(lit?{fireSpots:[{color:[0.8,0.4,0.2],x:eye[0]+aside,z:eye[2]-2000,reach:500}]}:{})};const r=await bands();out[name+(lit?'':'Without')]=Array.from(r.pixels.subarray((48*128+64)*4,(48*128+64)*4+3));}};
  await haze('hazeFire',0,0.001);await haze('hazeNear',0,0.002);await haze('hazeAside',20000,0.001);
  delete night.options.fog;level.destroy();
  aim(60);
  await nshot('nightCloud',o=>{n(o);o.clouds={coverage:0.6};o.atmosphere={};});
  await nshot('nightCloudPall',o=>{n(o);o.clouds={coverage:0.6};o.atmosphere={layerTransmittance:[1e-6,1e-6,1e-6]};});
  // The fog's exponential height falloff on the GPU against its CPU twin: a depth of the test's own 2 km along a view 30
  // degrees up, so the point is about 1 km above the eye. The fog's share of the pixel is (with - without) / (colour - without).
  aim(30);
  const flat=device.createTexture({size:[128,96],format:'depth32float',usage:GPUTextureUsage.RENDER_ATTACHMENT|GPUTextureUsage.TEXTURE_BINDING}),clear=device.createCommandEncoder();
  clear.beginRenderPass({colorAttachments:[],depthStencilAttachment:{view:flat.createView(),depthClearValue:0.5*(100000-2000)/(2000*(100000-0.5)),depthLoadOp:'clear',depthStoreOp:'store'}}).end();
  device.queue.submit([clear.finish()]);
  const middle=async(fog)=>{n(night.options);delete night.options.fog;if(fog)night.options.fog=fog;const r=await bands();return r.pixels[(48*128+64)*4];};
  const bare=await middle(),hazy={depth:()=>flat,density:0.001,start:0,falloff:'exp',color:[1,1,1],scaleHeight:100,base:0},share=(await middle(hazy)-bare)/(1-bare);
  const y=engine.camera.position[1];
  out.heightFog={share,want:1-Math.exp(-fogOpticalDepth(hazy,2000,y,y+1000)),even:1-Math.exp(-2)};
  delete night.options.fog;flat.destroy();
  night.dispose();
  const error=await device.popErrorScope();
  const result={error:error?.message??null,errors:errors.splice(0)};
  for(const [k,v] of Object.entries(out))result[k]=v&&v.pixels?strip(v):v;
  return result;
 }};
window.ready=true;
</script></body></html>
