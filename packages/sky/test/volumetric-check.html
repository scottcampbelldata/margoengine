<!doctype html><html><head><meta charset="utf-8"/><title>Sky volumetric clouds check</title><style>body{margin:0}canvas{display:block;width:256px;height:192px}</style></head><body><canvas></canvas>
<script type="module">
// Volumetric clouds on a real GPU, read back from Bloom's HDR scene capture. Driven by features-check.mjs.
import {Engine,PbrMaterial,box} from '/packages/core/dist/index.js';
import {sceneSamples} from '/packages/core/dist/quality.js';
import {Bloom} from '/packages/post/dist/bloom.js';
import {Sky} from '/packages/sky/dist/index.js';
import {VolumetricClouds} from '/packages/sky/dist/compat-clouds.js';
import {waitForPipelines} from '/scripts/support/gpu-ready.js';
if(new URLSearchParams(location.search).get('samples')==='1')globalThis.margoLow=1;
const engine=await Engine.create(document.querySelector('canvas'),{backend:'webgpu',camera:{position:[0,2,0],target:[0,40,-60],near:0.5,far:200000}}),device=engine.gpu,errors=[];
device.addEventListener('uncapturederror',e=>errors.push(e.error.message));
const post=Bloom.attach(engine,{strength:0,threshold:1,exposure:0});
engine.createMesh().setGeometry(box(4000,0.2,4000)).setMaterial(new PbrMaterial({color:'#4a5a3a',roughness:0.9})).setPosition([0,0,0]);
// A pillar 30 m in front of the ground camera, and a block 120 m in front of the camera inside the layer.
engine.createMesh().setGeometry(box(8,60,8)).setMaterial(new PbrMaterial({color:'#8a8070',roughness:0.6})).setPosition([0,30,-30]);
engine.createMesh().setGeometry(box(40,40,40)).setMaterial(new PbrMaterial({color:'#8a8070',roughness:0.6})).setPosition([0,2700,-120]);
const sky=new Sky({hours:10,timeScale:0});engine.use(sky);void sky.reflectionTexture;
const module=device.createShaderModule({code:'@group(0) @binding(0) var image:texture_2d<f32>;@group(0) @binding(1) var<storage,read_write> result:array<vec4f>;@compute @workgroup_size(8,8) fn main(@builtin(global_invocation_id) id:vec3u){let s=textureDimensions(image);if(any(id.xy>=s)){return;}result[id.y*s.x+id.x]=textureLoad(image,vec2i(id.xy),0);}'});
const pipeline=device.createComputePipeline({layout:'auto',compute:{module,entryPoint:'main'}});
async function read(texture){
 const bytes=texture.width*texture.height*16,output=device.createBuffer({size:bytes,usage:GPUBufferUsage.STORAGE|GPUBufferUsage.COPY_SRC}),staging=device.createBuffer({size:bytes,usage:GPUBufferUsage.COPY_DST|GPUBufferUsage.MAP_READ});
 const encoder=device.createCommandEncoder(),pass=encoder.beginComputePass();pass.setPipeline(pipeline);
 pass.setBindGroup(0,device.createBindGroup({layout:pipeline.getBindGroupLayout(0),entries:[{binding:0,resource:texture.createView()},{binding:1,resource:{buffer:output}}]}));
 pass.dispatchWorkgroups(Math.ceil(texture.width/8),Math.ceil(texture.height/8));pass.end();encoder.copyBufferToBuffer(output,0,staging,0,bytes);device.queue.submit([encoder.finish()]);
 await staging.mapAsync(GPUMapMode.READ);const data=new Float32Array(staging.getMappedRange()).slice();staging.unmap();output.destroy();staging.destroy();return data;
}
const frame=async(delta=0)=>{engine.render({delta});await device.queue.onSubmittedWorkDone();return read(post.sceneTexture);};
const view=(position,target)=>{engine.camera.position=position;engine.camera.target=target;};
// Pixels that differ by more than one 8-bit step, and the fraction of all pixels they are.
const diff=(a,b,mask)=>{let n=0,total=0;for(let p=0;p<a.length;p+=4){if(mask&&!mask(p/4))continue;total++;let d=0;for(let c=0;c<3;c++)d=Math.max(d,Math.abs(a[p+c]-b[p+c]));if(d>1/255)n++;}return {changed:n,total};};
const views={ground:[[0,2,0],[0,40,-60]],inside:[[0,2700,40],[0,2700,-60]],above:[[0,7000,0],[0,5000,-4000]]};
window.check={samples:sceneSamples,
 async run(){
  device.pushErrorScope('validation');const out={};
  for(const [name,[position,target]] of Object.entries(views)){
   view(position,target);await waitForPipelines(frame);
   const clear=await frame();
   const none=VolumetricClouds.attach(engine,{sky,coverage:0,depth:()=>post.depthTexture});const zero=await frame();none.dispose();
   const clouds=VolumetricClouds.attach(engine,{sky,depth:()=>post.depthTexture});
   const t0=performance.now();const shown=await frame();const ms=performance.now()-t0;
   clouds.onPreUpdate(60);const later=await frame();clouds.dispose();
   (window.shots??={})[name]={clear,shown,later};out[name]={zero:diff(zero,clear).changed,shown:diff(shown,clear),evolved:diff(later,shown),ms};
  }
  // Depth: the pillar 30 m away hides the clouds behind it; the block inside the layer is veiled by cloud before it.
  const w=post.sceneTexture.width,h=post.sceneTexture.height,centre=(i)=>Math.abs(i%w-w/2)<4&&Math.abs(Math.floor(i/w)-h*0.55)<6;
  view(...views.ground);await frame();const pillar=await frame();
  let clouds=VolumetricClouds.attach(engine,{sky,coverage:0.9,depth:()=>post.depthTexture});const pillarClouds=await frame();clouds.dispose();
  out.pillar=diff(pillarClouds,pillar,centre);
  view(...views.inside);await frame();const block=await frame();
  clouds=VolumetricClouds.attach(engine,{sky,coverage:1,density:0.08,depth:()=>post.depthTexture});const blockClouds=await frame();clouds.dispose();
  out.block=diff(blockClouds,block,centre);
  clouds=VolumetricClouds.attach(engine,{sky,coverage:1,density:0.08});const automaticBlock=await frame();clouds.dispose();
  clouds=VolumetricClouds.attach(engine,{sky,coverage:1,density:0.08,depth:()=>undefined});const withoutBlockDepth=await frame();clouds.dispose();
  out.automaticDepth={same:diff(automaticBlock,blockClouds).changed,override:diff(withoutBlockDepth,block,centre).changed};
  // An unavailable explicit depth still draws just the empty sky: the pillar stays as it was, the sky beside it changes.
  view(...views.ground);await frame();const bare=await frame();
  clouds=VolumetricClouds.attach(engine,{sky,coverage:0.9,depth:()=>undefined});const noDepth=await frame();clouds.dispose();
  out.noDepth={pillar:diff(noDepth,bare,centre),sky:diff(noDepth,bare,(i)=>i%w<w/4)};
  // A lightning flash in the layer lights the cloud round it from inside; intensity 0 draws exactly as no flash.
  view(...views.ground);clouds=VolumetricClouds.attach(engine,{sky,coverage:0.9,depth:()=>post.depthTexture});await frame();const unlit=await frame();
  clouds.options.flash={position:[0,2000,-2600],intensity:0};const off=await frame();
  clouds.options.flash={position:[0,2000,-2600],intensity:4e7};const lit=await frame();
  let thrown=0;for(const bad of [{position:[0,0,Number.NaN],intensity:1},{position:[0,0,0],intensity:-1},{position:[0,0,0],intensity:1,radius:0}]){clouds.options.flash=bad;try{clouds.onPreUpdate(0);}catch(e){thrown+=+(e instanceof RangeError||e instanceof TypeError);}}
  clouds.dispose();
  const brightness=(f)=>{let s=0;for(let p=0;p<f.length;p+=4)s+=f[p]+f[p+1]+f[p+2];return s;};
  out.flash={off:diff(off,unlit).changed,lit:diff(lit,unlit),gain:brightness(lit)/brightness(unlit),thrown};
  // The deck in the sky's environment (docs/known-bugs.md, 2026-11-13): the reflection map holds the sky with the deck
  // laid over it (Sky.environmentLayer), and the scene's sky light (here the only ambient: a zero floor) takes it in.
  sky.options.lighting={ambient:{day:[0,0,0],night:[0,0,0]}};view(...views.ground);
  const upper=(m)=>{let s=0;for(let p=0;p<64*16*4;p+=4)s+=m[p]+m[p+1]+m[p+2];return s/(64*16);};
  const pillarLight=(f)=>{let s=0,n=0;for(let p=0;p<f.length;p+=4)if(centre(p/4)){s+=f[p]+f[p+1]+f[p+2];n++;}return s/n;};
  await frame();const clearFrame=await frame(),clearMap=await read(sky.reflectionTexture);
  clouds=VolumetricClouds.attach(engine,{sky,coverage:0.9,depth:()=>post.depthTexture});
  await frame();const cloudFrame=await frame(),cloudMap=await read(sky.reflectionTexture),deck=sky.environmentLayer?await read(sky.environmentLayer):new Float32Array(64*32*4);
  // The map is the sky through the deck plus the deck's light, texel for texel, to half-float rounding.
  let composite=0,lowerChanged=0,changed=0,opacity=0;
  for(let p=0;p<cloudMap.length;p+=4)for(let c=0;c<3;c++){
   const want=clearMap[p+c]*(1-deck[p+3])+deck[p+c];composite=Math.max(composite,Math.abs(cloudMap[p+c]-want)/Math.max(want,1e-3));
  }
  for(let p=0;p<cloudMap.length;p+=4){
   const d=Math.max(...[0,1,2].map((c)=>Math.abs(cloudMap[p+c]-clearMap[p+c])/Math.max(clearMap[p+c],1e-4)));
   if(p<64*16*4){changed+=+(d>0.01);opacity+=deck[p+3];}else lowerChanged+=+(d>0.002);
  }
  clouds.options.flash={position:[0,2000,-400],intensity:4e7};await frame();
  const flashFrame=await frame(),flashMap=await read(sky.reflectionTexture);
  const layered=sky.environmentLayer!==undefined;
  clouds.options.coverage=0;await frame();const zeroLayer=sky.environmentLayer,zeroMap=await read(sky.reflectionTexture);
  clouds.options.coverage=0.9;await frame();clouds.dispose();await frame();
  const afterMap=await read(sky.reflectionTexture),same=(a,b)=>a.every((v,i)=>v===b[i]);
  out.environment={composite,changed,opacity:opacity/(64*16),lowerChanged,layered,zeroCleared:zeroLayer===undefined&&same(zeroMap,clearMap),
   disposedCleared:sky.environmentLayer===undefined&&same(afterMap,clearMap),
   upper:{clear:upper(clearMap),clouds:upper(cloudMap),flash:upper(flashMap)},
   pillar:{clear:pillarLight(clearFrame),clouds:pillarLight(cloudFrame),flash:pillarLight(flashFrame)}};
  // Moonlight through the deck (2026-11-13: the moon lit every sample of the cloud alike, so a thick deck was as bright
  // as a thin veil and its gaps read as flat dark cut-outs): at night under a bright moon, the deck's light per unit
  // of its opacity in the sky's map falls as the cloud thickens, as the sun's does by day.
  sky.options.hours=23;sky.options.lighting={moon:{intensity:20},ambient:{day:[0,0,0],night:[0,0,0]}};
  const perOpacity=async(density)=>{const c=VolumetricClouds.attach(engine,{sky,coverage:0.9,density,depth:()=>post.depthTexture});await frame();await frame();
   const m=await read(sky.environmentLayer);c.dispose();let light=0,alpha=0;for(let p=0;p<64*16*4;p+=4){light+=m[p]+m[p+1]+m[p+2];alpha+=m[p+3];}return {light,alpha,ratio:light/Math.max(alpha,1e-6)};};
  out.moonlit={thin:await perOpacity(0.002),thick:await perOpacity(0.1),moon:Array.from(sky.lights[1].direction)};
  // The moon through a thin veil (2026-11-13: it showed as a flat disc with no glow round it): looking at the moon, the
  // light the moon gives the deck (the frame with the moon less the frame without) is far stronger 0.6 to 1.5 degrees
  // from it than 6 to 8 degrees out, the droplets' diffraction peak. The sky's own moon (its disc and halo, and the
  // night light) changes too, so the near ring counts the veil's change less the clear sky's whole change (the least
  // the deck can have added) and the far ring the veil's whole change (the most).
  const moonDir=Array.from(sky.lights[1].direction).slice(0,3);view([0,2,0],moonDir.map((v,i)=>v*1000+[0,2,0][i]));
  const W=post.sceneTexture.width,H=post.sceneTexture.height,half=Math.tan(Math.PI/6);
  const angle=(i)=>{const x=((i%W+0.5)/W*2-1)*half*W/H,y=(1-(Math.floor(i/W)+0.5)/H*2)*half;return Math.atan(Math.hypot(x,y))*180/Math.PI;};
  const ring=(f,g,lo,hi)=>{let s=0,n=0;for(let p=0;p<f.length;p+=4){const a=angle(p/4);if(a>=lo&&a<hi){s+=f[p]+f[p+1]+f[p+2]-g[p]-g[p+1]-g[p+2];n++;}}return s/Math.max(n,1);};
  const moonlit=async(intensity)=>{sky.options.lighting={moon:{intensity},ambient:{day:[0,0,0],night:[0,0,0]}};await frame();return frame();};
  const skyLit=await moonlit(20),skyDark=await moonlit(0);
  const veil=VolumetricClouds.attach(engine,{sky,coverage:0.9,density:0.002,depth:()=>post.depthTexture});
  const veilLit=await moonlit(20),veilDark=await moonlit(0);veil.dispose();
  out.glow={inner:ring(veilLit,veilDark,0.6,1.5)-ring(skyLit,skyDark,0.6,1.5),outer:ring(veilLit,veilDark,6,8),sky:[ring(skyLit,skyDark,0.6,1.5),ring(skyLit,skyDark,6,8)]};
  // Temporal starts (VolumetricCloudOptions.temporal, 2026-11-13: each pixel's march started at one fixed fraction of a
  // step, so the edges' sampling noise stood still and TAA could not average it): with it, still frames differ and
  // their mean is smoother pixel to pixel than any one of them; without it, still frames are identical.
  sky.options.hours=10;sky.options.lighting={ambient:{day:[0,0,0],night:[0,0,0]}};view(...views.ground);
  const grain=(f)=>{let s=0;for(let p=0;p<f.length-4;p+=4)if((p/4)%W<W-1)for(let c=0;c<3;c++)s+=Math.abs(f[p+c]-f[p+4+c]);return s;};
  const still=async(temporal)=>{const c=VolumetricClouds.attach(engine,{sky,coverage:0.6,steps:16,temporal,depth:()=>post.depthTexture});await waitForPipelines(frame);
   // fixed-wait: eight still frames are the samples the mean averages, taken once the pipelines are in place
   const frames=[];for(let k=0;k<8;k++)frames.push(await frame());c.dispose();
   const mean=new Float32Array(frames[0].length);for(const f of frames)for(let p=0;p<f.length;p++)mean[p]+=f[p]/frames.length;
   return {moved:diff(frames[1],frames[0]).changed,one:grain(frames[0]),mean:grain(mean)};};
  out.temporal={on:await still(true),off:await still(false)};
  sky.options.hours=10;
  sky.options.lighting=undefined;
  const error=await device.popErrorScope();
  return {...out,error:error?.message??null,errors:errors.splice(0)};
 }};
window.shot=(name,key)=>{const f=window.shots[name][key],o=new Array(f.length);for(let p=0;p<f.length;p++)o[p]=(p%4===3)?255:Math.round(255*Math.min(1,Math.pow(f[p]/(1+f[p]),1/2.2)));return o;};
window.ready=true;
</script></body></html>
