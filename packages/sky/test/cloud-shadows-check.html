<!doctype html><html><head><meta charset="utf-8"/><title>Sky cloud shadows check</title><style>body{margin:0}canvas{display:block;width:64px;height:64px}</style></head><body><canvas width="64" height="64"></canvas>
<script type="module">
// Volumetric cloud shadows against the clouds themselves: at each ground point, the plate's light with and without the
// shadow, and the clouds' own opacity seen from that point toward the sun. Driven by features-check.mjs.
import {Engine,box} from '/packages/core/dist/index.js';
import {sceneSamples} from '/packages/core/dist/quality.js';
import {Bloom} from '/packages/post/dist/bloom.js';
import {Shadows} from '/packages/shadows/dist/index.js';
import {VolumetricClouds} from '/packages/sky/dist/volumetric-clouds.js';
import {volumetricCloudShadows} from '/packages/sky/dist/cloud-shadows.js';
if(new URLSearchParams(location.search).get('samples')==='1')globalThis.margoLow=1;
const engine=await Engine.create(document.querySelector('canvas'),{backend:'webgpu',camera:{position:[0,50,0],target:[0,0,-0.001],fov:1,near:0.5,far:30000}}),device=engine.gpu,errors=[];
engine.stop();
device.addEventListener('uncapturederror',e=>errors.push(e.error.message));
const post=Bloom.attach(engine,{strength:0,threshold:1,exposure:0});
const sun=[0.25,1,0.15],l=sun.map(v=>v/Math.hypot(...sun));
engine.lighting.direction.set(l);engine.lighting.radiance.set([1,1,1,0]);
// A uniform white source and no sun on the clouds: a view toward the sun then reads the clouds' opacity itself.
const clouds=VolumetricClouds.attach(engine,{sunDirection:l,coverage:0.4,bottom:1500,top:2500,sunIntensity:0,ambient:[[1,1,1],[1,1,1]],evolution:0,wind:[0,0]});
const shade=volumetricCloudShadows(clouds,{samples:24});
const plate=engine.createMesh().setGeometry(box(40000,1,40000)).setPosition([0,-0.5,0]);
const shadows=Shadows.attach(engine,{resolution:256,bounds:{min:[-1,-1,-1],max:[1,1,1]},filter:'hard',effects:[shade]});
shadows.add(plate,{castShadow:false});
const module=device.createShaderModule({code:'@group(0) @binding(0) var image:texture_2d<f32>;@group(0) @binding(1) var<storage,read_write> result:array<vec4f>;@compute @workgroup_size(1) fn main(){let s=textureDimensions(image);result[0]=textureLoad(image,vec2i(s/2u),0);}'});
const pipeline=device.createComputePipeline({layout:'auto',compute:{module,entryPoint:'main'}});
// The middle pixel of Bloom's HDR scene capture.
async function middle(){
 engine.render({delta:0});
 const output=device.createBuffer({size:16,usage:GPUBufferUsage.STORAGE|GPUBufferUsage.COPY_SRC}),staging=device.createBuffer({size:16,usage:GPUBufferUsage.COPY_DST|GPUBufferUsage.MAP_READ});
 const encoder=device.createCommandEncoder(),pass=encoder.beginComputePass();pass.setPipeline(pipeline);
 pass.setBindGroup(0,device.createBindGroup({layout:pipeline.getBindGroupLayout(0),entries:[{binding:0,resource:post.sceneTexture.createView()},{binding:1,resource:{buffer:output}}]}));
 pass.dispatchWorkgroups(1);pass.end();encoder.copyBufferToBuffer(output,0,staging,0,16);device.queue.submit([encoder.finish()]);
 await staging.mapAsync(GPUMapMode.READ);const v=new Float32Array(staging.getMappedRange())[0];staging.unmap();output.destroy();staging.destroy();return v;
}
const look=(position,target)=>{engine.camera.position=position;engine.camera.target=target;};
window.check={samples:sceneSamples,
 // Moves the clouds `metres` along X in one step; between steps the wind is still, so readings hold.
 advance(metres){clouds.options.wind=[metres,0];clouds.onPreUpdate(1);clouds.options.wind=[0,0];return [...clouds.drift];},
 async read(points){
  device.pushErrorScope('validation');const out=[];
  for(const [x,z] of points){
   look([x,50,z],[x,0,z-0.001]);
   shade.options.strength=1;await middle();const shaded=await middle();
   shade.options.strength=0;const open=await middle();shade.options.strength=1;
   // Looking from the point toward the sun: opacity = (value - background) / (1 - background) under the white source.
   look([x,1,z],[x+l[0]*100,1+l[1]*100,z+l[2]*100]);
   clouds.options.coverage=0;await middle();const background=await middle();clouds.options.coverage=0.4;
   const seen=await middle();
   out.push({shadow:shaded/open,opacity:(seen-background)/(1-background),open,background});
  }
  const error=await device.popErrorScope();
  return {points:out,error:error?.message??null,errors:errors.splice(0)};
 }};
window.ready=true;
</script></body></html>
