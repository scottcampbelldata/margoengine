<!doctype html><html><head><meta charset="utf-8"/><title>Sky fog motion check</title><style>body{margin:0}canvas{display:block;width:256px;height:192px}</style></head><body><canvas></canvas>
<script type="module">
// Fog over Bloom's scene capture while the camera turns: the first frame at a new camera must already equal the still
// frame at that camera. Driven by browser-check.mjs.
import {Engine,PbrMaterial,box} from '/packages/core/dist/index.js';
import {sceneSamples} from '/packages/core/dist/quality.js';
import {Bloom} from '/packages/post/dist/bloom.js';
import {Sky} from '/packages/sky/dist/index.js';
if(new URLSearchParams(location.search).get('samples')==='1')globalThis.margoLow=1;
const engine=await Engine.create(document.querySelector('canvas'),{backend:'webgpu',camera:{position:[0,4,14],target:[0,4,-30],near:0.1,far:800}}),device=engine.gpu,errors=[];
device.addEventListener('uncapturederror',e=>errors.push(e.error.message));
const post=Bloom.attach(engine,{strength:0,threshold:1,exposure:0});
engine.createMesh().setGeometry(box(400,0.2,400)).setMaterial(new PbrMaterial({color:'#4a5a3a',roughness:0.9})).setPosition([0,0,-60]);
for(const x of [-30,-10,10,30])engine.createMesh().setGeometry(box(4,40,4)).setMaterial(new PbrMaterial({color:'#8a8070',roughness:0.6})).setPosition([x,20,-60]);
const sky=new Sky({hours:10,timeScale:0,fog:{depth:()=>post.depthTexture,color:[1,0,1],falloff:'exp',start:10,density:0.05}});
engine.use(sky);
const module=device.createShaderModule({code:'@group(0) @binding(0) var image:texture_2d<f32>;@group(0) @binding(1) var<storage,read_write> result:array<vec4f>;@compute @workgroup_size(8,8) fn main(@builtin(global_invocation_id) id:vec3u){let s=textureDimensions(image);if(any(id.xy>=s)){return;}result[id.y*s.x+id.x]=textureLoad(image,vec2i(id.xy),0);}'});
const pipeline=device.createComputePipeline({layout:'auto',compute:{module,entryPoint:'main'}});
async function read(texture){
 const bytes=texture.width*texture.height*16,output=device.createBuffer({size:bytes,usage:GPUBufferUsage.STORAGE|GPUBufferUsage.COPY_SRC}),staging=device.createBuffer({size:bytes,usage:GPUBufferUsage.COPY_DST|GPUBufferUsage.MAP_READ});
 const encoder=device.createCommandEncoder(),pass=encoder.beginComputePass();pass.setPipeline(pipeline);
 pass.setBindGroup(0,device.createBindGroup({layout:pipeline.getBindGroupLayout(0),entries:[{binding:0,resource:texture.createView()},{binding:1,resource:{buffer:output}}]}));
 pass.dispatchWorkgroups(Math.ceil(texture.width/8),Math.ceil(texture.height/8));pass.end();encoder.copyBufferToBuffer(output,0,staging,0,bytes);device.queue.submit([encoder.finish()]);
 await staging.mapAsync(GPUMapMode.READ);const data=new Float32Array(staging.getMappedRange()).slice();staging.unmap();output.destroy();staging.destroy();return data;
}
const frame=async()=>{engine.render({delta:0});await device.queue.onSubmittedWorkDone();return read(post.sceneTexture);};
const aim=(x)=>{engine.camera.target=[x,4,-30];};
window.check={async run(){
 device.pushErrorScope('validation');
 // Ready when the fog is on screen and two frames at the first camera agree.
 const fogOn=(f)=>{for(let p=0;p<f.length;p+=4)if(f[p]>0.5&&f[p+2]>0.5&&f[p+1]<0.3)return true;return false;},same=(a,b)=>a.every((v,i)=>Math.abs(v-b[i])<=1/255);
 aim(-6);const limit=performance.now()+20000;let before=await frame(),prior;
 do{prior=before;before=await frame();}while((!fogOn(before)||!same(prior,before))&&performance.now()<limit);
 aim(6);const moving=await frame();const still=await frame();
 const error=await device.popErrorScope();
 let differing=0,moved=0,fogged=0;
 for(let p=0;p<still.length;p+=4){
  let d=0,m=0;for(let c=0;c<3;c++){d=Math.max(d,Math.abs(moving[p+c]-still[p+c]));m=Math.max(m,Math.abs(before[p+c]-still[p+c]));}
  if(d>1/255)differing++;if(m>0.05)moved++;
  if(still[p]>0.5&&still[p+2]>0.5&&still[p+1]<0.3)fogged++;
 }
 return {samples:sceneSamples(),error:error?.message??null,errors:errors.splice(0),differing,moved,fogged,pixels:still.length/4};
}};
window.ready=true;
</script></body></html>
