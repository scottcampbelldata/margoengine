<!doctype html><meta charset="utf-8"><title>Sky radiance reference</title>
<script type="module">
import { preetham } from '../dist/preetham.js';
window.skyRadiance = async (cases) => {
  const adapter = await navigator.gpu.requestAdapter({ powerPreference: 'high-performance' });
  const device = await adapter.requestDevice();
  const samples = cases.flatMap(c => c.directions.map(d => [...d, c.turbidity, ...c.sun, 0]));
  const data = new Float32Array(samples.flat());
  const input = device.createBuffer({ size: data.byteLength, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST });
  device.queue.writeBuffer(input, 0, data);
  const output = device.createBuffer({ size: samples.length * 16, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC });
  const readback = device.createBuffer({ size: output.size, usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ });
  const module = device.createShaderModule({ code: `
struct Frame { settings:vec4f } var<private> frame:Frame;
struct Sample { direction:vec4f, sun:vec4f }
@group(0) @binding(0) var<storage,read> samples:array<Sample>;
@group(0) @binding(1) var<storage,read_write> output:array<vec4f>;
${preetham.wgsl}
@compute @workgroup_size(64) fn main(@builtin(global_invocation_id) id:vec3u) {
  if(id.x >= arrayLength(&samples)){return;}
  let s=samples[id.x]; frame.settings=vec4f(0,0,s.direction.w,0);
  output[id.x]=vec4f(preetham(s.direction.xyz,s.sun.xyz),1);
}` });
  const pipeline = await device.createComputePipelineAsync({ layout:'auto', compute:{ module, entryPoint:'main' } });
  const group = device.createBindGroup({ layout: pipeline.getBindGroupLayout(0), entries:[
    {binding:0,resource:{buffer:input}},{binding:1,resource:{buffer:output}},
  ]});
  const encoder = device.createCommandEncoder();
  const pass = encoder.beginComputePass(); pass.setPipeline(pipeline); pass.setBindGroup(0,group);
  pass.dispatchWorkgroups(Math.ceil(samples.length / 64)); pass.end();
  encoder.copyBufferToBuffer(output,0,readback,0,output.size); device.queue.submit([encoder.finish()]);
  await readback.mapAsync(GPUMapMode.READ);
  const values = new Float32Array(readback.getMappedRange());
  let offset = 0;
  const result = cases.map(c => c.directions.map(() => {
    const rgb = Array.from(values.slice(offset,offset+3)); offset += 4; return rgb;
  }));
  readback.unmap(); device.destroy(); return result;
};
</script>
