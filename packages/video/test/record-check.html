<!doctype html><meta charset="utf-8"><title>Canvas recording check</title>
<script type="module">
import {Engine} from '/packages/core/dist/index.js';
import {webglRenderer} from '/packages/webgl2-compat/dist/preview.js';
import {recordCanvas} from '/packages/video/dist/record.js';
// The recorded WebM's first VP8 key frame as raw planes, decoded with WebCodecs and read before any colour conversion:
// what the encoder wrote (Y, Cb, Cr at the centre), independent of how the browser's <video> converts it to RGB.
async function webmCentreYUV(bytes){
  const masters=new Set([0x18538067,0x1f43b675]);let key=null;
  const vint=(p,id)=>{const w=Math.clz32(bytes[p])-23;let n=id?bytes[p]:bytes[p]&(255>>>w),all=n===(255>>>w);for(let i=1;i<w;i++){n=n*256+bytes[p+i];all&&=bytes[p+i]===255;}return{n,w,unknown:!id&&all};};
  for(let p=0;p<bytes.length&&!key;){
    const id=vint(p,true),size=vint(p+id.w,false),body=p+id.w+size.w;
    if(masters.has(id.n)){p=body;continue;}
    // SimpleBlock: track number, 16-bit time, flags, then the frame; a VP8 key frame carries the start code 9d 01 2a.
    if(id.n===0xa3){const f=body+vint(body,false).w+3;if(bytes[f+3]===0x9d&&bytes[f+4]===0x01&&bytes[f+5]===0x2a)key=bytes.slice(f,body+size.n);}
    if(size.unknown)return null;p=body+size.n;
  }
  if(!key||typeof VideoDecoder!=='function')return null;
  const frame=await new Promise((resolve,reject)=>{const d=new VideoDecoder({output:resolve,error:reject});d.configure({codec:'vp8',codedWidth:64,codedHeight:64});d.decode(new EncodedVideoChunk({type:'key',timestamp:0,data:key}));d.flush().catch(reject);});
  try{
    const space=frame.colorSpace.toJSON(),data=new Uint8Array(frame.allocationSize()),[y,u,v]=await frame.copyTo(data),centre=data[y.offset+32*y.stride+32];
    if(frame.format==='I420')return {format:frame.format,space,yuv:[centre,data[u.offset+16*u.stride+16],data[v.offset+16*v.stride+16]]};
    if(frame.format==='NV12')return {format:frame.format,space,yuv:[centre,data[u.offset+16*u.stride+32],data[u.offset+16*u.stride+33]]};
    return {format:frame.format,space};
  }finally{frame.close();}
}
// Where a fragmented or plain MP4's boxes end its longest timeline, in seconds (ISO/IEC 14496-12): the movie and media
// headers' durations, and each track fragment's decode time (tfdt) plus its sample durations (trun, tfhd, trex).
function mp4Seconds(bytes){
  const view=new DataView(bytes.buffer,bytes.byteOffset,bytes.byteLength),containers=new Set(['moov','trak','mdia','mvex','moof','traf']);
  const scales={},defaults={},ends={},headers=[];let track=0,sample=0,time=0;
  const walk=(start,end)=>{for(let p=start;p+8<=end;){
    let size=view.getUint32(p),head=8;
    if(size===1){size=Number(view.getBigUint64(p+8));head=16;}else if(size===0)size=end-p;
    if(size<head)break;
    const type=String.fromCharCode(...bytes.subarray(p+4,p+8)),d=p+head;
    if(containers.has(type))walk(d,p+size);
    else if(type==='tkhd')track=view.getUint32(d+(bytes[d]?20:12));
    else if(type==='mvhd'||type==='mdhd'){const long=bytes[d],scale=view.getUint32(d+(long?20:12)),length=long?Number(view.getBigUint64(d+24)):view.getUint32(d+16);if(type==='mdhd')scales[track]=scale;if(length!==0xffffffff&&length<2**63)headers.push(length/scale);}
    else if(type==='trex')defaults[view.getUint32(d+4)]=view.getUint32(d+12);
    else if(type==='tfhd'){const flags=view.getUint32(d)&0xffffff;track=view.getUint32(d+4);sample=flags&8?view.getUint32(d+8+(flags&1?8:0)+(flags&2?4:0)):defaults[track];time=ends[track]??0;}
    else if(type==='tfdt')time=bytes[d]?Number(view.getBigUint64(d+4)):view.getUint32(d+4);
    else if(type==='trun'){const flags=view.getUint32(d)&0xffffff,count=view.getUint32(d+4);let q=d+8+(flags&1?4:0)+(flags&4?4:0);
      for(let i=0;i<count;i++){time+=flags&0x100?view.getUint32(q):sample;q+=[0x100,0x200,0x400,0x800].reduce((n,bit)=>n+(flags&bit?4:0),0);}
      ends[track]=Math.max(ends[track]??0,time);}
    p+=size;
  }};
  walk(0,bytes.length);
  return {headers:Math.max(0,...headers),fragments:Math.max(0,...Object.entries(ends).map(([id,end])=>end/scales[id]))};
}
window.check=async()=>{
  const results=[];
  for(const backend of ['webgpu','webgl2']) for(const format of ['webm','mp4']) {
    const canvas=document.createElement('canvas');canvas.width=canvas.height=64;document.body.append(canvas);
    const engine=await Engine.create(canvas,{backend,...(backend==='webgl2'?{fallback:webglRenderer}:{})});
    engine.scene.background='#336699';
    const audio=new AudioContext(),tone=audio.createOscillator(),dest=audio.createMediaStreamDestination();
    tone.frequency.value=440;tone.connect(dest);tone.start();await audio.resume();
    let frame;
    const draw=()=>{engine.render({delta:0});frame=requestAnimationFrame(draw);};
    engine.stop();draw();
    try {
      if(!MediaRecorder.isTypeSupported('video/'+format)) {
        try {recordCanvas(canvas,{format});throw Error('unsupported container was accepted');}
        catch(e){if(e.code!=='unsupported'||!e.message.includes('https:'))throw e;results.push({backend,format,unsupported:e.code});}
        continue;
      }
      const started=performance.now(),recording=recordCanvas(canvas,{format,audio:dest.stream});
      // fixed-wait: real-time recording needs 1.2 seconds of media time to produce picture and sound, independent of GPU readiness.
      await new Promise(resolve=>setTimeout(resolve,1200));
      const blob=await recording.stop(),wallSeconds=(performance.now()-started)/1000,buffer=await blob.arrayBuffer();
      const video=document.createElement('video'),url=URL.createObjectURL(blob);video.muted=true;video.src=url;
      try{
        await new Promise((resolve,reject)=>{video.onloadeddata=resolve;video.onerror=()=>reject(Error('recorded file did not decode'));video.load();});
        await new Promise((resolve,reject)=>{video.onseeked=resolve;video.onerror=()=>reject(Error('recorded file did not seek'));video.currentTime=0.5;});
        const decoded=new OffscreenCanvas(64,64),ctx=decoded.getContext('2d');ctx.drawImage(video,0,0);
        const pixel=[...ctx.getImageData(32,32,1,1).data];
        // Independent browser demuxer/audio decoder proves the recorded file contains audible sound.
        const sound=await audio.decodeAudioData(buffer.slice(0)),samples=sound.getChannelData(0);
        let energy=0,crossings=0;
        const start=Math.floor(samples.length/4),end=Math.floor(samples.length*3/4);
        for(let i=start;i<end;i++){energy+=samples[i]**2;if(i>start&&samples[i-1]<=0&&samples[i]>0)crossings++;}
        const rms=Math.sqrt(energy/(end-start)),hz=crossings*sound.sampleRate/(end-start);
        const encoded=format==='webm'&&!blob.type.includes('mp4')?await webmCentreYUV(new Uint8Array(buffer)):null;
        const stated=format==='mp4'?mp4Seconds(new Uint8Array(buffer)):null;
        results.push({backend,format,encoded,stated,wallSeconds,bytes:blob.size,type:blob.type,width:video.videoWidth,height:video.videoHeight,pixel,audioSeconds:sound.duration,rms,hz,callerAudio:dest.stream.getAudioTracks()[0].readyState});
      }finally{video.removeAttribute('src');video.load();URL.revokeObjectURL(url);}
      const abort=new AbortController(),cancelled=recordCanvas(canvas,{signal:abort.signal});abort.abort();
      try{await cancelled.result;throw Error('abort resolved');}catch(e){if(e.name!=='AbortError')throw e;}
    }finally{cancelAnimationFrame(frame);engine.dispose();tone.stop();dest.stream.getTracks().forEach(t=>t.stop());await audio.close();canvas.remove();}
  }
  return results;
};
</script>
