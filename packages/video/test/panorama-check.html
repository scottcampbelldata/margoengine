<!doctype html><meta charset="utf-8"><title>Video panorama GPU check</title>
<script type="module">
import {Engine} from '/packages/core/dist/index.js';
import {webglRenderer} from '/packages/webgl2-compat/dist/preview.js';
import {UnlitMaterial,createMesh} from '/packages/materials/dist/index.js';
import {sphereGeometry} from '/packages/geometry/dist/index.js';
import {video360Material} from '/packages/video/dist/panorama.js';
import {waitForPipelines} from '/scripts/support/gpu-ready.js';
const directions=[['front',[0,0,-1]],['right',[1,0,0]],['back',[0,0,1]],['left',[-1,0,0]],['up',[0,1,0]],['down',[0,-1,0]]];
const colours=['#ff0000','#00ff00','#0000ff','#ffff00','#ff00ff','#00ffff'];
const make=(stereo)=>{
  const c=new OffscreenCanvas(stereo?256:128,64),ctx=c.getContext('2d');
  for(let eye=0;eye<(stereo?2:1);eye++){
    const offset=eye*128;
    const palette=eye?colours.map(c=>c==='#ff0000'?'#ffffff':c):colours;
    // Sectors centred at u=0 (back), .25 (left), .5 (front), .75 (right).
    for(let x=0;x<128;x++){const u=x/128;ctx.fillStyle=palette[u<.125||u>=.875?2:u<.375?3:u<.625?0:1];ctx.fillRect(offset+x,0,1,64);}
    ctx.fillStyle=palette[4];ctx.fillRect(offset,0,128,12);
    ctx.fillStyle=palette[5];ctx.fillRect(offset,52,128,12);
  }
  return new VideoFrame(c,{timestamp:0});
};
const read=c=>{const x=new OffscreenCanvas(64,64).getContext('2d');x.drawImage(c,0,0,64,64);return [...x.getImageData(32,32,1,1).data];};
window.check=async()=>{
  const canvas=document.createElement('canvas');canvas.style.width=canvas.style.height='64px';canvas.width=canvas.height=64;document.body.append(canvas);
  const engine=await Engine.create(canvas,{backend:'webgpu',camera:{position:[0,0,0],target:[0,0,-1],near:.01,far:100}});engine.stop();
  const mono=make(false),stereo=make(true),material=new UnlitMaterial({side:'back',features:[video360Material(mono)]});
  const mesh=createMesh(engine,sphereGeometry(10,64,32),material),results=[],errors=[];
  engine.gpu.addEventListener('uncapturederror',e=>errors.push(e.error.message));
  try{
    for(const [layout,eye,source] of [['mono','left',mono],['stereo-left-right','left',stereo],['stereo-left-right','right',stereo]]){
      material.features=[video360Material(source,{layout,eye})];const pixels={};
      for(const [name,direction] of directions){
        engine.camera.target=direction;engine.camera.up=name==='up'||name==='down'?[0,0,1]:[0,1,0];
        await waitForPipelines(async()=>{engine.render({delta:0});await engine.gpu.queue.onSubmittedWorkDone();});
        engine.render({delta:0});pixels[name]=read(canvas);
      }
      results.push({layout,eye,pixels});
    }
    const fallbackCanvas=document.createElement('canvas');document.body.append(fallbackCanvas);
    const fallback=await Engine.create(fallbackCanvas,{backend:'webgl2',fallback:webglRenderer});fallback.stop();let rejected;
    try{video360Material(mono).bindings(fallback.gpu??{},fallback);}catch(e){rejected={code:e.code,message:e.message};}
    finally{fallback.dispose();fallbackCanvas.remove();}
    return {results,errors,fallback:rejected};
  }finally{mesh.dispose();material.dispose();engine.dispose();mono.close();stereo.close();canvas.remove();}
};
</script>
