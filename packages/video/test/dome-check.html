<!doctype html><meta charset="utf-8"><title>Dome packing and 180 projection check</title>
<script type="module">
import {Engine} from '/packages/core/dist/index.js';
import {UnlitMaterial,createMesh} from '/packages/materials/dist/index.js';
import {sphereGeometry} from '/packages/geometry/dist/index.js';
import {videoDomeMaterial} from '/packages/video/dist/dome.js';
import {waitForPipelines} from '/scripts/support/gpu-ready.js';
window.check=async()=>{
 const c=document.createElement('canvas');c.width=c.height=64;document.body.append(c);
 const engine=await Engine.create(c,{backend:'webgpu',camera:{position:[0,0,0],target:[0,0,-1],near:.01,far:100}});engine.stop();
 const material=new UnlitMaterial({side:'back'}),mesh=createMesh(engine,sphereGeometry(10,64,32),material),errors=[],results=[];
 engine.gpu.addEventListener('uncapturederror',e=>errors.push(e.error.message));
 const read=()=>{const ctx=new OffscreenCanvas(64,64).getContext('2d');ctx.drawImage(c,0,0);return [...ctx.getImageData(32,32,1,1).data].slice(0,3);};
 try{
  for(const layout of ['mono','stereo-left-right','stereo-top-bottom']) for(const angle of [180,360]){
   const art=new OffscreenCanvas(layout==='stereo-left-right'?256:128,layout==='stereo-top-bottom'?128:64),ctx=art.getContext('2d');
   // Independent angular oracle: each eye has three horizontal sectors and two latitude caps.
   for(let eye=0;eye<(layout==='mono'?1:2);eye++){
    const x=layout==='stereo-left-right'?eye*128:0,y=layout==='stereo-top-bottom'?eye*64:0;
    ctx.fillStyle=eye?'white':'red';ctx.fillRect(x,y,128,64);
    ctx.fillStyle='yellow';ctx.fillRect(x,y,angle===180?24:48,64);
    ctx.fillStyle='lime';ctx.fillRect(x+(angle===180?104:80),y,angle===180?24:48,64);
    ctx.fillStyle='magenta';ctx.fillRect(x,y,128,8);ctx.fillStyle='cyan';ctx.fillRect(x,y+56,128,8);
   }
   const frame=new VideoFrame(art,{timestamp:0});
   try{for(const eye of ['left','right']){
    material.features=[videoDomeMaterial(frame,{layout,angle,eye})];const pixels={};
    for(const [name,target] of [['front',[0,0,-1]],['left',[-.98,0,-.2]],['right',[.98,0,-.2]],['up',[0,.999,-.04]],['down',[0,-.999,-.04]],['back',[0,0,1]]]){
     engine.camera.target=target;await waitForPipelines(async()=>{engine.render({delta:0});await engine.gpu.queue.onSubmittedWorkDone();});engine.render({delta:0});pixels[name]=read();
    }
    results.push({layout,angle,eye,pixels});
   }}finally{frame.close();}
  }
  return {errors,results};
 }finally{mesh.dispose();material.dispose();engine.dispose();c.remove();}
};
</script>
