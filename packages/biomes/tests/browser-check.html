<!doctype html><html><head><meta charset="utf-8"/><title>Biomes browser check</title><style>body{margin:0}canvas{display:block;width:256px;height:192px}</style></head><body><canvas></canvas>
<script type="module">
// Real-GPU proof for @margoengine/biomes/view: a biome world draws as terrain with its ground layer, and painting a
// biome shows that biome's ground layer where it was painted, also with all 8 presets (15 materials).
import {Engine} from '/packages/core/dist/index.js';
import {Bloom} from '/packages/post/dist/bloom.js';
import {Sky} from '/packages/sky/dist/index.js';
import {BiomeWorld} from '/packages/biomes/dist/index.js';
import {presets,presetWorlds} from '/packages/biomes/dist/presets.js';
import {BiomeEditor} from '/packages/biomes/dist/editor.js';
import {waitForPipelines} from '/scripts/support/gpu-ready.js';
import {BiomeView} from '/packages/biomes/dist/view.js';
const engine=await Engine.create(document.querySelector('canvas'),{backend:'webgpu',camera:{position:[0,160,40],target:[0,0,0],near:0.5,far:2000}}),device=engine.gpu,errors=[];
device.addEventListener('uncapturederror',e=>errors.push(e.error.message));
const post=Bloom.attach(engine,{strength:0,threshold:100,exposure:0});
const module=device.createShaderModule({code:'@group(0) @binding(0) var image:texture_2d<f32>;@group(0) @binding(1) var<storage,read_write> result:array<vec4f>;@compute @workgroup_size(8,8) fn main(@builtin(global_invocation_id) id:vec3u){let s=textureDimensions(image);if(any(id.xy>=s)){return;}result[id.y*s.x+id.x]=textureLoad(image,vec2i(id.xy),0);}'});
const pipeline=device.createComputePipeline({layout:'auto',compute:{module,entryPoint:'main'}});
async function read(texture){
 const bytes=texture.width*texture.height*16,output=device.createBuffer({size:bytes,usage:GPUBufferUsage.STORAGE|GPUBufferUsage.COPY_SRC}),staging=device.createBuffer({size:bytes,usage:GPUBufferUsage.COPY_DST|GPUBufferUsage.MAP_READ});
 const encoder=device.createCommandEncoder(),pass=encoder.beginComputePass();pass.setPipeline(pipeline);
 pass.setBindGroup(0,device.createBindGroup({layout:pipeline.getBindGroupLayout(0),entries:[{binding:0,resource:texture.createView()},{binding:1,resource:{buffer:output}}]}));
 pass.dispatchWorkgroups(Math.ceil(texture.width/8),Math.ceil(texture.height/8));pass.end();encoder.copyBufferToBuffer(output,0,staging,0,bytes);device.queue.submit([encoder.finish()]);
 await staging.mapAsync(GPUMapMode.READ);const data=new Float32Array(staging.getMappedRange()).slice();staging.unmap();output.destroy();staging.destroy();return {data,width:texture.width,height:texture.height};
}
async function shot(){for(let i=0;i<2;i++){engine.render({delta:1/60});await device.queue.onSubmittedWorkDone();}return read(post.sceneTexture);}
// Mean linear colour of the central quarter of the frame.
function mean({data,width,height}){let r=0,g=0,b=0,n=0;for(let y=height>>2;y<height*3>>2;y++)for(let x=width>>2;x<width*3>>2;x++){const k=(y*width+x)*4;r+=data[k];g+=data[k+1];b+=data[k+2];n++;}return [r/n,g/n,b/n];}
// Mean sRGB luma (0..1) and colour spread (mean over channels of the standard deviation, 0..1) of the ground in the
// lower 60 percent of a canvas frame (the horizon sits above it).
async function noonGround(world){
 const canvas=document.createElement('canvas');canvas.width=640;canvas.height=400;document.body.append(canvas);
 const e=await Engine.create(canvas,{backend:'webgpu',camera:{position:[0,52,60],target:[0,38,0],near:0.5,far:4000}}),sky=Sky.attach(e,{hours:12,timeScale:0,lighting:{intensity:3},environment:true});
 const view=await BiomeView.attach(e,world,{radius:600,objects:false});await view.ready;await view.whenIdle();
 for(let i=0;i<3;i++){e.render({delta:1/60});await e.gpu.queue.onSubmittedWorkDone();}
 e.render({delta:1/60});
 const c=new OffscreenCanvas(canvas.width,canvas.height).getContext('2d');c.drawImage(canvas,0,0);
 const {data}=c.getImageData(0,Math.floor(canvas.height*0.4),canvas.width,Math.ceil(canvas.height*0.6));
 const n=data.length/4,m=[0,0,0],q=[0,0,0];let luma=0;
 for(let k=0;k<data.length;k+=4){for(let i=0;i<3;i++){const v=data[k+i]/255;m[i]+=v;q[i]+=v*v;}luma+=(0.2126*data[k]+0.7152*data[k+1]+0.0722*data[k+2])/255;}
 let spread=0;for(let i=0;i<3;i++){m[i]/=n;spread+=Math.sqrt(Math.max(0,q[i]/n-m[i]*m[i]));}
 view.dispose();sky.dispose();e.dispose();canvas.remove();
 return {luma:luma/n,spread:spread/3,mean:m};
}

// A 720 x 450 canvas engine under the biome shots' Sky (noon, lighting 3, environment), its sRGB pixels after a view of
// `world` is in, and the camera ray through a pixel (60 degree vertical field of view, Y up).
async function shotEngine(position,target){
 const canvas=document.createElement('canvas');canvas.width=720;canvas.height=450;canvas.style.cssText='width:720px;height:450px';document.body.append(canvas);
 const e=await Engine.create(canvas,{backend:'webgpu',camera:{position,target,near:0.3,far:20000}}),sky=Sky.attach(e,{hours:12,timeScale:0,lighting:{intensity:3},environment:true}),errs=[];
 e.gpu.addEventListener('uncapturederror',ev=>errs.push(ev.error.message));
 const frame=async()=>{e.render({delta:1/60});await e.gpu.queue.onSubmittedWorkDone();};
 return {canvas,e,sky,errs,
  async pixels(world,options={}){
   const view=await BiomeView.attach(e,world,{objects:false,sky,...options});
   await view.ready;await view.whenIdle();await waitForPipelines(frame);await view.whenIdle();await waitForPipelines(frame);
   e.render({delta:1/60});
   const c=new OffscreenCanvas(canvas.width,canvas.height).getContext('2d');c.drawImage(canvas,0,0);
   view.dispose();return c.getImageData(0,0,canvas.width,canvas.height).data;
  },
  ray(px,py){
   const p=position,f=norm(target.map((v,i)=>v-p[i])),r=norm([-f[2],0,f[0]]),u=[r[1]*f[2]-r[2]*f[1],r[2]*f[0]-r[0]*f[2],r[0]*f[1]-r[1]*f[0]],t=Math.tan(Math.PI/6),a=canvas.width/canvas.height;
   const x=((px+0.5)/canvas.width*2-1)*t*a,y=(1-(py+0.5)/canvas.height*2)*t;
   return norm([0,1,2].map(i=>f[i]+x*r[i]+y*u[i]));
  },
  dispose(){sky.dispose();e.dispose();canvas.remove();}};
}
const norm=v=>{const l=Math.hypot(...v);return v.map(x=>x/l);};
const luma=(d,k)=>(0.2126*d[k]+0.7152*d[k+1]+0.0722*d[k+2])/255;
// Where a ray from `p` along `d` meets the world's region heights (bilinear, 16 m grid), marched in 4 m steps to 6 km.
function hit(world,p,d){
 const o=world.overview(),[x0,z0]=world.bounds,h=(x,z)=>{const fx=Math.min(o.width-1.001,Math.max(0,(x-x0)/o.resolution)),fz=Math.min(o.depth-1.001,Math.max(0,(z-z0)/o.resolution)),ix=Math.floor(fx),iz=Math.floor(fz),tx=fx-ix,tz=fz-iz,g=(i,j)=>o.height[j*o.width+i],a=g(ix,iz)+(g(ix+1,iz)-g(ix,iz))*tx,b=g(ix,iz+1)+(g(ix+1,iz+1)-g(ix,iz+1))*tx;return a+(b-a)*tz;};
 for(let t=4;t<6000;t+=4){const q=[p[0]+d[0]*t,p[1]+d[1]*t,p[2]+d[2]*t];if(q[1]<=h(q[0],q[2]))return q;}
 return null;
}
// Shot 05: the alpine preset world's highest peak from 1,400 m away and 150 m over the ground, sRGB pixels of the
// default look and of a mask look (rock red, snow blue, scree yellow, meadow green, 0.35 each, no detail or relief).
// Rock pixels whose ground is above 2,600 m: the standard deviation of the natural log of their luma over the mask's red
// (how much the rock's own light and dark varies, with the lighting divided out); pixels where snow outweighs rock:
// their mean luma.
async function alpine(){
 const world=await BiomeWorld.create({biomes:[presets.alpine],climate:presetWorlds.alpine.climate,height:{relief:presetWorlds.alpine.relief}});
 const g=(x,z)=>world.sample(x,z).height;let best=[0,0,-1e9];
 for(let z=-2000;z<=2000;z+=64)for(let x=-2000;x<=2000;x+=64){const h=g(x,z);if(h>best[2])best=[x,z,h];}
 const [hx,hz,hh]=best,len=Math.hypot(hx,hz)||1,px=hx-hx/len*1400,pz=hz-hz/len*1400,position=[px,g(px,pz)+150,pz];
 const s=await shotEngine(position,[hx,hh-60,hz]),W=s.canvas.width,H=s.canvas.height;
 const look=await s.pixels(world),flat=c=>({color:c,detail:0}),
  mask=await s.pixels(world,{materials:{rock:flat([0.35,0,0]),snow:flat([0,0,0.35]),scree:flat([0.35,0.35,0]),meadow:flat([0,0.35,0])}});
 const rock=new Uint8Array(W*H),snow=new Uint8Array(W*H),high=new Int8Array((W>>1)*(H>>1)).fill(-1);
 // Ground height per 2 x 2 pixel block, marched only where the mask shows rock.
 const above=(x,y)=>{const b=(y>>1)*(W>>1)+(x>>1);if(high[b]<0){const q=hit(world,position,s.ray(x&~1,y&~1));high[b]=+(q!==null&&q[1]>2600);}return high[b];};
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){
  const i=y*W+x,k=i*4,[r,gg,b]=[mask[k],mask[k+1],mask[k+2]];
  if(b>r&&b>3*gg&&b>20)snow[i]=1;
  else if(r>10*gg&&r>10*b&&r>20)rock[i]=above(x,y);
 }
 let n=0,sum=0,sq=0,sn=0,ss=0;
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){
  const i=y*W+x;
  if(snow[i]){sn++;ss+=luma(look,i*4);}
  if(!rock[i])continue;
  // The look's luma over the flat mask's red: the light (sun, sky, the vertex normal) cancels, the ground's own light and
  // dark (texture, relief, macro tone) stays.
  const l=Math.log(luma(look,i*4)/Math.max(1,mask[i*4])*255);n++;sum+=l;sq+=l*l;
 }
 const mean=sum/Math.max(1,n),errors=s.errs.splice(0);
 s.dispose();world.dispose();
 return {rock:n/(W*H),rockSd:Math.sqrt(Math.max(0,sq/Math.max(1,n)-mean*mean)),saturated:mask.filter((v,k)=>k%4===0&&v===255).length,snow:sn/(W*H),snowLuma:ss/Math.max(1,sn),errors};
}
// Shot 08: the temperate world with desert painted (constant, radius 260 m at [0, -300]) from 110 m over [0, 500]. On the
// screen row through the circle's centre, the largest change between neighbouring pixels (the sum of the absolute R, G
// and B differences, sRGB bytes) within 12 px of where the row enters and leaves the patch's sand (R over G by more than 12:
// grass is G over R). R minus B alone does not tell this palette's grass from sand (76 and 83 on that row).
async function edge(ecotone){
 const world=await BiomeWorld.create({biomes:[presets.temperate,presets.desert],climate:presetWorlds.temperate.climate,height:{relief:presetWorlds.temperate.relief},ecotone});
 const editor=BiomeEditor.attach(world);editor.paint('desert',{center:[0,-300],radius:260,falloff:'constant'});editor.dispose?.();
 const g=(x,z)=>world.sample(x,z).height,position=[0,g(0,500)+110,500],target=[0,g(0,500)-20,-300];
 const s=await shotEngine(position,target),W=s.canvas.width,H=s.canvas.height,data=await s.pixels(world);
 // The screen row of the circle's centre (the camera ray inverted: 60 degree vertical field of view, Y up).
 const f=norm(target.map((v,i)=>v-position[i])),r=norm([-f[2],0,f[0]]),u=[r[1]*f[2]-r[2]*f[1],r[2]*f[0]-r[0]*f[2],r[0]*f[1]-r[1]*f[0]],
  d=[0,g(0,-300),-300].map((v,i)=>v-position[i]),depth=d[0]*f[0]+d[1]*f[1]+d[2]*f[2],
  row=Math.round((1-(d[0]*u[0]+d[1]*u[1]+d[2]*u[2])/(depth*Math.tan(Math.PI/6)))/2*H);
 const at=x=>(row*W+x)*4,sand=x=>data[at(x)]-data[at(x)+1]>12;
 // The widest stretch of sand on the row, gaps of up to 40 px (the desert's rock patches) included, is the painted
 // patch; other reddish specks are leaf litter.
 let first=-1,last=-1;for(let x=0,start=-1,end=-1;x<=W;x++){if(x<W&&sand(x)){if(start<0||x-end>40)start=x;end=x;if(end-start>last-first)[first,last]=[start,end];}}
 let jump=0;
 for(const ex of [first,last])for(let x=Math.max(1,ex-12);x<=Math.min(W-1,ex+12);x++){const k=at(x),j=k-4;jump=Math.max(jump,Math.abs(data[k]-data[j])+Math.abs(data[k+1]-data[j+1])+Math.abs(data[k+2]-data[j+2]));}
 const errors=s.errs.splice(0);s.dispose();world.dispose();
 return {row,first,last,jump,errors};
}
// Finding 1: a coast-west world seen from its south-west corner at radius 1,600 with the default clipmap. The terrain's
// outer ring used to stop at about 1 km (6 rings of 64 cells), so land past it was not drawn while the sea and the sky
// were: the frame must now equal the one with 12 rings (the most the terrain takes, 63 km of reach), and a clipmap that
// reaches less than the radius is a RangeError. Returns the share of pixels (any channel off by more than 8) where two
// frames differ.
async function clip(){
 const world=await BiomeWorld.create({biomes:[presets.temperate],climate:{latitude:44,rainfall:1100},height:{relief:{seed:9,relief:900,base:160,coast:'west',seaDepth:60}}});
 const g=(x,z)=>world.sample(x,z).height,s=await shotEngine([-1850,g(-1850,1750)+30,1750],[-1150,110,-300]),W=s.canvas.width,H=s.canvas.height;
 const diff=(a,b)=>{let n=0;for(let i=0;i<W*H*4;i+=4)if(Math.abs(a[i]-b[i])>8||Math.abs(a[i+1]-b[i+1])>8||Math.abs(a[i+2]-b[i+2])>8)n++;return n/(W*H);};
 const auto=await s.pixels(world,{radius:1600}),full=await s.pixels(world,{radius:1600,clipmap:{levels:12}});
 let error=null;try{await BiomeView.attach(s.e,world,{radius:1600,objects:false,clipmap:{levels:5}});}catch(e){error=e.message;}
 const errors=s.errs.splice(0);s.dispose();world.dispose();
 return {autoVsFull:diff(auto,full),error,errors};
}
window.check={
 async run(){
  const out={};device.pushErrorScope('validation');
  const world=await BiomeWorld.create({size:[512,512],biomes:[presets.temperate,presets.desert],height:{field:(x,z)=>40+3*Math.sin(x/37)*Math.cos(z/41)},climate:{latitude:47,rainfall:1000}});
  const view=await BiomeView.attach(engine,world,{radius:600,objects:false});
  await view.ready;
  out.materials=view.materials;
  out.before=mean(await shot());
  const full=new Uint8Array(256*256).fill(255);
  for(let z=0;z<2;z++)for(let x=0;x<2;x++)world.writeLayer('paint/desert',x,z,full);
  await view.whenIdle();
  out.after=mean(await shot());
  // Clearing the paint brings the grass back.
  for(let z=0;z<2;z++)for(let x=0;x<2;x++)world.writeLayer('paint/desert',x,z,undefined);
  await view.whenIdle();
  out.cleared=mean(await shot());
  view.dispose();
  out.afterDispose=mean(await shot());
  // All 8 presets: 15 ground materials, 4 weight textures. Painted desert must draw as sand (main cut the list at 8 and
  // drew sand, the 12th, as grass).
  const every=await BiomeWorld.create({size:[512,512],biomes:Object.values(presets).filter(b=>b.id!=='beach'),height:{field:(x,z)=>40+3*Math.sin(x/37)*Math.cos(z/41)},climate:{latitude:47,rainfall:1000}});
  for(let z=0;z<2;z++)for(let x=0;x<2;x++)every.writeLayer('paint/desert',x,z,full);
  const all=await BiomeView.attach(engine,every,{radius:600,objects:false});
  await all.ready;await all.whenIdle();
  out.allMaterials=all.materials;out.allDesert=mean(await shot());
  all.dispose();
  // Temperate ground at noon, as the canvas shows it (sRGB pixels of a second engine with the Sky's sun and sky light and
  // no Bloom), looked at from 12 m up over the world's rolling ground: how bright and how varied the default ground reads.
  out.noon=await noonGround(world);
  out.alpine=await alpine();
  out.clip=await clip();
  out.edge=await edge(24);out.edgeOff=await edge(0);
  const error=await device.popErrorScope();
  out.validation=error?.message??null;out.errors=errors.splice(0);
  return out;
 }
};
window.ready=true;
</script></body></html>
