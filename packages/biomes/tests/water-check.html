<!doctype html><html><head><meta charset="utf-8"/><title>Biomes water check</title><style>body{margin:0}canvas{display:block;width:320px;height:200px}canvas.sea{width:720px;height:450px}</style></head><body><canvas width="320" height="200"></canvas>
<script type="module">
// Real-GPU proof for the `water` option of @margoengine/biomes/view: the wetland preset world reaches below sea level on
// its west side, so the default view (`water: 'auto'`) draws the sea there; with `water: false` (main had no water) the
// sea floor shows as mud. Then the sea's look from the biome shots' camera 06 under a noon Sky passed as `sky`.
import {Engine} from '/packages/core/dist/index.js';
import {Sky} from '/packages/sky/dist/index.js';
import {BiomeWorld} from '/packages/biomes/dist/index.js';
import {presets,presetWorlds} from '/packages/biomes/dist/presets.js';
import {BiomeView} from '/packages/biomes/dist/view.js';
import {hydrologyOf,riversOf} from '/packages/biomes/dist/hydrology.js';
import {waitForPipelines} from '/scripts/support/gpu-ready.js';
const canvas=document.querySelector('canvas');
const luma=(d,k)=>(0.2126*d[k]+0.7152*d[k+1]+0.0722*d[k+2])/255;
// The sea of the wetland world from shot 06 (14 m over the shore at x = -700 m, looking west to x = -1,900 m), 720 x 450
// sRGB pixels, under the shots' Sky (noon, lighting 3, environment). Water pixels are the ones the sea changes: the
// same frame drawn with `water: false` shows the sea floor there. Returns their mean and standard deviation of sRGB luma
// and, in the shore band (water pixels with land at most 8 px below them in the same column), the share of foam-white
// pixels (every channel 0.7 or more), and the wave texture (below).
async function sea(){
 const c2=document.createElement('canvas');c2.className='sea';c2.width=720;c2.height=450;document.body.append(c2);
 const world=await BiomeWorld.create({biomes:[presets.wetland],climate:presetWorlds.wetland.climate,height:{relief:presetWorlds.wetland.relief}});
 const g=world.sample(-700,0).height;
 const e=await Engine.create(c2,{backend:'webgpu',camera:{position:[-700,g+14,0],target:[-1900,g-14,0],near:0.3,far:20000}});
 const errors=[];e.gpu.addEventListener('uncapturederror',ev=>errors.push(ev.error.message));
 const sky=Sky.attach(e,{hours:12,timeScale:0,lighting:{intensity:3},environment:true});
 const frame=async()=>{e.render({delta:1/60});await e.gpu.queue.onSubmittedWorkDone();};
 async function grab(water){
  const view=await BiomeView.attach(e,world,{objects:false,sky,water});
  await view.ready;await view.whenIdle();await waitForPipelines(frame);await view.whenIdle();await waitForPipelines(frame);
  e.render({delta:1/60});
  const c=new OffscreenCanvas(c2.width,c2.height).getContext('2d');c.drawImage(c2,0,0);
  const {data}=c.getImageData(0,0,c2.width,c2.height);
  const drawn=view.water!==undefined;view.dispose();return {data,drawn};
 }
 const on=await grab('auto'),off=await grab(false),W=c2.width,H=c2.height,water=new Uint8Array(W*H);
 for(let i=0;i<W*H;i++){const k=i*4;water[i]=+(Math.abs(on.data[k]-off.data[k])+Math.abs(on.data[k+1]-off.data[k+1])+Math.abs(on.data[k+2]-off.data[k+2])>30);}
 let n=0,s=0,q=0,band=0,foam=0,tn=0,tq=0;
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){
  const i=y*W+x;if(!water[i])continue;
  const l=luma(on.data,i*4);n++;s+=l;q+=l*l;
  // Wave texture: luma less the mean of its 5 x 5 neighbourhood, where that is all water (a plane's distance gradient
  // and the horizon haze cancel out; waves do not).
  if(x>=2&&y>=2&&x<W-2&&y<H-2){let all=true,m=0;for(let dy=-2;dy<=2&&all;dy++)for(let dx=-2;dx<=2;dx++){const j=i+dy*W+dx;if(!water[j]){all=false;break;}m+=luma(on.data,j*4);}if(all){const d=l-m/25;tn++;tq+=d*d;}}
  let shore=false;for(let d=1;d<=8&&y+d<H;d++)if(!water[i+d*W]){shore=true;break;}
  if(shore){band++;const k=i*4;if(on.data[k]>=179&&on.data[k+1]>=179&&on.data[k+2]>=179)foam++;}
 }
 const mean=s/n;
 sky.dispose();e.dispose();world.dispose();c2.remove();
 return {drawn:on.drawn,share:n/(W*H),mean,sd:Math.sqrt(Math.max(0,q/n-mean*mean)),texture:Math.sqrt(tq/Math.max(1,tn)),band,foam:foam/Math.max(1,band),errors};
}
// River water at a 4 km coast world's river (relief: coast south, one river): the state the water stands on, along the
// line, is 1.5 m over the ground and above the sea, and from above the river shows where `water: 'auto'` has only land.
async function river(){
 const c2=document.createElement('canvas');c2.className='sea';c2.width=720;c2.height=450;document.body.append(c2);
 const world=await BiomeWorld.create({biomes:[presets.temperate],climate:{latitude:46,rainfall:1200},height:{relief:{seed:3,relief:900,base:300,rivers:1,coast:'south'}}});
 const line=world.rivers[0],at=(k)=>[line[2*k]/1000,line[2*k+1]/1000];
 const [mx,mz]=at(4),e=await Engine.create(c2,{backend:'webgpu',camera:{position:[mx-30,world.heightAt(mx,mz)+420,mz+260],target:[mx,world.heightAt(mx,mz),mz],near:0.5,far:20000}});
 const errors=[];e.gpu.addEventListener('uncapturederror',ev=>errors.push(ev.error.message));
 const sky=Sky.attach(e,{hours:12,timeScale:0,lighting:{intensity:3},environment:true});
 const frame=async()=>{e.render({delta:1/60});await e.gpu.queue.onSubmittedWorkDone();};
 async function grab(water){
  const view=await BiomeView.attach(e,world,{objects:false,sky,water});
  await view.ready;await view.whenIdle();await waitForPipelines(frame);await view.whenIdle();await waitForPipelines(frame);
  let state;
  if(typeof water==='object'){
   const texture=view.water.coastalDepthTexture,w=texture.width,h=texture.height,read=e.gpu.createBuffer({size:w*h*16,usage:GPUBufferUsage.MAP_READ|GPUBufferUsage.COPY_DST}),enc=e.gpu.createCommandEncoder();
   enc.copyTextureToBuffer({texture},{buffer:read,bytesPerRow:w*16},[w,h]);e.gpu.queue.submit([enc.finish()]);await read.mapAsync(GPUMapMode.READ);state={w,h,data:new Float32Array(read.getMappedRange()).slice()};read.unmap();read.destroy();
  }
  e.render({delta:1/60});
  const c=new OffscreenCanvas(c2.width,c2.height).getContext('2d');c.drawImage(c2,0,0);
  const {data}=c.getImageData(0,0,c2.width,c2.height);view.dispose();return {data,state};
 }
 const on=await grab({rivers:'auto'}),off=await grab('auto'),{w,h,data}=on.state,[x0,z0,x1,z1]=world.bounds;
 const stand=(x,z)=>{const i=Math.floor((x-x0)/(x1-x0)*w),j=Math.floor((z-z0)/(z1-z0)*h),o=(j*w+i)*4;return {depth:data[o],surface:data[o]+data[o+1]};};
 const points=[];for(let k=1;k<=8;k++){const [x,z]=at(k),g=world.heightAt(x,z),s=stand(x,z);points.push({k,x,z,ground:g,depth:s.depth,surface:s.surface});}
 let changed=0;for(let i=0;i<on.data.length;i+=4)if(Math.abs(on.data[i]-off.data[i])+Math.abs(on.data[i+1]-off.data[i+1])+Math.abs(on.data[i+2]-off.data[i+2])>30)changed++;
 sky.dispose();e.dispose();world.dispose();c2.remove();
 return {points,share:changed/(c2.width*c2.height),errors};
}
// Job E: lakes and hydrology rivers on the default world (no sea, no relief rivers). Before, its lakes lived in the
// hydrology's data only and no view drew them. Over its deepest lake the state the water stands on is at the fill level
// (`h.filled`), and from above `water: { lakes: 'auto' }` changes pixels that `water: {}` (a sea hidden under land) does
// not; `water: { rivers: 'hydrology' }` shows water along the longest channel.
async function lakes(){
 const c2=document.createElement('canvas');c2.className='sea';c2.width=720;c2.height=450;document.body.append(c2);
 const world=await BiomeWorld.create({}),h=hydrologyOf(world),{lines}=riversOf(world,h),[x0,z0,x1,z1]=world.bounds;
 let deep=-1;for(let c=0;c<h.lake.length;c++)if(h.lake[c]&&(deep<0||h.filled[c]-h.height[c]>h.filled[deep]-h.height[deep]))deep=c;
 const lx=x0+(deep%h.nx)*h.step/1000,lz=z0+Math.floor(deep/h.nx)*h.step/1000,level=h.filled[deep]/1000;
 const e=await Engine.create(c2,{backend:'webgpu',camera:{position:[lx-30,level+420,lz+260],target:[lx,level,lz],near:0.5,far:20000}});
 const errors=[];e.gpu.addEventListener('uncapturederror',ev=>errors.push(ev.error.message));
 const sky=Sky.attach(e,{hours:12,timeScale:0,lighting:{intensity:3},environment:true});
 const frame=async()=>{e.render({delta:1/60});await e.gpu.queue.onSubmittedWorkDone();};
 async function grab(water,read){
  const view=await BiomeView.attach(e,world,{objects:false,sky,water});
  await view.ready;await view.whenIdle();await waitForPipelines(frame);await view.whenIdle();await waitForPipelines(frame);
  let state;
  if(read){
   const texture=view.water.coastalDepthTexture,w=texture.width,hh=texture.height,buf=e.gpu.createBuffer({size:w*hh*16,usage:GPUBufferUsage.MAP_READ|GPUBufferUsage.COPY_DST}),enc=e.gpu.createCommandEncoder();
   enc.copyTextureToBuffer({texture},{buffer:buf,bytesPerRow:w*16},[w,hh]);e.gpu.queue.submit([enc.finish()]);await buf.mapAsync(GPUMapMode.READ);state={w,h:hh,data:new Float32Array(buf.getMappedRange()).slice()};buf.unmap();buf.destroy();
  }
  e.render({delta:1/60});
  const c=new OffscreenCanvas(c2.width,c2.height).getContext('2d');c.drawImage(c2,0,0);
  const {data}=c.getImageData(0,0,c2.width,c2.height);view.dispose();return {data,state};
 }
 const changed=(a,b)=>{let n=0;for(let i=0;i<a.length;i+=4)if(Math.abs(a[i]-b[i])+Math.abs(a[i+1]-b[i+1])+Math.abs(a[i+2]-b[i+2])>30)n++;return n/(c2.width*c2.height);};
 const on=await grab({lakes:'auto'},true),off=await grab({}),{w,h:hh,data}=on.state;
 const i=Math.floor((lx+1-x0)/(x1-x0)*w),j=Math.floor((lz+1-z0)/(z1-z0)*hh),o=(j*w+i)*4;
 const lake={level,depth:data[o],surface:data[o]+data[o+1],share:changed(on.data,off.data)};
 // The longest channel, the camera over its middle point.
 const line=lines.reduce((a,b)=>b.length>a.length?b:a),k=Math.floor(line.length/4)*2,mx=line[k]/1000,mz=line[k+1]/1000;
 e.camera.position=[mx-30,world.heightAt(mx,mz)+420,mz+260];e.camera.target=[mx,world.heightAt(mx,mz),mz];
 const river=changed((await grab({rivers:'hydrology'})).data,(await grab({})).data);
 sky.dispose();e.dispose();world.dispose();c2.remove();
 return {lake,river,lines:lines.length,errors};
}
window.check={
 async run(){
  const {climate,relief}=presetWorlds.wetland,world=await BiomeWorld.create({climate,height:{relief}});
  // On land 50 m from the shore (about x = -1,300 m), looking west out to sea.
  const ground=world.sample(-1250,0).height,out={ground,sea:world.climate.sea/1000};
  const engine=await Engine.create(canvas,{backend:'webgpu',camera:{position:[-1250,ground+15,0],target:[-1800,ground-25,0],near:0.5,far:20000}}),device=engine.gpu,errors=[];
  device.addEventListener('uncapturederror',e=>errors.push(e.error.message));
  device.pushErrorScope('validation');
  // Share of pixels in the lower third of the frame that are water: blue over red (land here is mud, moss and grass).
  async function lowerThird(){
   for(let i=0;i<3;i++){engine.render({delta:1/60});await device.queue.onSubmittedWorkDone();}
   engine.render({delta:1/60});
   const c=new OffscreenCanvas(canvas.width,canvas.height).getContext('2d');c.drawImage(canvas,0,0);
   const {data}=c.getImageData(0,0,canvas.width,canvas.height);let water=0,n=0;
   for(let y=Math.floor(canvas.height*2/3);y<canvas.height;y++)for(let x=0;x<canvas.width;x++,n++){const k=(y*canvas.width+x)*4;if(data[k]<data[k+2])water++;}
   return water/n;
  }
  for(const [name,water] of [['auto',undefined],['off',false]]){
   const view=await BiomeView.attach(engine,world,{objects:false,radius:600,...(water===undefined?{}:{water})});
   await view.ready;await view.whenIdle();
   out[name]={water:view.water!==undefined,share:await lowerThird()};
   view.dispose();
  }
  const error=await device.popErrorScope();
  out.validation=error?.message??null;out.errors=errors.splice(0);
  engine.dispose();world.dispose();
  out.sea=await sea();
  out.river=await river();
  out.lakes=await lakes();
  return out;
 }
};
window.ready=true;
</script></body></html>
