<!doctype html><html><head><meta charset="utf-8"/><title>Biome flythrough check</title><style>body{margin:0}canvas{display:block;width:640px;height:360px}</style></head><body><canvas></canvas>
<script type="module">
// Goal G3 of the biomes spec: a 300 km/h (83 m/s) flight over the zero-configuration world with its 1 km object radius,
// tiles made by the world's workers as the camera goes, against the same flight with every tile it meets made before
// it starts (view.prefetch), three flights of each taking turns. Frames run in real time (requestAnimationFrame); each
// frame's main-thread work is the time engine.render takes (the view's streaming runs inside it, before the draw). The
// runner compares the medians of the two kinds.
import {Engine} from '/packages/core/dist/index.js';
import {BiomeWorld} from '/packages/biomes/dist/index.js';
import {BiomeView} from '/packages/biomes/dist/view.js';
const engine=await Engine.create(document.querySelector('canvas'),{backend:'webgpu',camera:{position:[-1200,260,-1200],target:[-1100,200,-1100],near:0.5,far:4000}}),device=engine.gpu,errors=[];
device.addEventListener('uncapturederror',e=>errors.push(e.error.message));
const SPEED=83.3,FROM=[-1200,-1200],TO=[1200,1200],LENGTH=Math.hypot(TO[0]-FROM[0],TO[1]-FROM[1]);
const place=(s)=>{const t=Math.min(1,s/LENGTH),x=FROM[0]+(TO[0]-FROM[0])*t,z=FROM[1]+(TO[1]-FROM[1])*t;engine.camera.position[0]=x;engine.camera.position[1]=260;engine.camera.position[2]=z;engine.camera.target[0]=x+70;engine.camera.target[1]=200;engine.camera.target[2]=z+70;};
const frame=()=>new Promise((done)=>requestAnimationFrame(done));
/** One flight: real-time frames until the camera reaches the end; per frame the render time and the interval. */
async function fly(view){
 const times=[],intervals=[];let s=0,last;place(0);
 for(let i=0;i<30;i++){await frame();engine.render({delta:1/60});}
 await view.whenIdle();view.tileTimes.length=0;view.frameTimes.length=0;
 // Intervals between frame timestamps only: a frame's timestamp is when it began, which can be earlier than a
 // performance.now() read while the page was late, and a negative delta is (rightly) refused by render.
 last=await frame();
 while(s<LENGTH){
  const now=await frame(),dt=Math.min(0.1,(now-last)/1000);intervals.push(now-last);last=now;s+=SPEED*dt;place(s);
  const t0=performance.now();engine.render({delta:dt});times.push(performance.now()-t0);
 }
 return {times,intervals,tiles:[...view.tileTimes],copies:[...view.frameTimes]};
}
window.check={
 /** Three flights of each kind, taking turns: streamed (tiles made as the camera goes), then prefetched (every tile made first), each on a fresh world. */
 async run(workers){
  const out={streamed:[],prefetched:[]};device.pushErrorScope('validation');
  for(let round=0;round<3;round++)for(const kind of ['streamed','prefetched']){
   const world=await BiomeWorld.create(workers?{workers}:{});out.workers=world.workers?.size??0;place(0);
   const view=await BiomeView.attach(engine,world);await view.ready;
   if(kind==='prefetched')await view.prefetch([FROM[0]-1300,FROM[1]-1300,TO[0]+1300,TO[1]+1300]);
   const flight=await fly(view);flight.objects=view.objects.count;out[kind].push(flight);view.dispose();world.dispose();
  }
  const error=await device.popErrorScope();out.validation=error?.message??null;out.errors=errors.splice(0);
  return out;
 },
 /**
  * A slow machine: sending a job wakes a worker thread, and copying bytes into textures is memory bound, both much
  * dearer on a laptop than on a desktop. Here every send to a worker takes SEND ms and every texture write COPY ms
  * per kB: a third of the flight on 4 workers, timing the view's own work in each frame (its plugin). Jobs a frame
  * starts must go out within the frame budget, and a tile must go in a few rows at a time, not in one frame. With STALL
  * set, the workers' replies are held back for STALL ms out of every 2 x STALL ms, as busy workers on a laptop are:
  * jobs the view sends meanwhile only wait in the pool's queues.
  */
 async slowSends(SEND,COPY,STALL=0){
  let sends=0,late=0,inView=false,stepped=false,known=false;const queue=device.queue,writeTexture=queue.writeTexture;
  queue.writeTexture=function(dst,data,layout,size){if(inView)stepped=true;const end=performance.now()+COPY*(layout.bytesPerRow??0)*(size[1]??size.height??1)/1024;while(performance.now()<end);return writeTexture.call(this,dst,data,layout,size);};
  const createWorker=()=>{const w=new Worker('/packages/biomes/dist/workers/biomes.js',{name:'margoengine-biomes'}),post=w.postMessage.bind(w);if(STALL){let on=null;Object.defineProperty(w,'onmessage',{get:()=>on,set:(f)=>{on=f;}});w.addEventListener('message',(e)=>held?held.push(()=>on?.(e)):on?.(e));}w.postMessage=(m,t)=>{sends++;if(inView){if(stepped&&known)late++;known=true;}const end=performance.now()+SEND;while(performance.now()<end);post(m,t);};return w;};
  let held=null;const world=await BiomeWorld.create({workers:4,createWorker});place(0);
  const view=await BiomeView.attach(engine,world);await view.ready;
  // Every step the view takes marks the frame: a texture write, an objects step, a job handed to the pool (sent or queued).
  const run=world.workers.run.bind(world.workers);world.workers.run=(...a)=>{const r=run(...a);if(inView)stepped=true;return r;};
  const proto=Object.getPrototypeOf(view.objects),steps=proto.steps;proto.steps=function(...a){return steps.apply(this,a).map((f)=>()=>{f();if(inView)stepped=true;});};
  const stall=STALL&&setInterval(()=>{if(held){const go=held;held=null;for(const f of go)setTimeout(f,0);}else held=[];},STALL);
  const plugin=[...engine.plugins.values()].find((p)=>p.name.startsWith('biomes-view:')),own=plugin.onPreUpdate,times=[];
  plugin.onPreUpdate=(delta)=>{const t0=performance.now();inView=true;stepped=false;own(delta);inView=false;times.push(performance.now()-t0);};
  for(let i=0;i<10;i++){await frame();engine.render({delta:1/60});}
  await view.whenIdle();times.length=0;sends=0;late=0;known=false;
  let s=0,last=await frame();
  while(s<LENGTH/3){const now=await frame(),dt=Math.min(0.1,(now-last)/1000);last=now;s+=SPEED*dt;place(s);engine.render({delta:dt});}
  delete queue.writeTexture;proto.steps=steps;clearInterval(stall);if(held){for(const f of held)f();held=null;}
  const out={frames:times.length,max:Math.max(...times),sends,late};view.dispose();world.dispose();
  return out;
 }
};
/**
 * Copying goes on while budget is left: a frame that copied and left copy steps waiting spent its whole budget. With
 * every tile made first (no sends) and each detail map write slowed by SLOW ms, the frames that stopped short are
 * counted; the view once held all objects steps back for a whole frame after one dear step, and copied over four
 * times as many frames.
 */
window.check.packing=async function(SLOW){
 const world=await BiomeWorld.create({workers:4});place(0);
 const view=await BiomeView.attach(engine,world);await view.ready;
 await view.prefetch([FROM[0]-1300,FROM[1]-1300,FROM[0]+(TO[0]-FROM[0])/3+1300,FROM[1]+(TO[1]-FROM[1])/3+1300]);
 const queue=device.queue,writeTexture=queue.writeTexture;
 queue.writeTexture=function(dst,...rest){if(dst.texture.format==='r8unorm'){const end=performance.now()+SLOW;while(performance.now()<end);}return writeTexture.call(this,dst,...rest);};
 for(let i=0;i<10;i++){await frame();engine.render({delta:1/60});}
 await view.whenIdle();
 let s=0,copied=0,short=0,last=await frame();
 while(s<LENGTH/3){const now=await frame(),dt=Math.min(0.1,(now-last)/1000);last=now;s+=SPEED*dt;place(s);
  view.frameTimes.length=0;engine.render({delta:dt});
  if(view.frameTimes.length){copied++;if(view.streaming.arrived&&view.frameTimes[0]<0.25)short++;}}
 delete queue.writeTexture;view.dispose();world.dispose();return {copied,short};
};
/**
 * A frame that plans sends and copies nothing, unless the frame before planned and did nothing too; it once sent the
 * jobs it planned in the same frame, and on a laptop APU those frames were the slowest 1 percent. A flight moves under
 * an eighth of a tile a frame, so no frame plans right after a plan either. Plans are the view's own count (a plan
 * that starts no job counts), and a frame copied or sent when it took any streaming step.
 */
window.check.planFrames=async function(){
 const world=await BiomeWorld.create({workers:4});place(0);
 const view=await BiomeView.attach(engine,world);await view.ready;
 for(let i=0;i<10;i++){await frame();engine.render({delta:1/60});}
 await view.whenIdle();
 let s=0,plans=0,both=0,after=0,waited=false,was=false,last=await frame();
 while(s<LENGTH/3){const now=await frame(),dt=Math.min(0.1,(now-last)/1000);last=now;s+=SPEED*dt;place(s);
  const p0=view.streaming.plans;view.frameTimes.length=0;engine.render({delta:dt});
  const planned=view.streaming.plans>p0,copied=view.frameTimes.length>0;
  if(planned){plans++;if(copied&&!waited)both++;if(was)after++;}waited=planned&&!copied;was=planned;}
 view.dispose();world.dispose();return {plans,both,after};
};
/**
 * The plan of a camera that stays put comes 30 frames after the last plan: it came every 30th frame, so a camera that
 * planned (moved an eighth of a tile) the frame before planned twice in a row, and the second plan streamed too. A
 * camera that moves an eighth of a tile every 29 frames (1.12 m a frame; an eighth of a 256 m tile is 32 m) met that
 * every 30 frames.
 */
window.check.heartbeat=async function(){
 const world=await BiomeWorld.create({workers:4});place(0);
 const view=await BiomeView.attach(engine,world);await view.ready;
 let s=0,plans=0,after=0,was=false;
 for(let i=0;i<300;i++){await frame();s+=1.12;place(s);
  const p0=view.streaming.plans;engine.render({delta:1/60});
  const planned=view.streaming.plans>p0;if(planned){plans++;if(was)after++;}was=planned;}
 view.dispose();world.dispose();return {plans,after};
};
window.ready=true;
</script></body></html>
