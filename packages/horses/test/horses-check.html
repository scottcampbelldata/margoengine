<!doctype html><html><head><meta charset="utf-8"/><title>horses check</title><style>body{margin:0;background:#000}canvas{display:block}</style></head><body><canvas></canvas>
<script type="module">
// GPU check page of @margoengine/horses. window.check.horse(): a cavalry horse built by addHorse eases into a trot under
// a key light with shadows; returns the frame as PNG bytes, the pose after chunked play and after a seek to the same
// film time, and the saddle path a rider seat follows. window.check.herd(): 60 horses of addHorseCrowd driven by a
// @margoengine/navmesh/formations cavalry wedge and line on the march, as PNG bytes.
import {Engine} from '/packages/core/dist/index.js';
import {Shadows} from '/packages/shadows/dist/index.js';
import {addHorse} from '/packages/horses/dist/index.js';
import {horseDocument,horseJointTranslation,poseHooves,poseJoints} from '/packages/horses/dist/model.js';
import {parseGLTFAsync} from '/packages/gltf/dist/pbr.js';
import {addHorseCrowd} from '/packages/horses/dist/crowd.js';
import {mountRider} from '/packages/horses/dist/seat.js';
import {Army} from '/packages/navmesh/dist/formations.js';
const canvas=document.querySelector('canvas');canvas.width=480;canvas.height=360;canvas.style.width='480px';canvas.style.height='360px';
const make=async(camera)=>{
  const engine=await Engine.create(canvas,{camera:{fov:35,near:0.05,far:400,...camera}});
  engine.stop();
  const errors=[];engine.gpu?.addEventListener?.('uncapturederror',e=>errors.push(e.error.message));
  engine.scene.background='#30333a';
  engine.lighting.direction.set([0.5,0.6,0.62,3]);engine.lighting.radiance.set([1,0.95,0.88,0.45]);
  return {engine,errors};
};
const png=async()=>[...new Uint8Array(await (await new Promise(r=>canvas.toBlob(r,'image/png'))).arrayBuffer())];
const settle=async(engine)=>{for(let i=0;i<4;i++){engine.render({delta:1/30});await engine.gpu?.queue?.onSubmittedWorkDone?.();}};
window.check={
  async horse(){
    const {engine,errors}=await make({position:[4.2,1.6,3.2],target:[0,1.0,1.2]});
    Shadows.attach(engine,{resolution:1024});
    const horse=await addHorse(engine,{type:'cavalry',position:[0,-6.2],coat:'bay',markings:{blaze:true,socks:[0.3,0,0,0]}});
    horse.speed=4;
    const saddle=[];
    const rider={root:{setPosition(p){saddle.push(p[1]);},setQuaternion(){}}},mount=mountRider(horse,rider,{height:1.75});
    for(let i=0;i<75;i++)horse.advanceTime(1/30);
    const played={d:horse.distance,t:horse.time,cs:horse.currentSpeed,pose:JSON.stringify(horse.pose),frame:JSON.stringify(horse.frame()),gait:horse.currentGait,speed:horse.currentSpeed,hip:mount.hip};
    await settle(engine);
    const bytes=await png();
    horse.seek(1.1);horse.seek(2.5);
    const sought={d:horse.distance,t:horse.time,cs:horse.currentSpeed,pose:JSON.stringify(horse.pose),frame:JSON.stringify(horse.frame()),hip:mount.hip};
    // Measure the steady trot across its stride, independent of the phase chosen at the walk-to-trot transition.
    const ys=saddle.slice(-180),rise=Math.max(...ys)-Math.min(...ys);
    mount.dispose();horse.dispose();
    const after=engine.plugins.has(horse.animation.name);
    engine.dispose();
    return {bytes,errors,played,sought,rise,after,clips:horse.clips.map(c=>c.name)};
  },
  async motion(){
    const {engine,errors}=await make({position:[4.2,1.65,2.6],target:[0,1.0,0]});
    const horse=await addHorse(engine,{type:'riding',coat:'chestnut',markings:{blaze:true}});
    const samples=[], gaits=new Set();
    const k=horse.skeleton.index('tailHair5');
    const limbs=horse.skeleton.legs.flat();
    const at=()=>poseJoints(horse.skeleton,horse.pose);
    let last=at(), maxRestartStep=0, maxGallopStep=0, tailSweep=0, stopSpeed, largestRestart;
    const shots={};
    const frames=new Map([[34,'tail-flick'],[225,'trot'],[852,'gallop'],[1416,'restart']]);
    for(let i=0;i<1490;i++){
      if(i===0) horse.flickTail(1,'right');
      if(i===76) horse.speed=4;
      if(i===110) horse.gait='canter'; // Interrupt the walk-to-trot blend.
      if(i===119) horse.gait='auto';
      if(i===260) horse.speed=0;
      if(i===476) horse.speed=12;
      if(i===877) horse.speed=0;
      if(i===1360){stopSpeed=horse.currentSpeed;horse.gait='trot';horse.speed=4;}
      horse.advanceTime(1/120);
      const joints=at();
      for(const id of limbs) {
        const step=Math.hypot(...joints[id].map((v,c)=>v-last[id][c]));
        if((i<225||i>=1360)&&step>maxRestartStep){
          maxRestartStep=step;largestRestart={i,id,speed:horse.currentSpeed,gait:horse.currentGait};
        }
        else if(horse.currentGait==='gallop')maxGallopStep=Math.max(maxGallopStep,step);
      }
      if(i<76)tailSweep=Math.max(tailSweep,Math.abs(joints[k][0]));
      last=joints;
      gaits.add(horse.currentGait);
      if(frames.has(i)){
        const pos=horse.frame().position;
        engine.camera.position=[4.2,1.72,pos[2]+2.05];engine.camera.target=[0,0.95,pos[2]];
        await settle(engine);
        shots[frames.get(i)]=await png();
        samples.push({time:horse.time,pose:JSON.stringify(horse.pose)});
      }
    }
    horse.seek(samples[0].time);
    const replayTail=JSON.stringify(horse.pose);
    horse.seek(samples[2].time);
    const replayGallop=JSON.stringify(horse.pose);
    horse.dispose();engine.dispose();
    return {gaits:[...gaits],maxRestartStep,maxGallopStep,stopSpeed,largestRestart,tailSweep,samples,replayGallop,replayTail,shots,errors};
  },
  async authored(){
    const {engine,errors}=await make({position:[4.2,1.6,3.2],target:[0,1.0,0]});
    const {doc,buffers,skeleton:nominal,clips}=horseDocument({detail:0});
    const model=await parseGLTFAsync(engine,doc,buffers);
    // A taller shoulder relative to the fore limb's length leaves less room to advance the hoof.
    const foreJoints=new Set(nominal.legs.filter((_,i)=>i%2===1).flatMap(leg=>leg.slice(0,5)));
    const skeleton={...nominal,joints:nominal.joints.map((joint,i)=>{
      const [x,y,z]=joint.rest;
      return foreJoints.has(i)?{...joint,rest:[x,y+.18*(y-.06),z*.38+.62*nominal.ground[1][2]]}:joint;
    })};
    let last;
    const horse=await addHorse(engine,{skin:{model,skeleton,applyPose(pose){
      last=pose;
      pose.rotations.forEach((q,i)=>{
        model.nodes[i].setQuaternion(q);
        model.nodes[i].setPosition(horseJointTranslation(skeleton,pose,i));
      });
    }}});
    horse.speed=3.8;
    let lowest=Infinity;
    const unregister=horse.onStep((_dt,current)=>{
      if(current.currentSpeed<1) lowest=Math.min(lowest,...poseHooves(skeleton,current.pose).map(hoof=>hoof[1]));
    });
    horse.seek(1.7);
    unregister();
    await settle(engine);
    const adopted=horse.model===model && last===horse.pose && !horse.animation.playing;
    const fitted=horse.clips[2].strideLength/clips[2].strideLength;
    const still=engine.sceneOf(model);
    horse.dispose();
    const callerOwns=engine.sceneOf(model)===still && !!still && !engine.plugins.has(horse.animation.name);
    model.dispose();engine.dispose();
    return {adopted,callerOwns,errors,fitted,lowest};
  },
  async herd(){
    const {engine,errors}=await make({position:[0,22,-48],target:[0,0,4]});
    const army=new Army();
    const wedge=army.add({count:25,kind:'cavalry',shape:'wedge',position:[-8,0]}),
      line=army.add({count:35,kind:'cavalry',shape:'line',ranks:2,position:[10,-6]});
    wedge.march({speed:6});line.march({speed:3.5});
    const herd=await addHorseCrowd(engine,{type:'cavalry'});
    army.advanceTime(2);herd.update(army.members);
    await settle(engine);
    const bytes=await png();
    const gaits=army.members.map(m=>herd.pose(m.speed,m.distance).clip),seats=army.members.map((m,i)=>[herd.saddles[i*16+12]-m.x,herd.saddles[i*16+13],herd.saddles[i*16+14]-m.z]);
    herd.dispose();engine.dispose();
    return {bytes,errors,count:herd.count,gaits,seats,withers:herd.body.withers,clips:herd.clips.map(c=>c.name),bones:herd.bake.bones};
  },
};
window.ready=true;
</script></body></html>
