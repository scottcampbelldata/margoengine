// The canvas as RGBA bytes (a 2D copy right after a frame).

// Real KTX-Software files of packages/decoders/tests/fixtures/ktx2-layers.
const ktx2File=name=>`/packages/decoders/tests/fixtures/ktx2-layers/${name}.ktx2`;

// The surfaces of the lobes checks: black under the lobe, so what shows is the lobe.

  coat:{color:[0,0,0,1],clearcoat:1,clearcoatRoughness:0.3},
  sheen:{color:[0,0,0,1],sheenColor:[1,1,1],sheenRoughness:0.5},

const toward=[0.3,0.2,1],lobePower={coat:16,sheen:64,film:2,grain:1};
window.check={
  // Strand highlights on a flat quad (a stand-in), its strands up the V axis, seen from `height` units away.

  },
  // The same light as the sun and as clustered lights, on one model.
  async character({model,light}){

  },
  // Strand highlights on the real avatar's hair mesh: the way the strands run moves them.
  async hairAvatar(){

    const draw=async(material)=>{const made=await scene(view),{engine,errors,render}=made;engine.lighting.direction.set([0.3,0.5,0.8,Math.PI]);engine.lighting.radiance.set([1,1,1,0]);createMesh(engine,geometry,material);await render();const data=await pixels(made);engine.dispose();return {data,errors};};

  // Skin on the real avatar's head, lit from the side, against the plain material, with each pixel's n.l from a normal pass.

    const draw=async(material)=>{const made=await scene(view),{engine,errors,render}=made;engine.lighting.direction.set([1,0,0,power]);engine.lighting.radiance.set([1,1,1,0]);createMesh(engine,geometry,material);await render();const data=await pixels(made);engine.dispose();return {data,errors};};

  // A sphere as an eye (a stand-in for a real eyeball), its colour alone: the dark run along the middle row is the pupil.

  // The real avatar's iris: a shallow plate of 65 vertices with no eyeball behind it, on a sphere of about 65 mm fitted from

  // A real floor texture tiled four times across the whole canvas, so one repeat is 64 pixels exactly.
  async stochastic(kind){

      floorMap=async()=>new Texture(await createImageBitmap(await (await fetch(url)).blob()),{wrapS:'repeat',wrapT:'repeat'}),

    const draw=async(material)=>{const made=await scene(front),{engine,errors,render}=made;createMesh(engine,floor,material);await render();const data=await pixels(made);engine.dispose();return {data,errors};};

    for(let by=64;by<192;by+=8)for(let bx=64;bx<192;bx+=8){let s=0;for(let y=by;y<by+8;y++)for(let x=bx;x<bx+8;x++)s+=light(data[(y*size+x)*4]);means.push(s/64);}
    const mean=means.reduce((a,b)=>a+b)/means.length,spread=Math.sqrt(means.reduce((a,b)=>a+(b-mean)**2,0)/means.length);
    let pixelSum=0,n=0;for(let y=64;y<192;y++)for(let x=64;x<192;x++){pixelSum+=(light(data[(y*size+x)*4])-mean)**2;n++;}
    const out={mean,spread,pixelSpread:Math.sqrt(pixelSum/n),errors};engine.dispose();return out;
  },
  // The shading normal a material draws at the screen's middle, as view-space RGB decoded to -1..1.
  async objectNormal(name){
    const encode=v=>[...v.map(x=>Math.round((x*0.5+0.5)*255)),255],solid=v=>new Texture({data:new Uint8Array([...encode(v),...encode(v),...encode(v),...encode(v)]),width:2,height:2},{colorSpace:'linear',mipmaps:false,magFilter:'nearest',minFilter:'nearest'});
    const made=await scene(front),{engine,errors,render}=made,s=Math.SQRT1_2,turn=[0,Math.PI/4,0];
    const material=(v,o={})=>new NormalMaterial({normalMap:solid(v),features:[objectNormal(o.feature)],side:'double',...o.material});
    const y45=[s,0,-s,0,0,1,0,0,s,0,s,0,0,0,0,1];
    const cases={
      // A map pointing along +z on a quad facing the camera, then turned 45 degrees about y: the normal turns with it.
      plain:()=>createMesh(engine,quad(),material([0,0,1])),
      turned:()=>{const m=createMesh(engine,quad(),material([0,0,1]));m.root.setRotation(turn);},
      // The map wins over the vertex normal, and no tangents are in the geometry.
      sideways:()=>createMesh(engine,quad(),material([1,0,0])),
      // Twice as wide: normals go through the inverse transpose.
      stretched:()=>{const m=createMesh(engine,quad(),material([s,0,s]));m.root.setScale([2,1,1]);},
      // Mirrored in x: the normal mirrors with the mesh.
      mirrored:()=>{const m=createMesh(engine,quad(),material([s,0,s]));m.root.setScale([-1,1,1]);},
      instanced:()=>{const m=createInstancedMesh(engine,quad(),material([0,0,1]),1);m.instances.setMatrices(0,new Float32Array(y45));},
      // Baked Z up: x, y, z read as x, z, -y, so the map's (0, -s, s) is the mesh's (0, s, s).
      zUp:()=>createMesh(engine,quad(),material([0,-s,s],{feature:{up:'z'}})),
      halfScale:()=>createMesh(engine,quad(),material([1,0,0],{material:{normalScale:0.5}})),
    };
    cases[name]();
    await render();
    const data=await pixels(made),o=(size/2*size+size/2)*4,out={normal:[0,1,2].map(k=>+(data[o+k]/255*2-1).toFixed(2)),errors};
    engine.dispose();return out;
  },
};
window.ready=true;
</script></body></html>
