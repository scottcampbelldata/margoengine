<!doctype html><html><head><meta charset="utf-8"/><title>Virtual shadows: page edges</title><style>body{margin:0;background:#000}canvas{width:1280px;height:720px;display:block}</style></head><body><canvas width="1280" height="720"></canvas>
<script type="module">
// Boxes on a plane, so shadow edges cross many page edges. window.check.show renders one filter; window.check.pageIds tells
// the browser test which page of which level each floor pixel starts on, so it can compare pixels across a page edge.
import {Engine,box} from '/packages/core/dist/index.js';
import {VirtualShadows} from '/packages/shadows/dist/virtual.js';
const canvas=document.querySelector('canvas'),errors=[];
const engine=await Engine.create(canvas,{backend:'webgpu',camera:{position:[-5,5,-6],target:[0,0,0]}}),device=engine.gpu;
device.addEventListener('uncapturederror',e=>errors.push(e.error.message));
const floor=engine.createMesh().setGeometry(box(12,0.1,12)).setPosition([0,-0.05,0]);
const boxes=[[0,0.75,0],[-2,0.75,1.5],[2,0.75,-2],[-1,0.75,-3],[1.5,0.75,2.5]].map(p=>engine.createMesh().setGeometry(box(0.9,1.5,0.9)).setPosition(p));
const radiance=Float32Array.from(engine.lighting.radiance);
let shadows;
const frame=async(n)=>{device.pushErrorScope('validation');for(let i=0;i<n;i++){engine.render();await device.queue.onSubmittedWorkDone();await new Promise(r=>setTimeout(r));}const e=await device.popErrorScope();if(e)errors.push(e.message);};
window.check={
  async show(state){
    shadows?.dispose();shadows=undefined;
    engine.lighting.radiance.set(state==='dark'?[0,0,0]:radiance.subarray(0,3));
    if(state==='pcf'||state==='soft'){shadows=VirtualShadows.attach(engine,{filter:state});for(const b of boxes)shadows.add(b);shadows.add(floor,{castShadow:false});}
    await frame(8);
    return {errors:errors.splice(0),stats:shadows?{...shadows.stats}:undefined};
  },
  // Per pixel: the level and page a receiver's walk lands on, as one number; 0 off the floor.
  pageIds(){
    const c=engine.camera,W=canvas.width,H=canvas.height,p=shadows.pages,r=shadows.right,u=shadows.up,e=c.position,t=c.target;
    const norm=a=>{const l=Math.hypot(...a);return a.map(v=>v/l);},cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
    const f=norm([t[0]-e[0],t[1]-e[1],t[2]-e[2]]),right=norm(cross(f,[0,1,0])),up=cross(right,f),tan=Math.tan(c.fov*Math.PI/360),perUnit=H/(2*tan);
    const ids=new Array(W*H).fill(0),base=p.base,levels=p.levels;
    for(let y=0;y<H;y++)for(let x=0;x<W;x++){
      const sx=((x+0.5)/W*2-1)*tan*W/H,sy=(1-(y+0.5)/H*2)*tan,ray=[0,1,2].map(k=>f[k]+sx*right[k]+sy*up[k]);
      if(ray[1]>=0)continue;
      const s=-e[1]/ray[1],q=[e[0]+ray[0]*s,0,e[2]+ray[2]*s];
      if(Math.abs(q[0])>6||Math.abs(q[2])>6)continue;
      const lx=q[0]*r[0]+q[1]*r[1]+q[2]*r[2],ly=q[0]*u[0]+q[1]*u[1]+q[2]*u[2],eye=(q[0]-e[0])*f[0]+(q[1]-e[1])*f[1]+(q[2]-e[2])*f[2];
      let level=Math.min(levels-1,Math.max(0,Math.ceil(Math.log2(eye/perUnit*126/base))));
      for(;level<levels;level++){const size=base*2**level,ix=Math.floor(lx/size),iy=Math.floor(ly/size);if(p.find(level,ix,iy)>=0){ids[y*W+x]=(level+1)*1e8+(ix&4095)*1e4+(iy&4095);break;}}
    }
    return ids;
  },
};
window.ready=true;
</script></body></html>
