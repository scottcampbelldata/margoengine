<!doctype html><html><head><meta charset="utf-8"/><title>Shadows: light functions</title><style>body{margin:0;background:#000}canvas{display:block;width:64px;height:64px}</style></head><body><canvas width="64" height="64"></canvas>
<script type="module">
// Cloud shadows against the sky's own clouds, and every kind of receiver under an effect. light-function-browser.mjs asserts.
import {waitForPipelines} from '/scripts/support/gpu-ready.js';
import {Engine,PbrMaterial,box} from '/packages/core/dist/index.js';
import {loadGLTF} from '/packages/gltf-pro/dist/index.js';
import {Shadows} from '/packages/shadows/dist/index.js';
import {VirtualShadows} from '/packages/shadows/dist/virtual.js';
import {cloudShadows,lightPattern} from '/packages/shadows/dist/light-function.js';
import {Sky} from '/packages/sky/dist/index.js';
import {Terrain} from '/packages/terrain/dist/index.js';
import {BlockTypes,VoxelWorld} from '/packages/voxel/dist/index.js';
import {BlockTextures,VoxelRenderer} from '/packages/voxel/dist/render.js';
const canvas=document.querySelector('canvas'),errors=[];
const engine=await Engine.create(canvas,{backend:'webgpu',camera:{position:[0,1,0],target:[0.1,2,0],fov:1,near:0.5,far:30000}}),device=engine.gpu;
engine.stop();
device.addEventListener('uncapturederror',e=>errors.push(e.error.message));
engine.lighting.radiance.set([0.5,0.5,0.5,0]);
const frames=async(n)=>{device.pushErrorScope('validation');for(let i=0;i<n;i++){engine.render();await device.queue.onSubmittedWorkDone();}const e=await device.popErrorScope();if(e)errors.push(e.message);};
const reader=new OffscreenCanvas(1,1).getContext('2d',{willReadFrequently:true});
// The middle pixel of one frame, read in the task that drew it.
const middle=()=>{engine.render();reader.drawImage(canvas,32,32,1,1,0,0,1,1);return [...reader.getImageData(0,0,1,1).data.slice(0,3)];};
const look=(position,target)=>{engine.camera.position=position;engine.camera.target=target;};
let sky,shade,plate,effect;
const clouds={coverage:0.45,speed:0,height:1500};
window.check={
  // The sun of the light, not of the sky: the sky's own disc stays out of the frame, and the clouds do not depend on it.
  async clouds(toLight){
    const length=Math.hypot(...toLight);
    engine.lighting.direction.set(toLight.map(v=>v/length));
    sky=Sky.attach(engine,{model:'preetham',sunDirection:[0.5,0.5,-0.7],clouds});
    shade=cloudShadows(sky);
    plate=engine.createMesh().setGeometry(box(40000,1,40000)).setPosition([0,-0.5,0]);
    effect=Shadows.attach(engine,{resolution:256,bounds:{min:[-1,-1,-1],max:[1,1,1]},filter:'hard',effects:[shade]});
    effect.add(plate,{castShadow:false});
    await waitForPipelines(()=>frames(1));await frames(2);
    return errors;
  },
  // Advances the sky's clock by `seconds` at 8 m/s, in one step. Between steps the speed is 0, so readings hold still.
  advance(seconds){clouds.speed=8;sky.onPreUpdate(seconds);clouds.speed=0;return sky.cloudLayer.drift;},
  // At each ground point: the sky along the ray to the sun, with and without clouds, and the plate's light with and without
  // the shadow. Without clouds the sky is the same under any clock.
  async read(points,toLight){
    const out=[],length=Math.hypot(...toLight),l=toLight.map(v=>v/length);
    await frames(1);
    for(const [x,z] of points){
      look([x,1,z],[x+l[0]*100,1+l[1]*100,z+l[2]*100]);
      await frames(1);
      const cloudy=middle();
      sky.options.clouds=undefined;
      await frames(1);
      const clear=middle();
      sky.options.clouds=clouds;
      look([x,10,z+0.01],[x,0,z]);
      shade.options.strength=1;
      await frames(1);
      const shaded=middle();
      shade.options.strength=0;
      await frames(1);
      const open=middle();
      shade.options.strength=1;
      out.push({cloudy,clear,shaded,open});
    }
    return {out,errors};
  },
  end(){effect.dispose();sky.dispose?.();plate.dispose?.();},
};
// What the pattern lies on: every path by which a surface takes the sun. Each returns what to add and how to look at it.
const pixel=(r,g,b,a=255)=>({width:16,height:16,data:Uint8Array.from({length:16*16*4},(_,i)=>[r,g,b,a][i%4])});
const receivers={
  mesh:async()=>{const m=engine.createMesh().setGeometry(box(40,1,40)).setPosition([0,-0.5,0]);return {source:m,receive:{castShadow:false}};},
  material:async()=>{const m=engine.createMesh().setGeometry(box(40,1,40)).setMaterial(new PbrMaterial({color:'#ffffff'})).setPosition([0,-0.5,0]);return {source:m,receive:{castShadow:false}};},
  gltf:async()=>({source:await loadGLTF(engine,'/examples/assets/khronos-samples/GlassVaseFlowers.glb'),model:true}),
  terrain:async()=>{
    const layer=(lo,hi)=>({height:[-1e6,1e6],slope:[lo,hi],scale:1});
    const t=Terrain.attach(engine,{origin:[-32,-32],size:[64,64],heightScale:1,cellSize:1,resolution:64,levels:2,layers:[layer(0,0.25),layer(0.25,0.5),layer(0.5,0.75),layer(0.75,1)],
      textures(gpu){
        const heightmap=gpu.createTexture({size:[2,2],format:'r32float',usage:6}),layers=gpu.createTexture({size:[1,1,4],format:'rgba8unorm-srgb',usage:6});
        gpu.queue.writeTexture({texture:heightmap},new Float32Array(4),{bytesPerRow:8,rowsPerImage:2},[2,2]);
        gpu.queue.writeTexture({texture:layers},new Uint8Array(16).fill(231),{bytesPerRow:4,rowsPerImage:1},[1,1,4]);
        return {heightmap,layers};
      }});
    return {source:t,receive:{static:true}};
  },
  voxels:async()=>{
    const blocks=new BlockTypes(),stone=blocks.define('stone',{textures:0}),world=new VoxelWorld({blocks});
    world.addChunk(0,0,0);world.addChunk(-1,0,0);world.addChunk(0,0,-1);world.addChunk(-1,0,-1);
    for(const key of [[0,0],[-1,0],[0,-1],[-1,-1]])world.getChunk(key[0],0,key[1]).fillLight(0xf0);
    const cells=[];for(let x=-12;x<12;x++)for(let z=-12;z<12;z++)cells.push([x,0,z,stone]);
    world.setBlocks(cells.flat());
    const v=VoxelRenderer.attach(engine,{world,textures:new BlockTextures({size:16,images:[pixel(255,255,255),pixel(0,0,0)]})});
    for(let i=0;i<200&&!(!world.dirty.size&&v.stats.pending===0&&v.stats.draws>0&&!v.stats.compiling);i++){await frames(1);await new Promise(r=>setTimeout(r,10));}
    return {source:v,receive:{static:true}};
  },
};
const black=device.createTexture({size:[1,1],format:'rgba8unorm',usage:6});
device.queue.writeTexture({texture:black},new Uint8Array([0,0,0,255]),{bytesPerRow:4},[1,1]);
window.check.receiver=async(name,kind)=>{
  engine.lighting.direction.set([0.3/1.1,1/1.1,0.2/1.1]);engine.lighting.radiance.set([3,3,3,0]);
  Object.assign(engine.camera,{near:0.05,far:300,fov:50});
  look([0.4,name==='gltf'?0.6:6,name==='gltf'?0.5:0.5],[0,name==='gltf'?0.1:0,0]);
  const r=await receivers[name](),pattern=lightPattern({texture:black.createView(),size:1,strength:0});
  const options={filter:'hard',effects:[pattern],...(kind==='shadows'?{resolution:1024,cascades:1,distance:100}:{distance:60})};
  const e=(kind==='virtual'?VirtualShadows:Shadows).attach(engine,options);
  e.add(r.source,r.receive??{});
  await waitForPipelines(()=>frames(1));await frames(kind==='virtual'?20:3);
  const open=middle();
  pattern.options.strength=1;
  await frames(2);
  const dark=middle();
  e.dispose();r.source.dispose?.();
  await frames(1);
  return {open,dark,errors};
};
window.ready=true;
</script></body></html>
