<!doctype html><html><head><meta charset="utf-8"/><title>Shadows: a real model against an outside renderer</title><style>body{margin:0;background:#000}canvas{display:block}</style></head><body><canvas width="512" height="512" style="width:512px;height:512px"></canvas>
<script type="module">
// The scene of scenes.json as Margo draws it: a white ground, a real glTF model, the sun alone (no ambient). check.mjs
// reads each frame and divides it by the frame with no shadows, which is the same quantity reference.py takes from Cycles.
import {waitForPipelines} from '/scripts/support/gpu-ready.js';
import {Engine,PbrMaterial,box} from '/packages/core/dist/index.js';
import {loadGLTF} from '/packages/gltf-pro/dist/index.js';
import {Shadows} from '/packages/shadows/dist/index.js';
import {VirtualShadows} from '/packages/shadows/dist/virtual.js';
import {lightPattern} from '/packages/shadows/dist/light-function.js';
import {varianceFilter} from '/packages/shadows/dist/vsm.js';
import {transmission} from '/packages/shadows/dist/transmission.js';
import {distanceShadows} from '/packages/shadows/dist/distance.js';
import {shadowStyle} from '/packages/shadows/dist/style.js';
import {rayTracedFilter} from '/packages/shadows/dist/rt.js';
import {MeshBVH,worldTriangles} from '/packages/bvh/dist/index.js';
import {Terrain} from '/packages/terrain/dist/index.js';
const canvas=document.querySelector('canvas'),errors=[];
const scenes=await (await fetch('/packages/shadows/test/outside/scenes.json')).json();
const engine=await Engine.create(canvas,{backend:'webgpu',camera:{position:[0,2,1],target:[0,0,0],fov:50,near:0.05,far:100}}),device=engine.gpu;
engine.stop();
device.addEventListener('uncapturederror',e=>errors.push(e.error.message));
engine.lighting.radiance.set([0.6,0.6,0.6,0]);
let ground,model,effect,scene,mask;
// An image as sRGB colour, for a light pattern.
const image=async(url)=>{
  const bitmap=await createImageBitmap(await (await fetch(url)).blob(),{colorSpaceConversion:'none',premultiplyAlpha:'none'});
  const texture=device.createTexture({size:[bitmap.width,bitmap.height],format:'rgba8unorm-srgb',usage:22});
  device.queue.copyExternalImageToTexture({source:bitmap},{texture},[bitmap.width,bitmap.height]);
  return texture.createView();
};
// A Terrarium elevation tile's heights: metres = red * 256 + green + blue / 256 - 32768, read with no colour management.
const terrarium=async(url)=>{
  const bitmap=await createImageBitmap(await (await fetch(url)).blob(),{colorSpaceConversion:'none',premultiplyAlpha:'none'});
  const c=new OffscreenCanvas(bitmap.width,bitmap.height).getContext('2d',{willReadFrequently:true});c.drawImage(bitmap,0,0);
  const d=c.getImageData(0,0,bitmap.width,bitmap.height).data,out=new Float32Array(bitmap.width*bitmap.height);
  for(let i=0;i<out.length;i++)out[i]=d[i*4]*256+d[i*4+1]+d[i*4+2]/256-32768;
  return {width:bitmap.width,height:bitmap.height,heights:out};
};
const land=async(s)=>{
  const {width,height,heights}=await terrarium('/'+s.terrain),half=s.extent/2;
  const layer=(lo,hi)=>({height:[-1e6,1e6],slope:[lo,hi],scale:1});
  return Terrain.attach(engine,{origin:[-half,-half],size:[s.extent,s.extent],heightScale:s.heightScale,cellSize:1,resolution:256,levels:2,
    layers:[layer(0,0.25),layer(0.25,0.5),layer(0.5,0.75),layer(0.75,1)],
    textures(gpu){
      const heightmap=gpu.createTexture({size:[width,height],format:'r32float',usage:6}),layers=gpu.createTexture({size:[1,1,4],format:'rgba8unorm-srgb',usage:6});
      gpu.queue.writeTexture({texture:heightmap},heights,{bytesPerRow:width*4,rowsPerImage:height},[width,height]);
      gpu.queue.writeTexture({texture:layers},new Uint8Array(16).fill(231),{bytesPerRow:4,rowsPerImage:1},[1,1,4]);
      return {heightmap,layers};
    }});
};
const frames=async(n)=>{device.pushErrorScope('validation');for(let i=0;i<n;i++){engine.render();await device.queue.onSubmittedWorkDone();}const e=await device.popErrorScope();if(e)errors.push(e.message);};
window.check={
  // Loads a scene without shadows.
  async scene(name){
    const s=scene=scenes[name],length=Math.hypot(...s.toLight);
    effect?.dispose();effect=undefined;model?.dispose();ground?.dispose?.();
    if(s.terrain){ground=undefined;model=await land(s);}
    else{
      ground=engine.createMesh().setGeometry(box(s.ground.size,0.02,s.ground.size)).setMaterial(new PbrMaterial({color:'#ffffff'})).setPosition([0,s.ground.y-0.01,0]);
      if(s.pattern){model=undefined;mask=await image('/'+s.pattern.image);}
      else{
        model=await loadGLTF(engine,'/'+s.model);
        model.root.setScale([s.scale??1,s.scale??1,s.scale??1]);
        if(s.offset)model.root.setPosition(s.offset);
      }
    }
    engine.lighting.direction.set(s.toLight.map(v=>v/length));
    Object.assign(engine.camera,{near:0.05,far:100},s.camera);
    await waitForPipelines(()=>frames(1));await frames(2);
    return errors;
  },
  // control 'solid': the model's casters without their masks, so the check must fail (cases.mjs).
  async shadows(kind,options,control){
    effect?.dispose();
    const c=kind==='virtual'?VirtualShadows:Shadows,p=scene.pattern;
    // control 'shifted': the mask a quarter turn off, so the check must fail.
    if(p)options={...options,effects:[lightPattern({texture:mask,size:p.size,offset:control==='shifted'?[p.offset[0]+0.25,p.offset[1]+0.25]:p.offset})]};
    const leaves=options.colored&&model?transmission(model,{scale:options.scale,size:options.size}):undefined;
    if(leaves&&options.size)options={...options,effects:[leaves.effect]};
    // The tile's own heights as a far field, so nothing past the small `distance` is cast by the terrain's depth draws.
    if(options.far){
      const {width,height,heights}=await terrarium('/'+scene.terrain);
      options={...options,effects:[distanceShadows({heights,columns:width,rows:height,origin:[-scene.extent/2,-scene.extent/2],size:[scene.extent,scene.extent],heightScale:scene.heightScale,...options.far})]};
    }
    if(options.look)options={...options,effects:[shadowStyle(options.look)]};
    // control 'empty': a tree with nothing over the ground, so a shadow that stays came from the map, and the check must fail.
    if(options.traced){const {vertices,indices}=control==='empty'?{vertices:new Float32Array([50,50,50,51,50,50,50,50,51]),indices:new Uint32Array([0,1,2])}:worldTriangles(engine,[model]);options={...options,filter:rayTracedFilter(engine,MeshBVH.build({positions:vertices,indices}),options.traced)};}
    if(options.variance)options={...options,filter:varianceFilter(options.variance)};
    effect=c.attach(engine,options);
    if(ground)effect.add(ground,{castShadow:false});
    const masks=!model?[]:scene.masksOnly?model.shadowPrimitives.filter(p=>p.cutoff>0):model.shadowPrimitives;
    if(p){}
    else if(scene.terrain)effect.add(model,{static:true,castShadow:control!=='nocast'});
    else if(control==='solid')effect.add({shadowPrimitives:masks.map(p=>({...p,alphaTexture:undefined,alphaSampler:undefined,cutoff:0}))});
    else effect.add(scene.masksOnly?{shadowPrimitives:masks}:leaves??model);
    await frames(kind==='virtual'?30:3);
    return errors;
  },
  async off(){effect?.dispose();effect=undefined;await frames(2);return errors;},
};
window.ready=true;
</script></body></html>
