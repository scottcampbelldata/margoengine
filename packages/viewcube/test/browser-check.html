<!doctype html><html><head><meta charset="utf-8"/><title>ViewCube browser check</title><style>body{margin:0}#host{width:400px;height:400px}canvas{display:block;width:400px;height:400px}</style></head><body><div id="host"><canvas></canvas></div>
<script type="module">
import {Engine,PbrMaterial,box} from '/packages/core/dist/index.js';
import {CameraProjection} from '/packages/cameras/dist/index.js';
import {OrbitControls} from '/packages/controls/dist/index.js';
import {ViewCube} from '/packages/viewcube/dist/index.js';
import {AxisTriad} from '/packages/viewcube/dist/axes.js';
import {UpViewCube} from '/packages/viewcube/dist/up.js';
import {FitViewCube} from '/packages/viewcube/dist/fit.js';
import {ViewCompass} from '/packages/viewcube/dist/compass.js';
const engine=await Engine.create(document.querySelector('canvas'),{backend:'webgpu',camera:{position:[0,0,10],target:[0,0,0],near:0.1,far:100}}),errors=[];
engine.gpu.addEventListener('uncapturederror',e=>errors.push(e.error.message));
// Red at +X, blue at -Z, green at the origin: top view puts red right of centre and blue above it.
for(const [color,position] of [['#ff0000',[2,0,0]],['#0000ff',[0,0,-2]],['#00ff00',[0,0,0]]])engine.createMesh().setGeometry(box(1,1,1)).setMaterial(new PbrMaterial({color})).setPosition(position);
const projection=new CameraProjection({mode:'perspective'});engine.use(projection);
const orbit=new OrbitControls(engine);
let cube=new ViewCube(engine,{projection,duration:0.25,home:true,roll:true});
const triad=new AxisTriad(engine,{corner:'bottom-left',duration:0.25});
engine.start();
const direction=()=>{const c=engine.camera,d=c.position.map((v,i)=>v-c.target[i]),l=Math.hypot(...d);return d.map(v=>v/l);};
window.check={
  compass(){window.compass=ViewCompass.attach(cube);engine.render();},
  compassMenuAtEdge(){window.compass.openMenu(innerWidth,innerHeight);const r=window.compass.menu.getBoundingClientRect();return {right:r.right,bottom:r.bottom,width:innerWidth,height:innerHeight};},
  fitCube(){cube.dispose();engine.camera.position=[0,0,2];engine.camera.target=[0,0,0];projection.mode='perspective';cube=new FitViewCube(engine,{projection,bounds:[-3,-1,-3,3,1,3],duration:0.25});cube.view('front',0);engine.render();},
  framed(){const m=engine.camera.matrix;for(let i=0;i<8;i++){const p=[i&1?3:-3,i&2?1:-1,i&4?3:-3],q=[0,1,2,3].map(r=>p[0]*m[r]+p[1]*m[r+4]+p[2]*m[r+8]+m[r+12]);if(!(q[3]>0&&Math.abs(q[0]/q[3])<=1&&Math.abs(q[1]/q[3])<=1&&q[2]/q[3]>=0&&q[2]/q[3]<=1))return false;}return true;},
  upCube(){cube.dispose();triad.dispose();orbit.dispose();engine.camera.position=[0,-10,0];engine.camera.target=[0,0,0];cube=new UpViewCube(engine,{projection,duration:0.25,home:true,roll:true});cube.view('front',0);engine.render();},
  /** Centre of the visible cell for a view, and what the browser hit-tests there. */
  cell(view){
    for(const e of cube.element.querySelectorAll(`[data-view="${view}"]`)){const r=e.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2;if(r.width>4&&document.elementFromPoint(x,y)===e)return {x,y};}
    return null;
  },
  async settle(){await new Promise(r=>setTimeout(r,400));await engine.gpu.queue.onSubmittedWorkDone();return {direction:direction(),animating:cube.animating,errors:errors.splice(0),mode:projection.mode,turns:cube.turns,up:[...engine.camera.up],ortho:!engine.camera.matrix[11]};},
  focus(){const tabbable=[...cube.element.querySelectorAll('button[tabindex="0"]:not([data-projection])')].map(b=>b.getAttribute('aria-label'));cube.element.querySelector('[aria-label="Top view"]').focus();return {tabbable,active:document.activeElement.getAttribute('aria-label')};},
  // Publish the camera's new matrix to the CSS hit targets before the next mouse coordinate is read.
  front(){cube.view('front',0);engine.render();},
  button(name){const r=cube.element.querySelector(`[data-${name}]`).getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2;return document.elementFromPoint(x,y)?.dataset[name]!==undefined?{x,y}:null;},
  theme(name){cube.setTheme(name);const s=getComputedStyle(cube.element.querySelector('.mvc-face'));return {background:s.backgroundColor,color:s.color};},
  ball(view){const e=triad.element.querySelector(`[data-view="${view}"]`),r=e.getBoundingClientRect(),o=triad.element.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2;return {x,y,dx:x-(o.left+o.width/2),dy:y-(o.top+o.height/2),hit:document.elementFromPoint(x,y)===e};},
  home(){const r=cube.element.querySelector('[data-home]').getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2;return document.elementFromPoint(x,y)?.dataset.home===''?{x,y}:null;},
  toggle(){const r=cube.element.querySelector('[data-projection]').getBoundingClientRect();return {x:r.left+r.width/2,y:r.top+r.height/2};},
};
window.ready=true;
</script></body></html>
