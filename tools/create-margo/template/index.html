<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>Margo app</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0e1117; color: #e8eeed; font: 16px system-ui, sans-serif; }
      /* The engine sizes its drawing buffer from the canvas's CSS size every frame, so resizing needs no code. */
      canvas { display: block; width: 100%; height: 100%; touch-action: none; }
      #error { position: fixed; inset: auto 16px 16px; margin: 0; }
    </style>
  </head>
  <body>
    <canvas aria-label="Three lit shapes. Drag to orbit, scroll to zoom."></canvas>
    <p id="error" role="alert"></p>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
