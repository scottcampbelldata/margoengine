  - paragraph [ref=e40]: Uncapped results are medians of three interleaved runs, each with 60 warm-up frames and 600 measured frames. Frame time is requestAnimationFrame cadence under GPU back-pressure; it is not a GPU timestamp measurement. Profiling traces were recorded separately from the timed runs.
  - paragraph [ref=e41]: "Margo uses 217 GPU draws per frame: 215 mesh batches plus line and backdrop draws. Repeated parts are instanced, but distinct geometry/material pairs still require separate batches. The single-digit draw-call target is not met."
