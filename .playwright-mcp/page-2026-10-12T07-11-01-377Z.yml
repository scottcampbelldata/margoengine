  - paragraph [ref=e52]: The roller geometry and highlight placement are similar. Margo's outer surface is brighter and its front face is darker. Shading is not a pixel match. Three.js uses 4× MSAA; Margo uses no multisampling. Margo has 570 parts, including the extra Blender Cube; the baseline has 569.
