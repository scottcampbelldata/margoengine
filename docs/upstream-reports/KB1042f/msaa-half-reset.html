<!doctype html>
<meta charset="utf-8">
<title>4x RGBA16F resolve after a uniform reset</title>
<pre id="out">running</pre>
<script type="module">
// Standalone WebGL2 repro for KB1042f (no libraries, no engine code). Shape of the failing Margo case: a 4x multisampled
// RGBA16F scene (clear, opaque background triangles, a refracting quad that samples a resolved copy of the background
// with an offset scaled by one uniform), resolved by blitFramebuffer into an RGBA16F texture and read back as floats.
// Frame "base" draws with the uniform 0 from the start; then the uniform goes to `peak` for `live` frames and back to
// 0, and every later frame issues the same commands as "base". Per the OpenGL ES 3.0 repeatability rule (Appendix A)
// those frames must equal "base". `churn` creates and deletes that many textures and programs between frames, as the
// engine grid does. Query: frames (default 12), live (3), peak (0.05), churn (16), size (256).
// Result: window.result = { gl, frames, differing, channels, maxDifference, distinct }.
const q = new URLSearchParams(location.search);
const frames = Number(q.get('frames') ?? 12), live = Number(q.get('live') ?? 3), peak = Number(q.get('peak') ?? 0.05);
const churn = Number(q.get('churn') ?? 16), N = Number(q.get('size') ?? 256);
const canvas = document.createElement('canvas');
const gl = canvas.getContext('webgl2', { antialias: false });
const result = { frames, live, peak, churn, size: N, userAgent: navigator.userAgent };
try {
  if (!gl) throw new Error('no WebGL2');
  if (!gl.getExtension('EXT_color_buffer_float')) throw new Error('EXT_color_buffer_float missing');
  const info = gl.getExtension('WEBGL_debug_renderer_info');
  result.gl = info ? gl.getParameter(info.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER);
  const compile = (vs, fs) => {
    const p = gl.createProgram();
    for (const [type, src] of [[gl.VERTEX_SHADER, vs], [gl.FRAGMENT_SHADER, fs]]) {
      const s = gl.createShader(type);
      gl.shaderSource(s, src);
      gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
      gl.attachShader(p, s);
    }
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
    return p;
  };
  const header = '#version 300 es\nprecision highp float;\n';
  const opaque = compile(
    header + 'in vec2 p;in vec3 c;out vec3 v;void main(){v=c;gl_Position=vec4(p,0.5,1);}',
    header + 'in vec3 v;out vec4 o;void main(){o=vec4(v*4.0,1);}',
  );
  const glass = compile(
    header + 'in vec2 p;out vec2 uv;void main(){uv=p*0.5+0.5;gl_Position=vec4(p*0.6,0.25,1);}',
    header +
      'uniform sampler2D behind;layout(std140) uniform Glass{vec4 g;};in vec2 uv;out vec4 o;' +
      'void main(){vec2 d=vec2(sin(uv.y*40.0),cos(uv.x*40.0))*g.x;vec3 r=texture(behind,uv+d).rgb;' +
      'vec3 gg=texture(behind,uv+d*0.5).rgb;vec3 b=texture(behind,uv).rgb;o=vec4(r.r,gg.g,b.b,1)*0.9+vec4(0.02,0.03,0.05,0);}',
  );
  // Dense background: many thin triangles with different colours, so 4x edge pixels hold several colours.
  const tris = [];
  let seed = 7;
  const rnd = () => ((seed = (seed * 1103515245 + 12345) >>> 0) / 4294967296);
  for (let k = 0; k < 3000; k++) {
    const x = rnd() * 2 - 1, y = rnd() * 2 - 1, c = [rnd(), rnd(), rnd()];
    for (const [dx, dy] of [[0, 0], [0.08 * rnd(), 0.004], [0.004, 0.08 * rnd()]]) tris.push(x + dx, y + dy, ...c);
  }
  const vao = gl.createVertexArray();
  gl.bindVertexArray(vao);
  const vb = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, vb);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(tris), gl.STATIC_DRAW);
  const pLoc = gl.getAttribLocation(opaque, 'p'), cLoc = gl.getAttribLocation(opaque, 'c');
  gl.enableVertexAttribArray(pLoc);
  gl.vertexAttribPointer(pLoc, 2, gl.FLOAT, false, 20, 0);
  gl.enableVertexAttribArray(cLoc);
  gl.vertexAttribPointer(cLoc, 3, gl.FLOAT, false, 20, 8);
  const quadVao = gl.createVertexArray();
  gl.bindVertexArray(quadVao);
  const qb = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, qb);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  const qLoc = gl.getAttribLocation(glass, 'p');
  gl.enableVertexAttribArray(qLoc);
  gl.vertexAttribPointer(qLoc, 2, gl.FLOAT, false, 8, 0);
  const ubo = gl.createBuffer();
  gl.bindBuffer(gl.UNIFORM_BUFFER, ubo);
  gl.bufferData(gl.UNIFORM_BUFFER, 16, gl.DYNAMIC_DRAW);
  gl.uniformBlockBinding(glass, gl.getUniformBlockIndex(glass, 'Glass'), 0);
  gl.bindBufferBase(gl.UNIFORM_BUFFER, 0, ubo);
  // 4x RGBA16F colour and depth renderbuffers; resolve targets are RGBA16F textures.
  const msColor = gl.createRenderbuffer();
  gl.bindRenderbuffer(gl.RENDERBUFFER, msColor);
  gl.renderbufferStorageMultisample(gl.RENDERBUFFER, 4, gl.RGBA16F, N, N);
  const msDepth = gl.createRenderbuffer();
  gl.bindRenderbuffer(gl.RENDERBUFFER, msDepth);
  gl.renderbufferStorageMultisample(gl.RENDERBUFFER, 4, gl.DEPTH_COMPONENT24, N, N);
  const ms = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, ms);
  gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.RENDERBUFFER, msColor);
  gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.RENDERBUFFER, msDepth);
  const target = () => {
    const t = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texStorage2D(gl.TEXTURE_2D, 1, gl.RGBA16F, N, N);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    const f = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, f);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0);
    return { t, f };
  };
  const behind = target(), out = target();
  const resolve = (to) => {
    gl.bindFramebuffer(gl.READ_FRAMEBUFFER, ms);
    gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, to.f);
    gl.blitFramebuffer(0, 0, N, N, 0, 0, N, N, gl.COLOR_BUFFER_BIT, gl.NEAREST);
  };
  const frame = (strength) => {
    gl.bindBuffer(gl.UNIFORM_BUFFER, ubo);
    gl.bufferSubData(gl.UNIFORM_BUFFER, 0, new Float32Array([strength, 0, 0, 0]));
    gl.bindFramebuffer(gl.FRAMEBUFFER, ms);
    gl.viewport(0, 0, N, N);
    gl.enable(gl.DEPTH_TEST);
    gl.clearColor(0.1, 0.2, 0.3, 1);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    gl.useProgram(opaque);
    gl.bindVertexArray(vao);
    gl.drawArrays(gl.TRIANGLES, 0, tris.length / 5);
    resolve(behind);
    gl.bindFramebuffer(gl.FRAMEBUFFER, ms);
    gl.useProgram(glass);
    gl.bindVertexArray(quadVao);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, behind.t);
    gl.uniform1i(gl.getUniformLocation(glass, 'behind'), 0);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    resolve(out);
    gl.bindFramebuffer(gl.READ_FRAMEBUFFER, out.f);
    const pixels = new Float32Array(N * N * 4);
    gl.readPixels(0, 0, N, N, gl.RGBA, gl.FLOAT, pixels);
    return pixels;
  };
  const stir = () => {
    for (let k = 0; k < churn; k++) {
      const t = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D, t);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, 64 + k, 64, 0, gl.RGBA, gl.HALF_FLOAT, null);
      gl.deleteTexture(t);
      if (k % 4 === 0) gl.deleteProgram(compile(header + 'void main(){gl_Position=vec4(0);}', header + `out vec4 o;void main(){o=vec4(${k}.0);}`));
    }
  };
  const base = frame(0);
  stir();
  const images = [];
  for (let k = 0; k < live; k++) frame(peak), stir();
  for (let k = 0; k < frames; k++) {
    images.push(frame(0));
    stir();
  }
  let differing = 0, channels = 0, maxDifference = 0;
  const keys = new Set();
  for (const image of images) {
    let changed = 0;
    for (let i = 0; i < image.length; i++) {
      const d = Math.abs(image[i] - base[i]);
      if (d > 0) changed++, (maxDifference = Math.max(maxDifference, d));
    }
    if (changed) differing++, (channels = Math.max(channels, changed));
    let h = 2166136261;
    const bytes = new Uint8Array(image.buffer);
    for (let i = 0; i < bytes.length; i++) h = Math.imul(h ^ bytes[i], 16777619);
    keys.add(h >>> 0);
  }
  Object.assign(result, { differing, channels, maxDifference, distinct: keys.size, error: gl.getError() || undefined });
} catch (e) {
  result.error = String(e);
}
document.getElementById('out').textContent = JSON.stringify(result, null, 2);
window.result = result;
</script>
