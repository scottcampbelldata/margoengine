<!doctype html>
<meta charset="utf-8">
<title>drawImage of an unpremultiplied ImageBitmap</title>
<pre id="out">running</pre>
<script type="module">
// Draws a createImageBitmap(..., { premultiplyAlpha: 'none' }) bitmap into a 2D canvas, once onto a transparent
// canvas and once over opaque black, and reads each pixel with getImageData. No WebGL, WebGPU or library is used.
// Source pixels: (11, 200, 7, 0) and (100, 201, 60, 1). Expected over black: (0, 0, 0, 255) and (0, 1, 0, 255).
const source = new ImageData(new Uint8ClampedArray([11, 200, 7, 0, 100, 201, 60, 1]), 2, 1);
const bitmap = await createImageBitmap(source, { premultiplyAlpha: 'none' });
function drawn(black) {
  const canvas = document.createElement('canvas');
  canvas.width = 2;
  canvas.height = 1;
  const g = canvas.getContext('2d');
  if (black) g.fillRect(0, 0, 2, 1);
  g.drawImage(bitmap, 0, 0);
  return [...g.getImageData(0, 0, 2, 1).data];
}
const result = { userAgent: navigator.userAgent, transparent: drawn(false), overBlack: drawn(true) };
result.reproduces = [0, 0, 0, 255, 0, 1, 0, 255].some((v, i) => Math.abs(result.overBlack[i] - v) > 1);
document.getElementById('out').textContent = JSON.stringify(result, null, 2);
window.result = result;
</script>
