<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Playground - Margo Engine</title>
  <meta name="description" content="Write Margo Engine code beside a running canvas, then share it by link, save versions or download it as one HTML file.">
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="stylesheet" href="../site.css">
  <link rel="stylesheet" href="./playground.css">
  <script type="module" src="./playground.js"></script>
</head>
<body>
  <a class="skip" href="#editor">Skip to the editor</a>
  <header class="nav">
    <a class="brand" href="../" translate="no">Margo Engine</a>
    <nav aria-label="Primary">
      <a href="../catalog/">Catalog</a>
      <a href="../errors.html">Error help</a>
      <a href="https://github.com/scottcampbelldata/margoengine">GitHub</a>
    </nav>
  </header>
  <main id="main" class="playground">
    <h1 class="visually-hidden">Playground</h1>
    <div class="toolbar" role="toolbar" aria-label="Playground">
      <button id="run" type="button" class="primary" aria-keyshortcuts="Control+Enter Meta+Enter" disabled>Run</button>
      <label>Template
        <select id="template"></select>
      </label>
      <button id="share" type="button">Share link</button>
      <button id="save" type="button" aria-keyshortcuts="Control+S Meta+S">Save version</button>
      <label>Versions
        <select id="versions"><option value="">No saved versions</option></select>
      </label>
      <button id="restore" type="button" disabled>Restore</button>
      <button id="download" type="button" disabled>Download HTML</button>
    </div>
    <p id="status" role="status" aria-live="polite">Loading...</p>
    <p id="shared" class="shared" hidden>Shared code loaded. Your own code is still saved until you edit, run or save
      this. <button id="back" type="button" class="small">Back to my code</button></p>
    <div class="panes">
      <section class="pane" aria-labelledby="editor-label">
        <h2 id="editor-label" class="pane-title">Code <span class="hint">Ctrl+Enter runs. Esc, then Tab, leaves the editor.</span></h2>
        <div class="files">
          <div id="tabs" class="tabs" role="tablist" aria-label="Files"></div>
          <form id="add-file" class="add-file">
            <label for="new-file" class="visually-hidden">New file name</label>
            <input id="new-file" placeholder="util.js" autocomplete="off" spellcheck="false" maxlength="35">
            <button type="submit">Add file</button>
          </form>
        </div>
        <div class="editor">
          <pre id="gutter" class="gutter" aria-hidden="true">1</pre>
          <textarea id="editor" spellcheck="false" autocapitalize="off" autocomplete="off" wrap="off"
            aria-labelledby="editor-label"></textarea>
        </div>
      </section>
      <section class="pane" aria-labelledby="output-label">
        <h2 id="output-label" class="pane-title">Result</h2>
        <div id="stage" class="stage"></div>
        <h2 class="pane-title">Console <button id="clear" type="button" class="small">Clear</button></h2>
        <ol id="console" class="console" aria-live="polite"></ol>
      </section>
    </div>
  </main>
</body>
</html>
