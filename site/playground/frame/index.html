<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Margo Engine playground</title>
  <style>html,body{margin:0;height:100%;background:#111;color:#eee;font:16px system-ui,sans-serif}#scene{position:fixed;inset:0}</style>
</head>
<body>
  <div id="scene"></div>
  <!-- run -->
  <script>
// The playground's run frame (docs/playground.md). The page loads it as <iframe sandbox="allow-scripts">, so it has an
// opaque origin and its own loose policy (site/_headers): the page itself keeps a strict one. It waits for one run
// message from its parent (checked by source and shape), loads margoengine's import map, adds an entry `#tab/<name>`
// for each file, then imports main.js. Each file is a blob module; its `./name.js` imports are pointed at those entries
// (a blob URL cannot be the base of a relative import), so files may import each other, cycles included, and stack
// lines are lines of each file. Console output and errors go back to the parent. A downloaded file sets
// window.MARGO_PLAYGROUND instead and runs at once.
(() => {
  'use strict';
  const CHANNEL = 'margo-playground';
  const MAX_CODE = 256 * 1024, MAX_FILES = 12, FILE_NAME = /^[A-Za-z0-9][A-Za-z0-9_-]{0,31}\.js$/;
  const CDN_MAP = 'https://cdn.jsdelivr.net/npm/margoengine@1.0.0/dist/importmap.json';
  const CDN = /^https:\/\/cdn\.jsdelivr\.net\/npm\/((?:@[^/]+\/)?[^@/]+)@[^/]+\/(.+)$/;
  const top = parent !== window ? parent : null;
  const urls = new Map(); // blob URL -> file name
  let started = false;

  const text = (v) => {
    if (v instanceof Error || (v && typeof v.message === 'string' && typeof v.name === 'string'))
      return (v.name ? v.name + ': ' : '') + v.message;
    if (typeof v === 'string') return v;
    try { return JSON.stringify(v) ?? String(v); } catch { return String(v); }
  };
  const send = (message) => { if (top) top.postMessage({ channel: CHANNEL, ...message }, '*'); };
  /** The first stack frame in one of the files: [file, line], or [null, null]. */
  const placeOf = (error, filename, lineno) => {
    for (const [, url, line] of String((error && error.stack) || '').matchAll(/(blob:[^\s()]+?):(\d+):\d+/g))
      if (urls.has(url)) return [urls.get(url), Number(line)];
    return urls.has(filename) && lineno > 0 ? [urls.get(filename), lineno] : [null, null];
  };
  const report = (error, filename = '', lineno = 0) => {
    const [file, line] = placeOf(error, filename, lineno);
    send({ kind: 'error', text: text(error), file, line,
      code: error && typeof error.code === 'string' ? error.code : null });
  };

  for (const level of ['log', 'info', 'warn', 'error', 'debug']) {
    const original = console[level].bind(console);
    console[level] = (...args) => { original(...args); send({ kind: 'log', level, text: args.map(text).join(' ') }); };
  }
  addEventListener('error', (e) => report(e.error ?? e.message, e.filename, e.lineno));
  addEventListener('unhandledrejection', (e) => report(e.reason));

  const valid = (m) => {
    if (!m || typeof m !== 'object' || m.channel !== CHANNEL || m.kind !== 'run') return false;
    if (!(m.packages === null || (typeof m.packages === 'string' && /^https?:\/\/[^\s]+\/$/.test(m.packages))))
      return false;
    if (!Array.isArray(m.files) || !m.files.length || m.files.length > MAX_FILES) return false;
    let size = 0;
    const names = new Set();
    for (const f of m.files) {
      if (!f || typeof f.name !== 'string' || typeof f.code !== 'string' || !FILE_NAME.test(f.name)) return false;
      if (names.has(f.name)) return false;
      names.add(f.name);
      size += f.code.length;
    }
    return m.files[0].name === 'main.js' && size <= MAX_CODE;
  };

  async function importMap(packages) {
    const url = packages === null ? CDN_MAP : `${packages}margoengine/dist/importmap.json`;
    const response = await fetch(url);
    if (!response.ok) throw new Error(`The import map at ${url} answered ${response.status}`);
    const map = await response.json();
    if (packages === null) return map;
    const imports = {};
    for (const [name, target] of Object.entries(map.imports)) {
      const m = CDN.exec(target);
      imports[name] = m ? `${packages}${m[1]}/${m[2]}` : target;
    }
    return { imports };
  }

  /** `./name.js` in an import or export of a file of the project becomes its import map entry `#tab/name.js`. */
  const linkTabs = (code, names) =>
    code.replace(/(\bfrom\s*|\bimport\s*\(\s*|\bimport\s+)(['"])\.\/([A-Za-z0-9_-]+\.js)\2/g, (whole, head, q, name) =>
      names.has(name) ? `${head}${q}#tab/${name}${q}` : whole);

  async function run(message) {
    if (started || !valid(message)) return;
    started = true;
    try {
      const map = await importMap(message.packages);
      const names = new Set(message.files.map((f) => f.name));
      for (const f of message.files) {
        const url = URL.createObjectURL(new Blob([linkTabs(f.code, names)], { type: 'text/javascript' }));
        urls.set(url, f.name);
        map.imports[`#tab/${f.name}`] = url;
      }
      const script = document.createElement('script');
      script.type = 'importmap';
      script.textContent = JSON.stringify(map);
      document.head.append(script);
      await import('#tab/main.js');
      send({ kind: 'done' });
    } catch (error) {
      report(error);
    }
  }

  if (window.MARGO_PLAYGROUND) run(window.MARGO_PLAYGROUND);
  else if (top) {
    addEventListener('message', (event) => { if (event.source === top) run(event.data); });
    send({ kind: 'ready' });
  }
})();
  </script>
</body>
</html>
