<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inside a Meteorite | Margo Engine</title>
  <link rel="stylesheet" href="../../showcase-films/player.css">
</head>
<body>
  <div id="viewport"></div>
  <p id="status" role="status">Preparing the film.</p>
  <section id="controls" aria-label="Film playback" hidden>
    <button id="play" type="button">Pause</button>
    <input id="seek" type="range" aria-label="Film time" min="0" max="90" value="0" step="0.01">
    <output id="clock" for="seek">0:00 / 1:30</output>
  </section>
  <script type="module">
    import { openFilm } from '../../showcase-films/film.js';
    import { buildMeteorite } from '../../showcase-films/inside-a-meteorite.js';
    await openFilm({ title: 'Inside a Meteorite', build: buildMeteorite, night: true, far: 17, camera: { near: 0.012 }, look: { environment: 0.62, direction: [0.44, 0.73, 0.5, 1.71], radiance: [0.9, 0.96, 1, 0.36], exposure: 0.18, bloom: 0.1, shadows: { distance: 2 } } });
  </script>
</body>
</html>
