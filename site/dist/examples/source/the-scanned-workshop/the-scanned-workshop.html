<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>The Scanned Workshop | Margo Engine</title>
  <link rel="stylesheet" href="./player.css">
</head>
<body>
  <div id="viewport"></div>
  <p id="status" role="status">Preparing the film…</p>
  <section id="controls" aria-label="Film playback" hidden>
    <button id="play" type="button">Pause</button>
    <input id="seek" type="range" aria-label="Film time" min="0" max="90" value="0" step="0.01">
    <output id="clock" for="seek">0:00 / 1:30</output>
  </section>
  <script type="module">
    import { openFilm } from './film.js';
    import { buildScannedWorkshop } from './the-scanned-workshop.js';
    await openFilm({ build: buildScannedWorkshop, ...{
      title: "The Scanned Workshop",
      "night": false,
      "far": 34,
      "look": {
        "environment": 0.86,
        "exposure": 0.08,
        "bloom": 0.028,
        "contrast": 1,
        "direction": [-0.55, 0.55, -0.63, 3.65],
        "radiance": [1.0, 0.96, 0.87, 0.53],
        "shadows": {
          "distance": 12,
          "resolution": 2048
        }
      }
    } });
  </script>
</body>
</html>
