<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>The Observatory Dome | Margo Engine</title>
  <link rel="stylesheet" href="./player.css">
</head>
<body>
  <div id="viewport"></div>
  <p id="status" role="status">Preparing the film…</p>
  <section id="controls" aria-label="Film playback" hidden>
    <button id="play" type="button">Pause</button>
    <input id="seek" type="range" aria-label="Film time" min="0" max="90" value="0" step="0.01">
    <output id="clock" for="seek">0:00 / 1:30</output>
  </section>
  <script type="module">
    import { openFilm } from './film.js';
    import { buildObservatory } from './the-observatory-dome.js';
    await openFilm({ build: buildObservatory, ...{
      title: "The Observatory Dome",
      "night": true,
      "far": 850,
      "look": {
        "environment": 0.32,
        "exposure": 0.1,
        "bloom": 0.12,
        "direction": [
          0.29,
          0.62,
          0.728,
          0.46
        ],
        "radiance": [
          0.49,
          0.63,
          0.93,
          0.3
        ],
        "ambient": [
          0.42,
          0.49,
          0.65
        ],
        "shadows": {
          "distance": 27,
          "resolution": 2048
        }
      }
    } });
  </script>
</body>
</html>
