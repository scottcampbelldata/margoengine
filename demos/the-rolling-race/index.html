<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eae6da">
  <meta name="description" content="Release a solid disc and hollow ring on the same ramp. See how their mass distribution changes the race.">
  <title>The Rolling Race · Margo Engine</title>
  <link rel="icon" href="data:,">
  <script type="module" crossorigin src="./assets/index-BsyTezb7.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-CCslgjke.css">
</head>
<body>
  <main>
    <a class="brand" href="../">Margo Engine <span>Web demos</span></a>
    <header>
      <h1>The Rolling Race</h1>
      <p>Release a solid disc and a hollow ring from the same gate. Tilt the ramp and see how mass distribution affects the race.</p>
    </header>
    <section class="experiment" aria-label="Rolling inertia experiment">
      <figure>
        <canvas id="scene" aria-label="A brass disc and silver ring on two lanes of an adjustable laboratory ramp"></canvas>
        <p id="loading" role="status">Preparing the timing gate…</p>
      </figure>
      <aside aria-label="Ramp and timing controls">
        <div class="angle">
          <div><label for="slope">Ramp angle</label><output id="degrees" for="slope">12°</output></div>
          <input id="slope" type="range" min="6" max="19" step="1" value="12" disabled>
          <div class="bounds" aria-hidden="true"><span>6°</span><span>19°</span></div>
        </div>
        <button id="release" type="button" disabled>Release both</button>
        <dl>
          <div><dt><i class="disc"></i>Solid disc</dt><dd><output id="disc-time">—</output><small>s</small></dd></div>
          <div><dt><i class="ring"></i>Hollow ring</dt><dd><output id="ring-time">—</output><small>s</small></dd></div>
        </dl>
        <p id="result" role="status">Ready at the gate.</p>
      </aside>
    </section>
    <footer><a href="./source/README.md">Model and scene notes</a></footer>
  </main>
</body>
</html>
