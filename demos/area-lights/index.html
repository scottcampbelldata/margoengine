<main>
  <header>

    <h1>Area Lights</h1>
    <p>Move the source and compare its highlight on three finishes.</p>
  </header>
  <section aria-label="Lighting controls">
    <div class="controls">
      <fieldset>
        <legend>Emitter</legend>
        <button type="button" data-shape="sphere" aria-pressed="true" disabled>Sphere</button>
