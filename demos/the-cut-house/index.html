<body>
  <main>
    <nav aria-label="Showcase"><a href="../">Margo Engine / Web demos</a></nav>
    <header>
      <h1>The Cut House</h1>
      <p>Slide a plane through a two-storey IFC house. Amber faces close the walls and floors where the plane cuts them.</p>
    </header>
    <section aria-label="Building section">
      <div class="views" aria-label="Section view">
        <button type="button" data-view="cross" aria-pressed="true" disabled>Cross-section</button>
        <button type="button" data-view="plan" aria-pressed="false" disabled>Plan</button>
        <button type="button" data-view="whole" aria-pressed="false" disabled>Whole house</button>
      </div>
      <figure id="figure">
        <canvas id="house" aria-label="Three-dimensional cutaway of a two-storey house"></canvas>
        <span class="key">Amber marks the cut</span>
        <p class="status" id="status" role="status">Opening the IFC house…</p>
        <div id="error" class="error" hidden>
          <p role="alert" id="message"></p>
          <a id="help" href="https://margoengine.com/errors#compatibility-layer" hidden>Renderer requirements</a>
        </div>
      </figure>
      <div class="cut-bar">
        <div class="cut-label"><label for="section">Section plane</label><output for="section" id="distance">1.38 m</output></div>
        <input id="section" type="range" min="-3.60" max="4.85" value="1.38" step=".01" disabled>
        <p class="cut-count"><output id="cut-count">—</output> cut elements</p>
      </div>
      <div class="info">
        <div class="element">
          <label for="element">Inspect cut element</label>
          <select id="element" disabled><option value="">All cut elements</option></select>
          <output id="element-id" aria-live="polite"></output>
        </div>
        <details>
          <summary>Room records</summary>
          <ul id="rooms"></ul>
        </details>
      </div>
    </section>
    <footer><a id="ifc-source" download="cut-house.ifc">Download the IFC</a><a href="./source/README.md">Scene notes and sources</a></footer>
  </main>

</body>
</html>
