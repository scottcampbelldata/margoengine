    <nav aria-label="Gallery"><a href="../" class="brand">Margo Engine <span>Web demos</span></a></nav>
    <header><h1>Cathedral Light</h1><p>Move the sun through an autumn day and watch the windows cast changing shapes on the stone.</p></header>

      <div class="field">

        <input id="hour" type="range" min="480" max="1020" value="578" step="1" disabled>
      </div>
      <div class="presets" role="group" aria-label="Jump to time">
        <button type="button" data-minute="600" disabled>10:00</button>
        <button type="button" data-minute="720" disabled>Noon</button>
        <button type="button" data-minute="930" disabled>15:30</button>
      </div>
      <dl class="readings">
        <div><dt id="altitude-label">Sun elevation</dt><dd><output id="altitude" aria-labelledby="altitude-label">—</output></dd></div>
        <div><dt id="azimuth-label">Sun bearing</dt><dd><output id="azimuth" aria-labelledby="azimuth-label">—</output></dd></div>
