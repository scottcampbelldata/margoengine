    <header>
      <h1>The Measuring Room</h1>
      <p>Take dimensions from a machined gauge block. A leader line follows each point as you turn the part.</p>
    </header>
    <section class="exhibit" aria-label="Interactive measuring station">
      <figure>
        <canvas id="part" aria-label="Machined gauge block with two bored holes and a sloped face"></canvas>
        <p id="status" role="status">Preparing the gauge block…</p>
        <p id="error" role="alert" hidden></p>
        <div class="overlay"><span>Tap to measure · drag to turn</span><button id="reset" type="button" disabled>Reset view</button></div>
      </figure>
      <aside>
        <fieldset id="tools" disabled>
          <legend>Measure</legend>
          <button data-tool="distance" type="button" aria-pressed="true">Distance</button>
          <button data-tool="angle" type="button" aria-pressed="false">Angle</button>
          <button data-tool="radius" type="button" aria-pressed="false">Radius</button>
        </fieldset>
        <p id="guide">Pick two points. Nearby edges and corners are used when available.</p>
        <div class="reading">
          <span id="kind">Distance</span>
          <output id="measure" aria-live="polite">—</output>
        </div>
        <button id="reference" type="button" disabled>Measure block width</button>
      </aside>
    </section>
    <footer><a href="./source/README.md">Scene notes and source</a></footer>
