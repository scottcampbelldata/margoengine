<body>
  <main>
    <nav aria-label="Showcase"><a href="../">Margo Engine</a><span aria-hidden="true">/</span><span>Web Demos</span></nav>
    <header>
      <h1>The Flow Field</h1>
      <p>Tap open terrain to move the destination. Twelve thousand moving lights find their way around the ridges.</p>
    </header>
    <div class="instrument">
      <div class="controls" aria-label="Flow controls">
        <button type="button" id="target" disabled>Next target</button>
        <button type="button" id="vectors" aria-pressed="false" disabled>Show directions</button>
        <button type="button" id="pause" aria-pressed="false" disabled>Pause</button>
        <button type="button" id="reset" disabled>Reset</button>
      </div>
      <figure id="viewport" aria-label="A relief model with two streams of light">
        <canvas id="scene" tabindex="0" aria-label="Tap open terrain to move the destination, or focus here and press an arrow key."></canvas>
        <span id="loading" role="status">Opening the relief model…</span>
        <span id="error" role="alert" hidden></span>
        <span id="destination"><b aria-hidden="true"></b><output id="place">East landing</output></span>
        <span id="hint" aria-live="polite"></span>
      </figure>
      <section class="results" aria-label="Live flow measurements">
        <dl>
          <div><dt>Units</dt><dd id="units">—</dd></div>
          <div><dt>Arrivals</dt><dd id="arrivals">—</dd></div>
          <div><dt>Reachable cells</dt><dd id="reachable">—</dd></div>
        </dl>
        <div class="legend">
          <span><i aria-hidden="true"></i> Higher travel cost</span>
          <span><i aria-hidden="true"></i> Blocked terrain</span>
        </div>
      </section>
    </div>
    <footer><a href="https://graphics.cs.cmu.edu/?p=375">Continuum Crowds</a><a href="https://www.gameaipro.com/GameAIPro/GameAIPro_Chapter23_Crowd_Pathfinding_and_Steering_Using_Flow_Field_Tiles.pdf">Flow-field navigation</a></footer>
