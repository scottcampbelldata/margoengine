<body>
  <main>
    <nav aria-label="Margo Engine"><a href="../">Margo Engine</a><span aria-hidden="true">/</span><a href="../">Web demos</a></nav>
    <header>
      <h1>Caustic Glass</h1>
      <p>The same lens can focus white light, spread it softly or split it into color. Switch the glass to compare the light on the table.</p>
    </header>
    <section aria-label="Optical bench">
      <figure id="viewport">
        <canvas id="scene" aria-label="A thick faceted glass lens held above an optical bench by a blackened metal stand. A focused pattern of light falls across a gauged slate table."></canvas>
        <p id="loading" role="status">Opening the optical bench…</p>
        <p id="error" role="alert" hidden></p>
      </figure>
      <div class="instrument">
        <fieldset id="controls" disabled>
          <legend>Glass treatment</legend>
          <div class="modes">
            <button type="button" data-mode="clear" aria-pressed="false">Polished</button>
            <button type="button" data-mode="ground" aria-pressed="false">Ground</button>
            <button type="button" data-mode="spectrum" aria-pressed="true">Dispersive</button>
          </div>
        </fieldset>
        <dl class="measurements">
          <div><dt>Light collected</dt><dd><output id="power">—</output></dd></div>
          <div><dt>Footprint spread</dt><dd><output id="spread">—</output></dd></div>
        </dl>
        <div class="bake">
          <button type="button" id="rebake" disabled>Rebake light</button>
          <p id="progress" role="status"></p>
        </div>
      </div>
    </section>
    <footer><a href="https://cseweb.ucsd.edu/~henrik/papers/rendering_caustics/">How caustics are baked</a><a href="./source/README.md">Scene notes</a></footer>
  </main>
