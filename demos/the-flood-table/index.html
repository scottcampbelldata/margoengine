<html lang="en">
<head>
  <meta charset="utf-8">

  <meta name="description" content="Release a reservoir and defend a miniature valley in a live Margo Engine hydraulic simulation.">

<body>
  <main>
    <a class="brand" href="../">Margo Engine <span>Web demos</span></a>
    <header>
      <h1>The Flood Table</h1>
      <p>Place a floodwall, then release the reservoir. See how much water reaches the village.</p>
    </header>
    <section class="exhibit" aria-label="Interactive hydraulic model">
      <canvas id="terrain" aria-label="Three-dimensional valley with an upstream reservoir and a village downstream"></canvas>
      <p role="status" id="loading">Filling the reservoir…</p>
      <div class="labels" aria-hidden="true">
        <span id="headwater">Reservoir</span>
        <span id="settlement">Hawthorn</span>
      </div>
      <div class="positions" role="group" aria-label="Floodwall positions">
        <button type="button" data-site="0" aria-label="Place a floodwall at the upper bend" aria-pressed="false">A</button>
        <button type="button" data-site="1" aria-label="Place a floodwall below the bridge" aria-pressed="false">B</button>
        <button type="button" data-site="2" aria-label="Place a floodwall near the village" aria-pressed="false">C</button>
      </div>
      <div class="view-tools">
        <button class="view" type="button" id="view" aria-pressed="false" disabled>Overhead</button>
      </div>
      <div class="scale" aria-hidden="true"><i></i> 5 m</div>
    </section>
    <section class="instrument" aria-label="Simulation controls and live measurements">
      <div class="actions">
        <button type="button" id="release" disabled>Release reservoir</button>
        <button type="button" id="reset" disabled>Reset</button>
      </div>
      <dl>
        <div><dt>Floodwall</dt><dd id="selection">None</dd></div>
        <div><dt>Village depth</dt><dd id="village">—</dd></div>
        <div><dt>Fastest flow</dt><dd id="velocity">—</dd></div>
      </dl>
    </section>
    <footer><a href="./source/scene.js">View scene source</a><p id="message" role="status"></p></footer>
  </main>
</body>
</html>
