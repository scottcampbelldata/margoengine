<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#161f18">
  <meta name="description" content="Fly low over an original alpine forest, bank through a rushing headwater valley and put ten thousand trees in the path of the wind.">
  <title>Ten Thousand Trees | Margo Engine</title>
  <link rel="icon" href="data:,">
  <link rel="preload" as="fetch" href="./assets/opening-grove-BWGbCF7K.plants" crossorigin>
  <script type="module" crossorigin src="./assets/index-DQY9ViPN.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-Q93oYVIv.css">
</head>
<body>
  <main>
    <nav aria-label="Margo Web Demos"><a href="../">Margo Engine</a><span>/</span><a href="../">Web demos</a></nav>
    <header>
      <h1>Ten Thousand Trees</h1>
      <p>Skim a spruce canopy and follow the headwaters up to the saddle.</p>
    </header>
    <section class="exhibit" aria-label="Canopy flight and wind">
      <figure>
        <canvas id="scene" aria-label="Flyover of ten thousand spruce and fir trees in an alpine headwater valley"></canvas>
        <canvas id="complete-scene" aria-label="Flyover of ten thousand spruce and fir trees in an alpine headwater valley" aria-hidden="true"></canvas>
        <figcaption><output id="leg">Lower headwaters</output><output id="distance">0 m along route</output></figcaption>
        <p id="loading" role="status">Opening the headwater valley…</p>
        <p id="error" role="alert" hidden></p>
        <p id="detail-status" role="status" hidden></p>
      </figure>
      <aside aria-label="Flight controls">
        <fieldset id="controls" disabled>
          <legend class="sr-only">Flyover and wind controls</legend>
          <div class="read"><label for="route">Flight path</label><output id="route-value" for="route">0%</output></div>
          <input id="route" type="range" min="0" max="1000" value="80" step="1">
          <div class="ticks" aria-hidden="true"><span>Headwaters</span><span>Saddle</span></div>
          <button id="play" type="button">Fly over canopy <span aria-hidden="true">▶</span></button>
          <div class="read wind"><label for="wind">Wind</label><output id="wind-value" for="wind">23 km/h</output></div>
          <input id="wind" type="range" min="0" max="56" value="23" step="1" aria-label="Wind speed in kilometres per hour">
          <div class="ticks" aria-hidden="true"><span>Calm</span><span>Gusts</span></div>
        </fieldset>
        <dl>
          <div><dt>Trees in the basin</dt><dd id="count">10,000</dd></div>
          <div><dt>Above valley floor</dt><dd><output id="height">—</output></dd></div>
        </dl>
      </aside>
    </section>
    <footer>
      <span>Original spruce–fir landscape</span>
      <a href="https://www.nps.gov/romo/learn/nature/subalpine_ecosystem.htm">Subalpine forests</a>
      <a href="./source/README.md">Method and sources</a>
    </footer>
  </main>
</body>
</html>
