<!doctype html>
<html lang="en">
<head><link rel="modulepreload" crossorigin href="./assets/scene-ComgKVYm.js"><script src="./assets/inline-3d0627a2.js"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#161724">

  <title>The Sky Survey · Margo Engine</title>
  <script type="module" crossorigin src="./assets/index-CaanxDDd.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-gMOX6dn2.css">
</head>
<body>
  <main>
    <nav aria-label="Showcase"><a href="../">Margo Engine / Web demos</a></nav>
    <header>
      <div><p class="instrument">Fermi Large Area Telescope · 4FGL-DR4</p><h1>The Sky Survey</h1></div>
      <p class="lede">Fourteen years of gamma-ray detections make a different map of the sky. Turn the globe to follow the Milky Way or isolate its pulsars.</p>
    </header>
    <section class="controls" aria-label="Catalog controls">
      <div role="group" aria-label="Source selection">
        <button type="button" data-filter="all" aria-pressed="true" disabled>All sources</button>
        <button type="button" data-filter="plane" aria-pressed="false" disabled>Galactic plane</button>
        <button type="button" data-filter="pulsars" aria-pressed="false" disabled>Pulsars</button>
      </div>
      <p class="sources" aria-live="polite"><output id="count">—</output><span>matching sources</span></p>
    </section>
    <figure aria-label="Celestial sphere of Fermi LAT gamma-ray sources">
      <div id="stage">
        <canvas id="globe" tabindex="0" aria-label="Galactic-coordinate globe. Drag to turn or use arrow keys. Tap a point to inspect its catalog entry."></canvas>
        <div class="labels" aria-hidden="true"><span id="core">Galactic centre</span><span id="north">North Galactic pole</span><span id="source-marker" hidden></span></div>
        <div class="coordinates" aria-label="Current Galactic view direction"><div><abbr title="Galactic longitude">l</abbr> <output id="longitude">12°</output></div><div><abbr title="Galactic latitude">b</abbr> <output id="latitude">15°</output></div></div>
        <p class="notice" id="status" role="status">Opening the Fermi catalog…</p>
        <div class="notice" id="error" hidden><p id="message" role="alert"></p><a id="help" href="https://margoengine.com/errors#compatibility-layer" hidden>Renderer requirements</a></div>
      </div>
      <figcaption>
        <div><p id="selection">Every entry in the 4FGL-DR4 source catalog.</p><p id="inspect" role="status">Drag the globe to turn it. Tap a point for its source.</p></div>
        <div class="views" role="group" aria-label="Preset directions"><button type="button" data-orient="core" disabled>Centre</button><button type="button" data-orient="pole" disabled>North pole</button></div>
      </figcaption>
    </figure>
    <footer><a href="./source/README.md">Catalog and interpretation</a><span>50 MeV–1 TeV · NASA Fermi</span></footer>
  </main>
</body>
</html>
