  <header>

    <h1>The Rewind Button</h1>
    <p>Roll a brass drum into a stack of ceramic crates. Slide back through the pile-up using the physics engine’s saved state.</p>
  </header>
  <section aria-label="Physics rewind">
    <div class="actions"><button id="run" type="button" disabled>Run pile-up</button><span id="route">Margo Engine</span></div>

      <div class="stage">

        <div id="notice"><p id="status" role="status">Opening the transfer yard…</p><p id="error" role="alert"></p></div>
      </div>
    </figure>
    <div class="panel">
      <label>Timeline <output id="time" for="timeline">0.00 s</output>
        <input type="range" min="0" max="168" step="1" id="timeline" value="0" disabled>
      </label>
      <dl>
        <div><dt>Rigid bodies</dt><dd id="bodies">—</dd></div>
        <div><dt>Saved checkpoints</dt><dd id="checkpoints">—</dd></div>
      </dl>
    </div>
    <p id="hint">Start the roller to record the pile-up.</p>
  </section>
