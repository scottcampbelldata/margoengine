    <h1>Golden Hour</h1>
    <p>One sandstone basin, four kinds of daylight.</p>
  </header>
  <section aria-label="Landscape lighting">
    <div class="day-row">
      <fieldset>
        <legend>Daylight</legend>
        <button type="button" data-day="golden" aria-pressed="true" disabled>Golden hour</button>
        <button type="button" data-day="clear" aria-pressed="false" disabled>Clear</button>

        <button type="button" data-day="overcast" aria-pressed="false" disabled>Overcast</button>
      </fieldset>
      <label class="look-label" for="look">Display look</label>
      <select id="look" disabled>
        <option value="neutral">Neutral</option>
        <option value="agx" selected>AgX</option>
        <option value="acescg">ACES fit</option>
      </select>
    </div>
    <figure>
      <div class="frame">
        <canvas id="vista" aria-label="An original layered sandstone basin, with eroded buttes and a dry wash under a changing sky."></canvas>
        <div id="notice"><p id="status" role="status">Opening the landscape…</p><p id="error" role="alert"></p></div>
      </div>
      <figcaption>
        <p id="description">Low sun grazes the sandstone and warms the dust over the basin.</p>
        <dl aria-label="Lighting settings">
          <div><dt>Sun elevation</dt><dd id="sun">5°</dd></div>
          <div><dt>Cloud cover</dt><dd id="cloud">25%</dd></div>
