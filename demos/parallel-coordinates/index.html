<body>
  <main>
    <nav aria-label="Showcase"><a href="../">Margo Engine / Web demos</a></nav>
    <header>
      <div>
        <p class="subject">Vinho verde · Northern Portugal</p>
        <h1>Parallel Coordinates</h1>
      </div>
      <p class="lede">Trace the chemistry of 6,497 wines. Brush a range and watch the same samples light up in the scatter plot.</p>
    </header>
    <section class="filters" aria-label="Quick filters">
      <div role="group" aria-label="Example brushes">
        <button type="button" data-preset="all" aria-pressed="true" disabled>All wines</button>
        <button type="button" data-preset="sugar" aria-pressed="false" disabled>Sugar ≥ 10 g/L</button>
        <button type="button" data-preset="alcohol" aria-pressed="false" disabled>Alcohol ≥ 12%</button>
      </div>
      <div class="sample-count" aria-live="polite"><output id="count">—</output><span>matching wines</span></div>
    </section>
    <figure aria-label="Parallel coordinates and linked scatter plot">
      <div class="frame">
        <canvas id="plot" aria-label="Eight vertical chemistry axes linked to a scatter plot of residual sugar and alcohol. Drag on an axis to filter or use the brush controls below."></canvas>
        <div id="guides" aria-hidden="true" hidden></div>
        <p class="notice" id="status" role="status">Opening the samples…</p>
        <div class="notice" id="error" hidden><p id="message" role="alert"></p><a id="help" href="https://margoengine.com/errors#compatibility-layer" hidden>Renderer requirements</a></div>
      </div>
      <figcaption>
        <p id="selection" role="status">Drag along a vertical axis to select a range.</p>
        <div class="legend"><span data-kind="red"><i></i><output id="red">—</output> red</span><span data-kind="white"><i></i><output id="white">—</output> white</span></div>
      </figcaption>
    </figure>
    <form class="brushes" aria-label="Brush a chemistry axis">
      <label for="measure">Measurement<select id="measure" disabled></select></label>
      <label for="min">Lower limit<input id="min" type="number" inputmode="decimal" step="any" disabled></label>
      <label for="max">Upper limit<input id="max" type="number" inputmode="decimal" step="any" disabled></label>
      <button id="apply" type="submit" disabled>Apply range</button>
      <button id="clear" type="button" disabled>Clear axis</button>
      <p id="form-error" role="status" hidden></p>
    </form>
    <footer><a href="./source/README.md">Measurements and sources</a><span>UCI Wine Quality dataset</span></footer>
  </main>
</body>
