name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      # The whole history: scripts/lint.mjs checks the files changed since the merge base with origin/main, which a
      # depth-1 checkout (a pull request's merge commit) does not have (tests/ci-checkout.test.js).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    runs-on: ubuntu-latest
    steps:
      # The whole history: npm run quality compares baselines and document readers with the merge base with origin/main,
      # and without it they skipped those checks on every pull request (tests/ci-checkout.test.js).
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0
      # The repository's minimum Node (root package.json engines; scripts/check-engines.mjs keeps the two equal).
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          cache: npm
      - run: npm ci
      - name: Bundle dependency closures stay inside their allowed packages
        run: npm run check:bundles
      - name: Build packages and check the core + stage size budget
        run: npm run build:packages
      # After the build: a package's tsconfig resolves @margoengine/* through the built dist/*.d.ts (scripts/typecheck.js).
      - name: Strict TypeScript of every package
        run: npm run typecheck
      - name: Every script and test parses on the minimum Node
        run: node scripts/check-engines.mjs --run=repo
      - name: API reports
        run: npm run api:check
      # Quality runs the root tests that name a changed document, and some of those open Chromium. Install it before
      # that step. The package tests below need the same browser (tests/ci-test-jobs.test.js, KB-CI-FIXTURES1).
      - run: npx playwright install chromium
      - name: Quality checks
        run: npm run quality
      # The test files need the Required external test assets (scripts/support/external-test-assets.mjs, kept outside
      # the repository).
      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/../engine-bench/batch-160/gltf-gpu-samples
          key: external-test-assets-${{ hashFiles('scripts/support/external-test-assets.mjs') }}
      - run: node scripts/reference-rendering/fetch-skip-assets.mjs
      - name: Tests
        run: node --experimental-test-module-mocks --test --test-concurrency=4 tests/*.test.js packages/*/tests/*.test.js packages/*/test/*.test.js

  # What users run: the built packages on the packages' minimum Node (their engines field), the latest 22.x and the
  # newest, with Node itself building, packing, installing and bundling. The repository's own unit tests (the test job)
  # need the contributors' Node 24.18; that includes the React unit tests of the packed tarball, which rely on
  # node:test mock.module timing (bug 18), so --consumer leaves only them out and they run in the test job.
  node-compat:
    name: End-user proof on Node ${{ matrix.node }} (React unit tests run on 24.18)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22.12.0', '22', '26']
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build:packages
      - name: Every shipped file parses and every package entry imports
        run: node scripts/check-engines.mjs --run=packages
      # The golden proof digests must hold on every supported Node (bug 17: Node 22's pow differs from Node 26's), and
      # shipped code may use no API this Node lacks without a feature test (bug 39).
      - run: node --test tests/proofs-golden.test.js tests/node-apis.test.js
      - run: npx playwright install chromium
      - name: Pack, install in a clean project, README type-checks, consumer run, packed browser
        run: npm run modern:test:packages -- --consumer
        env:
          MARGO_SOFTWARE_GPU: '1'
      - name: Vite, webpack, Next.js (Turbopack and webpack), Rollup and esbuild build the packed packages
        run: npm run modern:test:bundlers
      - if: matrix.node == '26'
        run: npm test
      # The frame allocation probes on the newest Node; the test job runs them on the minimum Node (24.18, V8 13), whose
      # middle tier has its own limits row (Node 22 has no Maglev by default; its middle-tier probes skip).
      - if: matrix.node == '26'
        run: node --test tests/frame-alloc.test.js

  # The unit tests of the packages that run code in Node (scripts/node22-packages.json, one reason per package), with
  # the same assertions as the test job. Test files with `using` declarations are lowered for Node 22 only
  # (scripts/lib/lower-using.mjs). The React unit tests need Node 24.18 (mock.module timing, bug 18) and stay in the
  # test job; browser-only packages are covered on Node 22 by the end-user proof above.
  node22-tests:
    name: node22 unit tests (Node-run packages) on ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22.12.0', '22']
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build:packages
      # As in the test job: the Required external test assets and a Chromium (tests/ci-test-jobs.test.js).
      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/../engine-bench/batch-160/gltf-gpu-samples
          key: external-test-assets-${{ hashFiles('scripts/support/external-test-assets.mjs') }}
      - run: node scripts/reference-rendering/fetch-skip-assets.mjs
      - run: npx playwright install chromium
      - run: node scripts/node22-tests.mjs

  kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - run: cargo test --locked --manifest-path packages/kernel/Cargo.toml
