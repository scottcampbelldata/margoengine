name: Feature request
description: Something Margo Engine should do that it does not do yet.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The use case. What you are building and where you got stuck.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help
      description: The API or behaviour you have in mind, if any.
  - type: textarea
    id: alternatives
    attributes:
      label: What you tried instead
