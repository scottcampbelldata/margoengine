name: Bug report
description: Something renders wrong, throws, or does not load.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead. Include the error message if there is one.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: The smallest snippet, example page or file that shows it. Attach the model if you can share it.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Margo Engine version
      placeholder: 1.0.0, or a commit hash
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: Chrome 141 on Windows 11
    validations:
      required: true
  - type: input
    id: gpu
    attributes:
      label: GPU
      description: From chrome://gpu or about:support, if you know it.
