<!doctype html><html><head><meta charset="utf-8"><title>Outside reference comparison</title>
<style>body{margin:0;background:black}canvas{display:block;width:512px;height:512px}</style></head><body>
<script type="module">
import {Engine} from '/packages/core/dist/index.js';
import {parseGLTFAsync} from '/packages/gltf-pro/dist/index.js';
import {webglRenderer} from '/packages/webgl2-compat/dist/preview.js';
import {waitForPipelines} from '/scripts/support/gpu-ready.js';
import {SETTINGS} from './scene.mjs';
window.referenceMargo={
  async render(bytes,{backend='webgpu',settings=SETTINGS}={}){
    const canvas=document.body.appendChild(document.createElement('canvas'));
    const engine=await Engine.create(canvas,{backend,fallback:webglRenderer,camera:settings.camera});
    const errors=[];
    engine.gpu?.addEventListener('uncapturederror',e=>errors.push(e.error.message));
    try{
      engine.scene.background='#000000';
      engine.lighting.direction.set([...settings.light.direction,settings.light.intensity]);
      engine.lighting.radiance.set([1,1,1,0]);
      const model=await parseGLTFAsync(engine,new Uint8Array(bytes));
      await waitForPipelines(async()=>{engine.render({culling:false});await engine.gpu.queue.onSubmittedWorkDone();});
      if(errors.length)throw new Error(errors.join('\n'));
      return {backend:engine.backend,draws:engine.stats.drawCalls,primitives:model.primitives.length,width:canvas.width,height:canvas.height};
    }catch(e){engine.dispose();canvas.remove();throw e;}
  },
};
</script></body></html>
