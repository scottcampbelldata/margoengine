<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>4x MSAA blend repeat repro</title></head>
<body>
<script type="module">
// Plain WebGPU, no Margo code: the repro for docs/known-bugs.md "4x MSAA blending is not repeatable". Each frame runs
// the same commands on the same resources: a clear pass, an opaque pass (a dense mesh of flat-coloured triangles, so
// pixels on its edges hold samples of different colours), a blended pass (a coarse mesh multiplied by one constant
// colour: blend srcFactor zero, dstFactor src) and a resolve pass. Per-sample blending makes every sample of the
// blended pass dst x constant, so every frame must give the same bytes. Each frame also copies the multisampled colour
// before and after the blended pass. Driven by scripts/msaa-blend-repeat-check.mjs; `?mask=N` sets the blended
// pipeline's sample mask, `?grid=N` the blended mesh's cells per side, `?size=WxH`.
const q = new URLSearchParams(location.search);
const [W, H] = (q.get('size') ?? '640x480').split('x').map(Number);
const grid = Number(q.get('grid') ?? 6),
  mask = q.has('mask') ? Number(q.get('mask')) : undefined;
const format = 'bgra8unorm',
  adapter = await navigator.gpu.requestAdapter(),
  device = await adapter.requestDevice();
const usage = GPUTextureUsage;
const color = device.createTexture({ size: [W, H], sampleCount: 4, format, usage: usage.RENDER_ATTACHMENT | usage.TEXTURE_BINDING });
const depth = device.createTexture({ size: [W, H], sampleCount: 4, format: 'depth32float', usage: usage.RENDER_ATTACHMENT });
const target = device.createTexture({ size: [W, H], format, usage: usage.RENDER_ATTACHMENT | usage.COPY_SRC });
const module = device.createShaderModule({
  code: `
struct O { @builtin(position) p: vec4f, @location(0) @interpolate(flat) h: f32 }
@vertex fn opaqueVertex(@location(0) p: vec2f, @builtin(vertex_index) v: u32) -> O {
  return O(vec4f(p, 0.5 + 0.2 * cos(p.y * 8.0 - p.x * 3.0), 1), f32((v / 3u) % 7u) / 7.0);
}
@fragment fn opaqueFragment(o: O) -> @location(0) vec4f { return vec4f(0.1 + 0.6 * o.h, 0.5 - 0.4 * o.h, 0.2 + 0.3 * fract(o.h * 3.0), 1); }
@vertex fn blendVertex(@location(0) p: vec2f) -> O { return O(vec4f(p, 0.5 + 0.2 * sin(p.x * 9.0 + p.y * 4.0), 1), 0.0); }
@fragment fn tint(o: O) -> @location(0) vec4f { return vec4f(0.93, 0.91, 0.87, 1); }
@group(0) @binding(0) var ms: texture_multisampled_2d<f32>;
@group(0) @binding(1) var<storage, read_write> out: array<u32>;
@compute @workgroup_size(8, 8) fn copySamples(@builtin(global_invocation_id) g: vec3u) {
  let d = textureDimensions(ms);
  if (g.x >= d.x || g.y >= d.y) { return; }
  for (var s = 0u; s < 4u; s++) { out[(g.y * d.x + g.x) * 4u + s] = pack4x8unorm(textureLoad(ms, vec2i(g.xy), i32(s))); }
}`,
});
const buffers = [{ arrayStride: 8, attributes: [{ shaderLocation: 0, offset: 0, format: 'float32x2' }] }];
const opaque = device.createRenderPipeline({
  layout: 'auto',
  vertex: { module, entryPoint: 'opaqueVertex', buffers },
  fragment: { module, entryPoint: 'opaqueFragment', targets: [{ format }] },
  depthStencil: { format: 'depth32float', depthWriteEnabled: true, depthCompare: 'greater-equal' },
  multisample: { count: 4 },
});
const blended = device.createRenderPipeline({
  layout: 'auto',
  vertex: { module, entryPoint: 'blendVertex', buffers },
  fragment: {
    module,
    entryPoint: 'tint',
    targets: [{ format, blend: { color: { srcFactor: 'zero', dstFactor: 'src' }, alpha: { srcFactor: 'zero', dstFactor: 'one' } } }],
  },
  primitive: { cullMode: 'back' },
  depthStencil: { format: 'depth32float', depthWriteEnabled: false, depthCompare: 'greater-equal' },
  multisample: { count: 4, ...(mask === undefined ? {} : { mask }) },
});
const copy = device.createComputePipeline({ layout: 'auto', compute: { module, entryPoint: 'copySamples' } });
// Counter-clockwise quads of a warped grid over [-span, span], so edges do not follow pixel rows.
function mesh(cells, span, warp) {
  const v = [],
    at = (i, j) => {
      const x = -span + (2 * span * i) / cells,
        y = -span + (2 * span * j) / cells;
      return [x + warp * Math.sin(y * 17), y + warp * Math.cos(x * 13)];
    };
  for (let i = 0; i < cells; i++)
    for (let j = 0; j < cells; j++) {
      const a = at(i, j), b = at(i + 1, j), c = at(i + 1, j + 1), d = at(i, j + 1);
      v.push(...a, ...b, ...c, ...a, ...c, ...d);
    }
  const buffer = device.createBuffer({ size: v.length * 4, usage: GPUBufferUsage.VERTEX | GPUBufferUsage.COPY_DST });
  device.queue.writeBuffer(buffer, 0, new Float32Array(v));
  return { buffer, count: v.length / 2 };
}
const opaqueMesh = mesh(150, 1, 0.004),
  blendMesh = mesh(grid, 0.8, 0.013);
const sampleBytes = W * H * 16,
  snapshots = [0, 1].map(() => device.createBuffer({ size: sampleBytes, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC }));
const copyGroups = snapshots.map((buffer) =>
  device.createBindGroup({ layout: copy.getBindGroupLayout(0), entries: [{ binding: 0, resource: color.createView() }, { binding: 1, resource: { buffer } }] }),
);
const attachment = (loadOp, resolve) => ({
  view: color.createView(),
  loadOp,
  storeOp: 'store',
  clearValue: [0.1, 0.12, 0.15, 1],
  ...(resolve ? { resolveTarget: target.createView() } : {}),
});
const depthAttachment = (depthLoadOp) => ({ view: depth.createView(), depthLoadOp, depthStoreOp: 'store', depthClearValue: 0 });
const copySamples = (encoder, k) => {
  const p = encoder.beginComputePass();
  p.setPipeline(copy);
  p.setBindGroup(0, copyGroups[k]);
  p.dispatchWorkgroups(Math.ceil(W / 8), Math.ceil(H / 8));
  p.end();
};
function frame() {
  const e = device.createCommandEncoder();
  e.beginRenderPass({ colorAttachments: [attachment('clear')], depthStencilAttachment: depthAttachment('clear') }).end();
  let p = e.beginRenderPass({ colorAttachments: [attachment('load')], depthStencilAttachment: depthAttachment('load') });
  p.setPipeline(opaque);
  p.setVertexBuffer(0, opaqueMesh.buffer);
  p.draw(opaqueMesh.count);
  p.end();
  copySamples(e, 0);
  p = e.beginRenderPass({ colorAttachments: [attachment('load')], depthStencilAttachment: depthAttachment('load') });
  p.setPipeline(blended);
  p.setVertexBuffer(0, blendMesh.buffer);
  p.draw(blendMesh.count);
  p.end();
  copySamples(e, 1);
  e.beginRenderPass({ colorAttachments: [attachment('load', true)], depthStencilAttachment: depthAttachment('load') }).end();
  device.queue.submit([e.finish()]);
}
async function read(buffer, size) {
  const staging = device.createBuffer({ size, usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ });
  const e = device.createCommandEncoder();
  if (buffer) e.copyBufferToBuffer(buffer, 0, staging, 0, size);
  else e.copyTextureToBuffer({ texture: target }, { buffer: staging, bytesPerRow: Math.ceil((W * 4) / 256) * 256 }, [W, H]);
  device.queue.submit([e.finish()]);
  await staging.mapAsync(GPUMapMode.READ);
  const data = new Uint32Array(staging.getMappedRange()).slice();
  staging.destroy();
  return data;
}
const differs = (a, b) => a.reduce((n, v, i) => n + (v !== b[i]), 0);
const hex = (a, i) => [0, 1, 2, 3].map((s) => a[i + s].toString(16).padStart(8, '0')).join(' ');
/** Runs `n` frames; per frame against the first: samples that differ before and after the blended pass, resolved texels that differ, and the first example pixel. */
window.repeatFrames = async (n) => {
  const first = [];
  const rows = [];
  for (let k = 0; k < n; k++) {
    frame();
    const shot = [await read(snapshots[0], sampleBytes), await read(snapshots[1], sampleBytes), await read(null, Math.ceil((W * 4) / 256) * 256 * H)];
    if (k === 0) {
      first.push(...shot);
      continue;
    }
    const row = { frame: k, before: differs(first[0], shot[0]), after: differs(first[1], shot[1]), resolved: differs(first[2], shot[2]) };
    for (let i = 0; i < shot[1].length && !row.example; i += 4)
      if ([0, 1, 2, 3].some((s) => first[1][i + s] !== shot[1][i + s]))
        row.example = `pixel ${(i / 4) % W},${Math.floor(i / 4 / W)}: before ${hex(shot[0], i)}; after, frame 0 ${hex(first[1], i)}, frame ${k} ${hex(shot[1], i)}`;
    rows.push(row);
  }
  const info = adapter.info ?? {};
  return { gpu: [info.vendor, info.architecture, info.description].filter(Boolean).join(' '), rows };
};
window.reproReady = true;
</script>
</body>
</html>
